window.WERB_GUIDES = [{ fichier: "1-ANSSI/0-carte.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Carte ANSSI — repères et guides de l'Agence nationale de la sécurité des systèmes d'information\n\nL'ANSSI est l'autorité nationale française de cybersécurité : elle publie des guides de recommandations, qualifie des produits et des prestataires, et supervise les obligations réglementaires (LPM, NIS2).\n\n- Gouvernance et risques\n  - Méthode EBIOS Risk Manager (module WerbEBIOS)\n  - Homologation de sécurité : décider en connaissance des risques résiduels\n  - Politique de sécurité des SI (PSSI)\n- Hygiène informatique\n  - [42 mesures en 10 thèmes](1-hygiene_informatique.md)\n  - Deux niveaux : standard et renforcé\n  - Outil de suivi pour l'autodiagnostic\n- Systèmes industriels\n  - [Classification en 3 classes](2-systemes_industriels.md)\n  - Mesures principales et mesures détaillées\n  - Articulation avec IEC 62443 (module WerbIEC62443)\n- Produits et prestataires qualifiés\n  - PASSI : audit de sécurité\n  - PRIS : réponse aux incidents\n  - PDIS : détection des incidents\n  - PACS : accompagnement et conseil\n  - SecNumCloud : informatique en nuage\n- Réglementation\n  - LPM : opérateurs d'importance vitale (OIV) et leurs SIIV\n  - [NIS2 : entités essentielles et importantes](../3-NIS2/0-carte.md)\n- Crise et incidents\n  - CERT-FR : alertes et avis de sécurité\n  - Fiches réflexes en cas d'incident\n- [Sources officielles](sources.md)\n\n## Comment s'en servir dans le SMSI\n\n| Besoin | Point d'entrée ANSSI | Où le suivre dans WerbSMSI |\n|---|---|---|\n| Socle minimal de mesures | Guide d'hygiène (42 mesures) | WerbGouvernance › socle de mesures |\n| Analyse de risques | EBIOS Risk Manager | WerbEBIOS |\n| Systèmes industriels | Classification et mesures (classes 1 à 3) | WerbIEC62443, WerbMap (zones et conduits) |\n| Choix d'un prestataire | Catalogue des qualifications | WerbGouvernance › prestataires |\n| Obligations réglementaires | LPM, NIS2 | [Tableau de correspondances](../correspondances.md) |\n\n> Les guides de l'ANSSI sont publiés pour la plupart sous **Licence Ouverte** (Etalab) : ils peuvent être repris et résumés avec mention de la source et de la date de version.\n" },
{ fichier: "1-ANSSI/1-hygiene_informatique.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Guide d'hygiène informatique — les 42 mesures\n\nSynthèse du *Guide d'hygiène informatique — Renforcer la sécurité de son système d'information en 42 mesures* (ANSSI, version 2.0, septembre 2017), publié sous Licence Ouverte / Open Licence (Etalab v1). Les intitulés des mesures sont ceux du guide ; les commentaires sont propres à WerbSMSI.\n\n> Le guide distingue un niveau **standard**, à atteindre par toute entité, et un niveau **renforcé** pour les entités plus exposées ou plus matures. Son outil de suivi permet de coter chaque mesure.\n\n## Les 10 thèmes\n\n| Thème | Mesures | Idée directrice |\n|---|---|---|\n| I. Sensibiliser et former | 1 à 3 | Les personnes et l'infogérance d'abord |\n| II. Connaître le système d'information | 4 à 7 | On ne protège que ce que l'on connaît |\n| III. Authentifier et contrôler les accès | 8 à 13 | Un compte par personne, des droits au juste besoin |\n| IV. Sécuriser les postes | 14 à 18 | Un niveau minimal partout, géré centralement |\n| V. Sécuriser le réseau | 19 à 26 | Cloisonner, filtrer, chiffrer |\n| VI. Sécuriser l'administration | 27 à 29 | L'administration est la cible prioritaire |\n| VII. Gérer le nomadisme | 30 à 33 | Le terminal hors des murs est exposé |\n| VIII. Maintenir le SI à jour | 34 et 35 | Correctifs et fin de support anticipés |\n| IX. Superviser, auditer, réagir | 36 à 40 | Voir, contrôler, savoir réagir |\n| X. Pour aller plus loin | 41 et 42 | Analyse de risques et produits qualifiés |\n\n## I. Sensibiliser et former\n\n1. Former les équipes opérationnelles à la sécurité des systèmes d'information\n2. Sensibiliser les utilisateurs aux bonnes pratiques élémentaires de sécurité informatique\n3. Maîtriser les risques de l'infogérance\n\n## II. Connaître le système d'information\n\n4. Identifier les informations et serveurs les plus sensibles et maintenir un schéma du réseau\n5. Disposer d'un inventaire exhaustif des comptes privilégiés et le maintenir à jour\n6. Organiser les procédures d'arrivée, de départ et de changement de fonction des utilisateurs\n7. Autoriser la connexion au réseau de l'entité aux seuls équipements maîtrisés\n\n## III. Authentifier et contrôler les accès\n\n8. Identifier nommément chaque personne accédant au système et distinguer les rôles utilisateur/administrateur\n9. Attribuer les bons droits sur les ressources sensibles du système d'information\n10. Définir et vérifier des règles de choix et de dimensionnement des mots de passe\n11. Protéger les mots de passe stockés sur les systèmes\n12. Changer les éléments d'authentification par défaut sur les équipements et services\n13. Privilégier lorsque c'est possible une authentification forte\n\n## IV. Sécuriser les postes\n\n14. Mettre en place un niveau de sécurité minimal sur l'ensemble du parc informatique\n15. Se protéger des menaces relatives à l'utilisation de supports amovibles\n16. Utiliser un outil de gestion centralisée afin d'homogénéiser les politiques de sécurité\n17. Activer et configurer le pare-feu local des postes de travail\n18. Chiffrer les données sensibles transmises par voie Internet\n\n## V. Sécuriser le réseau\n\n19. Segmenter le réseau et mettre en place un cloisonnement entre ces zones\n20. S'assurer de la sécurité des réseaux d'accès Wi-Fi et de la séparation des usages\n21. Utiliser des protocoles sécurisés dès qu'ils existent\n22. Mettre en place une passerelle d'accès sécurisé à Internet\n23. Cloisonner les services visibles depuis Internet du reste du système d'information\n24. Protéger sa messagerie professionnelle\n25. Sécuriser les interconnexions réseau dédiées avec les partenaires\n26. Contrôler et protéger l'accès aux salles serveurs et aux locaux techniques\n\n## VI. Sécuriser l'administration\n\n27. Interdire l'accès à Internet depuis les postes ou serveurs utilisés pour l'administration du système d'information\n28. Utiliser un réseau dédié et cloisonné pour l'administration du système d'information\n29. Limiter au strict besoin opérationnel les droits d'administration sur les postes de travail\n\n## VII. Gérer le nomadisme\n\n30. Prendre des mesures de sécurisation physique des terminaux nomades\n31. Chiffrer les données sensibles, en particulier sur le matériel potentiellement perdable\n32. Sécuriser la connexion réseau des postes utilisés en situation de nomadisme\n33. Adopter des politiques de sécurité dédiées aux terminaux mobiles\n\n## VIII. Maintenir le système d'information à jour\n\n34. Définir une politique de mise à jour des composants du système d'information\n35. Anticiper la fin de la maintenance des logiciels et systèmes et limiter les adhérences logicielles\n\n## IX. Superviser, auditer, réagir\n\n36. Activer et configurer les journaux des composants les plus importants\n37. Définir et appliquer une politique de sauvegarde des composants critiques\n38. Procéder à des contrôles et audits de sécurité réguliers puis appliquer les actions correctives associées\n39. Désigner un référent en sécurité des systèmes d'information et le faire connaître auprès du personnel\n40. Définir une procédure de gestion des incidents de sécurité\n\n## X. Pour aller plus loin\n\n41. Mener une analyse de risques formelle\n42. Privilégier l'usage de produits et de services qualifiés par l'ANSSI\n\n## Utiliser les 42 mesures dans WerbSMSI\n\n- **Socle de mesures du groupe** : reprendre les mesures retenues dans WerbGouvernance (socle exigé sur tous les sites), avec le niveau visé (standard ou renforcé).\n- **Autodiagnostic** : coter chaque mesure (appliquée, partielle, non appliquée, non applicable) et justifier les exclusions.\n- **Contexte industriel** : les mesures 19, 25, 27 et 28 se déclinent en zones et conduits (IEC 62443-3-2), cartographiés dans WerbMap.\n- **Preuves** : registres de WerbExploitation pour les mesures 5 et 6 (comptes et habilitations), 34 et 35 (mises à jour, applicatifs), 37 (sauvegardes).\n- **Correspondances** : chaque mesure est reliée aux exigences NIS2 et ISO/IEC 27001 dans le [tableau de correspondances](../correspondances.md).\n\nRetour à la [carte ANSSI](0-carte.md).\n" },
{ fichier: "1-ANSSI/2-systemes_industriels.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Systèmes industriels — la classification ANSSI\n\nSynthèse des guides *La cybersécurité des systèmes industriels* de l'ANSSI : la **méthode de classification et les mesures principales**, et les **mesures détaillées**. Elle donne les repères ; la classification d'une installation se fait avec les guides eux-mêmes (voir les [sources](sources.md)).\n\n## Le principe\n\nChaque système industriel reçoit une **classe de cybersécurité** de 1 à 3, déterminée par :\n\n- la **gravité** des conséquences d'une attaque (impacts humains, environnementaux, sur la production et sur les services rendus) ;\n- la **vraisemblance** d'une attaque, appréciée à partir de l'exposition du système (fonctionnalités, connectivité, utilisateurs) et de son attractivité pour un attaquant.\n\nPlus la classe est élevée, plus les mesures sont nombreuses et plus le contrôle est fort.\n\n## Les trois classes\n\n| Classe | Situation | Ce que cela implique |\n|---|---|---|\n| 1 | Risque ou impact d'une attaque faible | Mesures appliquées sous la responsabilité de l'entité |\n| 2 | Risque ou impact significatif | Mesures plus exigeantes ; l'entité doit pouvoir démontrer leur mise en œuvre |\n| 3 | Risque ou impact critique | Exigences les plus fortes, homologation et contrôles renforcés, interconnexions très encadrées |\n\n> La classe s'apprécie par **système** (ou par zone), pas pour toute l'usine : une même installation peut contenir des systèmes de classes différentes. Les échanges entre classes se traitent comme des conduits.\n\n## Les familles de mesures\n\n- **Organisationnelles** : rôles et responsabilités, inventaire et cartographie, analyse de risques, gestion des intervenants et des prestataires, formation, gestion des incidents, veille, audits.\n- **Techniques** : cloisonnement et filtrage, sécurisation des accès distants, gestion des comptes et authentification, durcissement des équipements, journalisation et détection, sauvegardes, gestion des supports amovibles, maintien en condition de sécurité.\n- **Cycle de vie** : la sécurité s'intègre dès la spécification, puis pendant l'exploitation, la maintenance et le retrait du système.\n\n## Articulation avec les autres référentiels\n\n| Notion ANSSI | Équivalent IEC 62443 | Dans WerbSMSI |\n|---|---|---|\n| Classe de cybersécurité | Niveau de sécurité cible (SL-T) d'une zone | WerbMap (zones), WerbIEC62443 |\n| Cartographie et inventaire | 62443-2-1, 62443-3-2 | WerbMap (actifs, flux) |\n| Analyse de risques | 62443-3-2 | WerbEBIOS (site) |\n| Mesures techniques | 62443-3-3 (exigences système) | WerbIEC62443 |\n| Intervenants extérieurs | 62443-2-4 | WerbGouvernance, WerbIEC62443 |\n\nLe lien entre classe ANSSI et niveau SL-T n'est pas une conversion automatique : il se justifie zone par zone, à partir de l'analyse de risques.\n\nVoir aussi la [carte ANSSI](0-carte.md) et le [tableau de correspondances](../correspondances.md).\n" },
{ fichier: "1-ANSSI/sources.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Sources officielles — ANSSI\n\nLiens vers les publications de référence. Ils s'ouvrent dans un nouvel onglet, hors du module. Vérifier la date de version d'un guide avant de s'y référer dans un audit.\n\n## Agence\n\n| Ressource | Lien |\n|---|---|\n| Site de l'ANSSI | https://cyber.gouv.fr |\n| Publications (guides et recommandations) | https://cyber.gouv.fr/publications |\n| CERT-FR : alertes, avis, menaces | https://www.cert.ssi.gouv.fr/ |\n| Produits et services qualifiés | https://cyber.gouv.fr/produits-services-qualifies |\n\n## Guides cités dans ce référentiel\n\n| Guide | Lien |\n|---|---|\n| Guide d'hygiène informatique (42 mesures) | https://messervices.cyber.gouv.fr/guides/guide-dhygiene-informatique |\n| Cybersécurité des systèmes industriels : méthode de classification et mesures principales | https://messervices.cyber.gouv.fr/guides/la-cybersecurite-des-systemes-industriels |\n| Cybersécurité des systèmes industriels : mesures détaillées | https://messervices.cyber.gouv.fr/guides/la-cybersecurite-des-systemes-industriels-mesures-detaillees |\n| Méthode EBIOS Risk Manager | https://cyber.gouv.fr/la-methode-ebios-risk-manager |\n\n## Réglementation\n\n| Sujet | Lien |\n|---|---|\n| Directive NIS2 (présentation par l'ANSSI) | https://cyber.gouv.fr/directive-nis-2 |\n| MonEspaceNIS2 : s'informer, vérifier son assujettissement, se déclarer | https://monespacenis2.cyber.gouv.fr/ |\n\n## Droits de réutilisation\n\n- La plupart des guides de l'ANSSI sont publiés sous **Licence Ouverte / Open Licence** (Etalab) : réutilisation libre avec mention de la paternité (« ANSSI », titre, date de version). Texte de la licence : https://www.etalab.gouv.fr/licence-ouverte-open-licence/\n- Vérifier la mention de licence sur chaque guide avant d'en reprendre de larges extraits.\n\nRetour à la [carte ANSSI](0-carte.md).\n" },
{ fichier: "2-NIST/0-carte.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Carte NIST — le Cybersecurity Framework 2.0 et les publications associées\n\nLe NIST (National Institute of Standards and Technology, États-Unis) publie le Cybersecurity Framework (CSF) 2.0 : six fonctions, 22 catégories, pour décrire et piloter la cybersécurité d'une organisation, quelle que soit sa taille. Les publications de la série SP 800 détaillent les contrôles, l'analyse de risques et la cybersécurité industrielle.\n\n- GOUVERNER (GV)\n  - GV.OC — Contexte de l'organisation\n  - GV.RM — Stratégie de gestion des risques\n  - GV.RR — Rôles, responsabilités et autorités\n  - GV.PO — Politique\n  - GV.OV — Supervision\n  - GV.SC — Risques cyber de la chaîne d'approvisionnement\n- IDENTIFIER (ID)\n  - ID.AM — Gestion des actifs\n  - ID.RA — Appréciation des risques\n  - ID.IM — Amélioration\n- PROTÉGER (PR)\n  - PR.AA — Identités, authentification et contrôle d'accès\n  - PR.AT — Sensibilisation et formation\n  - PR.DS — Sécurité des données\n  - PR.PS — Sécurité des plateformes\n  - PR.IR — Résilience de l'infrastructure technique\n- DÉTECTER (DE)\n  - DE.CM — Surveillance continue\n  - DE.AE — Analyse des événements indésirables\n- RÉPONDRE (RS)\n  - RS.MA — Gestion des incidents\n  - RS.AN — Analyse des incidents\n  - RS.CO — Communication et signalement\n  - RS.MI — Atténuation des incidents\n- RÉTABLIR (RC)\n  - RC.RP — Exécution du plan de rétablissement\n  - RC.CO — Communication pendant le rétablissement\n- Pages du référentiel\n  - [Guide NIST](1-Guide_NIST.md)\n  - [Checklist d'audit](2-checklist_audit_nist.md)\n  - [Plan de mise en œuvre](3-plan_de_mise_en_oeuvre_nist.md)\n  - [Modèles et registres](4-modeles_et_registres_nist.md)\n  - [Sources officielles](sources.md)\n\n## Les publications à connaître\n\n| Publication | Objet | Usage dans le SMSI |\n|---|---|---|\n| CSF 2.0 (CSWP 29) | Cadre : fonctions, catégories, sous-catégories, profils, niveaux (tiers) | Profil actuel et profil cible, feuille de route |\n| SP 800-53 Rev. 5 | Catalogue de contrôles de sécurité et de vie privée | Choix et formulation de mesures |\n| SP 800-30 Rev. 1 | Conduite d'une appréciation des risques | Méthode alternative ou complément d'EBIOS RM |\n| SP 800-37 Rev. 2 | Risk Management Framework (cycle d'autorisation des systèmes) | Proche de l'homologation française |\n| SP 800-61 Rev. 3 | Gestion des incidents, alignée sur le CSF 2.0 | Procédure de réponse aux incidents |\n| SP 800-82 Rev. 3 | Sécurité des technologies opérationnelles (OT) | Sites industriels, avec IEC 62443 |\n\n## Profils et niveaux de mise en œuvre\n\n- **Profil actuel / profil cible** : pour chaque catégorie retenue, la situation d'aujourd'hui et celle visée ; l'écart donne le plan d'actions.\n- **Tiers 1 à 4** (partiel, informé des risques, reproductible, adaptatif) : la maturité de la gouvernance et de la gestion des risques, pas un score de conformité.\n\nLe CSF ne se certifie pas : il sert de langage commun. Son articulation avec ISO/IEC 27001, NIS2 et IEC 62443 est dans le [tableau de correspondances](../correspondances.md).\n" },
{ fichier: "2-NIST/1-Guide_NIST.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Guide complet NIST — Cybersécurité et gestion des risques\n\n**Nom du fichier :** `guide_nist.md`  \n**Version :** 1.0  \n**Référentiel principal :** NIST Cybersecurity Framework (CSF) 2.0  \n**Périmètre :** Gouvernance, gestion des risques, contrôles de sécurité, audit et cybersécurité industrielle.\n\n> Ce document est une synthèse pédagogique. Il ne reproduit pas les publications officielles et ne constitue pas une déclaration de conformité.\n\n## 1. Présentation du NIST\n\nLe National Institute of Standards and Technology (NIST) est un organisme américain qui publie des références techniques, des guides et des cadres méthodologiques, notamment dans les domaines de la cybersécurité, de la gestion des risques et de la protection des systèmes d'information.\n\nContrairement à une norme unique, le corpus NIST comprend plusieurs publications complémentaires.\n\nLes principales références sont :\n\n- **NIST CSF 2.0** : cadre de gestion des risques de cybersécurité.\n- **NIST SP 800-53 Rev. 5** : catalogue de contrôles de sécurité et de confidentialité.\n- **NIST SP 800-30 Rev. 1** : méthode d'appréciation des risques.\n- **NIST SP 800-37 Rev. 2** : Risk Management Framework (RMF).\n- **NIST SP 800-61 Rev. 3** : recommandations de gestion des incidents.\n- **NIST SP 800-82 Rev. 3** : sécurité des technologies opérationnelles (OT).\n\nSources officielles : NIST CSF 2.0, NIST SP 800-53, NIST SP 800-82.\n\n## 2. NIST CSF 2.0 — Structure générale\n\nLe CSF 2.0 organise les résultats attendus de la gestion des risques de cybersécurité en six fonctions.\n\n|Fonction|Objectif|Exemples d'activités|\n|---|---|---|\n|Govern (GV)|Gouverner|Politique, responsabilités, stratégie, supervision et risques fournisseurs|\n|Identify (ID)|Identifier|Inventaire, contexte, risques et dépendances|\n|Protect (PR)|Protéger|Identités, accès, sensibilisation, sécurité des données et résilience|\n|Detect (DE)|Détecter|Surveillance, analyse d'événements et détection d'anomalies|\n|Respond (RS)|Répondre|Gestion des incidents, communication, analyse et limitation des effets|\n|Recover (RC)|Rétablir|Restauration, continuité, communication et amélioration après incident|\n\nLes six fonctions sont complémentaires et continues. Elles ne représentent pas nécessairement une succession linéaire d'étapes.\n\n### 2.1 Govern — Gouverner\n\nCette fonction établit la manière dont l'organisation pilote le risque cyber.\n\nLes activités peuvent inclure :\n\n- La définition de la stratégie de cybersécurité.\n- L'attribution des responsabilités.\n- L'approbation des politiques.\n- La définition de l'appétence et des critères d'acceptation des risques.\n- L'intégration de la cybersécurité dans la gestion des risques d'entreprise.\n- La supervision des fournisseurs et de la chaîne d'approvisionnement.\n- Le suivi des résultats et des décisions de direction.\n\n**Livrables possibles :** politique de sécurité, matrice RACI, registre des risques, stratégie cyber, indicateurs de pilotage.\n\n### 2.2 Identify — Identifier\n\nL'organisation doit comprendre son environnement et les risques qui affectent ses activités.\n\nLes travaux comprennent :\n\n- L'identification des actifs et des données.\n- La cartographie des systèmes et des dépendances.\n- L'analyse du contexte métier.\n- L'identification des menaces et vulnérabilités.\n- L'évaluation des conséquences d'une compromission.\n- La priorisation des risques.\n- La prise en compte des fournisseurs et services externes.\n\n**Livrables possibles :** inventaire, cartographie, analyse de risques, classification des actifs et registre des dépendances.\n\n### 2.3 Protect — Protéger\n\nCette fonction couvre les mesures destinées à réduire la probabilité ou les conséquences d'un incident.\n\nExemples :\n\n- Gestion des identités et des accès.\n- Authentification et gestion des privilèges.\n- Sensibilisation et formation.\n- Protection des données.\n- Configuration sécurisée.\n- Gestion des vulnérabilités.\n- Protection des infrastructures et réseaux.\n- Sauvegardes et mesures de résilience.\n\n**Livrables possibles :** règles d'accès, configurations de référence, procédures de sauvegarde, politique de correctifs et supports de formation.\n\n### 2.4 Detect — Détecter\n\nLa détection vise à identifier rapidement les événements susceptibles de signaler une compromission.\n\nExemples :\n\n- Collecte et corrélation des journaux.\n- Surveillance des systèmes.\n- Détection des comportements anormaux.\n- Analyse des alertes.\n- Gestion des sources de renseignement sur les menaces.\n- Définition des procédures d'escalade.\n\n**Livrables possibles :** règles de détection, cas d'usage SOC, procédures de qualification et tableaux de bord.\n\n### 2.5 Respond — Répondre\n\nLa réponse vise à contenir l'incident et à en limiter les effets.\n\nExemples :\n\n- Qualification et priorisation.\n- Coordination des équipes.\n- Confinement adapté au contexte.\n- Investigation technique.\n- Communication interne et externe.\n- Conservation des éléments de preuve.\n- Coordination avec les prestataires concernés.\n\n**Livrables possibles :** plan de réponse aux incidents, fiches réflexes, annuaire de crise et rapports d'incident.\n\n### 2.6 Recover — Rétablir\n\nLe rétablissement vise à restaurer les capacités nécessaires après un incident.\n\nExemples :\n\n- Restauration des données et configurations.\n- Vérification de l'intégrité des systèmes.\n- Remise en service progressive.\n- Validation du retour à un état maîtrisé.\n- Communication sur le rétablissement.\n- Retour d'expérience et amélioration.\n\n**Livrables possibles :** plan de reprise, procédures de restauration, résultats de tests et plan d'amélioration.\n\n## 3. Profils organisationnels et niveaux de mise en œuvre\n\n### 3.1 Profil actuel et profil cible\n\nLe CSF permet de décrire un profil actuel et un profil cible.\n\n- **Profil actuel :** résultats de cybersécurité observés dans l'organisation.\n- **Profil cible :** résultats que l'organisation souhaite atteindre en fonction de ses risques et objectifs.\n\nLa comparaison permet de construire une feuille de route priorisée.\n\nUn profil n'est pas une certification. Il doit être fondé sur des preuves et sur des objectifs adaptés à l'organisation.\n\n### 3.2 Tiers de mise en œuvre\n\nLe CSF 2.0 décrit quatre Tiers caractérisant la rigueur des pratiques de gouvernance et de gestion des risques.\n\n|Tier|Désignation anglaise|Interprétation générale|\n|---|---|---|\n|1|Partial|Pratiques principalement ponctuelles ou peu formalisées|\n|2|Risk Informed|Pratiques informées par le risque, avec formalisation variable|\n|3|Repeatable|Pratiques définies, documentées et répétables|\n|4|Adaptive|Pratiques adaptatives intégrant l'apprentissage et l'évolution du contexte|\n\nCes Tiers ne doivent pas être interprétés comme une note universelle de sécurité ni comme des niveaux de certification.\n\n## 4. NIST SP 800-53 Rev. 5 — Catalogue de contrôles\n\nSP 800-53 propose un catalogue de contrôles de sécurité et de confidentialité, adaptable selon le système, le contexte et les risques.\n\nLes familles comprennent notamment :\n\n|Famille|Code|Domaine|\n|---|---|---|\n|Access Control|AC|Contrôle des accès|\n|Awareness and Training|AT|Sensibilisation et formation|\n|Audit and Accountability|AU|Journalisation et responsabilité|\n|Assessment, Authorization and Monitoring|CA|Évaluation, autorisation et surveillance|\n|Configuration Management|CM|Gestion des configurations|\n|Contingency Planning|CP|Continuité et reprise|\n|Identification and Authentication|IA|Identification et authentification|\n|Incident Response|IR|Gestion des incidents|\n|Maintenance|MA|Maintenance|\n|Media Protection|MP|Protection des supports|\n|Physical and Environmental Protection|PE|Sécurité physique et environnementale|\n|Planning|PL|Planification|\n|Personnel Security|PS|Sécurité du personnel|\n|Risk Assessment|RA|Appréciation des risques|\n|System and Services Acquisition|SA|Acquisition et développement|\n|System and Communications Protection|SC|Protection des systèmes et communications|\n|System and Information Integrity|SI|Intégrité des systèmes et informations|\n|Supply Chain Risk Management|SR|Risques liés à la chaîne d'approvisionnement|\n\nCette liste présente des familles importantes, sans prétendre remplacer le catalogue complet.\n\n### Utilisation des contrôles\n\nPour sélectionner un contrôle :\n\n1. Définir le système et les objectifs de sécurité.\n2. Identifier les exigences applicables.\n3. Sélectionner une base de contrôles pertinente.\n4. Adapter les contrôles au contexte.\n5. Définir les responsabilités d'implémentation.\n6. Évaluer l'efficacité des mesures.\n7. Documenter les écarts et les risques résiduels.\n\nLe catalogue est flexible. Les contrôles doivent être sélectionnés et adaptés selon une méthode justifiée plutôt que déclarés tous obligatoires par défaut.\n\n## 5. NIST SP 800-30 — Appréciation des risques\n\nSP 800-30 fournit des recommandations pour réaliser une appréciation des risques.\n\nUne démarche opérationnelle comprend généralement :\n\n1. Préparer l'appréciation et définir son périmètre.\n2. Identifier les sources de menace et les événements redoutés.\n3. Examiner les vulnérabilités, les conditions facilitatrices et les mesures existantes.\n4. Estimer la vraisemblance et les conséquences.\n5. Déterminer les niveaux de risque selon les critères retenus.\n6. Documenter les incertitudes et hypothèses.\n7. Communiquer les résultats aux décideurs.\n8. Réviser l'appréciation lorsque le contexte évolue.\n\n### Registre minimal de risques\n\n|Champ|Description|\n|---|---|\n|Identifiant|Référence unique|\n|Actif ou processus|Élément concerné|\n|Scénario|Événement et chemin de compromission|\n|Menace|Source ou événement menaçant|\n|Vulnérabilité|Faiblesse ou condition facilitatrice|\n|Impact|Conséquences opérationnelles et métier|\n|Vraisemblance|Estimation selon une méthode définie|\n|Risque initial|Niveau avant traitement|\n|Traitement|Mesure choisie|\n|Risque résiduel|Niveau après traitement|\n|Responsable|Propriétaire du risque|\n|Échéance|Date de décision ou de traitement|\n\n## 6. NIST SP 800-37 — Risk Management Framework\n\nLe RMF structure la gestion des risques de sécurité et de confidentialité tout au long du cycle de vie des systèmes.\n\nSes principales étapes sont :\n\n|Étape|Objectif|\n|---|---|\n|Prepare|Préparer la gestion des risques et les responsabilités|\n|Categorize|Catégoriser le système et les informations|\n|Select|Sélectionner les contrôles appropriés|\n|Implement|Mettre en œuvre les contrôles|\n|Assess|Évaluer leur mise en œuvre et leur efficacité|\n|Authorize|Décider de l'autorisation d'exploitation selon le modèle applicable|\n|Monitor|Surveiller les contrôles et l'évolution des risques|\n\nCe cadre est particulièrement structuré pour les systèmes concernés par les exigences fédérales américaines. Une organisation française peut en reprendre la logique sans considérer que les règles d'autorisation américaines lui sont automatiquement applicables.\n\n## 7. Gestion des incidents — NIST SP 800-61 Rev. 3\n\nSP 800-61 Rev. 3 intègre la réponse aux incidents dans l'ensemble de la gestion des risques du CSF 2.0.\n\nLes activités couvrent notamment :\n\n- La préparation et la gouvernance.\n- La détection et l'analyse.\n- La coordination de la réponse.\n- Le confinement et la limitation des impacts.\n- Le rétablissement des systèmes.\n- L'analyse post-incident.\n- L'amélioration des contrôles et procédures.\n\nIl convient de consulter la révision 3 comme référence actuelle de cette publication plutôt que de s'appuyer uniquement sur la révision 2.\n\n## 8. NIST SP 800-82 — Cybersécurité OT\n\nSP 800-82 traite de la protection des technologies opérationnelles, notamment les systèmes de contrôle industriels, la supervision et les dispositifs interagissant avec le monde physique.\n\nLes particularités OT comprennent :\n\n- Les contraintes de disponibilité.\n- Les exigences de temps réel.\n- Les dépendances entre systèmes.\n- Les équipements à longue durée de vie.\n- Les difficultés de mise à jour.\n- Les conséquences physiques possibles d'une compromission.\n\nLes mesures doivent être conçues en tenant compte des contraintes de sûreté de fonctionnement. Une action techniquement pertinente en informatique peut être inadaptée à un procédé industriel si elle est déployée sans analyse et validation.\n\n**Point de version :** SP 800-82 Rev. 3 a été publiée en septembre 2023. Le NIST a annoncé en septembre 2026 un projet de révision 4 soumis à consultation. Il faut donc vérifier l'état de la publication au moment de construire un référentiel formel.\n\n## 9. Articulation entre les publications\n\n|Besoin|Référence de départ|\n|---|---|\n|Structurer la stratégie cyber|CSF 2.0|\n|Définir des contrôles détaillés|SP 800-53 Rev. 5|\n|Évaluer les risques|SP 800-30 Rev. 1|\n|Organiser le cycle de gestion des risques|SP 800-37 Rev. 2|\n|Préparer la réponse aux incidents|SP 800-61 Rev. 3|\n|Adapter les mesures à l'OT|SP 800-82 Rev. 3 et publications ultérieures applicables|\n\n## 10. Mise en œuvre dans une organisation\n\nUne démarche de mise en œuvre peut suivre ce cycle :\n\n1. Définir le périmètre et les objectifs.\n2. Réaliser un profil actuel CSF.\n3. Définir un profil cible.\n4. Réaliser l'analyse de risques.\n5. Sélectionner les contrôles adaptés.\n6. Construire un plan d'action priorisé.\n7. Mettre en œuvre les mesures.\n8. Vérifier leur efficacité.\n9. Suivre les indicateurs et les risques résiduels.\n10. Réviser les profils et les contrôles périodiquement.\n\n## 11. Sources officielles\n\n- NIST CSF : https://www.nist.gov/cyberframework\n- NIST CSF 2.0 : https://doi.org/10.6028/NIST.CSWP.29\n- SP 800-53 Rev. 5 : https://doi.org/10.6028/NIST.SP.800-53r5\n- SP 800-30 Rev. 1 : https://doi.org/10.6028/NIST.SP.800-30r1\n- SP 800-37 Rev. 2 : https://doi.org/10.6028/NIST.SP.800-37r2\n- SP 800-61 Rev. 3 : https://doi.org/10.6028/NIST.SP.800-61r3\n- SP 800-82 Rev. 3 : https://doi.org/10.6028/NIST.SP.800-82r3\n\n---\n\n**Fin du guide NIST.**" },
{ fichier: "2-NIST/2-checklist_audit_nist.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Checklist d'audit NIST — Cybersécurité et gestion des risques\n\n**Nom du fichier :** `checklist_audit_nist.md`  \n**Version :** 1.0  \n**Référence principale :** NIST CSF 2.0, complété par les familles de contrôles de SP 800-53 Rev. 5.\n\n## 1. Objectif\n\nCette checklist sert à évaluer les pratiques de cybersécurité, collecter les preuves et documenter les écarts.\n\nElle est organisée selon les six fonctions du CSF 2.0. Elle constitue une grille de préparation et non une liste exhaustive de toutes les sous-catégories du CSF ou de tous les contrôles SP 800-53.\n\n## 2. Échelle d'évaluation\n\n|Statut|Signification|\n|---|---|\n|Conforme|Le critère d'audit est satisfait et les preuves sont suffisantes|\n|Partiellement conforme|La mesure existe mais reste incomplète|\n|Non conforme|Un écart est établi par rapport au critère applicable|\n|Non applicable|L'exclusion est justifiée et validée|\n|Non évalué|Le point n'a pas encore été examiné|\n\nChaque point doit être associé à un périmètre, à un critère et à une preuve vérifiable.\n\n## 3. Gouvernance — Govern\n\n|ID|Question d'audit|Preuves attendues|Statut|\n|---|---|---|---|\n|GOV-01|Une stratégie de cybersécurité est-elle approuvée ?|Stratégie, décision de direction|À évaluer|\n|GOV-02|Une politique de sécurité est-elle publiée ?|Politique versionnée|À évaluer|\n|GOV-03|Les responsabilités sont-elles définies ?|Organigramme, RACI|À évaluer|\n|GOV-04|Les critères d'acceptation des risques sont-ils documentés ?|Méthodologie et validation|À évaluer|\n|GOV-05|Les risques cyber sont-ils intégrés à la gestion globale des risques ?|Registres et comptes rendus|À évaluer|\n|GOV-06|Les fournisseurs critiques sont-ils évalués ?|Évaluations et contrats|À évaluer|\n|GOV-07|La direction examine-t-elle les indicateurs et les écarts ?|Revues de direction|À évaluer|\n|GOV-08|Les décisions importantes sont-elles tracées ?|Registre des décisions|À évaluer|\n\n## 4. Identification — Identify\n\n|ID|Question d'audit|Preuves attendues|Statut|\n|---|---|---|---|\n|ID-01|Les actifs matériels et logiciels sont-ils inventoriés ?|Inventaire actualisé|À évaluer|\n|ID-02|Les données sensibles sont-elles identifiées ?|Classification des données|À évaluer|\n|ID-03|Les systèmes critiques sont-ils identifiés ?|Analyse d'impact et cartographie|À évaluer|\n|ID-04|Les dépendances techniques sont-elles documentées ?|Cartographie des flux|À évaluer|\n|ID-05|Une méthode d'appréciation des risques est-elle définie ?|Méthodologie approuvée|À évaluer|\n|ID-06|Les risques sont-ils réévalués périodiquement ?|Analyses datées|À évaluer|\n|ID-07|Les risques fournisseurs sont-ils intégrés ?|Registre de risques tiers|À évaluer|\n|ID-08|Les responsabilités de gestion des actifs sont-elles attribuées ?|Propriétaires des actifs|À évaluer|\n\n## 5. Protection — Protect\n\n|ID|Question d'audit|Preuves attendues|Statut|\n|---|---|---|---|\n|PR-01|Les comptes et identités sont-ils gérés ?|Procédures IAM|À évaluer|\n|PR-02|Les privilèges sont-ils limités au besoin ?|Matrice des habilitations|À évaluer|\n|PR-03|Les accès sensibles sont-ils protégés par une authentification adaptée ?|Paramétrage et tests|À évaluer|\n|PR-04|Les configurations de référence sont-elles définies ?|Baselines de configuration|À évaluer|\n|PR-05|Les correctifs sont-ils gérés selon une procédure ?|Registre des vulnérabilités|À évaluer|\n|PR-06|Les données sensibles sont-elles protégées ?|Mesures de chiffrement et d'accès|À évaluer|\n|PR-07|Les sauvegardes sont-elles protégées et testées ?|Rapports de sauvegarde et restauration|À évaluer|\n|PR-08|La sensibilisation des utilisateurs est-elle organisée ?|Formations et évaluations|À évaluer|\n|PR-09|Les changements sont-ils approuvés et tracés ?|Tickets et journaux|À évaluer|\n\n## 6. Détection — Detect\n\n|ID|Question d'audit|Preuves attendues|Statut|\n|---|---|---|---|\n|DET-01|Les événements de sécurité pertinents sont-ils collectés ?|Politique de journalisation|À évaluer|\n|DET-02|Les journaux sont-ils protégés contre les modifications non autorisées ?|Configuration des collecteurs|À évaluer|\n|DET-03|Les alertes sont-elles analysées ?|Procédures SOC et tickets|À évaluer|\n|DET-04|Les cas d'usage de détection sont-ils définis ?|Catalogue des détections|À évaluer|\n|DET-05|Les incidents potentiels sont-ils escaladés ?|Matrice d'escalade|À évaluer|\n|DET-06|Les dispositifs de détection sont-ils testés ?|Résultats de tests|À évaluer|\n|DET-07|Les sources de renseignement sur les menaces sont-elles exploitées ?|Veille et règles adaptées|À évaluer|\n\n## 7. Réponse — Respond\n\n|ID|Question d'audit|Preuves attendues|Statut|\n|---|---|---|---|\n|RES-01|Un plan de réponse aux incidents est-il approuvé ?|Plan versionné|À évaluer|\n|RES-02|Les rôles de crise sont-ils définis ?|Annuaire et RACI|À évaluer|\n|RES-03|Les procédures de qualification sont-elles documentées ?|Procédure de triage|À évaluer|\n|RES-04|Les méthodes de confinement sont-elles définies ?|Fiches réflexes|À évaluer|\n|RES-05|La conservation des preuves est-elle organisée ?|Procédure et registre|À évaluer|\n|RES-06|Les communications internes et externes sont-elles préparées ?|Plan de communication|À évaluer|\n|RES-07|Les incidents font-ils l'objet d'un retour d'expérience ?|Rapport post-incident|À évaluer|\n|RES-08|Des exercices sont-ils organisés ?|Comptes rendus d'exercices|À évaluer|\n\n## 8. Rétablissement — Recover\n\n|ID|Question d'audit|Preuves attendues|Statut|\n|---|---|---|---|\n|REC-01|Les services critiques ont-ils des objectifs de reprise ?|Analyse d'impact|À évaluer|\n|REC-02|Les procédures de restauration sont-elles documentées ?|Plans de reprise|À évaluer|\n|REC-03|Les sauvegardes sont-elles testées par des restaurations ?|Procès-verbaux de tests|À évaluer|\n|REC-04|L'intégrité des systèmes est-elle vérifiée avant remise en service ?|Procédures et résultats|À évaluer|\n|REC-05|Les responsabilités de validation sont-elles définies ?|Matrice de décision|À évaluer|\n|REC-06|Les parties concernées sont-elles informées du rétablissement ?|Plan de communication|À évaluer|\n|REC-07|Les enseignements sont-ils intégrés au plan d'amélioration ?|Registre d'actions|À évaluer|\n\n## 9. Contrôles transversaux à approfondir avec SP 800-53\n\nPour chaque domaine, identifier les contrôles SP 800-53 pertinents, leurs paramètres d'implémentation, les responsabilités et les preuves attendues.\n\nFamilles fréquemment utiles :\n\n- AC : Access Control.\n- AT : Awareness and Training.\n- AU : Audit and Accountability.\n- CA : Assessment, Authorization and Monitoring.\n- CM : Configuration Management.\n- CP : Contingency Planning.\n- IA : Identification and Authentication.\n- IR : Incident Response.\n- RA : Risk Assessment.\n- SA : System and Services Acquisition.\n- SC : System and Communications Protection.\n- SI : System and Information Integrity.\n- SR : Supply Chain Risk Management.\n\nLa liste des familles ne remplace pas la sélection des contrôles et des éventuelles améliorations applicables au système.\n\n## 10. Synthèse d'audit\n\n|Indicateur|Résultat|\n|---|---|\n|Points évalués|À renseigner|\n|Points conformes|À renseigner|\n|Points partiellement conformes|À renseigner|\n|Points non conformes|À renseigner|\n|Points non applicables|À renseigner|\n|Points non évalués|À renseigner|\n|Écarts critiques|À renseigner|\n|Actions en retard|À renseigner|\n|Risques résiduels majeurs|À renseigner|\n\nNe pas assimiler le pourcentage de points conformes à une mesure universelle du niveau de sécurité.\n\n## 11. Fiche d'écart\n\n- Identifiant :\n- Fonction CSF concernée :\n- Contrôle ou critère détaillé :\n- Système et périmètre :\n- Description factuelle :\n- Preuves examinées :\n- Risque associé :\n- Mesure corrective :\n- Mesure compensatoire éventuelle :\n- Responsable :\n- Échéance :\n- Preuve de clôture :\n- Validation finale :\n\n## 12. Références\n\n- NIST CSF : https://www.nist.gov/cyberframework\n- NIST SP 800-53 : https://csrc.nist.gov/pubs/sp/800/53/r5/final\n- NIST SP 800-30 : [https://csrc.nist.gov/pubs/sp/800/30/r1/final](https://csrc.nist.gov/pubs/sp/800/30/r1/final)\n- NIST SP 800-61 Rev. 3 : [https://csrc.nist.gov/pubs/sp/800/61/r3/final](https://csrc.nist.gov/pubs/sp/800/61/r3/final)\n\n---\n\n**Fin de la checklist d'audit NIST.**" },
{ fichier: "2-NIST/3-plan_de_mise_en_oeuvre_nist.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Plan de mise en œuvre NIST — Programme de cybersécurité\n\n**Nom du fichier :** `plan_de_mise_en_oeuvre_nist.md`  \n**Version :** 1.0\n\n## 1. Objectif\n\nCe plan décrit une méthode de déploiement fondée sur NIST CSF 2.0, complétée par les publications SP 800 pertinentes.\n\nIl vise à construire un programme mesurable, proportionné aux risques et maintenable dans le temps.\n\n## 2. Gouvernance du projet\n\n|Rôle|Responsabilités|\n|---|---|\n|Direction|Sponsor, arbitrage et acceptation des risques selon délégation|\n|Responsable cybersécurité|Méthode, coordination et suivi|\n|Responsable des risques|Critères et registre des risques|\n|Responsable informatique|Mise en œuvre technique|\n|Responsable OT, si applicable|Contraintes industrielles et validation opérationnelle|\n|Responsable des données|Classification et exigences de protection|\n|Responsable audit|Évaluation indépendante lorsque requise|\n|Responsables métiers|Priorités et conséquences opérationnelles|\n|Fournisseurs|Mesures et preuves contractuellement attendues|\n\n## 3. Phase 1 — Cadrage\n\nActions :\n\n1. Définir le périmètre organisationnel et technique.\n2. Identifier les services et processus critiques.\n3. Désigner les propriétaires des risques.\n4. Définir les objectifs du programme.\n5. Fixer les critères d'acceptation des risques.\n6. Déterminer les publications et obligations applicables.\n7. Organiser la gestion documentaire.\n\nLivrables :\n\n- Note de cadrage.\n- RACI.\n- Politique de cybersécurité.\n- Registre initial des risques.\n- Planning du programme.\n\nCritère de sortie : périmètre et gouvernance validés.\n\n## 4. Phase 2 — Établir le profil actuel\n\n**Référence principale :** NIST CSF 2.0.\n\nActions :\n\n1. Examiner les résultats attendus des six fonctions.\n2. Identifier les mesures en place.\n3. Recueillir les preuves.\n4. Identifier les écarts et incertitudes.\n5. Évaluer les pratiques de gouvernance et de gestion des risques.\n6. Documenter les dépendances critiques.\n\nLivrables :\n\n- Profil actuel CSF.\n- Inventaire des preuves.\n- Synthèse des écarts.\n- Liste des risques prioritaires.\n\nLe profil actuel doit refléter la situation observée et non uniquement les procédures déclarées.\n\n## 5. Phase 3 — Analyse de risques\n\n**Référence principale :** NIST SP 800-30 Rev. 1.\n\nActions :\n\n1. Définir les actifs et processus concernés.\n2. Identifier les événements redoutés.\n3. Examiner les menaces et vulnérabilités.\n4. Estimer les conséquences.\n5. Évaluer la vraisemblance.\n6. Déterminer le niveau de risque selon une méthode documentée.\n7. Définir les options de traitement.\n8. Faire valider les décisions et risques résiduels.\n\nLivrables :\n\n- Méthodologie d'appréciation.\n- Registre de risques.\n- Scénarios documentés.\n- Plan de traitement.\n\n## 6. Phase 4 — Définir le profil cible\n\nActions :\n\n1. Identifier les résultats CSF nécessaires au contexte métier.\n2. Tenir compte des obligations contractuelles et réglementaires.\n3. Définir les objectifs à atteindre.\n4. Déterminer les priorités selon les risques.\n5. Associer les responsables et preuves attendues.\n6. Valider le profil cible avec les décideurs.\n\nLivrables :\n\n- Profil cible CSF.\n- Liste des résultats prioritaires.\n- Indicateurs de réussite.\n- Feuille de route.\n\nLe profil cible doit être réaliste et fondé sur les risques. Il n'est pas nécessaire de viser indistinctement tous les résultats au même niveau de priorité.\n\n## 7. Phase 5 — Sélectionner les contrôles\n\n**Référence principale :** NIST SP 800-53 Rev. 5.\n\nActions :\n\n1. Sélectionner les contrôles appropriés.\n2. Définir les paramètres d'application.\n3. Identifier les contrôles communs et les contrôles propres aux systèmes.\n4. Définir les responsabilités.\n5. Documenter les contrôles hérités de services partagés.\n6. Adapter les contrôles aux environnements concernés.\n7. Définir les preuves d'efficacité attendues.\n\nLivrables :\n\n- Catalogue des contrôles applicables.\n- Matrice de responsabilités.\n- Plan d'implémentation.\n- Référentiel de preuves.\n\n## 8. Phase 6 — Mise en œuvre\n\nLes actions possibles comprennent :\n\n- Renforcement de la gestion des identités.\n- Réduction des privilèges excessifs.\n- Gestion des configurations.\n- Déploiement des correctifs selon le risque.\n- Protection des données sensibles.\n- Renforcement de la journalisation.\n- Amélioration de la détection.\n- Formalisation de la réponse aux incidents.\n- Tests de sauvegarde et de restauration.\n- Évaluation des fournisseurs critiques.\n\nPour les systèmes OT, toute modification susceptible d'affecter le procédé doit être évaluée et validée par les responsables opérationnels compétents.\n\nChaque action doit comporter un responsable, une échéance, un risque traité et un critère de réussite.\n\n## 9. Phase 7 — Évaluation et autorisation\n\n**Référence complémentaire :** NIST SP 800-37 Rev. 2.\n\nActions :\n\n1. Évaluer la mise en œuvre des contrôles.\n2. Vérifier leur efficacité.\n3. Documenter les écarts.\n4. Déterminer le risque résiduel.\n5. Préparer la décision de mise en service ou d'acceptation du risque, selon le modèle de gouvernance retenu.\n6. Planifier les actions restantes.\n\nLivrables :\n\n- Rapport d'évaluation.\n- Registre des écarts.\n- Plan d'actions.\n- Décision formelle de l'autorité compétente, lorsqu'applicable.\n\nL'étape d'autorisation du RMF correspond à un processus de gouvernance spécifique ; elle ne doit pas être présentée comme une obligation identique pour toutes les organisations privées.\n\n## 10. Phase 8 — Surveillance continue\n\nActions :\n\n- Suivre les vulnérabilités.\n- Surveiller les journaux et alertes.\n- Réviser les accès.\n- Vérifier les sauvegardes.\n- Réévaluer les risques après les changements importants.\n- Contrôler les fournisseurs.\n- Réaliser des audits périodiques.\n- Mettre à jour les profils CSF.\n- Suivre les actions correctives.\n\n## 11. Planning indicatif\n\n|Phase|Durée indicative|Livrable|\n|---|---|---|\n|Cadrage|1 à 2 semaines|Périmètre et gouvernance|\n|Profil actuel|2 à 4 semaines|Évaluation initiale|\n|Analyse de risques|2 à 6 semaines|Registre de risques|\n|Profil cible|1 à 3 semaines|Objectifs et priorités|\n|Sélection des contrôles|2 à 4 semaines|Matrice des contrôles|\n|Mise en œuvre|Variable|Mesures opérationnelles|\n|Évaluation|2 à 4 semaines|Rapport de validation|\n|Surveillance|Continue|Indicateurs et revues|\n\nLes durées sont indicatives et dépendent de la taille, de la complexité et de la maturité de l'organisation.\n\n## 12. Indicateurs de pilotage\n\n|Indicateur|Définition possible|\n|---|---|\n|Couverture de l'inventaire|Actifs recensés par rapport aux actifs estimés|\n|Couverture des risques|Actifs critiques avec risques évalués|\n|Couverture des contrôles|Contrôles applicables évalués|\n|Correctifs en retard|Vulnérabilités dépassant les délais définis|\n|Revue des accès|Comptes examinés sur le périmètre prévu|\n|Efficacité des sauvegardes|Restaurations réussies selon les critères établis|\n|Détection|Alertes pertinentes traitées selon les objectifs|\n|Incidents|Incidents analysés et actions associées|\n|Actions correctives|Actions clôturées avec preuves|\n\nLes objectifs chiffrés doivent être déterminés à partir de la situation de référence et des risques.\n\n## 13. Critères de réussite\n\nLe programme doit permettre de démontrer :\n\n- Une gouvernance définie.\n- Une connaissance suffisante des actifs et risques.\n- Des objectifs de sécurité priorisés.\n- Des contrôles adaptés et documentés.\n- Des preuves de mise en œuvre et d'efficacité.\n- Une gestion des incidents et de la continuité.\n- Un suivi des risques résiduels.\n- Un mécanisme d'amélioration continue.\n\n## 14. Références\n\n- NIST CSF 2.0 : https://www.nist.gov/cyberframework\n- NIST SP 800-30 : [https://csrc.nist.gov/pubs/sp/800/30/r1/final](https://csrc.nist.gov/pubs/sp/800/30/r1/final)\n- NIST SP 800-37 : https://csrc.nist.gov/pubs/sp/800/37/r2/final\n- NIST SP 800-53 : https://csrc.nist.gov/pubs/sp/800/53/r5/final\n- NIST SP 800-61 Rev. 3 : [https://csrc.nist.gov/pubs/sp/800/61/r3/final](https://csrc.nist.gov/pubs/sp/800/61/r3/final)\n\n---\n\n**Fin du plan de mise en œuvre NIST.**" },
{ fichier: "2-NIST/4-modeles_et_registres_nist.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Modèles et registres NIST — Cybersécurité\n\n**Nom du fichier :** `modeles_et_registres_nist.md`  \n**Version :** 1.0\n\n## 1. Objet\n\nCe document rassemble des modèles de travail pour mettre en œuvre et maintenir un programme de cybersécurité inspiré du NIST CSF 2.0 et des publications SP 800.\n\nLes modèles doivent être adaptés au contexte, aux obligations applicables et aux règles de gestion documentaire de l'organisation.\n\n## 2. Modèle — Fiche d'identification d'un système\n\n|Champ|Valeur|\n|---|---|\n|Identifiant|À renseigner|\n|Nom du système|À renseigner|\n|Propriétaire métier|À désigner|\n|Responsable technique|À désigner|\n|Responsable sécurité|À désigner|\n|Fonction métier|À décrire|\n|Données traitées|À classifier|\n|Criticité|À évaluer|\n|Dépendances|À documenter|\n|Fournisseurs|À renseigner|\n|Périmètre|À définir|\n|Dernière revue|À renseigner|\n\n### Analyse complémentaire\n\n- Fonction principale :\n- Conséquences d'une indisponibilité :\n- Conséquences d'une altération :\n- Conséquences d'une divulgation :\n- Exigences de disponibilité :\n- Objectifs de reprise :\n- Interfaces externes :\n- Contraintes techniques :\n- Exigences contractuelles et réglementaires :\n\n---\n\n## 3. Modèle — Inventaire des actifs\n\n|ID|Nom de l'actif|Type|Propriétaire|Environnement|Criticité|Données sensibles|Version|Statut de support|\n|---|---|---|---|---|---|---|---|---|\n|ACT-001|À renseigner|Serveur/application/poste|À désigner|À définir|À évaluer|À classifier|À renseigner|À vérifier|\n|ACT-002|À renseigner|Équipement réseau|À désigner|À définir|À évaluer|À classifier|À renseigner|À vérifier|\n\n### Règles de gestion\n\n- Utiliser un identifiant unique.\n- Attribuer un propriétaire à chaque actif important.\n- Documenter la date de vérification.\n- Identifier les actifs exposés à Internet.\n- Documenter les dépendances critiques.\n- Contrôler l'accès à l'inventaire.\n- Réviser les informations lors des changements.\n\n---\n\n## 4. Modèle — Profil actuel NIST CSF 2.0\n\n|Fonction|Résultat attendu|Situation observée|Preuves|Écart|Priorité|\n|---|---|---|---|---|---|\n|Govern|À définir|À évaluer|À collecter|À analyser|À définir|\n|Identify|À définir|À évaluer|À collecter|À analyser|À définir|\n|Protect|À définir|À évaluer|À collecter|À analyser|À définir|\n|Detect|À définir|À évaluer|À collecter|À analyser|À définir|\n|Respond|À définir|À évaluer|À collecter|À analyser|À définir|\n|Recover|À définir|À évaluer|À collecter|À analyser|À définir|\n\n### Fiche détaillée d'un résultat\n\n- Fonction :\n- Catégorie et sous-catégorie CSF :\n- Périmètre :\n- Résultat attendu :\n- Situation actuelle :\n- Preuves :\n- Incertitudes :\n- Risque associé :\n- Résultat cible :\n- Action nécessaire :\n- Responsable :\n- Échéance :\n\nLe profil actuel décrit les résultats observés. Il ne doit pas être renseigné uniquement sur la base des procédures théoriques.\n\n---\n\n## 5. Modèle — Profil cible NIST CSF 2.0\n\n|ID|Fonction|Résultat cible|Justification métier|Risque traité|Responsable|Échéance|\n|---|---|---|---|---|---|---|\n|CIB-001|Govern|À définir|À documenter|À associer|À désigner|À fixer|\n|CIB-002|Identify|À définir|À documenter|À associer|À désigner|À fixer|\n|CIB-003|Protect|À définir|À documenter|À associer|À désigner|À fixer|\n|CIB-004|Detect|À définir|À documenter|À associer|À désigner|À fixer|\n|CIB-005|Respond|À définir|À documenter|À associer|À désigner|À fixer|\n|CIB-006|Recover|À définir|À documenter|À associer|À désigner|À fixer|\n\nLe profil cible doit refléter les besoins réels de l'organisation et être approuvé par les responsables compétents.\n\n---\n\n## 6. Modèle — Registre des risques\n\n|ID|Actif|Scénario|Menace|Vulnérabilité|Impact|Vraisemblance|Niveau de risque|Traitement|\n|---|---|---|---|---|---|---|---|---|\n|RIS-001|À renseigner|À décrire|À analyser|À analyser|À évaluer|À évaluer|À calculer|À décider|\n|RIS-002|À renseigner|À décrire|À analyser|À analyser|À évaluer|À évaluer|À calculer|À décider|\n\n### Fiche détaillée de risque\n\n**Identifiant :** RIS-XXX\n\n**Contexte**\n\n- Actif ou processus :\n- Propriétaire du risque :\n- Événement redouté :\n- Source de menace :\n- Vulnérabilité ou condition facilitatrice :\n- Mesures existantes :\n\n**Évaluation**\n\n- Méthode de cotation :\n- Critères d'impact :\n- Critères de vraisemblance :\n- Niveau initial :\n- Justification :\n- Incertitudes :\n\n**Traitement**\n\n- Option choisie :\n- Mesures proposées :\n- Responsable :\n- Échéance :\n- Niveau résiduel :\n- Décision d'acceptation :\n- Approbateur :\n- Date de réexamen :\n\nLes critères de cotation et d'acceptation doivent être définis avant l'évaluation. Les niveaux ne doivent pas être inventés a posteriori pour justifier une décision.\n\n---\n\n## 7. Modèle — Matrice des contrôles NIST SP 800-53\n\n|ID|Famille|Référence du contrôle|Applicabilité|Implémentation|Responsable|Preuve|Évaluation|\n|---|---|---|---|---|---|---|---|\n|CTL-001|AC|À sélectionner|À évaluer|À documenter|À désigner|À collecter|À évaluer|\n|CTL-002|IA|À sélectionner|À évaluer|À documenter|À désigner|À collecter|À évaluer|\n|CTL-003|AU|À sélectionner|À évaluer|À documenter|À désigner|À collecter|À évaluer|\n|CTL-004|CM|À sélectionner|À évaluer|À documenter|À désigner|À collecter|À évaluer|\n|CTL-005|IR|À sélectionner|À évaluer|À documenter|À désigner|À collecter|À évaluer|\n\n### Informations à conserver pour chaque contrôle\n\n- Référence exacte et version de la publication.\n- Intitulé officiel.\n- Objectif de sécurité.\n- Applicabilité.\n- Paramètres ou exigences spécifiques.\n- Responsabilité d'implémentation.\n- Contrôles hérités d'un service partagé.\n- Preuves de mise en œuvre.\n- Méthode d'évaluation.\n- Résultat.\n- Écart éventuel.\n- Plan de correction.\n\nLa sélection des contrôles doit être fondée sur le périmètre, les risques et les exigences applicables. Cette matrice n'est pas un inventaire exhaustif de SP 800-53.\n\n---\n\n## 8. Modèle — Plan d'action\n\n|ID|Écart ou risque|Action|Priorité|Responsable|Échéance|Preuve de réussite|Statut|\n|---|---|---|---|---|---|---|---|\n|POA-001|À préciser|À définir|À évaluer|À désigner|À fixer|À définir|À planifier|\n|POA-002|À préciser|À définir|À évaluer|À désigner|À fixer|À définir|À planifier|\n\n### États possibles\n\n- À planifier.\n- En cours.\n- En attente de validation.\n- Bloquée.\n- Terminée, preuve à vérifier.\n- Clôturée.\n- Abandonnée avec justification approuvée.\n\nChaque action doit être associée à un risque ou à un objectif explicite.\n\n---\n\n## 9. Modèle — Registre des preuves\n\n|ID|Contrôle ou objectif|Preuve|Source|Date|Collecteur|Résultat|Emplacement|\n|---|---|---|---|---|---|---|---|\n|PRE-001|À référencer|À décrire|À renseigner|À renseigner|À désigner|À évaluer|À renseigner|\n|PRE-002|À référencer|À décrire|À renseigner|À renseigner|À désigner|À évaluer|À renseigner|\n\n### Critères de qualité\n\n- Pertinence par rapport au contrôle.\n- Provenance identifiable.\n- Date et périmètre connus.\n- Intégrité préservée.\n- Accès maîtrisé.\n- Possibilité de reproduire la vérification.\n\nUne politique démontre qu'une règle existe dans la documentation. Elle ne prouve pas, à elle seule, que cette règle est appliquée efficacement.\n\n---\n\n## 10. Modèle — Registre des incidents\n\n|ID|Date|Système concerné|Type d'incident|Gravité|Statut|Responsable|Actions|\n|---|---|---|---|---|---|---|---|\n|INC-001|À renseigner|À préciser|À qualifier|À évaluer|Ouvert|À désigner|À définir|\n|INC-002|À renseigner|À préciser|À qualifier|À évaluer|Ouvert|À désigner|À définir|\n\n### Fiche détaillée d'incident\n\n- Identifiant :\n- Date de détection :\n- Source du signalement :\n- Systèmes concernés :\n- Description factuelle :\n- Indicateurs observés :\n- Évaluation de l'impact :\n- Décision de qualification :\n- Responsable de l'incident :\n- Actions de confinement :\n- Actions d'éradication :\n- Actions de rétablissement :\n- Éléments de preuve conservés :\n- Communications effectuées :\n- Décisions et validations :\n- Analyse de cause :\n- Mesures correctives :\n- Date de clôture :\n\nLes délais et obligations de notification doivent être déterminés selon les textes et contrats applicables. Ce modèle ne remplace pas les procédures réglementaires de notification.\n\n---\n\n## 11. Modèle — Plan de réponse aux incidents\n\n### Préparation\n\n- Responsable de réponse :\n- Suppléant :\n- Équipe technique :\n- Équipe métier :\n- Contacts des fournisseurs :\n- Contacts de crise :\n- Procédure d'escalade :\n- Emplacement des procédures :\n- Moyens de communication alternatifs :\n\n### Détection et analyse\n\n- Sources d'alerte :\n- Critères de qualification :\n- Critères de gravité :\n- Méthode de collecte des preuves :\n- Procédure d'escalade :\n- Règles de conservation :\n\n### Réponse\n\n- Autorité habilitée à décider du confinement :\n- Mesures autorisées :\n- Restrictions opérationnelles :\n- Coordination avec les fournisseurs :\n- Exigences de notification :\n- Critères de clôture :\n\n### Rétablissement\n\n- Conditions de restauration :\n- Vérification de l'intégrité :\n- Validation métier :\n- Surveillance renforcée :\n- Communication du rétablissement :\n- Retour d'expérience :\n\nCe plan doit être testé au moyen d'exercices adaptés au périmètre et aux conséquences potentielles d'un incident.\n\n---\n\n## 12. Modèle — Continuité et restauration\n\n|Service|Criticité|Objectif de reprise|Perte de données acceptable|Sauvegarde|Test de restauration|\n|---|---|---|---|---|---|\n|À renseigner|À évaluer|À définir|À définir|À documenter|À planifier|\n\n### Fiche de restauration\n\n- Service :\n- Responsable :\n- Dépendances :\n- Sauvegarde de référence :\n- Vérification d'intégrité :\n- Conditions de restauration :\n- Tests fonctionnels :\n- Validation métier :\n- Résultat :\n- Écarts :\n- Date du prochain test :\n\nLes objectifs de reprise doivent être établis à partir d'une analyse d'impact métier et des contraintes réelles des systèmes.\n\n---\n\n## 13. Modèle — Registre fournisseurs\n\n|ID|Fournisseur|Service|Criticité|Accès aux données|Accès au SI|Évaluation|Actions|\n|---|---|---|---|---|---|---|---|\n|FOUR-001|À renseigner|À décrire|À évaluer|À préciser|À préciser|À planifier|À définir|\n|FOUR-002|À renseigner|À décrire|À évaluer|À préciser|À préciser|À planifier|À définir|\n\n### Points de contrôle\n\n- Criticité du service.\n- Données et systèmes accessibles.\n- Sous-traitants et dépendances.\n- Engagements de sécurité.\n- Gestion des vulnérabilités.\n- Notification des incidents.\n- Continuité du service.\n- Conditions de fin de contrat.\n- Suppression ou restitution des données.\n- Réévaluation périodique.\n\n---\n\n## 14. Modèle — Tableau de bord de cybersécurité\n\n|Indicateur|Définition|Fréquence|Responsable|Objectif|\n|---|---|---|---|---|\n|Couverture de l'inventaire|Actifs recensés par rapport aux actifs estimés|Mensuelle|Gestion des actifs|À définir|\n|Risques évalués|Actifs critiques dont les risques ont été analysés|Mensuelle|Gestion des risques|À définir|\n|Contrôles évalués|Contrôles applicables disposant d'une évaluation|Trimestrielle|Sécurité|À définir|\n|Vulnérabilités critiques|Vulnérabilités prioritaires non traitées|Mensuelle|Exploitation|À définir|\n|Revue des accès|Comptes revus selon le calendrier|Trimestrielle|IAM|À définir|\n|Sauvegardes testées|Restaurations ayant satisfait les critères|Selon criticité|Exploitation|À définir|\n|Incidents analysés|Incidents ayant une analyse documentée|Mensuelle|Réponse aux incidents|À définir|\n|Actions en retard|Actions échues non clôturées|Mensuelle|Responsable du programme|À définir|\n\nPour chaque indicateur, définir une méthode de calcul, une source de données, un responsable et les limites d'interprétation.\n\n---\n\n## 15. Règles de gestion documentaire\n\n- Attribuer un identifiant unique à chaque registre.\n- Désigner un propriétaire.\n- Définir les droits d'accès.\n- Enregistrer la date de dernière révision.\n- Conserver l'historique des modifications.\n- Relier les contrôles aux preuves.\n- Relier les écarts aux actions correctives.\n- Protéger les informations techniques sensibles.\n- Prévoir des revues périodiques.\n\n## 16. Références officielles\n\n- NIST CSF : https://www.nist.gov/cyberframework\n- NIST SP 800-53 : https://csrc.nist.gov/pubs/sp/800/53/r5/final\n- NIST SP 800-30 : [https://csrc.nist.gov/pubs/sp/800/30/r1/final](https://csrc.nist.gov/pubs/sp/800/30/r1/final)\n- NIST SP 800-37 : https://csrc.nist.gov/pubs/sp/800/37/r2/final\n- NIST SP 800-61 Rev. 3 : [https://csrc.nist.gov/pubs/sp/800/61/r3/final](https://csrc.nist.gov/pubs/sp/800/61/r3/final)\n- NIST SP 800-82 Rev. 3 : https://csrc.nist.gov/pubs/sp/800/82/r3/final\n\n---\n\n**Fin des modèles et registres NIST.**" },
{ fichier: "2-NIST/sources.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Sources officielles — NIST\n\nLes publications du NIST sont librement téléchargeables. Liens ouverts dans un nouvel onglet.\n\n| Publication | Lien |\n|---|---|\n| Cybersecurity Framework (portail) | https://www.nist.gov/cyberframework |\n| CSF 2.0 (NIST CSWP 29, février 2024) | https://doi.org/10.6028/NIST.CSWP.29 |\n| SP 800-53 Rev. 5 — contrôles de sécurité et de vie privée | https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final |\n| SP 800-30 Rev. 1 — appréciation des risques | https://csrc.nist.gov/pubs/sp/800/30/r1/final |\n| SP 800-37 Rev. 2 — Risk Management Framework | https://csrc.nist.gov/pubs/sp/800/37/r2/final |\n| SP 800-61 Rev. 3 — gestion des incidents | https://csrc.nist.gov/pubs/sp/800/61/r3/final |\n| SP 800-82 Rev. 3 — sécurité des technologies opérationnelles (OT) | https://csrc.nist.gov/pubs/sp/800/82/r3/final |\n\n## Bon usage\n\n- Citer l'édition exacte (CSF 2.0, Rev. 5…) : les identifiants de catégories ont changé entre CSF 1.1 et 2.0 (la fonction Gouverner est apparue en 2.0).\n- Le CSF propose des « références informatives » qui le relient à d'autres référentiels : les consulter sur le site du NIST pour une correspondance fine, sous-catégorie par sous-catégorie.\n\nRetour à la [carte NIST](0-carte.md).\n" },
{ fichier: "3-NIS2/0-carte.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Carte NIS2 — directive (UE) 2022/2555 sur un niveau élevé commun de cybersécurité\n\nLa directive NIS2 remplace la directive NIS de 2016. Elle élargit le nombre de secteurs et d'entités concernés, impose des mesures de gestion des risques, la notification des incidents et engage la responsabilité des dirigeants. Les obligations précises dépendent de sa **transposition nationale** : en France, se reporter à l'ANSSI et à MonEspaceNIS2 (voir les [sources](sources.md)).\n\n- Champ d'application\n  - Annexe I : 11 secteurs hautement critiques\n  - Annexe II : 7 autres secteurs critiques\n  - En principe moyennes et grandes entreprises\n  - Entités essentielles (EE) et entités importantes (EI)\n- Gouvernance (art. 20)\n  - La direction approuve les mesures et en supervise l'application\n  - Responsabilité des dirigeants\n  - Formation obligatoire des membres de la direction\n- [Mesures de gestion des risques (art. 21)](1-obligations.md)\n  - 10 domaines, de l'analyse de risques à l'authentification multifacteur\n  - Approche « tous risques », proportionnée à l'exposition\n- [Notification des incidents (art. 23)](1-obligations.md)\n  - Alerte précoce sous 24 h\n  - Notification sous 72 h\n  - Rapport final sous un mois\n- Supervision et sanctions (art. 31 à 36)\n  - EE : contrôle a priori et a posteriori\n  - EI : contrôle a posteriori\n  - Amendes administratives plafonnées\n- Textes liés\n  - Règlement d'exécution (UE) 2024/2690 : mesures techniques pour les entités numériques\n  - [Correspondance avec ISO 27001, NIST et IEC 62443](../correspondances.md)\n- [Sources officielles](sources.md)\n\n## Les secteurs\n\n| Annexe I — secteurs hautement critiques | Annexe II — autres secteurs critiques |\n|---|---|\n| Énergie (électricité, réseaux de chaleur, pétrole, gaz, hydrogène) | Services postaux et d'expédition |\n| Transports (aérien, ferroviaire, par eau, routier) | Gestion des déchets |\n| Secteur bancaire | Fabrication, production et distribution de produits chimiques |\n| Infrastructures des marchés financiers | Production, transformation et distribution des denrées alimentaires |\n| Santé | Fabrication (dispositifs médicaux, électronique, équipements électriques, machines, véhicules…) |\n| Eau potable | Fournisseurs numériques (places de marché, moteurs de recherche, réseaux sociaux) |\n| Eaux usées | Recherche |\n| Infrastructures numériques | |\n| Gestion des services TIC (entre entreprises) | |\n| Administration publique | |\n| Espace | |\n\n## Entité essentielle ou importante\n\nEn règle générale, une **grande entreprise** d'un secteur de l'annexe I est une entité **essentielle** ; les autres entités du champ (moyennes entreprises de l'annexe I, entreprises de l'annexe II) sont des entités **importantes**. Certaines entités sont concernées quelle que soit leur taille (fournisseurs DNS, registres de noms de domaine, prestataires de services de confiance qualifiés, entités désignées par l'État…). La qualification d'une entité se vérifie avec les critères de la transposition nationale.\n\n| | Entité essentielle | Entité importante |\n|---|---|---|\n| Mesures (art. 21) et notification (art. 23) | Oui | Oui |\n| Supervision | A priori et a posteriori | A posteriori, sur indices |\n| Amende maximale | au moins 10 M€ ou 2 % du chiffre d'affaires annuel mondial | au moins 7 M€ ou 1,4 % du chiffre d'affaires annuel mondial |\n\n> Pour un groupe multisite, l'assujettissement s'apprécie par entité juridique : c'est un point d'entrée de la base groupe envisagée dans WerbGouvernance (référentiels applicables par entité).\n" },
{ fichier: "3-NIS2/1-obligations.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Obligations NIS2 — mesures, notification et preuves attendues\n\nSynthèse des articles 20, 21 et 23 de la directive (UE) 2022/2555. Le texte qui s'impose à une entité est celui de la **transposition nationale** et de ses textes d'application : cette page sert à préparer et à structurer les preuves, pas à conclure sur la conformité.\n\n## Gouvernance (article 20)\n\n- Les **organes de direction** approuvent les mesures de gestion des risques en matière de cybersécurité et supervisent leur mise en œuvre.\n- Ils peuvent être tenus **responsables** des manquements.\n- Ils suivent une **formation** et sont encouragés à en proposer une, régulièrement, à l'ensemble du personnel.\n\n**Preuves attendues** : décision de la direction approuvant la politique et le plan de mesures, comptes rendus de revue de direction, attestations de formation des dirigeants.\n\n## Mesures de gestion des risques (article 21)\n\nLes mesures sont **techniques, opérationnelles et organisationnelles**, appropriées et proportionnées au risque, fondées sur une approche « tous risques » qui protège les réseaux, les systèmes d'information et leur environnement physique. Elles couvrent au moins :\n\n| Point | Domaine | Exemples de preuves | Module WerbSMSI |\n|---|---|---|---|\n| a) | Politiques d'analyse des risques et de sécurité des systèmes d'information | PSSI, méthode et rapport d'analyse de risques, plan de traitement | WerbGouvernance, WerbEBIOS |\n| b) | Gestion des incidents | Procédure, registre des incidents, retours d'expérience | WerbGouvernance, WerbExploitation |\n| c) | Continuité des activités : sauvegardes, reprise après sinistre, gestion de crise | PCA/PRA, registre des sauvegardes, tests de restauration, exercices de crise | WerbExploitation |\n| d) | Sécurité de la chaîne d'approvisionnement, relations avec les fournisseurs et prestataires | Clauses de sécurité, évaluation des fournisseurs, liste des prestataires | WerbGouvernance, WerbIEC62443 |\n| e) | Sécurité de l'acquisition, du développement et de la maintenance des systèmes, y compris le traitement et la divulgation des vulnérabilités | Exigences dans les achats, veille et traitement des vulnérabilités, registre des mises à jour | WerbExploitation, WerbIEC62443 |\n| f) | Politiques et procédures d'évaluation de l'efficacité des mesures | Indicateurs, audits internes, contrôles, plan d'actions | WerbGouvernance |\n| g) | Cyberhygiène de base et formation à la cybersécurité | Plan de sensibilisation, supports, présence ; socle d'hygiène (ANSSI) | WerbGouvernance |\n| h) | Cryptographie et, le cas échéant, chiffrement | Politique cryptographique, inventaire des usages, gestion des certificats | WerbExploitation (certificats) |\n| i) | Sécurité des ressources humaines, contrôle d'accès, gestion des actifs | Procédures d'arrivée et de départ, revue des droits, inventaire des actifs | WerbMap, WerbExploitation |\n| j) | Authentification multifacteur ou continue, communications sécurisées (voix, vidéo, texte), communications d'urgence sécurisées | Périmètre de la MFA, moyens de communication de crise | WerbExploitation (comptes) |\n\nLes entités tiennent compte des **vulnérabilités propres à chaque fournisseur** et de la qualité de leurs pratiques (art. 21 §3). Pour certaines entités numériques, le règlement d'exécution (UE) 2024/2690 précise les exigences techniques et méthodologiques.\n\n## Notification des incidents (article 23)\n\nUn incident est **important** s'il a causé ou peut causer une perturbation opérationnelle grave des services ou des pertes financières pour l'entité, ou s'il a affecté ou peut affecter d'autres personnes en causant des dommages matériels ou non matériels considérables.\n\n| Étape | Délai | Contenu |\n|---|---|---|\n| Alerte précoce | Sans retard injustifié, au plus tard **24 h** après en avoir eu connaissance | Suspicion d'acte illicite ou malveillant, effet transfrontière possible |\n| Notification d'incident | Au plus tard **72 h** après en avoir eu connaissance | Mise à jour de l'alerte, évaluation initiale (gravité, impact), indicateurs de compromission |\n| Rapport intermédiaire | À la demande de l'autorité ou du CSIRT | État de la situation |\n| Rapport final | Au plus tard **un mois** après la notification | Description détaillée, type de menace ou cause, mesures d'atténuation, effet transfrontière |\n| Rapport d'avancement | Si l'incident est toujours en cours à l'échéance du rapport final | Puis rapport final dans le mois suivant son traitement |\n\nL'entité informe aussi, le cas échéant, les **destinataires de ses services** des incidents susceptibles de les affecter et des mesures qu'ils peuvent prendre.\n\n**Preuves attendues** : procédure de notification avec les critères d'incident important, contacts de l'autorité et du CSIRT, modèles de notification, traces des notifications envoyées.\n\n## Prochaine étape\n\nRelier chaque point à une mesure existante, à sa preuve et à son écart : voir le [tableau de correspondances](../correspondances.md), qui rapproche ces obligations d'ISO/IEC 27001, du NIST CSF 2.0, d'IEC 62443 et des mesures d'hygiène de l'ANSSI.\n\nRetour à la [carte NIS2](0-carte.md).\n" },
{ fichier: "3-NIS2/sources.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Sources officielles — NIS2\n\nLiens ouverts dans un nouvel onglet. Les textes européens sont disponibles en français sur EUR-Lex.\n\n## Textes européens\n\n| Texte | Lien |\n|---|---|\n| Directive (UE) 2022/2555 du 14 décembre 2022 (NIS2) | https://eur-lex.europa.eu/eli/dir/2022/2555/oj |\n| Règlement d'exécution (UE) 2024/2690 : exigences techniques et méthodologiques pour certaines entités numériques | https://eur-lex.europa.eu/eli/reg_impl/2024/2690/oj |\n| ENISA, agence de l'Union européenne pour la cybersécurité | https://www.enisa.europa.eu/ |\n\n## En France\n\n| Ressource | Lien |\n|---|---|\n| Présentation de NIS2 par l'ANSSI | https://cyber.gouv.fr/directive-nis-2 |\n| MonEspaceNIS2 : tester son assujettissement, se déclarer, suivre les textes | https://monespacenis2.cyber.gouv.fr/ |\n\n## Bon usage\n\n- La directive fixe un socle ; **la loi de transposition et ses décrets** fixent les obligations exactes, les délais d'application et l'autorité compétente. Vérifier leur état sur les sites ci-dessus avant tout engagement.\n- Garder la trace de la version consultée (date, article) dans le dossier de preuves.\n\nRetour à la [carte NIS2](0-carte.md).\n" },
{ fichier: "4-ISO_27001/0-carte.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Carte ISO/IEC 27001 — le système de management de la sécurité de l'information\n\nISO/IEC 27001:2022 fixe les exigences d'un système de management de la sécurité de l'information (SMSI) : contexte, leadership, risques, support, fonctionnement, évaluation et amélioration. C'est la norme qui se **certifie** ; son Annexe A liste 93 mesures de référence, détaillées dans ISO/IEC 27002.\n\n- Exigences du SMSI (clauses 4 à 10)\n  - 4 — Contexte : enjeux, parties intéressées, périmètre\n  - 5 — Leadership : engagement de la direction, politique, rôles\n  - 6 — Planification : risques, déclaration d'applicabilité, objectifs\n  - 7 — Support : ressources, compétences, sensibilisation, documentation\n  - 8 — Fonctionnement : appréciation et traitement des risques au quotidien\n  - 9 — Évaluation : indicateurs, audit interne, revue de direction\n  - 10 — Amélioration : non-conformités, actions correctives\n- Annexe A — 93 mesures en 4 thèmes\n  - A.5 — Organisationnelles (37)\n  - A.6 — Liées aux personnes (8)\n  - A.7 — Physiques (14)\n  - A.8 — Technologiques (34)\n- Normes de la famille\n  - ISO/IEC 27000 : vocabulaire et vue d'ensemble\n  - ISO/IEC 27002 : guide des mesures\n  - ISO/IEC 27005 : gestion des risques\n  - ISO/IEC 27019 : secteur de l'énergie\n  - ISO/IEC 27035 : gestion des incidents\n- Pages du référentiel\n  - [Guide ISO/IEC 27000 et 27001](1-Guide_ISO_IEC_27000.md)\n  - [Sources officielles](sources.md)\n\n## Le cycle du SMSI\n\n| Étape | Clauses | Ce qui est produit | Dans WerbSMSI |\n|---|---|---|---|\n| Planifier | 4, 5, 6 | Périmètre, politique, rôles, appréciation des risques, déclaration d'applicabilité (DdA / SoA) | WerbGouvernance, WerbEBIOS |\n| Déployer | 7, 8 | Compétences, documentation maîtrisée, mise en œuvre des mesures, traitement des risques | WerbGouvernance, WerbExploitation |\n| Contrôler | 9 | Indicateurs, audits internes, revue de direction | WerbGouvernance |\n| Améliorer | 10 | Non-conformités, actions correctives, plan d'actions | WerbGouvernance |\n\n## La déclaration d'applicabilité\n\nPour chacune des 93 mesures de l'Annexe A, la déclaration d'applicabilité indique si elle est retenue, la justification de son inclusion ou de son exclusion, et son état de mise en œuvre. C'est le document pivot entre l'analyse de risques et l'audit de certification, et le meilleur point d'ancrage des [correspondances](../correspondances.md) avec NIS2.\n\n> Les textes des normes ISO/IEC sont protégés par le droit d'auteur : ce module n'en contient que des repères et des synthèses. La norme s'acquiert auprès de l'ISO ou de l'AFNOR.\n" },
{ fichier: "4-ISO_27001/1-Guide_ISO_IEC_27000.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n## Référentiel de management de la sécurité de l’information\n\n**Version du document :** 1.0  \n**Référentiel principal :** ISO/IEC 27001:2022  \n**Référentiels complémentaires :** ISO/IEC 27000, 27002, 27003, 27004, 27005, 27007, 27008, 27017, 27018, 27019 et 27035.\n\n---\n\n## Sommaire\n\n1. Introduction générale\n2. Vue d’ensemble de la famille ISO/IEC 27000\n3. Principes fondamentaux de la sécurité de l’information\n4. Structure détaillée d’ISO/IEC 27001:2022\n5. Annexe A : les 93 contrôles de sécurité\n6. ISO/IEC 27002 : bonnes pratiques de sécurité\n7. ISO/IEC 27005 : gestion des risques\n8. ISO/IEC 27004 : mesure et indicateurs\n9. ISO/IEC 27003 : mise en œuvre du SMSI\n10. ISO/IEC 27007 et 27008 : audit et évaluation\n11. ISO/IEC 27017 et 27018 : sécurité du cloud\n12. ISO/IEC 27019 : systèmes industriels du secteur énergétique\n13. ISO/IEC 27035 : gestion des incidents\n14. Documentation et preuves attendues\n15. Méthodologie de mise en œuvre\n16. Préparation à l’audit de certification\n17. Correspondance avec NIS2, la LPM et les référentiels ANSSI\n18. Glossaire\n19. Conclusion\n\n---\n\n# 1. Introduction générale\n\n## 1.1 Objectif du guide\n\nLa famille ISO/IEC 27000 regroupe des normes et des lignes directrices destinées à organiser, mettre en œuvre, évaluer et améliorer la sécurité de l’information.\n\nSon référentiel central est ISO/IEC 27001, qui définit les exigences applicables à un système de management de la sécurité de l’information (SMSI).\n\nL’objectif de ce guide est de fournir une compréhension structurée de cette famille normative, en précisant :\n\n- le rôle de chaque norme ;\n- les exigences de management applicables au SMSI ;\n- les principes de l’analyse et du traitement des risques ;\n- les contrôles de sécurité à considérer ;\n- les éléments de preuve utiles lors d’un audit ;\n- les interactions entre gouvernance, mesures techniques et amélioration continue ;\n- les possibilités de rapprochement avec les obligations réglementaires et les référentiels sectoriels.\n\nCe document constitue un support de travail pour les responsables de la sécurité des systèmes d’information (RSSI), les responsables qualité, les équipes informatiques, les auditeurs internes, les responsables de risques et les directions d’organisations.\n\n## 1.2 Qu’est-ce qu’un SMSI ?\n\nUn système de management de la sécurité de l’information est un ensemble cohérent de politiques, de processus, de responsabilités, de moyens et de contrôles permettant de protéger l’information en fonction des risques identifiés.\n\nIl ne se limite pas à l’installation de solutions techniques. Il repose sur une organisation formelle qui permet de décider :\n\n- quelles informations doivent être protégées ;\n- contre quelles menaces ;\n- avec quel niveau de protection ;\n- selon quelles responsabilités ;\n- au moyen de quelles mesures ;\n- comment vérifier leur efficacité ;\n- comment corriger les insuffisances constatées.\n\nUn SMSI doit être adapté au contexte de l'organisation, à ses activités, à ses obligations, à ses partenaires et à ses risques.\n\n## 1.3 Objectifs principaux\n\nUn SMSI vise notamment à :\n\n1. Protéger les informations sensibles et les actifs informationnels.\n2. Réduire les risques de perte, de divulgation, de modification non autorisée ou d'indisponibilité.\n3. Définir une gouvernance claire de la sécurité.\n4. Assurer la cohérence entre les objectifs métier et les objectifs de sécurité.\n5. Organiser la gestion des incidents et des crises.\n6. Démontrer la maîtrise des risques auprès des clients, partenaires, autorités et auditeurs.\n7. Améliorer continuellement les mesures de protection.\n\n## 1.4 Principes fondamentaux\n\nLa mise en œuvre d'un SMSI repose sur plusieurs principes complémentaires.\n\n|Principe|Description|\n|---|---|\n|Approche par les risques|Les mesures sont choisies en fonction des risques id
