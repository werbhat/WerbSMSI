   interne, ancre ignorée). Tout le HTML du texte est échappé, sauf les commentaires
   <!-- … --> placés entre deux blocs, qui ne sont pas affichés ; le premier porte la signature du guide (charte §7.4).
   Thème clair / sombre (charte §7.5, 1.2.0) : fonds sur les variables communes (--card, --info-bg…, repli clair), valeurs sombres
   propres au lecteur à l'écran seulement ; titres sous texte blanc sur --navy-fond ; impression en clair. */
const WerbGuides = Object.freeze((() => {
  const VERSION = "1.1.0";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const sansAccent = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

  /* ---------------------------------------------------------------- texte en ligne */
  let dossierCourant = "";                                   // dossier du guide en cours de rendu (liens relatifs)
  // Chemin d'une page .md citée par un lien relatif, à partir du dossier du guide (« ../2-NIST/0-carte.md »)
  function cheminRelatif(url) {
    let u = url.replace(/#.*$/, "");
    try { u = decodeURIComponent(u); } catch { /* adresse mal encodée : prise telle quelle */ }
    const parts = [];
    for (const p of ((dossierCourant ? dossierCourant + "/" : "") + u.replace(/^\.\//, "")).split("/")) {
      if (p === "..") parts.pop(); else if (p && p !== ".") parts.push(p);
    }
    return parts.join("/");
  }
  function enLigne(s, liens = true) {
    const gardes = [];
    const garder = h => `\u0000${gardes.push(h) - 1}\u0000`;
    s = s.replace(/`([^`]+)`/g, (_, c) => garder(`<code>${esc(c)}</code>`));
    s = s.replace(/\[([^\]]+)\]\((?:<([^>]+)>|([^)\s]+))\)/g, (t, lib, url1, url2) => {
      const url = url1 || url2;
      if (/^(https?:|mailto:)/i.test(url)) return garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${enLigne(lib, false)}</a>`);
      if (/^[^:]+\.md(#.*)?$/i.test(url)) return garder(`<a class="wg-int" data-werb-page="${esc(cheminRelatif(url))}">${enLigne(lib, false)}</a>`);
      return t;
    });
    if (liens) s = s.replace(/\bhttps?:\/\/[^\s<>()]+[^\s<>().,;:!?]/g, url => garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`));
    s = esc(s);
    s = s.replace(/\*\*(?=\S)(.+?)\*\*/g, "<strong>$1</strong>").replace(/__(?=\S)(.+?)__(?![\p{L}\d])/gu, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*(?=\S)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>").replace(/(^|[^\p{L}\d_])_(?=\S)([^_]+?)_(?![\p{L}\d_])/gu, "$1<em>$2</em>");
    return s.replace(/\u0000(\d+)\u0000/g, (_, n) => gardes[+n]);
  }

  /* ---------------------------------------------------------------- blocs */
  const RE_LISTE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const cellules = l => l.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  const estSeparateur = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);

  function rendre(md) {
    const lignes = String(md || "").replace(/\r\n?/g, "\n").split("\n");
    const sommaire = [], ancres = new Set();
    let titre = "", signature = "";
    const ancre = t => {
      const base = "g-" + (sansAccent(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "section");
      let a = base, n = 2;
      while (ancres.has(a)) a = `${base}-${n++}`;
      ancres.add(a);
      return a;
    };
    const html = [];
    let i = 0;
    while (i < lignes.length) {
      const l = lignes[i];
      if (!l.trim()) { i++; continue; }
      if (/^\s*<!--/.test(l)) {                                                     // commentaire : non affiché
        const debut = i;
        while (i < lignes.length && !lignes[i].includes("-->")) i++;
        const c = lignes.slice(debut, i + 1).join(" ").replace(/^\s*<!--|-->[\s\S]*$/g, "").trim();
        if (!signature && !html.length) signature = c;
        i++;
        continue;
      }
      let m;
      if ((m = l.match(/^\s*(`{3,}|~{3,})\s*([\w-]*)/))) {                       // bloc de code
        const fin = m[1], corps = [];
        i++;
        while (i < lignes.length && !lignes[i].trim().startsWith(fin)) corps.push(lignes[i++]);
        i++;
        html.push(`<pre class="wg-code"><code>${esc(corps.join("\n"))}</code></pre>`);
        continue;
      }
      if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {                          // titre
        const niv = m[1].length, txt = m[2], a = ancre(txt);
        if (!titre && niv <= 2) titre = txt.replace(/[*_`]/g, "");
        sommaire.push({ niv, texte: txt.replace(/[*_`]/g, ""), ancre: a });
        html.push(`<h${niv} id="${a}" class="wg-h${niv}">${enLigne(txt)}</h${niv}>`);
        i++;
        continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { html.push("<hr>"); i++; continue; } // filet
      if (l.includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1])) { // tableau
        const tete = cellules(l), alig = cellules(lignes[i + 1]).map(c => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : "");
        const st = k => alig[k] ? ` style="text-align:${alig[k]}"` : "";
        i += 2;
        const corps = [];
        while (i < lignes.length && lignes[i].includes("|") && lignes[i].trim()) corps.push(cellules(lignes[i++]));
        html.push(`<div class="wg-table"><table><thead><tr>${tete.map((c, k) => `<th${st(k)}>${enLigne(c)}</th>`).join("")}</tr></thead>`
          + `<tbody>${corps.map(r => `<tr>${tete.map((_, k) => `<td${st(k)}>${enLigne(r[k] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        continue;
      }
      if (/^\s*>/.test(l)) {                                                       // citation
        const corps = [];
        while (i < lignes.length && /^\s*>/.test(lignes[i])) corps.push(lignes[i++].replace(/^\s*>\s?/, ""));
        html.push(`<blockquote>${rendre(corps.join("\n")).html}</blockquote>`);
        continue;
      }
      if (RE_LISTE.test(l)) {                                                      // liste (imbrication par l'indentation)
        const items = [];
        while (i < lignes.length) {
          const x = lignes[i].match(RE_LISTE);
          if (x) { items.push({ ind: x[1].replace(/\t/g, "    ").length, num: /\d/.test(x[2]), txt: x[3] }); i++; continue; }
          if (lignes[i].trim() && /^\s{2,}/.test(lignes[i]) && items.length) { items[items.length - 1].txt += " " + lignes[i].trim(); i++; continue; }
          break;
        }
        html.push(liste(items));
        continue;
      }
      const para = [];                                                             // paragraphe
      while (i < lignes.length && lignes[i].trim() && !/^(#{1,6}\s|\s*>|\s*(`{3,}|~{3,}))/.test(lignes[i]) && !RE_LISTE.test(lignes[i])
        && !(lignes[i].includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1]))) para.push(lignes[i++]);
      html.push(`<p>${para.map((p, k) => enLigne(p.trim()) + (k < para.length - 1 && / {2,}$/.test(p) ? "<br>" : "")).join(" ")}</p>`);
    }
    return { html: html.join("\n"), sommaire, titre, signature };
  }

  function liste(items) {
    let h = "", pile = [];
    const ouvrir = it => { const t = it.num ? "ol" : "ul"; pile.push({ ind: it.ind, t }); h += `<${t}>`; };
    for (const it of items) {
      while (pile.length && it.ind < pile[pile.length - 1].ind) { h += `</li></${pile.pop().t}>`; }
      if (!pile.length || it.ind > pile[pile.length - 1].ind) ouvrir(it);
      else h += "</li>";
      const c = it.txt.match(/^\[([ xX])\]\s+(.*)$/);
      h += c ? `<li class="wg-tache"><input type="checkbox" disabled${c[1] !== " " ? " checked" : ""}> <span class="wg-li">${enLigne(c[2])}</span>`
        : `<li><span class="wg-li">${enLigne(it.txt)}</span>`;
    }
    while (pile.length) h += `</li></${pile.pop().t}>`;
    return h;
  }

  /* ---------------------------------------------------------------- guides du module */
  const EMOJIS = [[/correspondance|tableau crois[ée]/i, "🔀"], [/^(\d+\s*[-_. ]\s*)?carte\b/i, "🧭"], [/^sources?\b/i, "🔗"], [/obligation/i, "⚖️"], [/industriel/i, "🏭"], [/checklist|contr[oô]le|audit/i, "✅"], [/plan|feuille de route|mise en [oœ]uvre|[ée]tape/i, "🗺️"],
    [/cadrage|p[ée]rim[eè]tre/i, "🎯"], [/matrice|atelier/i, "🧮"], [/socle|mesure/i, "🛡️"], [/rapport|synth[eè]se/i, "📑"],
    [/registre/i, "🗂️"], [/mod[eè]le|gabarit/i, "🧩"], [/guide|r[ée]f[ée]rentiel|m[ée]thode/i, "📘"]];
  let cache = null;
  function liste_guides() {
    if (cache) return cache;
    const src = Array.isArray(globalThis.WERB_GUIDES) ? globalThis.WERB_GUIDES : [];
    cache = src.map((g, n) => {
      const chemin = String(g.fichier || `guide-${n + 1}.md`).replace(/\\/g, "/");
      const dossier = chemin.includes("/") ? chemin.slice(0, chemin.lastIndexOf("/")) : "";
      dossierCourant = dossier;
      const r = rendre(g.texte);
      dossierCourant = "";
      const nom = chemin.slice(dossier ? dossier.length + 1 : 0).replace(/\.md$/i, "");
      // Titre : premier titre (# ou ##) du document, avant « — » ; trop long ou absent : nom du fichier sans numéro
      let titre = (r.sommaire.find(s => s.niv <= 2) || { texte: "" }).texte.replace(/[*_`]/g, "").split(/\s+[—–]\s+/)[0].trim();
      if (!titre || titre.length > 60) titre = nom.replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " ");
      titre = titre.charAt(0).toUpperCase() + titre.slice(1);
      const id = "guide:" + (sansAccent((dossier ? dossier + "/" : "") + nom).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || n + 1);
      const mots = String(g.texte || "").split(/\s+/).filter(Boolean).length;
      // Sommaire : les deux plus hauts niveaux de titres, sans le titre du document
      const titres = r.sommaire.slice(1), niveaux = [...new Set(titres.map(s => s.niv))].sort();
      const som = titres.filter(s => niveaux.indexOf(s.niv) > -1 && niveaux.indexOf(s.niv) < 2).map(s => ({ ...s, rang: niveaux.indexOf(s.niv) + 1 }));
      return Object.freeze({ id, fichier: chemin, dossier, titre, signature: r.signature, emoji: (EMOJIS.find(([re]) => re.test(titre) || re.test(nom)) || [, "📄"])[1],
        html: r.html, sommaire: som, minutes: Math.max(1, Math.round(mots / 200)) });
    });
    return cache;
  }
  const trouver = id => liste_guides().find(g => g.id === id) || null;
  const duDossier = dossier => liste_guides().filter(g => dossier === undefined || g.dossier === dossier);
  const racine = () => String(globalThis.WERB_GUIDES_RACINE || "guides");

  // Entrées du menu ❓ Aide : [[idVue, libellé], …] ; idVue commence par « guide: ». dossier : ceux d'un seul dossier ("" = racine)
  const entrees = dossier => duDossier(dossier).map(g => [g.id, `${g.emoji} ${g.titre}`]);

  // Dossiers des guides, dans l'ordre de leurs fichiers : [{ dossier, nom (sans numéro), guides }] ; "" = racine
  function dossiers() {
    const ds = [];
    for (const g of liste_guides()) {
      let d = ds.find(x => x.dossier === g.dossier);
      if (!d) ds.push(d = { dossier: g.dossier, nom: g.dossier.split("/").pop().replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " "), guides: [] });
      d.guides.push(g);
    }
    return ds;
  }

  // Liens relatifs du texte (data-werb-page) : navigation propre au module vers la page citée, ou texte simple si elle manque
  const liensInternes = (html, lien) => html.replace(/<a class="wg-int" data-werb-page="([^"]*)">([\s\S]*?)<\/a>/g, (_, chemin, lib) => {
    const cible = liste_guides().find(g => esc(g.fichier) === chemin);
    return cible ? `<a href="#" class="wg-int" ${lien(cible.id)}>${lib}</a>` : `<span class="wg-absent" title="Page absente : ${chemin}">${lib}</span>`;
  });

  // Cartes des guides, pour la page d'aide ou l'accueil. lien(id) : attributs HTML de navigation propres au module ; dossier : facultatif
  function cartes(lien, dossier) {
    const gs = duDossier(dossier);
    if (!gs.length) return "";
    return `<div class="wg-cartes">${gs.map((g, n) => `<button type="button" class="wg-carte" ${lien(g.id)}><span class="wg-etape">${n + 1}</span>`
      + `<span class="wg-ct"><b>${g.emoji} ${esc(g.titre)}</b><small>${g.sommaire.filter(s => s.rang === 1).length} sections · ≈ ${g.minutes} min de lecture</small></span></button>`).join("")}</div>`;
  }

  // Page de lecture d'un guide (étapes : les guides de son dossier). lien(id) : attributs HTML de navigation propres au module ;
  // retour : HTML d'un bouton facultatif ; mot : nom d'un document dans le bandeau (« Guide », « Page »…)
  function vue(id, { lien, retour = "", mot = "Guide" } = {}) {
    const g = trouver(id);
    if (!g) return `<div class="wg"><p>Guide introuvable.</p>${retour}</div>`;
    const gs = duDossier(g.dossier);
    const n = gs.indexOf(g), prec = gs[n - 1], suiv = gs[n + 1];
    const etapes = gs.map((x, k) => `<button type="button" class="wg-pas${x === g ? " actif" : ""}" ${lien(x.id)} title="${esc(x.titre)}"><span class="wg-etape">${k + 1}</span>${x.emoji} ${esc(x.titre)}</button>`).join("");
    const som = g.sommaire.map(s => `<a class="wg-s${s.rang}" data-werb-ancre="${s.ancre}">${esc(s.texte)}</a>`).join("");
    const pied = `<div class="wg-pied">${prec ? `<button type="button" ${lien(prec.id)}>← ${esc(prec.titre)}</button>` : "<span></span>"}`
      + `${suiv ? `<button type="button" class="primary" ${lien(suiv.id)}>${esc(suiv.titre)} →</button>` : ""}</div>`;
    return `<div class="wg"><div class="wg-tete"><div class="wg-pas-liste">${etapes}</div>${retour}</div>
      <div class="wg-corps"><article class="wg-doc"><div class="wg-meta">${g.emoji} ${esc(mot)} ${n + 1} / ${gs.length} · ≈ ${g.minutes} min de lecture · <span class="wg-fichier">${esc(racine())}/${esc(g.fichier)}</span>${g.signature ? `<span class="wg-sig">${esc(g.signature)}</span>` : ""}</div>${liensInternes(g.html, lien)}${pied}</article>
      ${som ? `<aside class="wg-som"><div class="wg-som-t">📑 Sommaire</div>${som}</aside>` : ""}</div></div>`;
  }

  /* ---------------------------------------------------------------- style et ancres */
  const CSS = `
.wg{--wg-a:var(--navy,#1f3864);--wg-b:var(--navy-2,#2e5090);--wg-l:var(--line,#dfe3ea);--wg-m:var(--muted,#5d6676);--wg-f:#f6f8fc;--wg-fond:var(--card,#fff);--wg-i:var(--info-bg,#e8eef9);--wg-h:var(--navy-fond,var(--navy,#1f3864));--wg-h2:#2e5090;--wg-code:#eef1f6;--wg-cit:#fff8e6;--wg-cit-b:#e0a100;--wg-th-b:#c9d5ea;--wg-pre:#1d2330;--wg-pre-t:#e8ecf3}
@media screen{:root[data-theme=sombre] .wg,:root[data-theme=sombre] .wg-cartes{--wg-f:#1b2533;--wg-h2:#2a4a7a;--wg-code:#243041;--wg-cit:#3a2d0c;--wg-cit-b:#c79a00;--wg-th-b:#2e4a75;--wg-pre:#0b0f14}}
.wg-tete{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.wg-pas-liste{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.wg-pas{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--wg-l);background:var(--wg-fond);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font:inherit;font-size:13px;color:inherit}
.wg-pas:hover{border-color:var(--wg-b)}
.wg-pas.actif{background:var(--wg-h);border-color:var(--wg-h);color:#fff;font-weight:600}

.wg-pas.actif .wg-etape{background:rgba(255,255,255,.22);color:#fff}

  if (typeof document !== "undefined" && document.head && !document.getElementById("werb-guides-style")) {
    const st = document.createElement("style");
    st.id = "werb-guides-style";
    st.textContent = CSS;
    document.head.appendChild(st);
    // Sommaire : défilement vers la section sans toucher à l'adresse de la page
    document.addEventListener("click", e => {
      const a = e.target.closest && e.target.closest("[data-werb-ancre]");
      if (!a) return;
      e.preventDefault();
      const cible = document.getElementById(a.dataset.werbAncre);

  return { VERSION, rendre, guides: liste_guides, trouver, entrees, dossiers, cartes, vue };
})());

/*! WerbReferentiels – Développé par @WerbHat */
/* Référentiels de cybersécurité à lire et à relier (module de lecture, charte §4) : une catégorie du menu par dossier de
   referentiels/ (ANSSI, NIST, NIS2, ISO 27001…), ses pages Markdown lues par le composant commun guides.js, la carte du
   référentiel (liste imbriquée de 0-carte.md) affichée en carte mentale ou en arborescence, les pages de la racine
   (correspondances) et une recherche plein texte. Aucune base, aucun stockage : la page vue est dans l'adresse (#guide:…),
   ce qui garde le bouton Précédent du navigateur. */
"use strict";
(() => {
  const { esc } = WerbSocle;
  const $ = s => document.querySelector(s);
  const sansAccent = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  /* ===================================================== référentiels (dossiers de referentiels/) */
  // Repères des référentiels connus : emoji et teinte du menu commun. Un autre dossier prend 📚 et une teinte libre.
  const REPERES = [[/anssi/i, "🇫🇷", "bleu"], [/nist/i, "🇺🇸", "rouge"], [/nis\s*2/i, "🇪🇺", "violet"], [/iso/i, "🌐", "vert"],
    [/iec|62443/i, "🏭", "orange"], [/dora/i, "🇪🇺", "cyan"], [/lpm/i, "🇫🇷", "ardoise"], [/rgpd|gdpr/i, "🇪🇺", "rose"], [/\bcra\b/i, "🇪🇺", "olive"]];
  const LIBRES = ["ambre", "olive", "rose", "cyan", "ardoise"];
  const DOSSIERS = WerbGuides.dossiers();
  const RACINE = DOSSIERS.find(d => d.dossier === "") || { dossier: "", nom: "", guides: [] };
  const REFS = DOSSIERS.filter(d => d.dossier !== "").map((d, n) => {
    const r = REPERES.find(([re]) => re.test(d.nom));
    const carte = d.guides.find(estCarte) || null, sources = d.guides.find(g => /^sources?\.md$/i.test(nomFichier(g))) || null;
    return { ...d, emoji: r ? r[1] : "📚", teinte: r ? r[2] : LIBRES[n % LIBRES.length], carte, sources };
  });
  function nomFichier(g) { return g.fichier.split("/").pop(); }
  function estCarte(g) { return /^(\d+\s*[-_. ]\s*)?carte\.md$/i.test(nomFichier(g)); }
  const refDe = g => REFS.find(r => r.dossier === g.dossier) || null;
  const TEXTES = new Map((Array.isArray(window.WERB_GUIDES) ? window.WERB_GUIDES : []).map(x => [String(x.fichier).replace(/\\/g, "/"), String(x.texte || "")]));
  const NB_PAGES = WerbGuides.guides().length;
  // Premier paragraphe d'une page, en texte (le HTML vient du lecteur commun, déjà échappé)
  const chapeau = g => { const m = g && g.html.match(/<p>([\s\S]*?)<\/p>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; };
  const teinte = nom => WerbSocle.teinteCss(WerbSocle.TEINTES[nom] ? nom : "ardoise");   // [fond, texte] qui suivent le thème (charte §7.5)

  /* ===================================================== état (onglet seulement) */
  let vue = "accueil", requete = "", modeCarte = "mentale";

  /* ===================================================== menu */
  const MENU = [
    { g: "ref", i: "🧭", l: "Référentiels", c: "cyan", t: [["accueil", "Accueil"], ...WerbGuides.entrees("")] },
    ...REFS.map(r => ({ g: "d:" + r.dossier, i: r.emoji, l: r.nom, c: r.teinte, t: WerbGuides.entrees(r.dossier) })),
    { g: "aide", i: "❓", l: "Aide", c: "olive", t: [["aide", "Guide du module"], ["apropos", "À propos"]] },
  ];
  const menu = WerbSocle.menu($("#sidebar"), MENU, { surNav: aller });
  const pied = `<footer class="sig"><b>${esc(WERB.produit)}</b><br>${esc(WERB.signature)}<br>v${esc(WERB.version)} · ${esc(window.BUILD_DATE)}</footer>`;
  const lien = id => `data-nav="${esc(id)}"`;

  /* ===================================================== vues */
  const VUES = {};

  VUES.accueil = () => {
    const pages = r => r.guides.filter(g => g !== r.carte && g !== r.sources);
    const carteRef = r => {
      const [f, t] = teinte(r.teinte);
      return `<div class="rf-ref" style="--rf-f:${f};--rf-t:${t}">
        <button type="button" class="rf-ref-t" ${lien((r.carte || r.guides[0]).id)}><span class="rf-ref-i">${esc(r.emoji)}</span>${esc(r.nom)}<small>${r.guides.length} page${r.guides.length > 1 ? "s" : ""}</small></button>
        <p>${chapeau(r.carte || r.guides[0]) || "&nbsp;"}</p>
        <div class="rf-ref-b">${r.carte ? `<button type="button" class="primary" ${lien(r.carte.id)}>🧭 Carte</button>` : ""}${r.sources ? `<button type="button" ${lien(r.sources.id)}>🔗 Sources officielles</button>` : ""}</div>
        ${pages(r).length ? `<ul class="rf-pages">${pages(r).map(g => `<li><a href="#" ${lien(g.id)}>${esc(g.emoji)} ${esc(g.titre)}</a></li>`).join("")}</ul>` : ""}
      </div>`;
    };
    return `<h1>🧭 Référentiels de cybersécurité</h1>
      <p class="sub">${REFS.length} référentiel${REFS.length > 1 ? "s" : ""} · ${NB_PAGES} pages · des synthèses pour comprendre, relier et auditer, jamais les textes normatifs eux-mêmes.</p>
      ${RACINE.guides.map(g => `<div class="card rf-croise"><div class="row"><h2>${esc(g.emoji)} ${esc(g.titre)}</h2><span class="spacer"></span><button type="button" class="primary" ${lien(g.id)}>Ouvrir</button></div><p>${chapeau(g)}</p></div>`).join("")}
      ${REFS.length ? `<div class="rf-refs">${REFS.map(carteRef).join("")}</div>` : `<div class="card"><p>Aucun référentiel : ajoutez un dossier dans <code>referentiels/</code> puis reconstruisez le module.</p></div>`}
      <p class="small muted">Ajouter un référentiel (DORA, LPM, IEC 62443…) : un dossier de plus dans <code>referentiels/</code>, puis reconstruire. Voir ❓ Aide › Guide du module.</p>`;
  };

  VUES.recherche = () => {
    const termes = sansAccent(requete).split(/\s+/).filter(t => t.length >= 2);
    if (!termes.length) return `<h1>🔎 Recherche</h1><p class="sub">Saisissez au moins deux caractères dans la zone de recherche du bandeau.</p>`;
    const res = [];
    for (const g of WerbGuides.guides()) {
      const brut = texteBrut(TEXTES.get(g.fichier) || ""), norm = sansAccent(brut), titre = sansAccent(g.titre);
      if (!termes.every(t => norm.includes(t) || titre.includes(t))) continue;
      const score = termes.reduce((s, t) => s + norm.split(t).length - 1 + (titre.includes(t) ? 20 : 0), 0);
      const pos = Math.max(0, Math.min(...termes.map(t => { const i = norm.indexOf(t); return i < 0 ? Infinity : i; })));
      const debut = Number.isFinite(pos) ? Math.max(0, pos - 90) : 0;
      res.push({ g, score, extrait: (debut ? "… " : "") + brut.slice(debut, debut + 240) + (brut.length > debut + 240 ? " …" : "") });
    }
    res.sort((a, b) => b.score - a.score);
    return `<h1>🔎 Recherche : « ${esc(requete)} »</h1><p class="sub">${res.length} page${res.length > 1 ? "s" : ""} trouvée${res.length > 1 ? "s" : ""}${res.length > 60 ? " (60 premières)" : ""}.</p>
      ${res.slice(0, 60).map(({ g, extrait }) => { const r = refDe(g); return `<button type="button" class="rf-res" ${lien(g.id)}>
        <span class="rf-res-t">${r ? `<span class="rf-puce">${esc(r.emoji)} ${esc(r.nom)}</span>` : `<span class="rf-puce">🧭 Référentiels</span>`}<b>${esc(g.emoji)} ${surligner(g.titre, termes)}</b></span>
        <span class="rf-res-x">${surligner(extrait, termes)}</span></button>`; }).join("") || `<div class="card"><p>Aucune page ne contient tous ces mots.</p></div>`}`;
  };

  VUES.aide = () => `<h1>❓ Guide de ${esc(WERB.produit)}</h1><p class="sub">${esc(WERB.description)}</p>
    <div class="card"><h2>📖 Lire</h2><ul>
      <li>Le menu a <b>une catégorie par référentiel</b> (🇫🇷 ANSSI, 🇺🇸 NIST, 🇪🇺 NIS2, 🌐 ISO 27001…) ; ses pages sont dedans. La catégorie 🧭 Référentiels porte l'accueil et le <b>tableau de correspondances</b>.</li>
      <li>Chaque référentiel commence par sa <b>carte</b> : affichage en <b>carte mentale</b>, en <b>arborescence</b> ou en liste. Les liens de la carte ouvrent les pages du module.</li>
      <li>La page <b>Sources officielles</b> donne les liens vers les textes de référence (cyber.gouv.fr, nist.gov, EUR-Lex, iso.org) : ils s'ouvrent dans un nouvel onglet, la seule sortie vers Internet du module, à votre initiative.</li>
      <li>La zone 🔎 du bandeau cherche dans toutes les pages (sans tenir compte des accents). Le bouton Précédent du navigateur ramène à la page d'avant.</li>
    </ul></div>
    <div class="card"><h2>🔀 Correspondances et audit</h2><p>Le tableau croisé relie chaque exigence NIS2 aux mesures ISO/IEC 27001, aux catégories du NIST CSF 2.0, aux exigences IEC 62443 et aux mesures d'hygiène de l'ANSSI, avec le module WerbSMSI où se trouve la preuve. Il sert d'abord en audit : « telle mesure couvre telle exigence ». Une correspondance est fonctionnelle : elle ne vaut pas conformité automatique.</p></div>
    <div class="card"><h2>➕ Ajouter ou modifier un référentiel</h2><ol>
      <li>Dans le dépôt du module, créer un dossier <code>referentiels/&lt;n&gt;-&lt;NOM&gt;/</code> (par exemple <code>5-DORA</code>) : le numéro fixe l'ordre, le nom sans numéro devient la catégorie du menu.</li>
      <li>Y placer <code>0-carte.md</code> (une liste Markdown imbriquée : domaines → thèmes → liens vers les pages), les pages numérotées (<code>1-…md</code>, <code>2-…md</code>) et <code>sources.md</code>, toujours rangée en dernier.</li>
      <li>Première ligne de chaque page : <code>&lt;!-- WerbReferentiels – Développé par @WerbHat --&gt;</code> (contrôlée par l'audit).</li>
      <li>Liens entre pages : liens Markdown relatifs, <code>[Plan](3-plan.md)</code> ou <code>[Carte NIST](../2-NIST/0-carte.md)</code> (espaces en <code>%20</code>). Ils fonctionnent aussi dans Obsidian.</li>
      <li>Reconstruire puis publier : <code>werb_charte.py construire</code>, <code>empreinte</code>, <code>audit</code>, <code>publier</code>. Aucun nouveau module n'est nécessaire.</li>
    </ol></div>
    <div class="card"><h2>⚖️ Droits</h2><p>Le module contient des <b>synthèses rédigées pour WerbSMSI</b>. Il ne reproduit pas les textes des normes ISO/IEC, qui sont protégés : on les achète auprès de l'ISO ou de l'AFNOR. Les guides de l'ANSSI publiés sous Licence Ouverte (Etalab) peuvent être résumés plus largement, avec mention de la source. Les textes européens (EUR-Lex) et les publications du NIST sont librement consultables.</p></div>`;

  VUES.apropos = () => `<h1>À propos</h1><p class="sub">${esc(WERB.description)}</p><div class="card"><table class="t"><tbody>
    <tr><td class="muted" style="width:220px">Produit</td><td><b>${esc(WERB.produit)}</b> v${esc(WERB.version)} (build ${esc(window.BUILD_DATE)})</td></tr>
    <tr><td class="muted">Auteur</td><td>${esc(WERB.signature)}</td></tr>
    <tr><td class="muted">Type</td><td>Module de lecture : aucune base, aucune publication, rien n'est enregistré</td></tr>
    <tr><td class="muted">Contenu</td><td>${REFS.map(r => `${esc(r.emoji)} ${esc(r.nom)} (${r.guides.length})`).join(" · ")}${RACINE.guides.length ? ` · 🧭 ${RACINE.guides.length} page(s) transverse(s)` : ""} — ${NB_PAGES} pages, dossier <code>referentiels/</code></td></tr>
    <tr><td class="muted">Environnement WerbSMSI</td><td>Rubrique « gouvernance », niveau groupe · charte ${esc(WERB.charte)} · socle ${esc(WerbSocle.VERSION)} · lecteur ${esc(WerbGuides.VERSION)}</td></tr>
    <tr><td class="muted">Mention complète</td><td>${esc(WERB.ligne)}</td></tr>
    </tbody></table></div>`;

  // Page d'un référentiel ; la carte reçoit le choix d'affichage (carte mentale, arborescence, liste)
  function vuePage(id) {
    const g = WerbGuides.trouver(id), r = refDe(g);
    const retour = `<button type="button" data-nav="accueil">← Accueil</button>`;
    let h = WerbGuides.vue(id, { lien, retour, mot: "Page" });
    if (r) h = h.replace('<div class="wg-tete">', `<div class="rf-fil" style="--rf-f:${teinte(r.teinte)[0]};--rf-t:${teinte(r.teinte)[1]}">${esc(r.emoji)} <b>${esc(r.nom)}</b></div><div class="wg-tete">`);
    else h = h.replace('<article class="wg-doc">', '<article class="wg-doc rf-large">');   // page transverse : tableaux larges
    if (estCarte(g)) {
      const modes = [["mentale", "🧠 Carte mentale"], ["arbre", "🌳 Arborescence"], ["liste", "📝 Liste"]];
      h = h.replace('<article class="wg-doc">', `<article class="wg-doc rf-carte rf-${modeCarte}"><div class="rf-modes"><span class="muted">Affichage :</span>${modes.map(([m, l]) =>
        `<button type="button" data-mode="${m}"${m === modeCarte ? ' class="act" aria-pressed="true"' : ' aria-pressed="false"'}>${l}</button>`).join("")}</div>`);
    }
    return h;
  }

  /* ===================================================== recherche */
  function texteBrut(md) {
    return md.replace(/<!--[\s\S]*?-->/g, " ").replace(/^\s*\|?\s*:?-{2,}.*$/gm, " ").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/`{3,}[^\n]*|[#*_>`|~]+/g, " ")
      .replace(/^\s*[-+]\s+|\s:?-{2,}:?\s/gm, " ").replace(/\s+/g, " ").trim();
  }
  // Mots recherchés surlignés, accents compris : le texte est échappé morceau par morceau
  const ACCENTS = { a: "aàâä", e: "eéèêë", i: "iîï", o: "oôö", u: "uùûü", c: "cç", y: "yÿ" };
  function surligner(texte, termes) {
    const motif = termes.map(t => [...t].map(ch => ACCENTS[ch] ? `[${ACCENTS[ch]}]` : ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("")).join("|");
    if (!motif) return esc(texte);
    let h = "", i = 0;
    for (const m of texte.matchAll(new RegExp(motif, "giu"))) { h += esc(texte.slice(i, m.index)) + `<mark>${esc(m[0])}</mark>`; i = m.index + m[0].length; }
    return h + esc(texte.slice(i));
  }

  /* ===================================================== rendu et navigation */
  function render() {
    const page = vue.startsWith("guide:") && WerbGuides.trouver(vue);
    if (!page && !VUES[vue]) vue = "accueil";
    $("#main").innerHTML = page ? vuePage(vue) : VUES[vue]();
    $("#main").dataset.vue = vue;                                     // repère de la page affichée (tests)
    const g = page ? WerbGuides.trouver(vue) : null, r = g && refDe(g);
    $("#tb-titre").textContent = g ? `${r ? r.nom + " › " : ""}${g.titre}` : "Référentiels de cybersécurité";
    document.title = g ? `${g.titre} – ${WERB.produit}` : WERB.produit;
    if (r) menu.deplier("d:" + r.dossier);
    menu.rendre({ actif: vue, pied });
  }
  // La page vue est dans l'adresse (#guide:…) : Précédent / Suivant du navigateur, rien dans le stockage (P2)
  function aller(id) {
    if (id === vue) { $("#main").scrollTop = 0; return; }
    if (id !== "recherche") { requete = ""; $("#recherche").value = ""; }
    location.hash = encodeURIComponent(id);
  }
  function depuisAdresse() {
    let id = "";
    try { id = decodeURIComponent(location.hash.slice(1)); } catch { /* adresse illisible : accueil */ }
    vue = id === "recherche" && !requete ? "accueil" : id || "accueil";
    render();
    $("#main").scrollTop = 0;
  }
  window.addEventListener("hashchange", depuisAdresse);

  document.addEventListener("click", e => {
    const nav = e.target.closest("[data-nav]");
    if (nav && !nav.closest("#sidebar")) { e.preventDefault(); aller(nav.dataset.nav); return; }
    const mode = e.target.closest("[data-mode]");
    if (mode) { modeCarte = mode.dataset.mode; const y = $("#main").scrollTop; render(); $("#main").scrollTop = y; }
  });
  const champ = $("#recherche");
  champ.addEventListener("input", () => {
    requete = champ.value.trim();
    if (requete.length >= 2) { if (vue !== "recherche") location.hash = "recherche"; else render(); }
    else if (vue === "recherche" && !requete) aller("accueil");
  });
  champ.addEventListener("keydown", e => { if (e.key === "Escape") { champ.value = ""; requete = ""; if (vue === "recherche") aller("accueil"); } });

  // Bandeau commun (charte §7.6, socle 1.8.0) : pas de base à ouvrir ni à exporter ; 🖨 PDF imprime la page affichée (traité par le socle)
  document.getElementById("tb-actions").innerHTML = WerbSocle.bandeau.boutons(["pdf"]);
  depuisAdresse();
})();
</script>
</body>
