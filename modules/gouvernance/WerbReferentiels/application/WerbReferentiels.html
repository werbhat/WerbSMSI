 qui affecte sa conformité aux exigences essentielles ou modifie l'usage prévu (par exemple un firmware modifié, une fonction réseau ajoutée) ;\n- vous **vendez une machine ou un ensemble** qui constitue lui-même un produit à éléments numériques (une cellule robotisée communicante vendue sous votre nom).\n\nVous **n'êtes pas** fabricant au sens du CRA lorsque vous **configurez et installez**, pour un client, des produits déjà marqués CE sans les modifier ni les revendre sous votre nom : vous restez responsable de la qualité de votre intégration (cahier d'exigences, IEC 62443-2-4), pas de la conformité CRA des composants.\n\n| Situation | Statut CRA probable |\n|---|---|\n| Vous paramétrez un automate du marché et livrez le programme au client | Pas fabricant de l'automate ; votre programme sur mesure, non mis sur le marché, n'est pas un produit au sens du CRA |\n| Vous vendez une machine standard, sous votre marque, avec un automate et une IHM connectés | Fabricant de la machine en tant que produit à éléments numériques ; exigez la conformité CRA de vos composants |\n| Vous développez et vendez un logiciel de supervision | Fabricant du logiciel |\n| Vous modifiez le firmware d'un équipement acheté avant de le revendre | Fabricant (modification substantielle) |\n| Vous développez un outil interne utilisé seulement par votre entreprise | Hors champ (pas de mise sur le marché) |\n\n> Ces cas sont indicatifs : la qualification se fait produit par produit, avec les guides de la Commission et, si besoin, un conseil juridique.\n\n---\n\n## L'acheteur et l'exploitant : un levier\n\nUn site industriel, une DSI ou un RSSI n'ont pas d'obligation au titre du CRA quand ils achètent et exploitent des produits. Mais le règlement leur donne des **arguments opposables** aux fournisseurs :\n\n- exiger le **marquage CE au titre du CRA** et la **déclaration UE de conformité** pour tout produit mis sur le marché après décembre 2027 ;\n- connaître la **période de support** (durée des mises à jour de sécurité) **avant** l'achat, et la comparer à la durée d'exploitation prévue — souvent 15 à 20 ans en industrie ;\n- obtenir un **point de contact** pour signaler une vulnérabilité et les **avis de sécurité** du fabricant ;\n- demander la **nomenclature logicielle (SBOM)**, au moins sur demande ;\n- savoir comment les **mises à jour** sont distribuées et vérifiées.\n\nC'est l'objet du guide [l'acheteur et l'exploitant](5-Acheteur_et_exploitant.md).\n\n---\n\n## Les classes de produits\n\n| Classe | Exemples | Évaluation de la conformité |\n|---|---|---|\n| **Produit par défaut** (la grande majorité) | Capteur connecté simple, logiciel métier, imprimante, la plupart des automates et IHM | **Contrôle interne** par le fabricant (module A) |\n| **Important — classe I** (annexe III) | Systèmes d'exploitation, routeurs, modems, **commutateurs**, VPN, gestionnaires d'identité et de mots de passe, antivirus, outils de gestion de réseau, SIEM, PKI, objets connectés de sécurité (caméras, serrures…) | Contrôle interne **seulement si** une norme harmonisée, une spécification commune ou une certification européenne est appliquée entièrement ; sinon **tiers** (organisme notifié) |\n| **Important — classe II** (annexe III) | **Pare-feu**, systèmes de détection et de prévention d'intrusion, hyperviseurs et environnements de conteneurs, microprocesseurs et microcontrôleurs résistants à l'effraction | **Évaluation par un tiers** obligatoire (examen UE de type + conformité au type, ou assurance qualité complète) |\n| **Critique** (annexe IV) | Boîtiers de sécurité matériels (HSM), passerelles de compteurs intelligents, cartes à puce et éléments sécurisés | **Certification européenne de cybersécurité** lorsqu'un acte de la Commission l'exige, sinon comme la classe II |\n\nLa classe dépend de la **fonction principale** du produit, pas du fait qu'il en intègre un autre : une machine qui contient un commutateur n'est pas, de ce seul fait, un produit important.\n\n> La liste exacte des catégories et leurs descriptions techniques sont fixées par le règlement et un acte d'exécution : vérifiez la classe de chaque produit avec les [sources](sources.md).\n\nSuite : [Les exigences essentielles](3-Exigences_essentielles.md).\n" },
{ fichier: "5-CRA/3-Exigences_essentielles.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Les exigences essentielles\n\nL'**annexe I** du règlement fixe deux familles d'exigences. Elles sont formulées en **objectifs** : le fabricant choisit les moyens, et les démontre dans sa documentation technique. Les normes harmonisées, en cours de rédaction, donneront une présomption de conformité.\n\n---\n\n## Partie I — Propriétés de sécurité du produit\n\nLe produit est conçu, développé et fabriqué pour garantir un niveau de cybersécurité **adapté aux risques**, sur la base d'une **analyse de risques** documentée. En particulier :\n\n| # | Exigence (formulation simplifiée) | Ce que cela veut dire en pratique | Preuve attendue |\n|---|---|---|---|\n| 1 | Mis sur le marché **sans vulnérabilité exploitable connue** | Analyse des vulnérabilités des composants avant la livraison | Rapport d'analyse, SBOM confrontée aux bases de vulnérabilités |\n| 2 | **Configuration sécurisée par défaut**, avec retour à l'état d'origine possible | Pas de mot de passe par défaut commun, services inutiles désactivés | Guide de configuration, tests de la configuration d'usine |\n| 3 | Vulnérabilités corrigeables par des **mises à jour de sécurité**, automatiques si pertinent, que l'utilisateur peut différer ou refuser | Mécanisme de mise à jour, notification de l'utilisateur | Procédure de mise à jour, historique des versions |\n| 4 | **Protection contre l'accès non autorisé** : authentification, gestion des identités et des accès | Comptes nominatifs, mots de passe robustes, verrouillage | Description des mécanismes d'authentification |\n| 5 | **Confidentialité** des données stockées, transmises ou traitées (chiffrement) | Chiffrement des flux d'administration et des secrets | Liste des algorithmes, gestion des clés |\n| 6 | **Intégrité** des données, programmes et configuration | Signature des firmwares, contrôle d'intégrité au démarrage | Description de la chaîne de confiance |\n| 7 | **Minimisation des données** : seulement celles nécessaires à l'usage prévu | Pas de télémétrie superflue | Inventaire des données traitées |\n| 8 | **Disponibilité** des fonctions essentielles, y compris après un incident, et résistance au déni de service | Comportement en cas de saturation, mode dégradé | Tests de robustesse |\n| 9 | **Limiter l'effet** du produit sur la disponibilité des autres appareils ou réseaux | Pas de diffusion massive, limitation de débit | Tests en réseau |\n| 10 | **Surface d'attaque réduite**, y compris les interfaces externes | Ports et services au strict nécessaire | Liste des interfaces et justification |\n| 11 | **Réduire l'impact** d'un incident (cloisonnement, mécanismes d'atténuation) | Séparation des privilèges, durcissement | Architecture de sécurité |\n| 12 | **Journalisation** des activités internes pertinentes, désactivable par l'utilisateur | Journaux d'accès et de modification de configuration | Liste des événements journalisés |\n| 13 | **Effacement** sûr et facile de toutes les données et paramètres, et transfert sécurisé si prévu | Fonction de remise à zéro | Procédure de fin de vie |\n\n---\n\n## Partie II — Traitement des vulnérabilités\n\nPendant toute la **période de support**, le fabricant :\n\n| # | Exigence (formulation simplifiée) | En pratique |\n|---|---|---|\n| 1 | Identifie et documente les vulnérabilités et composants, notamment par une **nomenclature logicielle (SBOM)** dans un format lisible par machine, au moins pour les dépendances de premier niveau | SBOM à jour à chaque version ; transmise aux autorités sur demande |\n| 2 | **Traite et corrige sans délai** les vulnérabilités, notamment par des mises à jour de sécurité, séparées des évolutions fonctionnelles quand c'est possible | Processus de tri, priorisation et correction |\n| 3 | **Teste et revoit régulièrement** la sécurité du produit | Tests d'intrusion, revues de code, analyses automatisées |\n| 4 | **Publie** les informations sur les vulnérabilités corrigées (description, produits concernés, impact, gravité, correction) | Avis de sécurité publics |\n| 5 | Applique une **politique de divulgation coordonnée** des vulnérabilités | Politique publiée, délais annoncés |\n| 6 | Facilite le **signalement** des vulnérabilités par une adresse de contact | Point de contact unique, accusé de réception |\n| 7 | **Distribue les mises à jour de façon sécurisée** | Mises à jour signées, canal authentifié |\n| 8 | Diffuse les correctifs **sans délai et gratuitement**, avec des conseils aux utilisateurs | Bulletins avec mesures de contournement |\n\n---\n\n## Le signalement (article 14) — applicable depuis le 11 septembre 2026\n\nLe fabricant signale, par la **plateforme unique de signalement** gérée par l'ENISA, au CSIRT coordinateur de son État et à l'ENISA :\n\n| Événement | Alerte précoce | Notification | Rapport final |\n|---|---|---|---|\n| **Vulnérabilité activement exploitée** dans son produit | **24 h** après en avoir eu connaissance | **72 h** | Au plus tard **14 jours** après la mise à disposition d'une mesure corrective |\n| **Incident grave** ayant un impact sur la sécurité du produit | **24 h** | **72 h** | **Un mois** après la notification |\n\nIl **informe aussi les utilisateurs** concernés, et si besoin le public, de la vulnérabilité ou de l'incident et des mesures d'atténuation.\n\n> Pour un fabricant qui est aussi une entité NIS2, un même événement peut appeler **deux signalements** : celui du CRA (le produit) et celui de NIS2 (l'organisation). Préparez une procédure unique qui distingue les deux.\n\n---\n\n## Correspondance avec IEC 62443\n\nPour un produit industriel, la série IEC 62443 est la base technique la plus proche du CRA.\n\n| Exigence CRA | IEC 62443-4-1 (développement sécurisé) | IEC 62443-4-2 (exigences des composants) |\n|---|---|---|\n| Analyse de risques (partie I) | SR (exigences de sécurité), SD-1 (modèle de menace) | — |\n| Configuration sécurisée par défaut (I.2) | SG (guides de sécurité, durcissement) | CR 7.7 (fonctionnalité minimale) |\n| Contrôle d'accès, authentification (I.4) | — | CR 1.1 à CR 1.14, CR 2.1 |\n| Confidentialité, intégrité (I.5, I.6) | — | CR 3.1, CR 3.4, CR 4.1, CR 4.3 ; EDR / HDR 3.14 (intégrité du démarrage) |\n| Disponibilité, déni de service (I.8) | — | CR 7.1, CR 7.2 |\n| Journalisation (I.12) | — | CR 2.8, CR 2.9, CR 6.1 |\n| Mises à jour sécurisées (I.3, II.7) | SUM (gestion des mises à jour de sécurité) | CR 3.10 ; EDR 3.12 |\n| Traitement des vulnérabilités, divulgation (partie II) | DM (gestion des défauts de sécurité), SVV (vérification et validation) | — |\n\nLe tableau est **fonctionnel** : appliquer IEC 62443-4-1 et 4-2 aide fortement, sans valoir présomption de conformité tant que les normes harmonisées du CRA ne sont pas publiées. Voir aussi le [tableau de correspondances](../correspondances.md).\n\nSuite : [Mettre en œuvre : le fabricant](4-Mettre_en_oeuvre_fabricant.md).\n" },
{ fichier: "5-CRA/4-Mettre_en_oeuvre_fabricant.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Mettre en œuvre : le fabricant\n\nCe guide s'adresse à une organisation qui **met sur le marché** des produits à éléments numériques : constructeur d'équipements, éditeur de logiciels, constructeur de machines vendues sous sa marque. Il propose une feuille de route en dix étapes, à mener **avant décembre 2027** pour les produits vendus après cette date, et **dès maintenant** pour le signalement.\n\n---\n\n## La feuille de route\n\n| # | Étape | Livrable | Qui |\n|---|---|---|---|\n| 1 | **Inventorier** les produits mis sur le marché, leurs versions et leurs composants | Registre des produits | Direction produit |\n| 2 | **Qualifier** chaque produit : dans le champ ou non, classe (par défaut, I, II, critique), voie d'évaluation | Fiche produit CRA | Responsable conformité |\n| 3 | **Organiser le signalement** (urgent : applicable depuis septembre 2026) : veille sur les produits, procédure 24 h / 72 h, point de contact | Procédure de signalement | RSSI produit (PSIRT) |\n| 4 | **Mener l'analyse de risques** de chaque produit (usage prévu, environnement, menaces) | Analyse de risques produit | Équipe de conception |\n| 5 | **Mesurer l'écart** aux exigences essentielles (annexe I) | Matrice de conformité | Équipe de conception |\n| 6 | **Mettre en place le cycle de développement sécurisé** : exigences, revues, tests, gestion des dépendances | Processus de développement (IEC 62443-4-1) | Direction technique |\n| 7 | **Produire et tenir la SBOM** de chaque version | SBOM lisible par machine | Équipe de développement |\n| 8 | **Organiser le traitement des vulnérabilités** : politique de divulgation, tri, correctifs, avis de sécurité, distribution sécurisée | Politique de divulgation, avis publiés | PSIRT |\n| 9 | **Fixer la période de support** et l'annoncer | Période indiquée sur le produit ou sa documentation | Direction produit |\n| 10 | **Évaluer la conformité**, rédiger la documentation technique et la **déclaration UE**, apposer le **marquage CE** | Dossier technique, déclaration UE, marquage | Responsable conformité |\n\nCommencez par les étapes **1 à 3** : sans inventaire ni procédure de signalement, une vulnérabilité exploitée découverte demain ne pourra pas être déclarée à temps.\n\n---\n\n## La documentation technique\n\nElle est rédigée **avant** la mise sur le marché, tenue à jour pendant la période de support et conservée **au moins dix ans** (ou pendant la période de support si elle est plus longue). Elle comprend notamment :\n\n- la description générale du produit : usage prévu, versions logicielles, matériel, interfaces ;\n- la conception et le développement : architecture, fonctions de sécurité, processus de traitement des vulnérabilités ;\n- l'**analyse de risques** et la façon dont chaque exigence essentielle est satisfaite ;\n- la **SBOM** ;\n- la **période de support** retenue et sa justification ;\n- les normes, spécifications ou certifications appliquées ;\n- les rapports d'essais ;\n- la déclaration UE de conformité.\n\n## Les informations pour l'utilisateur (annexe II)\n\nFournies avec le produit, dans une langue comprise par l'utilisateur : fabricant et point de contact pour les vulnérabilités, identification du produit, usage prévu, risques connus, adresse de la déclaration UE, **date de fin de la période de support**, instructions d'installation et de configuration sécurisées, mises à jour, mise hors service sûre.\n\n## La période de support\n\nLe fabricant fixe une période de support qui reflète la **durée d'utilisation attendue** du produit ; elle est d'**au moins cinq ans**, sauf si le produit est prévu pour une durée plus courte. Pendant cette période, il traite les vulnérabilités et fournit les mises à jour de sécurité.\n\n> En industrie, la durée d'exploitation dépasse souvent largement cinq ans. Un fabricant qui annonce une période de support plus longue en fait un argument commercial ; un acheteur vérifie ce point avant tout achat.\n\n---\n\n## Les erreurs à éviter\n\n- **Attendre décembre 2027** : le signalement est déjà applicable, et la conformité d'un produit se construit pendant sa conception.\n- **Traiter le CRA comme un dossier papier** : sans processus réel de traitement des vulnérabilités, la documentation ne tient pas.\n- **Oublier les composants tiers** : une bibliothèque libre ou un module acheté fait partie du produit ; ses vulnérabilités sont celles du produit.\n- **Confondre la classe du produit et celle de ses composants** : c'est la fonction principale qui compte.\n- **Ignorer la modification substantielle** : une évolution majeure d'un produit déjà vendu peut appeler une nouvelle évaluation.\n\n## Dans WerbSMSI\n\n| Besoin | Module |\n|---|---|\n| Analyse de risques du produit ou de la ligne qui l'utilise | WerbEBIOS |\n| Exigences de composants, cycle de développement (IEC 62443-4-1, 4-2) | WerbIEC62443 |\n| Tests de sécurité du produit, suivi des corrections | WerbPentest |\n| Veille sur les vulnérabilités des composants | WerbVeille |\n| Procédure de signalement, revue de direction, plan d'actions | WerbGouvernance |\n\nSuite : [Mettre en œuvre : l'acheteur et l'exploitant](5-Acheteur_et_exploitant.md).\n" },
{ fichier: "5-CRA/5-Acheteur_et_exploitant.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Mettre en œuvre : l'acheteur et l'exploitant\n\nCe guide s'adresse au site industriel, à la DSI et au RSSI qui **achètent et exploitent** des produits numériques : pare-feu, commutateurs, automates, IHM, logiciels de supervision, postes et serveurs. Le CRA ne vous impose rien directement, mais il change ce que vous pouvez **exiger** et ce que vous devez **suivre**.\n\n---\n\n## Qui fait quoi\n\n| Population | Rôle dans la démarche |\n|---|---|\n| **Direction** | Fixe l'exigence (« pas d'achat sans période de support connue »), arbitre les remplacements de produits en fin de support |\n| **RSSI** | Définit les exigences, suit les vulnérabilités et les produits non maintenus, rend compte |\n| **Achats** | Intègre les exigences aux consultations et aux contrats, vérifie les pièces à la réception des offres |\n| **Architectes, automaticiens** | Recensent les produits, leurs versions et leur place dans les systèmes ; préparent les remplacements |\n| **Exploitation** | Applique les mises à jour, suit les avis de sécurité, signale les anomalies au fabricant |\n| **Auditeurs** | Vérifient les preuves : déclarations, contrats, suivi des mises à jour |\n\n---\n\n## Étape 1 — Recenser les produits et leur statut\n\nL'inventaire existe déjà dans WerbSMSI : les **actifs** de WerbMap (marque, modèle, version de firmware) et les **fiches** de WerbAssets. Il s'agit de les compléter, produit par produit, des informations CRA :\n\n| Information | Où la trouver | Pourquoi |\n|---|---|---|\n| Fabricant et modèle | Inventaire WerbMap | Identifier le produit |\n| Version installée | Inventaire WerbMap, fiche WerbAssets | Savoir si une vulnérabilité vous concerne |\n| Date de mise sur le marché, de la version | Fabricant | Avant ou après décembre 2027 |\n| Classe CRA probable | [Qui est concerné](2-Qui_est_concerne.md) | Niveau d'exigence attendu du fabricant |\n| Marquage CE au titre du CRA, déclaration UE | Fabricant (adresse fournie avec le produit) | Preuve de conformité, pour les produits récents |\n| **Fin de la période de support** | Fabricant, documentation | Planifier le remplacement |\n| Point de contact vulnérabilités, page des avis | Fabricant | Signaler et être informé |\n| SBOM disponible | Fabricant | Savoir quels composants vous exploitez réellement |\n| Criticité de l'usage | Analyse de risques (WerbEBIOS), zone (WerbMap) | Prioriser |\n\nCommencez par les produits **exposés** (pare-feu, VPN, accès distants), puis ceux des **zones critiques** ; un modèle de fiche est dans [Modèles et check-lists](6-Modeles_et_checklists.md).\n\n---\n\n## Étape 2 — Exiger à l'achat\n\nDans chaque consultation pour un produit numérique (et dans le cahier d'exigences cyber des prestataires de WerbPresta) :\n\n- [ ] Produit **conforme au règlement (UE) 2024/2847** (pour une mise sur le marché après le 11 décembre 2027), déclaration UE de conformité fournie\n- [ ] **Période de support** indiquée, avec la date de fin ; durée au moins égale à la durée d'exploitation prévue, ou engagement de remplacement\n- [ ] **Point de contact** pour les vulnérabilités et adresse des **avis de sécurité**\n- [ ] **SBOM** fournie à la livraison, ou sur demande\n- [ ] Mises à jour de sécurité **gratuites**, distribuées de façon **sécurisée** (signées), séparées des évolutions fonctionnelles quand c'est possible\n- [ ] **Configuration sécurisée par défaut** et guide de durcissement fourni\n- [ ] Engagement d'**information** en cas de vulnérabilité exploitée ou d'incident affectant le produit\n- [ ] Pour un intégrateur : il précise s'il agit comme **fabricant** (produit sous sa marque) ou s'il intègre des produits marqués CE\n\n> Pour un produit industriel, compléter par les exigences de l'IEC 62443-4-2 (niveau de sécurité du composant) et, pour le prestataire qui l'installe, par l'IEC 62443-2-4.\n\n---\n\n## Étape 3 — Suivre dans le temps\n\n| Rythme | À faire | Module WerbSMSI |\n|---|---|---|\n| En continu | Avis de sécurité des fabricants et vulnérabilités exploitées, filtrés sur les équipements du site | WerbVeille |\n| À chaque intervention | Version de firmware mise à jour dans l'inventaire et la fiche de l'équipement | WerbMap, WerbAssets, WerbExploitation (interventions) |\n| Chaque mois | Correctifs disponibles appliqués ou planifiés ; nouveaux équipements recensés avec leur statut CRA | WerbExploitation (mises à jour) |\n| Chaque trimestre | Produits **en fin de support** dans les 24 mois : remplacement planifié ou mesure compensatoire | WerbGouvernance (plan d'actions) |\n| Chaque année | Revue des fournisseurs (respect des engagements, réactivité aux vulnérabilités) ; revue de conformité | WerbPresta, WerbGouvernance (revue de direction) |\n\nUn produit **hors support** ne reçoit plus de correctifs : il se cloisonne (zones et conduits, WerbMap), se surveille, et son remplacement entre au plan d'actions.\n\n---\n\n## Les indicateurs\n\n| Pour la direction | Pour le RSSI |\n|---|---|\n| Nombre de produits recensés avec leur statut CRA | Vulnérabilités exploitées ouvertes sur des produits du site |\n| Part des produits dont la fin de support est connue | Correctifs disponibles non appliqués, par ancienneté |\n| Produits en fin de support dans les 24 mois, et plan de remplacement | Délai moyen d'application d'un correctif critique |\n| Part des achats de l'année avec exigences CRA dans le contrat | Fournisseurs sans point de contact ou sans avis de sécurité |\n\n---\n\n## Les erreurs à éviter\n\n- **Croire que le marquage CE suffit** : il atteste la conformité à la mise sur le marché ; la sécurité dans le temps dépend des mises à jour, donc de votre exploitation.\n- **Acheter sans connaître la fin du support** : un automate prévu pour quinze ans avec cinq ans de correctifs, c'est dix ans de vulnérabilités non corrigées.\n- **Exiger le CRA pour les produits déjà installés** : il ne s'applique pas rétroactivement ; pour ces produits, demander les mêmes engagements par contrat.\n- **Ne pas tracer** : une exigence non vérifiée à la réception ou un correctif non noté ne peuvent pas être démontrés en audit.\n\nSuite : [Modèles et check-lists](6-Modeles_et_checklists.md).\n" },
{ fichier: "5-CRA/6-Modeles_et_checklists.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Modèles et check-lists\n\nModèles à reprendre dans un tableur ou dans les modules WerbSMSI. Les exemples sont **fictifs**.\n\n---\n\n## Fiche produit CRA\n\n| Rubrique | Contenu | Exemple fictif |\n|---|---|---|\n| Produit | Désignation, fabricant, modèle | Commutateur industriel 16 ports, Constructeur A, modèle SW-16G |\n| Identifiant | TAG ou référence interne | SW_CORE01 |\n| Version | Firmware ou logiciel installé | 10.12 |\n| Localisation | Site, zone, baie | LYON, zone Supervision, baie BAIE-01 |\n| Responsable | Fonction en charge de l'équipement | Administrateur réseau du site |\n| Criticité de l'usage | D'après l'analyse de risques | Élevée (cœur du réseau de supervision) |\n| Classe CRA probable | Par défaut, I, II, critique | Important, classe I (commutateur) |\n| Mise sur le marché | Avant ou après le 11/12/2027 | Avant : CRA non applicable à ce produit |\n| Déclaration UE | Adresse, date | — |\n| Fin de la période de support | Date annoncée par le fabricant | 12/2029 |\n| Point de contact vulnérabilités | Adresse ou formulaire | psirt@exemple.fr |\n| Avis de sécurité | Page du fabricant | (adresse de la page des avis) |\n| SBOM | Disponible, sur demande, non | Sur demande |\n| Statut | Conforme, partiellement conforme, non conforme, à évaluer | Partiellement conforme (pas de SBOM fournie) |\n| Actions | Référence au plan d'actions | PA-2026-014 : demander la SBOM au fabricant |\n\n## Registre des produits (colonnes)\n\n`TAG` · `Produit` · `Fabricant` · `Modèle` · `Version` · `Site` · `Zone` · `Criticité` · `Classe CRA` · `Mise sur le marché` · `Fin de support` · `Point de contact` · `SBOM` · `Statut` · `Action`\n\n> Les sept premières colonnes viennent de l'inventaire WerbMap ; les autres se complètent avec le fabricant.\n\n---\n\n## Check-list fabricant\n\n- [ ] Produits mis sur le marché inventoriés, avec leurs versions et leurs composants\n- [ ] Chaque produit qualifié : champ, classe, voie d'évaluation de la conformité\n- [ ] **Procédure de signalement** 24 h / 72 h / rapport final en place, rôles nommés, accès à la plateforme de signalement\n- [ ] Point de contact vulnérabilités publié ; politique de divulgation coordonnée publiée\n- [ ] Analyse de risques documentée pour chaque produit\n- [ ] Matrice des exigences essentielles (annexe I, parties I et II) renseignée, avec les preuves\n- [ ] Cycle de développement sécurisé appliqué (exigences, revues, tests, dépendances)\n- [ ] SBOM produite à chaque version et conservée\n- [ ] Période de support fixée, justifiée et annoncée\n- [ ] Mises à jour de sécurité signées, distribuées gratuitement, avec avis publiés\n- [ ] Documentation technique complète, conservée dix ans\n- [ ] Évaluation de la conformité réalisée (contrôle interne ou organisme notifié), déclaration UE signée, marquage CE apposé\n- [ ] Informations pour l'utilisateur (annexe II) fournies avec le produit\n\n## Check-list achat\n\n- [ ] Le produit est-il dans le champ du CRA ? sa classe ?\n- [ ] Mis sur le marché après le 11/12/2027 : déclaration UE et marquage CE fournis\n- [ ] Date de fin de support connue et compatible avec la durée d'exploitation\n- [ ] Point de contact vulnérabilités et page des avis connus\n- [ ] SBOM fournie ou disponible sur demande\n- [ ] Mises à jour gratuites, signées ; procédure de mise à jour documentée\n- [ ] Guide de configuration sécurisée fourni ; aucun mot de passe par défaut commun\n- [ ] Engagement d'information en cas de vulnérabilité exploitée\n- [ ] Clauses reprises dans le contrat ; pièces vérifiées et rangées à la réception\n- [ ] Produit ajouté à l'inventaire (WerbMap) avec son statut CRA\n\n---\n\n## Modèle de clause contractuelle\n\n> *Le fournisseur garantit que les produits comportant des éléments numériques livrés au titre du présent contrat et mis sur le marché à compter du 11 décembre 2027 sont conformes au règlement (UE) 2024/2847 et fournit la déclaration UE de conformité correspondante. Il indique pour chaque produit la date de fin de la période de support, pendant laquelle il fournit gratuitement les mises à jour de sécurité, et communique le point de contact pour le signalement des vulnérabilités. Il informe l'acheteur, sans délai, de toute vulnérabilité activement exploitée ou de tout incident grave affectant un produit livré, ainsi que des mesures d'atténuation. Il fournit, sur demande, la nomenclature logicielle (SBOM) des produits livrés.*\n\nÀ adapter avec le service juridique ; pour les produits déjà sur le marché, conserver les engagements de support, d'information et de SBOM.\n\n---\n\n## Plan de signalement d'une vulnérabilité exploitée (fabricant)\n\n| Délai | Action | Responsable | Contenu |\n|---|---|---|---|\n| H0 | Connaissance d'une exploitation active (client, veille, chercheur) | PSIRT | Ouverture du dossier, horodatage |\n| < 24 h | **Alerte précoce** sur la plateforme de signalement | Responsable du signalement | Produit, existence de l'exploitation, États membres concernés si connus |\n| < 72 h | **Notification** | Responsable du signalement | Description, nature de l'exploitation, mesures correctives ou d'atténuation, gravité estimée |\n| Au plus vite | **Information des utilisateurs** | Communication, PSIRT | Avis de sécurité, mesures à appliquer |\n| ≤ 14 jours après le correctif | **Rapport final** | Responsable du signalement | Description complète, gravité, impact, cause, informations sur l'acteur malveillant si connues, correctifs |\n| Après clôture | Retour d'expérience | PSIRT, direction technique | Cause, amélioration du processus |\n\n---\n\n## Tableau de bord CRA (proposition)\n\n| Indicateur | Calcul | Seuil d'alerte proposé |\n|---|---|---|\n| Produits recensés avec statut CRA | Produits du registre au statut renseigné / produits de l'inventaire | < 80 % |\n| Fin de support connue | Produits avec date de fin de support / produits du registre | < 70 % |\n| Produits en fin de support < 24 mois | Nombre | > 0 sans plan de remplacement |\n| Vulnérabilités exploitées ouvertes | Nombre, sur les produits du site | > 0 depuis plus de 7 jours |\n| Achats avec clauses CRA | Contrats de l'année avec clauses / contrats d'achat de produits numériques | < 100 % |\n\nSuite : [Résumé des articles](7-Resume_des_articles.md) · retour à la [carte CRA](0-carte.md).\n" },
{ fichier: "5-CRA/7-Resume_des_articles.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Résumé des articles du CRA\n\nLe règlement (UE) 2024/2847 compte **71 articles**, répartis en **8 chapitres**, et **8 annexes**. Cette page donne, chapitre par chapitre, ce que dit chaque groupe d'articles, pour savoir où chercher dans le texte. Elle ne remplace pas le règlement : vérifiez toujours l'article exact dans les [sources](sources.md).\n\n| Chapitre | Articles | Sujet |\n|---|---|---|\n| I | 1 à 12 | Dispositions générales |\n| II | 13 à 26 | Obligations des opérateurs économiques, logiciels libres |\n| III | 27 à 34 | Conformité du produit |\n| IV | 35 à 51 | Notification des organismes d'évaluation de la conformité |\n| V | 52 à 60 | Surveillance du marché et contrôle |\n| VI | 61 et 62 | Actes délégués et comité |\n| VII | 63 à 65 | Confidentialité et sanctions |\n| VIII | 66 à 71 | Dispositions transitoires et finales |\n\n---\n\n## Chapitre I — Dispositions générales (articles 1 à 12)\n\n### Article 1 — Objet\n\nFixe les règles de mise à disposition sur le marché des **produits comportant des éléments numériques** (matériels et logiciels, avec leurs solutions de traitement de données à distance) : exigences essentielles de cybersécurité pour leur conception, leur développement et leur production, exigences de traitement des vulnérabilités, obligations des opérateurs économiques, surveillance du marché.\n\n### Article 2 — Champ d'application\n\nTout produit dont l'usage prévu comprend une connexion de données, directe ou indirecte, à un appareil ou à un réseau. Sont **exclus** les produits déjà couverts par des règles sectorielles : dispositifs médicaux et de diagnostic in vitro, véhicules à moteur, aviation civile, équipements marins. Sont aussi exclus les produits développés exclusivement pour la sécurité nationale ou la défense, et les pièces de rechange identiques.\n\n### Article 3 — Définitions\n\nProduit, fabricant, mise sur le marché, modification substantielle, vulnérabilité activement exploitée, incident grave, période de support, gestionnaire de logiciels libres…\n\n### Article 4 — Libre circulation\n\nUn État ne peut pas entraver la mise à disposition d'un produit conforme. Les prototypes, les salons et les versions de test d'un logiciel peuvent être présentés sous conditions.\n\n### Article 5 — Achats ou utilisation des produits\n\nUn État peut imposer des exigences de cybersécurité supplémentaires pour acheter ou utiliser des produits à des fins précises, si elles restent cohérentes avec le règlement.\n\n### Article 6 — Exigences applicables aux produits\n\nUn produit ne peut être mis à disposition que s'il respecte les **exigences essentielles** de l'annexe I et si le fabricant applique les processus de traitement des vulnérabilités.\n\n### Article 7 — Produits importants\n\nDeux classes, I et II, listées à l'**annexe III** (par exemple routeurs, commutateurs, systèmes d'exploitation en classe I ; pare-feu, détection d'intrusion, hyperviseurs en classe II). Leur évaluation de la conformité est plus exigeante.\n\n### Article 8 — Produits critiques\n\nListés à l'**annexe IV** (boîtiers de sécurité matériels, passerelles de compteurs intelligents, cartes à puce). La Commission peut leur imposer une **certification européenne** de cybersécurité.\n\n> Le règlement ne parle pas de « produits standards » : un produit qui n'est ni important ni critique relève de la **catégorie par défaut**, la plus courante (voir [Qui est concerné](2-Qui_est_concerne.md)).\n\n### Articles 9 à 12\n\nConsultation des parties prenantes (art. 9) ; renforcement des compétences en cybersécurité (art. 10) ; articulation avec le règlement sur la sécurité générale des produits (art. 11) ; systèmes d'IA à haut risque : le respect des exigences du CRA vaut présomption de conformité aux exigences de cybersécurité du règlement sur l'IA (art. 12).\n\n---\n\n## Chapitre II — Obligations des opérateurs économiques (articles 13 à 26)\n\n### Article 13 — Fabricants\n\nLe cœur du règlement. Le fabricant doit :\n- **évaluer les risques** de cybersécurité du produit et en tenir compte de la conception à la maintenance (sécurité dès la conception) ;\n- respecter les **exigences essentielles** de l'annexe I ;\n- fixer une **période de support** adaptée à la durée d'utilisation prévue, **au moins cinq ans** sauf usage plus court, et traiter les vulnérabilités pendant cette période ;\n- fournir les **mises à jour de sécurité** gratuitement, séparées des mises à jour fonctionnelles quand c'est possible ;\n- tenir la **documentation technique** et la déclaration UE de conformité pendant **dix ans** ;\n- s'assurer que les **composants tiers**, y compris libres, ne compromettent pas la sécurité du produit.\n\n### Article 14 — Signalement\n\nLe fabricant signale, **en même temps au CSIRT coordinateur** de son État **et à l'ENISA**, par la **plateforme unique de signalement** : toute **vulnérabilité activement exploitée** et tout **incident grave** affectant la sécurité du produit. Délais : alerte précoce sous **24 heures**, notification sous **72 heures**, rapport final sous **14 jours** après la mise à disposition d'un correctif (vulnérabilité) ou **un mois** après la notification (incident). Il informe aussi les utilisateurs concernés.\n\n### Articles 15 à 17\n\nSignalement volontaire par toute personne (art. 15) ; plateforme unique de signalement gérée par l'ENISA (art. 16) ; autres règles du signalement, dont la confidentialité et le rapport technique de l'ENISA (art. 17).\n\n### Article 18 — Mandataires\n\nUn fabricant établi hors de l'Union peut désigner un mandataire, par écrit.\n\n### Articles 19 et 20 — Importateurs et distributeurs\n\nIls vérifient, avant de vendre, le **marquage CE**, la **déclaration UE de conformité**, la documentation et l'identification du fabricant. Ils ne mettent pas sur le marché un produit qu'ils savent non conforme et informent le fabricant d'une vulnérabilité dont ils ont connaissance.\n\n### Articles 21 et 22 — Quand on devient fabricant\n\nUn importateur ou un distributeur qui vend un produit **sous son nom ou sa marque**, ou toute personne qui y apporte une **modification substantielle**, prend les obligations du fabricant. C'est le point d'attention des intégrateurs et des constructeurs de machines.\n\n### Article 23 — Identification\n\nLes opérateurs économiques indiquent aux autorités, pendant dix ans, de qui ils ont reçu un produit et à qui ils l'ont fourni.\n\n### Articles 24 à 26 — Logiciels libres\n\nRégime allégé pour les **gestionnaires de logiciels libres** (fondations, organisations qui soutiennent durablement un projet utilisé commercialement) : politique de cybersécurité, coopération avec les autorités, signalement (art. 24). Attestations volontaires de sécurité (art. 25). Guides de la Commission (art. 26). Le logiciel libre développé et fourni **hors activité commerciale** n'est pas un produit au sens du règlement.\n\n---\n\n## Chapitre III — Conformité du produit (articles 27 à 34)\n\n### Article 27 — Présomption de conformité\n\nUn produit conforme aux **normes harmonisées**, à des spécifications communes ou à une certification européenne est présumé respecter les exigences correspondantes.\n\n### Article 28 — Déclaration UE de conformité\n\nLe fabricant atteste, par écrit, que les exigences sont respectées (modèle à l'annexe V, version simplifiée à l'annexe VI).\n\n### Articles 29 et 30 — Marquage CE\n\nPrincipes et règles d'apposition ; le marquage est visible sur le produit, son emballage ou la déclaration pour un logiciel.\n\n### Article 31 — Documentation technique\n\nContenu à l'annexe VII : description du produit, conception, évaluation des risques, période de support, traitement des vulnérabilités, normes appliquées.\n\n### Article 32 — Procédures d'évaluation de la conformité\n\nSelon la classe : **contrôle interne** (module A) pour la catégorie par défaut ; pour la classe I, contrôle interne seulement si une norme harmonisée ou une certification est entièrement appliquée, sinon **tiers** ; pour la classe II, **évaluation par un organisme notifié** obligatoire ; pour les produits critiques, **certification européenne** si elle est exigée. Procédures détaillées à l'annexe VIII.\n\n### Articles 33 et 34\n\nMesures de soutien aux microentreprises et aux PME (art. 33) ; accords de reconnaissance mutuelle avec des pays tiers (art. 34).\n\n---\n\n## Chapitre IV — Notification des organismes d'évaluation de la conformité (articles 35 à 51)\n\nCes articles définissent qui peut évaluer un produit à la place du fabricant :\n- les **autorités notifiantes** désignées par chaque État et leurs obligations ;\n- les **exigences** applicables aux organismes notifiés : indépendance, impartialité, compétence, confidentialité, assurance ;\n- la procédure de **notification** à la Commission, les numéros d'identification, la contestation de la compétence d'un organisme ;\n- les **obligations opérationnelles** des organismes notifiés, les recours contre leurs décisions, la coordination entre eux.\n\nCe chapitre s'applique depuis le **11 juin 2026**, pour que des organismes soient prêts avant l'application complète.\n\n---\n\n## Chapitre V — Surveillance du marché et contrôle (articles 52 à 60)\n\nChaque État désigne une ou plusieurs **autorités de surveillance du marché**, qui peuvent :\n- **contrôler** les produits et accéder aux données et à la documentation (art. 52 et 53) ;\n- exiger des **mesures correctives**, la **restriction**, le **retrait** ou le **rappel** d'un produit présentant un risque important de cybersécurité (art. 54) ;\n- agir même contre un produit **conforme** qui présente un risque important (art. 57), ou pour une **non-conformité formelle** : marquage CE absent, déclaration manquante… (art. 58).\n\nLa Commission arbitre au niveau de l'Union (art. 55 et 56). Les autorités mènent des **actions conjointes** et des **opérations de contrôle coordonnées** (art. 59 et 60).\n\n---\n\n## Chapitre VI — Actes délégués et comité (articles 61 et 62)\n\nLa Commission peut, par **actes délégués**, notamment mettre à jour la liste des produits importants, désigner les produits critiques soumis à une certification européenne et préciser certaines exigences (art. 61). Un **comité** des États membres l'assiste pour les actes d'exécution (art. 62).\n\n---\n\n## Chapitre VII — Confidentialité et sanctions (articles 63 à 65)\n\n### Article 63 — Confidentialité\n\nLes autorités et les organismes protègent les informations reçues : secrets d'affaires, code source, sécurité nationale.\n\n### Article 64 — Sanctions\n\nLes États fixent des amendes administratives, jusqu'à :\n\n| Manquement | Plafond |\n|---|---|\n| Exigences essentielles (annexe I), obligations des articles 13 et 14 | 15 M€ ou 2,5 % du chiffre d'affaires annuel mondial |\n| Autres obligations du règlement | 10 M€ ou 2 % |\n| Informations inexactes, incomplètes ou trompeuses aux autorités ou organismes notifiés | 5 M€ ou 1 % |\n\nLe montant retenu est le plus élevé des deux. Les micro et petites entreprises ne sont pas sanctionnées pour le seul dépassement du délai de 24 heures de l'alerte précoce, et les gestionnaires de logiciels libres ne reçoivent pas d'amende.\n\n### Article 65 — Actions représentatives\n\nLes consommateurs peuvent agir collectivement contre une violation du règlement.\n\n---\n\n## Chapitre VIII — Dispositions transitoires et finales (articles 66 à 71)\n\n### Articles 66 à 68\n\nModifications d'autres textes de l'Union (surveillance du marché, actions représentatives…).\n\n### Article 69 — Dispositions transitoires\n\nUn produit mis sur le marché **avant le 11 décembre 2027** n'est soumis aux exigences que s'il fait ensuite l'objet d'une **modification substantielle** ; l'**article 14** (signalement) s'applique toutefois à tous les produits, y compris ceux déjà sur le marché.\n\n### Article 70 — Évaluation\n\nRapports de la Commission sur l'application du règlement.\n\n### Article 71 — Entrée en vigueur et application\n\nLe règlement entre en vigueur le vingtième jour suivant sa publication et s'applique par étapes :\n\n| Date | Étape |\n|---|---|\n| 10 décembre 2024 | Entrée en vigueur |\n| 11 juin 2026 | Chapitre IV : organismes d'évaluation de la conformité |\n| **11 septembre 2026** | **Article 14 : signalement** des vulnérabilités activement exploitées et des incidents graves |\n| **11 décembre 2027** | **Application complète** |\n\n---\n\n## Les annexes\n\n| Annexe | Contenu |\n|---|---|\n| I | **Exigences essentielles** : partie I, propriétés de sécurité du produit ; partie II, traitement des vulnérabilités (voir [Les exigences essentielles](3-Exigences_essentielles.md)) |\n| II | Informations et instructions pour l'utilisateur |\n| III | Liste des **produits importants** (classes I et II) |\n| IV | Liste des **produits critiques** |\n| V | Déclaration UE de conformité |\n| VI | Déclaration UE de conformité simplifiée |\n| VII | Contenu de la documentation technique |\n| VIII | Procédures d'évaluation de la conformité |\n\n---\n\n## Pour un site industriel : les articles qui comptent\n\n| Article | Pourquoi il compte en OT | Ce que fait le site |\n|---|---|---|\n| 13 | Période de support, mises à jour, SBOM : souvent plus courte que la durée de vie d'un automate ou d'un pare-feu (15 à 20 ans) | Demander la période de support et la nomenclature logicielle avant l'achat |\n| 14 | Le fabricant signale les vulnérabilités exploitées et prévient ses utilisateurs | Avoir un contact déclaré chez chaque fournisseur et suivre ses avis de sécurité |\n| 21 et 22 | Un intégrateur ou un constructeur de machines devient fabricant s'il vend sous son nom ou modifie substantiellement | Clarifier le statut CRA de chaque intégrateur dans le contrat |\n| 7, 8, 32 et annexes III, IV | Routeurs, commutateurs, pare-feu industriels sont des produits importants : évaluation plus stricte | Vérifier la classe et la déclaration UE de conformité à la réception |\n| 69 | Les produits installés avant décembre 2027 restent hors exigences, sauf modification substantielle | Inventorier ces produits et leur fin de support (WerbAssets, WerbMap) |\n\nVoir aussi [Mettre en œuvre : l'acheteur et l'exploitant](5-Acheteur_et_exploitant.md).\n\n---\n\n## En une phrase\n\nLe CRA impose aux fabricants de produits numériques — logiciels, équipements réseau, caméras, automates, objets connectés, applications — d'intégrer la cybersécurité dès la conception, de traiter les vulnérabilités pendant toute la période de support et de démontrer la conformité avant la mise sur le marché de l'Union ; les importateurs et distributeurs le vérifient, les autorités de surveillance du marché le contrôlent.\n\nRetour à la [carte CRA](0-carte.md).\n" },
{ fichier: "5-CRA/sources.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Sources officielles — CRA\n\nLiens ouverts dans un nouvel onglet. Les textes européens sont disponibles en français sur EUR-Lex.\n\n## Textes européens\n\n| Texte | Lien |\n|---|---|\n| Règlement (UE) 2024/2847 du 23 octobre 2024 concernant des exigences horizontales en matière de cybersécurité pour les produits comportant des éléments numériques (Cyber Resilience Act) | https://eur-lex.europa.eu/eli/reg/2024/2847/oj |\n| Commission européenne — page de présentation du CRA (questions-réponses, actes d'exécution, guides) | https://digital-strategy.ec.europa.eu/fr/policies/cyber-resilience-act |\n| ENISA — agence de l'Union européenne pour la cybersécurité (plateforme unique de signalement) | https://www.enisa.europa.eu/ |\n| Règlement (UE) 2023/1230 sur les machines | https://eur-lex.europa.eu/eli/reg/2023/1230/oj |\n\n## En France\n\n| Ressource | Lien |\n|---|---|\n| ANSSI — publications et actualités sur la cybersécurité des produits | https://cyber.gouv.fr/ |\n| ANSSI — Cadre règlementaire du CRA | https://cyber.gouv.fr/reglementation/cybersecurite-des-produits/cyber-resilience-act/cadre-reglementaire-du-cra/ |\n\n## Normes utiles\n\n| Norme | Objet |\n|---|---|\n| IEC 62443-4-1 | Exigences du cycle de développement sécurisé des produits |\n| IEC 62443-4-2 | Exigences de sécurité techniques des composants des systèmes d'automatisation et de commande |\n| Normes harmonisées du CRA (CEN, CENELEC, ETSI) | En cours d'élaboration : leur publication au Journal officiel donnera une présomption de conformité |\n\n## Bon usage\n\n- Le règlement s'applique directement ; les **actes d'exécution et délégués** (liste technique des produits importants et critiques, format des signalements, certification) et les **normes harmonisées** en précisent la mise en œuvre. Vérifier leur état avant tout engagement.\n- Garder la trace de la version consultée (date, article) dans le dossier de preuves.\n\nRetour à la [carte CRA](0-carte.md).\n" },
{ fichier: "6-RGPD/0-carte.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Carte RGPD — règlement (UE) 2016/679 sur la protection des données\n\nLe règlement général sur la protection des données (RGPD) encadre tout **traitement de données personnelles** : toute information qui permet d'identifier, directement ou non, une personne physique. Sur un site industriel, il ne concerne pas seulement les ressources humaines : badges d'accès, vidéosurveillance, identifiants des opérateurs dans la supervision, géolocalisation des véhicules, prestataires en télémaintenance. Il impose de **savoir quelles données on traite, pourquoi, combien de temps, qui y accède**, et de les **protéger**. La sécurité des données (article 32) et la notification des violations (article 33) en font un sujet directement lié au SMSI.\n\n> **À vérifier** : les délais, seuils et montants de ces pages sont ceux du règlement ; les durées de conservation citées sont des recommandations de la CNIL. Les lignes directrices du Comité européen de la protection des données (CEPD) et les référentiels de la CNIL précisent la mise en œuvre : consultez les [sources](sources.md) avant tout engagement.\n\n- [Comprendre le RGPD](1-Comprendre_le_RGPD.md)\n  - Ce qu'est une donnée personnelle, un traitement\n  - Responsable de traitement, sous-traitant, responsables conjoints\n  - Calendrier, autorité de contrôle, sanctions\n  - Liens avec NIS2, ISO 27001 et ISO 27701\n- [Principes et bases légales](2-Principes_et_bases_legales.md)\n  - Les sept principes de l'article 5\n  - Les six bases légales de l'article 6\n  - Données sensibles et données d'infraction\n  - Durées de conservation\n- [Droits des personnes](3-Droits_des_personnes.md)\n  - Information des personnes\n  - Accès, rectification, effacement, limitation, portabilité, opposition\n  - Délai d'un mois, vérification de l'identité, refus motivé\n- [Obligations du responsable de traitement](4-Obligations_du_responsable.md)\n  - Registre des activités de traitement (article 30)\n  - Protection dès la conception et par défaut\n  - Analyse d'impact (AIPD)\n  - Violations de données : 72 h vers la CNIL\n  - Sous-traitants (article 28), transferts hors de l'Union, délégué à la protection des données\n- [Sécurité des données et cybersécurité](5-Securite_et_cyber.md)\n  - Article 32 : mesures adaptées au risque\n  - Une violation de données, un incident NIS2 : deux notifications\n  - Correspondance avec ISO 27001, ISO 27701 et les modules WerbSMSI\n- [Cas industriels](6-Cas_industriels.md)\n  - Badges, vidéosurveillance, biométrie, géolocalisation\n  - Identifiants des opérateurs dans la supervision et le MES\n  - Télémaintenance, prestataires, données des visiteurs\n- [Modèles et check-lists](7-Modeles_et_checklists.md)\n  - Fiche du registre, check-list de conformité d'un site\n  - Procédure de gestion d'une violation de données\n  - Réponse à une demande d'exercice des droits\n  - Check-list du contrat de sous-traitance\n- [Sources officielles](sources.md)\n\n## En une phrase par acteur\n\n| Vous êtes… | Ce que le RGPD vous demande | Où commencer |\n|---|---|---|\n| **Direction de l'entité** (responsable de traitement) | Démontrer la conformité (principe de responsabilité) : registre, mesures de sécurité, sous-traitants encadrés, violations traitées, droits respectés | [Obligations du responsable](4-Obligations_du_responsable.md) |\n| **Délégué à la protection des données (DPO)** ou référent | Informer, conseiller, contrôler, tenir le registre, être le point de contact de la CNIL et des personnes | [Obligations du responsable](4-Obligations_du_responsable.md) |\n| **Responsable de site** | Recenser les traitements locaux (badges, vidéo, RH du site), appliquer les durées de conservation, remonter les violations sans délai | [Cas industriels](6-Cas_industriels.md) |\n| **RSSI, informatique, OT** | Sécuriser les données (article 32), détecter et qualifier les violations, appliquer la protection dès la conception aux nouveaux systèmes | [Sécurité et cybersécurité](5-Securite_et_cyber.md) |\n| **Achats** | Faire signer un contrat de sous-traitance conforme à l'article 28 à tout prestataire qui accède à des données personnelles | [Modèles et check-lists](7-Modeles_et_checklists.md) |\n\n## Dans WerbSMSI\n\nLe module **WerbRGPD** (rubrique Conformité & exigences, niveau site) tient le registre des traitements du site, le registre des violations avec le délai de 72 h, les demandes d'exercice des droits et les sous-traitants. Il relie chaque traitement aux SI et actifs de **WerbMap** (où sont les données) et aux prestataires de **WerbPresta** (qui y accède).\n" },
{ fichier: "6-RGPD/1-Comprendre_le_RGPD.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Comprendre le RGPD\n\n## Pourquoi ce règlement\n\nLe RGPD protège les **personnes** : leur droit à la vie privée et à la maîtrise de ce qu'on sait d'elles. Il ne protège pas les entreprises ni les systèmes ; c'est la différence avec NIS2. Mais une donnée personnelle mal protégée est un risque pour la personne **et** pour l'entreprise : sanction, atteinte à l'image, conflit social.\n\nC'est un **règlement** européen : il s'applique directement dans tous les États membres depuis le **25 mai 2018**. En France, la loi « Informatique et Libertés » de 1978, modifiée en 2018, le complète sur les points laissés aux États (âge du consentement des mineurs, données de santé, etc.).\n\n---\n\n## Les mots à connaître\n\n| Terme | Définition | Exemple industriel |\n|---|---|---|\n| **Donnée personnelle** | Toute information se rapportant à une personne physique identifiée ou identifiable, directement (nom) ou indirectement (numéro, identifiant, image, voix, combinaison d'éléments) | Nom d'un opérateur, numéro de badge, plaque d'immatriculation, image de caméra, identifiant de connexion à la supervision, adresse IP d'un poste attribué |\n| **Traitement** | Toute opération sur ces données : collecte, enregistrement, consultation, modification, transmission, conservation, effacement | Enregistrer les passages de badge, conserver les images de vidéosurveillance, tracer les actions des opérateurs |\n| **Responsable de traitement** | Celui qui décide des **finalités** (pourquoi) et des **moyens essentiels** (comment) | L'entité juridique qui exploite l'usine |\n| **Sous-traitant** | Celui qui traite les données **pour le compte** du responsable, sur ses instructions | Société de gardiennage, éditeur du logiciel de paie en SaaS, prestataire de télémaintenance qui accède à un serveur contenant des données |\n| **Responsables conjoints** | Deux organismes qui décident ensemble des finalités et des moyens | Une maison mère et sa filiale qui partagent un annuaire commun et en fixent ensemble l'usage |\n| **Destinataire** | Celui qui reçoit communication des données | Le service paie du groupe, un organisme social |\n| **Personne concernée** | La personne dont les données sont traitées | Salariés, intérimaires, visiteurs, prestataires, clients |\n\n> Une donnée **pseudonymisée** (identifiant à la place du nom, avec une table de correspondance quelque part) **reste** une donnée personnelle. Seule une donnée réellement **anonymisée**, sans retour possible à la personne, sort du RGPD.\n\n---\n\n## Qui contrôle, et quelles sanctions\n\nEn France, l'autorité de contrôle est la **CNIL**. Elle conseille, reçoit les plaintes et les notifications de violation, contrôle (sur place, en ligne, sur pièces) et sanctionne.\n\n| Manquement | Amende administrative maximale |\n|---|---|\n| Principes (article 5), bases légales (article 6), conditions du consentement, données sensibles, droits des personnes, transferts hors de l'Union | **20 M€ ou 4 % du chiffre d'affaires annuel mondial**, le montant le plus élevé étant retenu |\n| Obligations du responsable et du sous-traitant : protection dès la conception, registre, sécurité, notification des violations, AIPD, DPO, contrat de sous-traitance | **10 M€ ou 2 % du chiffre d'affaires annuel mondial** |\n\nS'y ajoutent les mises en demeure publiques, les injonctions sous astreinte, les actions des personnes (réparation du préjudice) et, en droit français, des sanctions pénales.\n\n---\n\n## Le principe qui change tout : la responsabilité\n\nAvant 2018, on déclarait les fichiers à la CNIL. Depuis le RGPD, il n'y a plus de déclaration : le responsable doit **être conforme et pouvoir le démontrer à tout moment** (article 5.2, « accountability »). Concrètement, la preuve, c'est de la documentation tenue à jour :\n\n- le **registre des activités de traitement** ;\n- les **analyses d'impact** (AIPD) des traitements à risque ;\n- les **contrats** avec les sous-traitants ;\n- le **registre des violations**, y compris celles qui n'ont pas été notifiées ;\n- les **demandes d'exercice des droits** et les réponses apportées ;\n- les **mentions d'information** et, le cas échéant, les preuves du consentement ;\n- les **mesures de sécurité** (politique, procédures, résultats de tests).\n\nC'est exactement la logique d'un SMSI : on documente, on applique, on vérifie.\n\n---\n\n## Liens avec les autres référentiels\n\n| Référentiel | Ce qu'il apporte au RGPD |\n|---|---|\n| **NIS2** | Mesures de sécurité des systèmes (article 21) qui couvrent l'essentiel de l'article 32 du RGPD ; un même incident peut être à la fois une violation RGPD (CNIL, 72 h) et un incident NIS2 (ANSSI, 24 h puis 72 h) : voir [Sécurité et cybersécurité](5-Securite_et_cyber.md) |\n| **ISO/IEC 27001** | Le SMSI fournit le cadre des mesures de sécurité ; la mesure A.5.34 (vie privée et protection des données à caractère personnel) renvoie aux obligations légales |\n| **ISO/IEC 27701** | Extension de 27001 et 27002 pour la protection de la vie privée : exigences pour le responsable et le sous-traitant, correspondance avec le RGPD |\n| **ANSSI** | Le guide d'hygiène informatique et les guides techniques fournissent les mesures concrètes de sécurité |\n| **CNIL** | Guide de la sécurité des données personnelles, référentiels sectoriels (gestion du personnel, contrôle d'accès, vidéoprotection…), modèle de registre, outil PIA pour les AIPD |\n" },
{ fichier: "6-RGPD/2-Principes_et_bases_legales.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Principes et bases légales\n\n## Les sept principes (article 5)\n\nTout traitement doit respecter ces principes. Ils servent de grille de lecture pour chaque ligne du registre.\n\n| Principe | Ce qu'il signifie | Question à se poser |\n|---|---|---|\n| **Licéité, loyauté, transparence** | Une base légale, pas de collecte cachée, une information claire | Les personnes savent-elles que ces données sont collectées, et pourquoi ? |\n| **Limitation des finalités** | Des objectifs déterminés, explicites et légitimes ; pas de réutilisation incompatible | Les badges servent à l'accès : peut-on s'en servir pour contrôler les horaires ? (non, sans base ni information spécifiques) |\n| **Minimisation** | Seulement les données adéquates, pertinentes et nécessaires | A-t-on besoin de la date de naissance pour attribuer un badge ? |\n| **Exactitude** | Données exactes et tenues à jour | Les comptes des personnes parties sont-ils désactivés ? |\n| **Limitation de la conservation** | Durée proportionnée à la finalité, puis suppression, archivage intermédiaire ou anonymisation | Combien de temps garde-t-on les images, les passages de badge ? |\n| **Intégrité et confidentialité** | Sécurité appropriée contre l'accès non autorisé, la perte, la destruction | Qui peut consulter les images ? Sont-elles chiffrées, journalisées ? |\n| **Responsabilité** | Être capable de démontrer le respect des six autres | Où est la preuve ? |\n\n---\n\n## Les six bases légales (article 6)\n\nChaque traitement repose sur **une** base légale, choisie **avant** le traitement et indiquée dans le registre et dans l'information des personnes.\n\n| Base légale | Quand l'utiliser | Exemples sur un site industriel |\n|---|---|---|\n| **Contrat** | Le traitement est nécessaire à l'exécution d'un contrat avec la personne | Gestion administrative du salarié, paie, planning |\n| **Obligation légale** | Une loi impose le traitement | Registre unique du personnel, déclarations sociales, suivi médical réglementaire, traçabilité imposée par une réglementation sectorielle |\n| **Intérêt légitime** | Intérêt du responsable, mis en balance avec les droits des personnes, qui ne doivent pas s'y attendre de façon déraisonnable | Contrôle d'accès aux locaux, vidéosurveillance de sécurité, journalisation des actions des opérateurs sur les systèmes critiques, cybersécurité |\n| **Consentement** | Libre, spécifique, éclairé, univoque, retirable à tout moment | Rarement adapté entre employeur et salarié (le lien de subordination fragilise le « libre ») ; utilisable pour une photo dans le journal interne |\n| **Sauvegarde des intérêts vitaux** | Protéger la vie de la personne ou d'un tiers | Données médicales communiquées aux secours lors d'un accident |\n| **Mission d'intérêt public** | Organismes publics ou chargés d'une mission de service public | Rarement applicable à une entreprise privée |\n\n> Avec l'**intérêt légitime**, documentez la mise en balance : l'intérêt poursuivi, la nécessité, l'impact pour les personnes et les garanties (durée courte, accès restreint, information). C'est ce document que la CNIL demandera.\n\n---\n\n## Données sensibles (article 9) et données d'infraction (article 10)\n\nLe traitement des données suivantes est **interdit par principe**, sauf exception prévue par le texte (consentement explicite, obligations en droit du travail, médecine du travail, etc.) :\n\n- origine raciale ou ethnique ;\n- opinions politiques, convictions religieuses ou philosophiques ;\n- appartenance syndicale ;\n- données génétiques ;\n- **données biométriques** utilisées pour identifier une personne (empreinte, contour de la main, reconnaissance faciale) ;\n- données de **santé** (arrêts de travail, aptitude médicale détaillée, accidents du travail) ;\n- vie sexuelle ou orientation sexuelle.\n\nLes données relatives aux **condamnations pénales et infractions** (extrait de casier judiciaire, par exemple pour un poste sensible) ne peuvent être traitées que dans les cas prévus par la loi.\n\nSur un site industriel, les plus fréquentes sont la **santé** (accidents du travail, aptitudes), la **biométrie** (contrôle d'accès à une zone sensible) et l'**appartenance syndicale** (heures de délégation). Elles imposent presque toujours une analyse d'impact.\n\n---\n\n## Durées de conservation\n\nIl n'existe pas de durée unique : chaque traitement a la sienne, fixée par la finalité et, souvent, par un texte ou une recommandation. Le cycle de vie comporte trois temps :\n\n1. **Base active** : la donnée sert au quotidien.\n2. **Archivage intermédiaire** : accès restreint, conservée pour une obligation légale ou un contentieux possible.\n3. **Suppression** ou **anonymisation**.\n\n| Traitement | Durée indicative (recommandation CNIL, à vérifier) |\n|---|---|\n| Images de vidéosurveillance | Quelques jours, **un mois au plus**, sauf incident (extraction pour une procédure) |\n| Données de passage du contrôle d'accès par badge | **Trois mois** pour les déplacements ; les données du badge le temps de l'habilitation |\n| Géolocalisation des véhicules des salariés | **Deux mois** en principe (plus long si une finalité le justifie : preuve d'interventions, temps de travail dans certains cas) |\n| Candidatures non retenues | **Deux ans** après le dernier contact, sauf opposition |\n| Dossier du salarié | Durée du contrat, puis archivage selon les délais de prescription (sociale, fiscale) |\n| Journaux de connexion aux systèmes | **Six mois à un an** en général pour la sécurité |\n\n> Inscrivez la durée **dans le registre**, et surtout **appliquez-la** : une purge automatique vaut mieux qu'une règle écrite. Les copies (sauvegardes, exports Excel, boîtes de messagerie) comptent aussi.\n" },
{ fichier: "6-RGPD/3-Droits_des_personnes.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Droits des personnes\n\n## L'information, préalable à tout (articles 12 à 14)\n\nLes personnes doivent être informées, **au moment de la collecte** (ou dans le mois si les données ne viennent pas d'elles), de façon concise, compréhensible et accessible :\n\n- l'identité du responsable de traitement et le contact du DPO ;\n- les **finalités** et la **base légale** (et l'intérêt légitime poursuivi le cas échéant) ;\n- les destinataires ;\n- les transferts hors de l'Union et leurs garanties ;\n- la **durée de conservation** ;\n- les **droits** et la façon de les exercer ;\n- le droit d'introduire une réclamation auprès de la CNIL ;\n- le caractère obligatoire ou non de la fourniture des données.\n\nSur un site : une **mention dans le livret d'accueil** ou le règlement intérieur pour les salariés, un **panneau** à l'entrée pour la vidéosurveillance (avec renvoi vers l'information complète), une **mention sur le registre des visiteurs**. Pour les salariés, la mise en place d'un dispositif de contrôle de l'activité impose aussi l'**information et la consultation du CSE**.\n\n---\n\n## Les droits\n\n| Droit | Article | Ce que la personne peut obtenir | Limites courantes |\n|---|---|---|---|\n| **Accès** | 15 | La confirmation que des données sont traitées, une **copie**, et les informations sur le traitement | Ne pas porter atteinte aux droits d'autrui (masquer les tiers sur une image) |\n| **Rectification** | 16 | La correction de données inexactes, le complément de données incomplètes | — |\n| **Effacement** (« droit à l'oubli ») | 17 | La suppression, notamment si les données ne sont plus nécessaires, en cas d'opposition fondée ou de traitement illicite | Obligation légale de conservation, constatation ou défense de droits en justice |\n| **Limitation** | 18 | Le « gel » des données le temps de vérifier une contestation | — |\n| **Portabilité** | 20 | Les données fournies, dans un format structuré et lisible par machine, pour les transmettre ailleurs | Seulement si la base est le consentement ou le contrat, et le traitement automatisé |\n| **Opposition** | 21 | L'arrêt d'un traitement fondé sur l'intérêt légitime, pour des raisons tenant à sa situation | Motifs légitimes et impérieux du responsable (sécurité du site, par exemple) |\n| **Décision automatisée** | 22 | Ne pas faire l'objet d'une décision produisant des effets juridiques fondée exclusivement sur un traitement automatisé | Exceptions du texte, avec garanties (intervention humaine) |\n\n---\n\n## Répondre à une demande\n\n1. **Enregistrer** la demande dès réception, quel que soit le canal (courrier, courriel, oral au responsable d'équipe) : date, personne, droit exercé, traitements visés.\n2. **Vérifier l'identité** si un doute raisonnable existe, sans demander plus que nécessaire (pas de copie systématique de pièce d'identité).\n3. **Rechercher** les données dans tous les traitements concernés, y compris les copies (exports, messageries, sauvegardes accessibles).\n4. **Répondre dans un délai d'un mois** à compter de la réception. Ce délai peut être **prolongé de deux mois** si la demande est complexe ou si les demandes sont nombreuses : prévenir la personne dans le premier mois en expliquant pourquoi.\n5. **Gratuitement**, sauf demande manifestement infondée ou excessive (répétitive) : frais raisonnables ou refus motivé.\n6. En cas de refus, **motiver** la réponse et rappeler la possibilité de saisir la CNIL ou un juge.\n7. **Conserver la trace** de la demande et de la réponse : c'est une preuve de conformité.\n\n> Le délai d'un mois court même pendant les congés. Désignez un circuit clair (DPO ou référent, avec un suppléant) et un modèle de réponse : voir [Modèles et check-lists](7-Modeles_et_checklists.md).\n\n---\n\n## Cas fréquents sur un site industriel\n\n| Demande | Points d'attention |\n|---|---|\n| Un salarié demande ses passages de badge du dernier mois | Données disponibles dans la durée de conservation (trois mois) ; extraction limitée à la personne |\n| Un salarié demande les images d'une altercation | Accès possible, en **masquant les autres personnes** ; si les images ont été effacées (durée dépassée), le dire |\n| Un ancien salarié demande l'effacement de son dossier | Refus partiel justifié par les obligations légales de conservation (paie, déclarations sociales) ; effacement du reste |\n| Un intérimaire s'oppose à la géolocalisation du véhicule | Mise en balance : si le dispositif est justifié (sécurité, preuve d'intervention), la réponse peut être un refus motivé, avec rappel des garanties (pas de suivi hors temps de travail) |\n| Un opérateur demande ce que la supervision enregistre sur lui | Journaux d'actions (identifiant, horodatage, commandes) : communiquer, en expliquant la finalité de sécurité et de traçabilité |\n" },
{ fichier: "6-RGPD/4-Obligations_du_responsable.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Obligations du responsable de traitement\n\n## Le registre des activités de traitement (article 30)\n\nC'est la **pièce centrale** : la CNIL commence presque toujours un contrôle par sa demande. Il est obligatoire au-delà de 250 salariés et, en dessous, dès que le traitement n'est pas occasionnel, présente un risque ou porte sur des données sensibles : en pratique, **toute entreprise** doit en tenir un.\n\nUne fiche par traitement (une **finalité principale**), avec :\n\n| Rubrique | Exemple : contrôle d'accès par badge |\n|---|---|\n| Nom et coordonnées du responsable, du DPO | Usine de Lyon, DPO du groupe |\n| **Finalité** | Contrôler l'accès aux bâtiments et aux zones de production |\n| **Base légale** | Intérêt légitime (sécurité des personnes et des biens) |\n| **Catégories de personnes** | Salariés, intérimaires, prestataires, visiteurs |\n| **Catégories de données** | Identité, photo, numéro de badge, zones autorisées, passages horodatés |\n| Données sensibles | Aucune (sans biométrie) |\n| **Destinataires** | Service sécurité, ressources humaines en cas d'enquête, société de gardiennage (sous-traitant) |\n| Transferts hors de l'Union | Aucun |\n| **Durée de conservation** | Badge : durée de l'habilitation ; passages : trois mois |\n| **Mesures de sécurité** | Accès nominatifs au logiciel, journalisation, serveur en zone protégée, sauvegardes |\n| Où sont les données | SI « Sûreté », serveur du contrôle d'accès (TAG de l'inventaire) |\n\nLe **sous-traitant** tient lui aussi un registre des traitements qu'il effectue pour le compte de ses clients.\n\n---\n\n## Protection des données dès la conception et par défaut (article 25)\n\nPour tout nouveau système (logiciel, automatisme connecté, caméra, application), la protection des données se pense **au cahier des charges**, pas après la mise en service :\n\n- **dès la conception** : minimisation, pseudonymisation, chiffrement, cloisonnement, purge automatique prévue ;\n- **par défaut** : seules les données nécessaires sont collectées, conservées le temps nécessaire, visibles par les seules personnes qui en ont besoin.\n\nIntégrez ces exigences aux cahiers des charges et aux recettes, au même titre que la cybersécurité.\n\n---\n\n## L'analyse d'impact relative à la protection des données (AIPD, article 35)\n\nObligatoire quand un traitement est **susceptible d'engendrer un risque élevé** pour les droits et libertés des personnes. La CNIL publie une **liste des types de traitements** pour lesquels elle est obligatoire (dont la surveillance constante de l'activité des salariés, les données biométriques, la géolocalisation à grande échelle). À défaut, le CEPD retient neuf critères ; **deux critères réunis imposent en principe une AIPD** :\n\n1. évaluation ou notation (profilage) ;\n2. décision automatisée avec effet juridique ou similaire ;\n3. **surveillance systématique** ;\n4. **données sensibles** ou hautement personnelles ;\n5. traitement à grande échelle ;\n6. croisement de jeux de données ;\n7. **personnes vulnérables** (dont les salariés vis-à-vis de l'employeur) ;\n8. usage innovant ou nouvelle technologie ;\n9. traitement qui empêche d'exercer un droit ou de bénéficier d'un service ou d'un contrat.\n\nUne AIPD décrit le traitement, évalue sa nécessité et sa proportionnalité, analyse les **risques pour les personnes** (accès illégitime, modification non désirée, disparition des données) et fixe les mesures. Si le risque résiduel reste élevé, la CNIL doit être **consultée avant** la mise en œuvre. La CNIL fournit un outil gratuit (PIA). La méthode est proche d'EBIOS Risk Manager, mais le point de vue est celui de la **personne**, pas de l'entreprise.\n\n---\n\n## Les violations de données (articles 33 et 34)\n\nUne **violation** est un incident de sécurité qui entraîne, de façon accidentelle ou illicite, la **destruction, la perte, l'altération, la divulgation ou l'accès non autorisé** à des données personnelles. Elle touche la **confidentialité** (fuite, accès d'un tiers), l'**intégrité** (modification) ou la **disponibilité** (chiffrement par un rançongiciel, perte sans sauvegarde).\n\n| Étape | Délai | Quand |\n|---|---|---|\n| **Documenter** la violation dans le registre des violations | Toujours | Même sans notification : faits, effets, mesures prises |\n| **Notifier la CNIL** | **72 heures** après en avoir pris connaissance | Sauf si la violation n'est pas susceptible d'engendrer un risque pour les personnes ; au-delà de 72 h, justifier le retard ; une notification peut être complétée ensuite |\n| **Informer les personnes** | Dans les meilleurs délais | Si la violation est susceptible d'engendrer un **risque élevé** (sauf données chiffrées inexploitables, mesures qui suppriment le risque, effort disproportionné remplacé par une communication publique) |\n| Le **sous-traitant** prévient le responsable | Dans les meilleurs délais | Toujours, dès qu'il a connaissance de la violation |\n\n> Le délai de 72 h commence quand on a une **certitude raisonnable** qu'une violation de données personnelles s'est produite, pas à la fin de l'enquête. Un rançongiciel qui chiffre le serveur RH est une violation (disponibilité, et souvent confidentialité si des données ont été exfiltrées).\n\n---\n\n## Les sous-traitants (article 28)\n\nLe responsable ne fait appel qu'à des sous-traitants présentant des **garanties suffisantes**, et signe avec chacun un **contrat** (ou un avenant) qui précise l'objet, la durée, la nature et la finalité du traitement, les types de données, les catégories de personnes, et les obligations du sous-traitant :\n\n- traiter les données **uniquement sur instruction documentée** ;\n- garantir la **confidentialité** des personnes autorisées ;\n- assurer la **sécurité** (article 32) ;\n- ne recourir à un **autre sous-traitant** qu'avec autorisation, en lui imposant les mêmes obligations ;\n- **aider** le responsable à répondre aux demandes de droits, à notifier les violations, à mener les AIPD ;\n- **supprimer ou restituer** les données à la fin de la prestation ;\n- mettre à disposition les informations nécessaires et permettre les **audits**.\n\nUn prestataire de télémaintenance qui se connecte à un serveur contenant des données personnelles est un sous-traitant, même si ce n'est pas l'objet de son contrat : la clause doit y figurer.\n\n---\n\n## Les transferts hors de l'Union (chapitre V)\n\nUn transfert (y compris un **accès à distance** depuis un pays tiers, ou un hébergement chez un fournisseur hors de l'Union) n'est possible qu'avec une garantie :\n\n- une **décision d'adéquation** de la Commission (le pays offre un niveau de protection équivalent ; pour les États-Unis, seulement vers les entreprises adhérentes au cadre UE-États-Unis de protection des données) ;\n- des **clauses contractuelles types** adoptées par la Commission, avec une évaluation de la législation du pays destinataire ;\n- des **règles d'entreprise contraignantes** (BCR) au sein d'un groupe.\n\n---\n\n## Le délégué à la protection des données (DPO, articles 37 à 39)\n\nSa désignation est **obligatoire** pour les autorités publiques, et pour les organismes dont l'activité de base consiste en un **suivi régulier et systématique à grande échelle** ou en un traitement **à grande échelle de données sensibles**. Sinon, elle reste recommandée ; au minimum, désignez un **référent** interne. Le DPO informe, conseille, contrôle, coopère avec la CNIL ; il doit être associé à toutes les questions de protection des données, disposer de moyens et ne pas être en conflit d'intérêts (il ne décide pas des traitements qu'il contrôle).\n" },
{ fichier: "6-RGPD/5-Securite_et_cyber.md", texte: "<!-- WerbReferentiels – Développé par @WerbHat -->\n# Sécurité des données et cybersécurité\n\n## Article 32 : une sécurité adaptée au risque\n\nLe responsable et le sous-traitant mettent en œuvre des **mesures techniques et organisationnelles appropriées** au risque, compte tenu de l'état des connaissances, des coûts, de la nature du traitement et de la gravité pour les personnes. Le texte cite notamment :\n\n- la **pseudonymisation** et le **chiffrement** ;\n- des moyens garantissant la **confidentialité, l'intégrité, la disponibilité et la résilience** des systèmes ;\n- la capacité de **rétablir** la disponibilité et l'accès aux données en cas d'incident (sauvegardes, reprise) ;\n- une procédure pour **tester et évaluer régulièrement** l'efficacité des mesures.\n\nLe RGPD ne donne pas de liste fermée : c'est au responsable de justifier que ses mesures sont à la hauteur du risque. Un SMSI fondé sur ISO 27001 et les mesures NIS2 en fournit l'essentiel, à condition de **repérer où sont les données personnelles** et de leur appliquer le bon niveau de protection.\n\n---\n\n## Les mesures qui comptent le plus\n\n| Domaine | Mesure | Module WerbSMSI |\n|---|---|---|\n| Savoir où sont les données | Rattacher chaque traitement à ses SI et actifs | WerbRGPD (registre) relié à WerbMap |\n| Contrôle d'accès | Comptes nominatifs, droits au besoin d'en connaître, revue périodique, suppression au départ | WerbExploitation (comptes et accès) |\n| Traçabilité | Journaliser les accès aux données sensibles (images, RH, santé) | WerbExploitation, WerbIEC62443 |\n| Cloisonnement | Données RH et sûreté hors des réseaux de production, filtrage | WerbMap (zones, flux), WerbCartoSI (schémas) |\n| Chiffrement | Postes nomades, supports amovibles, sauvegardes externalisées, échanges | WerbExploitation (certificats) |\n| Sauvegarde et reprise | Sauvegardes testées, copie hors ligne | WerbExploitation (sauvegardes), WerbPCR |\n| Prestataires | Contrat article 28, accès à distance maîtrisés | WerbPresta |\n| Sensibilisation | Former aux bons réflexes (pièces jointes, envoi de fichiers, rangement) | WerbAcademie |\n| Purge | Supprimer à l'échéance, y compris les copies | WerbRGPD (durées) |\n\n---\n\n## Une violation de données, un incident NIS2 : deux notifications\n\nUn même événement peut déclencher **deux obligations indépendantes** :\n\n| | RGPD (violation de données) | NIS2 (incident important) |\n|---|---|---|\n| Ce qui est protégé | Les personnes dont les données sont touchées | La continuité des services de l'entité |\n| Destinataire | **CNIL** | **ANSSI** (CERT-FR) en France |\n| Délais | **72 h** après en avoir pris connaissance, si risque pour les personnes | **24 h** alerte précoce, **72 h** notification, **un mois** rapport final |\n| Information des personnes | Si risque élevé | Information des destinataires des services, si nécessaire |\n\nExemple : un rançongiciel chiffre le serveur de supervision et le serveur RH, avec exfiltration. C'est un incident NIS2 (production arrêtée) **et** une violation de données (fichiers RH exfiltrés). Les deux notifications sont dues, par deux circuits. Préparez-les ensemble dans la procédure de gestion des incidents, avec un seul pilote.\n\n---\n\n## Correspondance avec ISO/IEC 27001 et 27701\n\n| Exigence RGPD | ISO/IEC 27001:2022 (annexe A) | ISO/IEC 27701 |\n|---|---|---|\n| Article 5.2 — Responsabilité | Clauses 4 à 10 (le SMSI lui-même) | Extension du SMSI au système de management de la vie privée |\n| Article 25 — Protection dès la conception | A.5.8, A.8.25 à A.8.28 | Exigences « privacy by design » |\n| Article 28 — Sous-traitants | A.5.19 à A.5.22 | Obligations du responsable envers ses sous-traitants, obligations du sous-traitant |\n| Article 30 — Registre | A.5.9 (inventaire), A.5.34 | Documentation des traitements |\n| Article 32 — Sécurité | Ensemble des mesures, notamment A.5.15, A.8.5, A.8.11, A.8.13, A.8.24 | — |\n| Articles 33 et 34 — Violations | A.5.24 à A.5.28 | Gestion des violations de données |\n| Article 35 — AIPD | Clause 6.1 (appréciation des risques) | Analyse d'impact sur la vie privée |\n| A.5.34 — Vie privée et protection des données à caractère personnel | Identifier et respecter les obligations légales | Mise en œuvre détaillée |\n" },
