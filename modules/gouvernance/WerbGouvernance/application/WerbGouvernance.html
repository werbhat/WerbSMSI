   interne, ancre ignorée). Tout le HTML du texte est échappé, sauf les commentaires
   <!-- … --> placés entre deux blocs, qui ne sont pas affichés ; le premier porte la signature du guide (charte §7.4).
   Thème clair / sombre (charte §7.5, 1.2.0) : fonds sur les variables communes (--card, --info-bg…, repli clair), valeurs sombres
   propres au lecteur à l'écran seulement ; titres sous texte blanc sur --navy-fond ; impression en clair. */
const WerbGuides = Object.freeze((() => {
  const VERSION = "1.1.0";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const sansAccent = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

  /* ---------------------------------------------------------------- texte en ligne */
  let dossierCourant = "";                                   // dossier du guide en cours de rendu (liens relatifs)
  // Chemin d'une page .md citée par un lien relatif, à partir du dossier du guide (« ../2-NIST/0-carte.md »)
  function cheminRelatif(url) {
    let u = url.replace(/#.*$/, "");
    try { u = decodeURIComponent(u); } catch { /* adresse mal encodée : prise telle quelle */ }
    const parts = [];
    for (const p of ((dossierCourant ? dossierCourant + "/" : "") + u.replace(/^\.\//, "")).split("/")) {
      if (p === "..") parts.pop(); else if (p && p !== ".") parts.push(p);
    }
    return parts.join("/");
  }
  function enLigne(s, liens = true) {
    const gardes = [];
    const garder = h => `\u0000${gardes.push(h) - 1}\u0000`;
    s = s.replace(/`([^`]+)`/g, (_, c) => garder(`<code>${esc(c)}</code>`));
    s = s.replace(/\[([^\]]+)\]\((?:<([^>]+)>|([^)\s]+))\)/g, (t, lib, url1, url2) => {
      const url = url1 || url2;
      if (/^(https?:|mailto:)/i.test(url)) return garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${enLigne(lib, false)}</a>`);
      if (/^[^:]+\.md(#.*)?$/i.test(url)) return garder(`<a class="wg-int" data-werb-page="${esc(cheminRelatif(url))}">${enLigne(lib, false)}</a>`);
      return t;
    });
    if (liens) s = s.replace(/\bhttps?:\/\/[^\s<>()]+[^\s<>().,;:!?]/g, url => garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`));
    s = esc(s);
    s = s.replace(/\*\*(?=\S)(.+?)\*\*/g, "<strong>$1</strong>").replace(/__(?=\S)(.+?)__(?![\p{L}\d])/gu, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*(?=\S)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>").replace(/(^|[^\p{L}\d_])_(?=\S)([^_]+?)_(?![\p{L}\d_])/gu, "$1<em>$2</em>");
    return s.replace(/\u0000(\d+)\u0000/g, (_, n) => gardes[+n]);
  }

  /* ---------------------------------------------------------------- blocs */
  const RE_LISTE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const cellules = l => l.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  const estSeparateur = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);

  function rendre(md) {
    const lignes = String(md || "").replace(/\r\n?/g, "\n").split("\n");
    const sommaire = [], ancres = new Set();
    let titre = "", signature = "";
    const ancre = t => {
      const base = "g-" + (sansAccent(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "section");
      let a = base, n = 2;
      while (ancres.has(a)) a = `${base}-${n++}`;
      ancres.add(a);
      return a;
    };
    const html = [];
    let i = 0;
    while (i < lignes.length) {
      const l = lignes[i];
      if (!l.trim()) { i++; continue; }
      if (/^\s*<!--/.test(l)) {                                                     // commentaire : non affiché
        const debut = i;
        while (i < lignes.length && !lignes[i].includes("-->")) i++;
        const c = lignes.slice(debut, i + 1).join(" ").replace(/^\s*<!--|-->[\s\S]*$/g, "").trim();
        if (!signature && !html.length) signature = c;
        i++;
        continue;
      }
      let m;
      if ((m = l.match(/^\s*(`{3,}|~{3,})\s*([\w-]*)/))) {                       // bloc de code
        const fin = m[1], corps = [];
        i++;
        while (i < lignes.length && !lignes[i].trim().startsWith(fin)) corps.push(lignes[i++]);
        i++;
        html.push(`<pre class="wg-code"><code>${esc(corps.join("\n"))}</code></pre>`);
        continue;
      }
      if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {                          // titre
        const niv = m[1].length, txt = m[2], a = ancre(txt);
        if (!titre && niv <= 2) titre = txt.replace(/[*_`]/g, "");
        sommaire.push({ niv, texte: txt.replace(/[*_`]/g, ""), ancre: a });
        html.push(`<h${niv} id="${a}" class="wg-h${niv}">${enLigne(txt)}</h${niv}>`);
        i++;
        continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { html.push("<hr>"); i++; continue; } // filet
      if (l.includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1])) { // tableau
        const tete = cellules(l), alig = cellules(lignes[i + 1]).map(c => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : "");
        const st = k => alig[k] ? ` style="text-align:${alig[k]}"` : "";
        i += 2;
        const corps = [];
        while (i < lignes.length && lignes[i].includes("|") && lignes[i].trim()) corps.push(cellules(lignes[i++]));
        html.push(`<div class="wg-table"><table><thead><tr>${tete.map((c, k) => `<th${st(k)}>${enLigne(c)}</th>`).join("")}</tr></thead>`
          + `<tbody>${corps.map(r => `<tr>${tete.map((_, k) => `<td${st(k)}>${enLigne(r[k] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        continue;
      }
      if (/^\s*>/.test(l)) {                                                       // citation
        const corps = [];
        while (i < lignes.length && /^\s*>/.test(lignes[i])) corps.push(lignes[i++].replace(/^\s*>\s?/, ""));
        html.push(`<blockquote>${rendre(corps.join("\n")).html}</blockquote>`);
        continue;
      }
      if (RE_LISTE.test(l)) {                                                      // liste (imbrication par l'indentation)
        const items = [];
        while (i < lignes.length) {
          const x = lignes[i].match(RE_LISTE);
          if (x) { items.push({ ind: x[1].replace(/\t/g, "    ").length, num: /\d/.test(x[2]), txt: x[3] }); i++; continue; }
          if (lignes[i].trim() && /^\s{2,}/.test(lignes[i]) && items.length) { items[items.length - 1].txt += " " + lignes[i].trim(); i++; continue; }
          break;
        }
        html.push(liste(items));
        continue;
      }
      const para = [];                                                             // paragraphe
      while (i < lignes.length && lignes[i].trim() && !/^(#{1,6}\s|\s*>|\s*(`{3,}|~{3,}))/.test(lignes[i]) && !RE_LISTE.test(lignes[i])
        && !(lignes[i].includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1]))) para.push(lignes[i++]);
      html.push(`<p>${para.map((p, k) => enLigne(p.trim()) + (k < para.length - 1 && / {2,}$/.test(p) ? "<br>" : "")).join(" ")}</p>`);
    }
    return { html: html.join("\n"), sommaire, titre, signature };
  }

  function liste(items) {
    let h = "", pile = [];
    const ouvrir = it => { const t = it.num ? "ol" : "ul"; pile.push({ ind: it.ind, t }); h += `<${t}>`; };
    for (const it of items) {
      while (pile.length && it.ind < pile[pile.length - 1].ind) { h += `</li></${pile.pop().t}>`; }
      if (!pile.length || it.ind > pile[pile.length - 1].ind) ouvrir(it);
      else h += "</li>";
      const c = it.txt.match(/^\[([ xX])\]\s+(.*)$/);
      h += c ? `<li class="wg-tache"><input type="checkbox" disabled${c[1] !== " " ? " checked" : ""}> <span class="wg-li">${enLigne(c[2])}</span>`
        : `<li><span class="wg-li">${enLigne(it.txt)}</span>`;
    }
    while (pile.length) h += `</li></${pile.pop().t}>`;
    return h;
  }

  /* ---------------------------------------------------------------- guides du module */
  const EMOJIS = [[/correspondance|tableau crois[ée]/i, "🔀"], [/^(\d+\s*[-_. ]\s*)?carte\b/i, "🧭"], [/^sources?\b/i, "🔗"], [/obligation/i, "⚖️"], [/industriel/i, "🏭"], [/checklist|contr[oô]le|audit/i, "✅"], [/plan|feuille de route|mise en [oœ]uvre|[ée]tape/i, "🗺️"],
    [/cadrage|p[ée]rim[eè]tre/i, "🎯"], [/matrice|atelier/i, "🧮"], [/socle|mesure/i, "🛡️"], [/rapport|synth[eè]se/i, "📑"],
    [/registre/i, "🗂️"], [/mod[eè]le|gabarit/i, "🧩"], [/guide|r[ée]f[ée]rentiel|m[ée]thode/i, "📘"]];
  let cache = null;
  function liste_guides() {
    if (cache) return cache;
    const src = Array.isArray(globalThis.WERB_GUIDES) ? globalThis.WERB_GUIDES : [];
    cache = src.map((g, n) => {
      const chemin = String(g.fichier || `guide-${n + 1}.md`).replace(/\\/g, "/");
      const dossier = chemin.includes("/") ? chemin.slice(0, chemin.lastIndexOf("/")) : "";
      dossierCourant = dossier;
      const r = rendre(g.texte);
      dossierCourant = "";
      const nom = chemin.slice(dossier ? dossier.length + 1 : 0).replace(/\.md$/i, "");
      // Titre : premier titre (# ou ##) du document, avant « — » ; trop long ou absent : nom du fichier sans numéro
      let titre = (r.sommaire.find(s => s.niv <= 2) || { texte: "" }).texte.replace(/[*_`]/g, "").split(/\s+[—–]\s+/)[0].trim();
      if (!titre || titre.length > 60) titre = nom.replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " ");
      titre = titre.charAt(0).toUpperCase() + titre.slice(1);
      const id = "guide:" + (sansAccent((dossier ? dossier + "/" : "") + nom).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || n + 1);
      const mots = String(g.texte || "").split(/\s+/).filter(Boolean).length;
      // Sommaire : les deux plus hauts niveaux de titres, sans le titre du document
      const titres = r.sommaire.slice(1), niveaux = [...new Set(titres.map(s => s.niv))].sort();
      const som = titres.filter(s => niveaux.indexOf(s.niv) > -1 && niveaux.indexOf(s.niv) < 2).map(s => ({ ...s, rang: niveaux.indexOf(s.niv) + 1 }));
      return Object.freeze({ id, fichier: chemin, dossier, titre, signature: r.signature, emoji: (EMOJIS.find(([re]) => re.test(titre) || re.test(nom)) || [, "📄"])[1],
        html: r.html, sommaire: som, minutes: Math.max(1, Math.round(mots / 200)) });
    });
    return cache;
  }
  const trouver = id => liste_guides().find(g => g.id === id) || null;
  const duDossier = dossier => liste_guides().filter(g => dossier === undefined || g.dossier === dossier);
  const racine = () => String(globalThis.WERB_GUIDES_RACINE || "guides");

  // Entrées du menu ❓ Aide : [[idVue, libellé], …] ; idVue commence par « guide: ». dossier : ceux d'un seul dossier ("" = racine)
  const entrees = dossier => duDossier(dossier).map(g => [g.id, `${g.emoji} ${g.titre}`]);

  // Dossiers des guides, dans l'ordre de leurs fichiers : [{ dossier, nom (sans numéro), guides }] ; "" = racine
  function dossiers() {
    const ds = [];
    for (const g of liste_guides()) {
      let d = ds.find(x => x.dossier === g.dossier);
      if (!d) ds.push(d = { dossier: g.dossier, nom: g.dossier.split("/").pop().replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " "), guides: [] });
      d.guides.push(g);
    }
    return ds;
  }

  // Liens relatifs du texte (data-werb-page) : navigation propre au module vers la page citée, ou texte simple si elle manque
  const liensInternes = (html, lien) => html.replace(/<a class="wg-int" data-werb-page="([^"]*)">([\s\S]*?)<\/a>/g, (_, chemin, lib) => {
    const cible = liste_guides().find(g => esc(g.fichier) === chemin);
    return cible ? `<a href="#" class="wg-int" ${lien(cible.id)}>${lib}</a>` : `<span class="wg-absent" title="Page absente : ${chemin}">${lib}</span>`;
  });

  // Cartes des guides, pour la page d'aide ou l'accueil. lien(id) : attributs HTML de navigation propres au module ; dossier : facultatif
  function cartes(lien, dossier) {
    const gs = duDossier(dossier);
    if (!gs.length) return "";
    return `<div class="wg-cartes">${gs.map((g, n) => `<button type="button" class="wg-carte" ${lien(g.id)}><span class="wg-etape">${n + 1}</span>`
      + `<span class="wg-ct"><b>${g.emoji} ${esc(g.titre)}</b><small>${g.sommaire.filter(s => s.rang === 1).length} sections · ≈ ${g.minutes} min de lecture</small></span></button>`).join("")}</div>`;
  }

  // Page de lecture d'un guide (étapes : les guides de son dossier). lien(id) : attributs HTML de navigation propres au module ;
  // retour : HTML d'un bouton facultatif ; mot : nom d'un document dans le bandeau (« Guide », « Page »…)
  function vue(id, { lien, retour = "", mot = "Guide" } = {}) {
    const g = trouver(id);
    if (!g) return `<div class="wg"><p>Guide introuvable.</p>${retour}</div>`;
    const gs = duDossier(g.dossier);
    const n = gs.indexOf(g), prec = gs[n - 1], suiv = gs[n + 1];
    const etapes = gs.map((x, k) => `<button type="button" class="wg-pas${x === g ? " actif" : ""}" ${lien(x.id)} title="${esc(x.titre)}"><span class="wg-etape">${k + 1}</span>${x.emoji} ${esc(x.titre)}</button>`).join("");
    const som = g.sommaire.map(s => `<a class="wg-s${s.rang}" data-werb-ancre="${s.ancre}">${esc(s.texte)}</a>`).join("");
    const pied = `<div class="wg-pied">${prec ? `<button type="button" ${lien(prec.id)}>← ${esc(prec.titre)}</button>` : "<span></span>"}`
      + `${suiv ? `<button type="button" class="primary" ${lien(suiv.id)}>${esc(suiv.titre)} →</button>` : ""}</div>`;
    return `<div class="wg"><div class="wg-tete"><div class="wg-pas-liste">${etapes}</div>${retour}</div>
      <div class="wg-corps"><article class="wg-doc"><div class="wg-meta">${g.emoji} ${esc(mot)} ${n + 1} / ${gs.length} · ≈ ${g.minutes} min de lecture · <span class="wg-fichier">${esc(racine())}/${esc(g.fichier)}</span>${g.signature ? `<span class="wg-sig">${esc(g.signature)}</span>` : ""}</div>${liensInternes(g.html, lien)}${pied}</article>
      ${som ? `<aside class="wg-som"><div class="wg-som-t">📑 Sommaire</div>${som}</aside>` : ""}</div></div>`;
  }

  /* ---------------------------------------------------------------- style et ancres */
  const CSS = `
.wg{--wg-a:var(--navy,#1f3864);--wg-b:var(--navy-2,#2e5090);--wg-l:var(--line,#dfe3ea);--wg-m:var(--muted,#5d6676);--wg-f:#f6f8fc;--wg-fond:var(--card,#fff);--wg-i:var(--info-bg,#e8eef9);--wg-h:var(--navy-fond,var(--navy,#1f3864));--wg-h2:#2e5090;--wg-code:#eef1f6;--wg-cit:#fff8e6;--wg-cit-b:#e0a100;--wg-th-b:#c9d5ea;--wg-pre:#1d2330;--wg-pre-t:#e8ecf3}
@media screen{:root[data-theme=sombre] .wg,:root[data-theme=sombre] .wg-cartes{--wg-f:#1b2533;--wg-h2:#2a4a7a;--wg-code:#243041;--wg-cit:#3a2d0c;--wg-cit-b:#c79a00;--wg-th-b:#2e4a75;--wg-pre:#0b0f14}}
.wg-tete{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.wg-pas-liste{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.wg-pas{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--wg-l);background:var(--wg-fond);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font:inherit;font-size:13px;color:inherit}
.wg-pas:hover{border-color:var(--wg-b)}
.wg-pas.actif{background:var(--wg-h);border-color:var(--wg-h);color:#fff;font-weight:600}

.wg-pas.actif .wg-etape{background:rgba(255,255,255,.22);color:#fff}

/*! WerbGouvernance – Développé par @WerbHat */
/* Classeurs Excel (.xlsx) sans bibliothèque externe : archive ZIP compressée par le navigateur (CompressionStream),
   feuilles en SpreadsheetML. Écriture : ligne de titres, largeurs, volet figé, filtre, listes déroulantes (valeurs ou
   plage d'une feuille de listes), dates au format date Excel, feuilles masquées, propriétés signées. Lecture : valeurs
   des cellules (texte partagé ou en ligne, nombres, booléens), feuille par feuille.
   Les cellules sont toujours écrites en valeurs, jamais en formules. Version commune (TRV-7), reprise de WerbAssets 1.4.0 et WerbExploitation 1.4.0. */
"use strict";
const WerbXlsx = (() => {
  const TYPE = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  const NS_R = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const TAILLE_MAX = 20 * 1024 * 1024;
  const LIGNES_LISTES = 2000;                              // étendue des listes déroulantes sous la ligne de titres
  const STYLE = { titre: 1, cellule: 2, info: 3, date: 4 };   // index cellXfs de styles()
  const EPOQUE = Date.UTC(1899, 11, 30);                   // jour 0 des dates Excel (calendrier 1900)
  // Date ISO (AAAA-MM-JJ) → cellule date Excel ; autre texte : inchangé
  const date = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? { v: (Date.UTC(+m[1], +m[2] - 1, +m[3]) - EPOQUE) / 86400000, s: STYLE.date, n: true } : iso; };
  // Numéro de série Excel → date ISO
  const isoDe = n => new Date(EPOQUE + Math.round(+n) * 86400000).toISOString().slice(0, 10);

  const CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const flux = (data, transformation) => new Response(new Blob([data]).stream().pipeThrough(transformation)).arrayBuffer();
  const X = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const lettre = n => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const numero = s => { let n = 0; for (const ch of s) n = n * 26 + ch.charCodeAt(0) - 64; return n; };

  /* ---------- ZIP ---------- */
  async function zip(entrees, type = TYPE) {   // [[chemin, texte]] → Blob
    const te = new TextEncoder(), parts = [], central = [];
    let off = 0;
    for (const [chemin, texte] of entrees) {
      const brut = te.encode(texte), nom = te.encode(chemin), crc = crc32(brut);
      let data = brut, meth = 0;
      if ("CompressionStream" in window) {
        try { data = new Uint8Array(await flux(brut, new CompressionStream("deflate-raw"))); meth = 8; } catch (e) { data = brut; meth = 0; }
      }
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, meth, true); h.setUint16(12, 0x21, true);
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, brut.length, true); h.setUint16(26, nom.length, true);
      parts.push(h.buffer, nom, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, meth, true); c.setUint16(14, 0x21, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, brut.length, true); c.setUint16(28, nom.length, true); c.setUint32(42, off, true);
      central.push(c.buffer, nom);
      off += 30 + nom.length + data.length;
    }
    const taille = central.reduce((s, p) => s + p.byteLength, 0), fin = new DataView(new ArrayBuffer(22));
    fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, entrees.length, true); fin.setUint16(10, entrees.length, true);
    fin.setUint32(12, taille, true); fin.setUint32(16, off, true);
    return new Blob([...parts, ...central, fin.buffer], { type });
  }

  // Renvoie une fonction chemin → texte (null si absent)
  function unzip(buf) {
    const dv = new DataView(buf);
    let e = buf.byteLength - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error("Fichier Excel illisible (archive invalide).");
    const n = dv.getUint16(e + 10, true), td = new TextDecoder(), fichiers = {};
    let o = dv.getUint32(e + 16, true);
    for (let i = 0; i < n; i++) {
      const meth = dv.getUint16(o + 10, true), csz = dv.getUint32(o + 20, true), nl = dv.getUint16(o + 28, true), xl = dv.getUint16(o + 30, true), cl = dv.getUint16(o + 32, true), lo = dv.getUint32(o + 42, true);
      fichiers[td.decode(new Uint8Array(buf, o + 46, nl))] = { meth, csz, lo };
      o += 46 + nl + xl + cl;
    }
    return async chemin => {
      const f = fichiers[chemin];
      if (!f) return null;
      const data = new Uint8Array(buf, f.lo + 30 + dv.getUint16(f.lo + 26, true) + dv.getUint16(f.lo + 28, true), f.csz);
      if (f.meth === 0) return td.decode(data);
      if (!("DecompressionStream" in window)) throw new Error("Navigateur trop ancien pour lire les fichiers Excel.");
      return td.decode(await flux(data, new DecompressionStream("deflate-raw")));
    };
  }

  /* ---------- Écriture ---------- */
  function styles() {
    const bord = `<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>`;
    const xf = (police, fond, format = 49) => `<xf numFmtId="${format}" fontId="${police}" fillId="${fond}" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
      + `<numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts>`
      + `<fonts count="3"><font><sz val="10"/><name val="Calibri"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><i/><sz val="10"/><color rgb="FF595959"/><name val="Calibri"/></font></fonts>`
      + `<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F3864"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEEF2F7"/><bgColor indexed="64"/></patternFill></fill></fills>`
      + `<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${bord}</borders>`
      + `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`
      + `<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(1, 2)}${xf(0, 0)}${xf(2, 3)}${xf(0, 0, 164)}</cellXfs>`
      + `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles><\/styleSheet>`;   // « <\/ » : pas de fin de balise style dans le livrable
  }
  // Feuille : { nom, lignes: [[valeur | { v, s, n }]], largeurs: [n], listes: [{ col (0 = A), valeurs: [] | plage: "Listes!$A$2:$A$9", strict }],
  //           info: [index de colonnes grisées], cachee }
  // Les cellules sont au format Texte (numFmt 49) : Excel garde « 0012 », « 10.1.1.0/24 » ou « 1;254 » tels quels ; n : nombre (dates).
  // Liste stricte : Excel refuse une autre valeur ; sinon il avertit seulement. Une plage évite la limite de 255 caractères des valeurs.
  function feuille(f) {
    const nc = Math.max(1, ...f.lignes.map(l => l.length)), info = new Set(f.info || []);
    const cellule = (c, i, j) => {
      const o = c !== null && typeof c === "object" ? c : { v: c };
      const ref = lettre(j + 1) + (i + 1), s = ` s="${o.s ?? (i === 0 ? STYLE.titre : info.has(j) ? STYLE.info : STYLE.cellule)}"`, v = o.v;
      if (v === "" || v === null || v === undefined) return `<c r="${ref}"${s}/>`;
      if (o.n && Number.isFinite(+v)) return `<c r="${ref}"${s}><v>${+v}</v></c>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`;
    };
    const donnees = f.lignes.map((l, i) => `<row r="${i + 1}">${l.map((c, j) => cellule(c, i, j)).join("")}</row>`).join("");
    const listes = (f.listes || []).filter(l => l.plage || (l.valeurs && l.valeurs.length)).map(l => {
      const col = lettre(l.col + 1), formule = l.plage || `"${l.valeurs.map(v => String(v).replace(/[",]/g, " ")).join(",")}"`;
      const msg = l.strict ? `errorStyle="stop" errorTitle="Valeur hors liste" error="Choisissez une valeur de la liste : une autre valeur serait rejetée à l'import."`
        : `errorStyle="warning" errorTitle="Valeur hors liste" error="Cette valeur n'est pas dans la liste : elle sera signalée à l'import."`;
      return `<dataValidation type="list" ${msg} allowBlank="1" showErrorMessage="1" sqref="${col}2:${col}${LIGNES_LISTES + 1}"><formula1>${X(formule)}</formula1></dataValidation>`;
    });
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
      + `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
      + `<cols>${Array.from({ length: nc }, (_, j) => `<col min="${j + 1}" max="${j + 1}" width="${(f.largeurs && f.largeurs[j]) || 18}" customWidth="1"/>`).join("")}</cols>`
      + `<sheetData>${donnees}</sheetData>${f.lignes.length > 1 ? `<autoFilter ref="A1:${lettre(nc)}${f.lignes.length}"/>` : ""}`
      + (listes.length ? `<dataValidations count="${listes.length}">${listes.join("")}</dataValidations>` : "") + `</worksheet>`;
  }
  // Classeur à partir de feuilles (voir feuille) ; titre et signature dans les propriétés du fichier
  function classeur(feuilles, { titre = "", signature = "" } = {}) {
    const nom = f => X(f.nom.replace(/[[\]:*?/\\]/g, " ").slice(0, 31));
    const fichiers = [
      ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>${feuilles.map((f, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
      ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`],
      ["docProps/core.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${X(titre)}</dc:title><dc:creator>@WerbHat</dc:creator><dc:description>${X(signature)}</dc:description><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0, 19)}Z</dcterms:created></cp:coreProperties>`],
      ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${NS_R}"><sheets>${feuilles.map((f, i) => `<sheet name="${nom(f)}" sheetId="${i + 1}"${f.cachee ? ` state="hidden"` : ""} r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`],
      ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${feuilles.map((f, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${feuilles.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ["xl/styles.xml", styles()],
      ...feuilles.map((f, i) => [`xl/worksheets/sheet${i + 1}.xml`, feuille(f)]),
    ];
    return zip(fichiers);
  }

  /* ---------- Lecture ---------- */
  // Renvoie { noms: [feuilles], lignes(nom) → [[valeur]] } ; lignes[0] = ligne 1, lignes[i][0] = colonne A
  async function lire(fichier) {
    if (fichier.size > TAILLE_MAX) throw new Error("Classeur trop volumineux (20 Mo au plus).");
    const texte = unzip(await fichier.arrayBuffer()), P = new DOMParser();
    const xml = async chemin => { const t = await texte(chemin); return t ? P.parseFromString(t, "application/xml") : null; };
    const balises = (d, t) => [...d.getElementsByTagNameNS("*", t)];
    const wb = await xml("xl/workbook.xml"), rel = await xml("xl/_rels/workbook.xml.rels");
    if (!wb || !rel) throw new Error("Ce fichier n'est pas un classeur Excel valide (.xlsx).");
    const cibles = {};
    balises(rel, "Relationship").forEach(r => { cibles[r.getAttribute("Id")] = r.getAttribute("Target"); });
    const feuilles = {};
    balises(wb, "sheet").forEach(s => {
      const t = cibles[s.getAttributeNS(NS_R, "id") || s.getAttribute("r:id")];
      if (t) feuilles[s.getAttribute("name")] = t.startsWith("/") ? t.slice(1) : "xl/" + t;
    });
    const partages = [], ss = await xml("xl/sharedStrings.xml");
    if (ss) balises(ss, "si").forEach(si => partages.push(balises(si, "t").filter(t => t.parentNode.localName !== "rPh").map(t => t.textContent).join("")));
    async function lignes(nom) {
      const d = feuilles[nom] ? await xml(feuilles[nom]) : null;
      if (!d) return [];
      const out = [];
      balises(d, "c").forEach(c => {
        const m = /^([A-Z]+)(\d+)$/.exec(c.getAttribute("r") || "");
        if (!m) return;
        const t = c.getAttribute("t"), v = balises(c, "v")[0];
        let val = "";
        if (t === "s") val = v ? partages[+v.textContent] ?? "" : "";
        else if (t === "inlineStr") val = balises(c, "t").map(x => x.textContent).join("");
        else if (t === "b") val = v ? v.textContent === "1" : "";
        else if (t === "d") val = v ? v.textContent.slice(0, 10) : "";   // date ISO (rare : LibreOffice, saisie stricte)
        else if (t !== "e" && v) val = t === "str" || isNaN(+v.textContent) ? v.textContent : +v.textContent;
        (out[+m[2] - 1] = out[+m[2] - 1] || [])[numero(m[1]) - 1] = val;
      });
      return out;
    }
    return { noms: Object.keys(feuilles), lignes };
  }

  return Object.freeze({ TYPE, STYLE, classeur, lire, lettre, date, isoDe, zip });
})();

  const PROC_TEXTES = [["objet", "Objet"], ["perimetre", "Domaine d'application"], ["refsN", "Références"], ["declencheur", "Déclencheurs"], ["lien", "Lien vers le document SMSI"]];

  /* ===================================================== état (en mémoire seulement) */
  let S = null, ENV = { creeLe: "", journal: [] }, LIAISON = {}, fichier = { poignee: null, nom: "", modifie: null }, dirty = false, user = "";
  let vue = "tdb";
  const ui = { pid: "", redige: false, jq: "", sel: {}, arch: {} };   // sel : lignes cochées par table (TRV-4) ; arch : archivées affichées
  const SMSI = { sites: {}, pubGroupe: null, err: "" };

  /* ===================================================== utilitaires */
  const $ = s => document.querySelector(s);
  const auj = () => new Date().toISOString().slice(0, 10);
  const frDate = v => { if (!v) return ""; const d = new Date(v); if (isNaN(d)) return String(v); const p = n => String(n).padStart(2, "0"); return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`; };
  const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const opt = (vals, cur, vide) => (vide !== undefined ? `<option value="">${esc(vide)}</option>` : "") + vals.map(v => `<option${String(v) === String(cur ?? "") ? " selected" : ""}>${esc(v)}</option>`).join("");
  const badge = (t, c = "") => `<span class="badge ${c}">${esc(t)}</span>`;
  function toast(msg, type = "") { const el = document.createElement("div"); el.className = "toast " + type; el.textContent = msg; $("#toasts").appendChild(el); setTimeout(() => el.remove(), type === "err" ? 7000 : 3500); }
  function confirmer(html, ok = "Confirmer") {
    return new Promise(res => {
      const back = document.createElement("div"); back.className = "modal-back";
      back.innerHTML = `<div class="modal" role="dialog"><p>${html}</p><div class="actions"><button data-x="non">Annuler</button><button class="primary" data-x="oui">${esc(ok)}</button></div></div>`;
      back.addEventListener("click", e => { const x = e.target.dataset.x; if (x) { back.remove(); res(x === "oui"); } });
      $("#modal-root").appendChild(back);
    });
  }
  function prochainId(liste, prefixe) {
    let n = 0; liste.forEach(x => { const m = new RegExp("^" + prefixe + "(\\d+)$").exec(x.id || ""); if (m) n = Math.max(n, +m[1]); });
    return prefixe + String(n + 1).padStart(prefixe === "A-" ? 3 : 2, "0");
  }
  function journaliser(action, objet, element = "", champ = "", avant = "", apres = "") {
    ENV.journal.push({ date: new Date().toISOString(), par: user, action, objet, element: String(element), champ, avant: String(avant ?? ""), apres: String(apres ?? "") });
  }
  function marquer() { dirty = true; renderTopbar(); }

  /* ===================================================== modèle */
  function vide() {
    return { organisation: { nom: "", perimetre: "", politique: { titre: "Politique de sécurité des systèmes d'information", reference: "", version: "1.0", dateApprobation: "", approbateur: "", prochaineRevue: "", lien: "", resume: "" } },
      roles: [], mesures: [], prestataires: [], procedures: [], etapes: [], revues: [], actions: [],
      archives: {}, largeurs: {} };   // archives : lignes archivées par table, avec { le, par } (TRV-4) ; largeurs : colonnes (TRV-6)
  }
  const str = v => (v === null || v === undefined) ? "" : String(v).slice(0, 4000);
  function normaliser(d) {
    const b = vide();
    if (!d || typeof d !== "object") return b;
    const o = d.organisation || {};
    b.organisation.nom = str(o.nom); b.organisation.perimetre = str(o.perimetre);
    Object.keys(b.organisation.politique).forEach(k => { if (o.politique && o.politique[k] !== undefined) b.organisation.politique[k] = str(o.politique[k]); });
    const champs = cols => cols.map(c => c.f);
    const ligne = (k, T, x) => {
      const r = {};
      champs(T.cols).forEach(f => { const c = T.cols.find(c => c.f === f); r[f] = c.t === "bool" ? x[f] === true : c.t === "liste" ? (Array.isArray(x[f]) ? x[f].map(str).filter(Boolean) : []) : str(x[f]); });
      if (k === "procedures") { r.id = str(x.id) || uid(); PROC_TEXTES.forEach(([f]) => r[f] = str(x[f])); }
      if (x.archive && typeof x.archive === "object") r.archive = { le: str(x.archive.le), par: str(x.archive.par) };
      return r;
    };
    const lignes = (k, l) => (Array.isArray(l) ? l : []).filter(x => x && typeof x === "object").map(x => ligne(k, TABLES[k], x));
    for (const k of Object.keys(TABLES)) b[k] = lignes(k, d[k]);
    const ar = d.archives && typeof d.archives === "object" ? d.archives : {};
    Object.keys(TABLES).forEach(k => { const l = lignes(k, ar[k]); if (l.length) b.archives[k] = l; });
    const lg = d.largeurs && typeof d.largeurs === "object" ? d.largeurs : {};
    Object.keys(TABLES).forEach(k => { const l = lg[k]; if (l && typeof l === "object") { const o = Object.fromEntries(Object.entries(l).filter(([, w]) => +w >= 40 && +w <= 2000).map(([c, w]) => [c, Math.round(+w)])); if (Object.keys(o).length) b.largeurs[k] = o; } });
    const pids = new Set([...b.procedures, ...(b.archives.procedures || [])].map(p => p.id));   // étapes d'une procédure archivée conservées
    b.etapes = (Array.isArray(d.etapes) ? d.etapes : []).filter(x => x && pids.has(x.pid)).map(x => Object.assign({ id: str(x.id) || uid(), pid: x.pid }, Object.fromEntries(ETAPE_COLS.map(c => [c.f, str(x[c.f])]))));
    return b;
  }

  /* ===================================================== fichier */
  function toEnvelope() {
    const env = WerbSocle.enveloppe(S, { utilisateur: user, base: { meta: ENV.creeLe ? { creeLe: ENV.creeLe } : {}, journal: ENV.journal }, groupeId: LIAISON.groupeId, portee: LIAISON.portee });
    ENV.creeLe = env.meta.creeLe;
    return env;
  }
  function charger(texte, f = {}) {
    const env = WerbSocle.lireEnveloppe(texte);
    S = normaliser(env.data);
    const m = env.meta || {};
    LIAISON = m.portee === "groupe" ? { portee: "groupe", groupeId: m.groupeId } : {};
    ENV = { creeLe: m.creeLe || "", journal: env.journal || [] };
    fichier = { poignee: f.poignee || null, nom: f.nom || "", modifie: f.modifie || null };
    dirty = false; vue = "tdb"; ui.pid = "";
    journaliser("Ouverture", "Base", fichier.nom);
    dirty = false;
    render();
  }
  async function ouvrir() {
    if (dirty && !(await confirmer("Des modifications ne sont pas enregistrées. Ouvrir une autre base quand même ?", "Ouvrir"))) return;
    try { const f = await WerbSocle.ouvrir(); charger(f.texte, f); toast(f.lecture ? "Base ouverte en lecture seule." : "Base ouverte.", "ok"); }
    catch (e) { if (e.name !== "AbortError") toast("Ouverture impossible : " + e.message, "err"); }
  }
  async function enregistrer(sous = false) {
    if (!S) return;
    let modifie = sous ? null : fichier.modifie;
    const nomSuggere = `Gouvernance_${(S.organisation.nom || "GROUPE").replace(/[^\w-]+/g, "_")}${WERB.extension}`;
    for (;;) {
      try {
        journaliser("Enregistrement", "Base", fichier.nom || nomSuggere);
        const r = await WerbSocle.enregistrer(toEnvelope(), { poignee: sous ? null : fichier.poignee, modifie, nomSuggere });
        fichier = { poignee: r.poignee, nom: r.poignee ? r.poignee.name : nomSuggere, modifie: r.modifie };
        break;
      } catch (e) {
        ENV.journal.pop();
        if (e.code === "CONFLIT" && await confirmer("Le fichier a été modifié par ailleurs depuis son ouverture. L'écraser avec votre version ?", "Écraser")) { modifie = null; continue; }
        if (e.name !== "AbortError") toast("Enregistrement impossible : " + e.message, "err");
        return false;
      }
    }
    dirty = false; render(); toast("Base enregistrée.", "ok");
    return true;
  }
  async function fermer() {
    if (dirty && !(await confirmer("Des modifications ne sont pas enregistrées et seront perdues. Fermer la base ?", "Fermer"))) return;
    S = null; dirty = false; LIAISON = {}; ENV = { creeLe: "", journal: [] }; fichier = { poignee: null, nom: "", modifie: null };
    E.fermer(); SMSI.sites = {}; SMSI.pubGroupe = null;
    WerbSocle.verrou.liberer(); WerbSocle.purger(); render();
  }

  /* ===================================================== import des procédures depuis WerbMap */
  function importerWerbMap(texte, nom) {
    let j;
    try { j = JSON.parse(texte); } catch (e) { throw new Error("Fichier illisible (JSON invalide)."); }
    const inv = j && j.famille === "WERBSMSI" && j.format === "WERBMAP" ? j.data && j.data.inventaire : j && j.format === "werbhat-vlan-ipam" ? j.data : null;
    if (!inv) throw new Error("Ce fichier n'est pas une base WerbMap.");
    const codes = new Set(S.procedures.map(p => p.code.trim().toUpperCase()));
    let ajout = 0, ignore = 0, etapes = 0;
    (inv.procs || []).forEach(p => {
      if (!p || codes.has(String(p.code || "").trim().toUpperCase())) { ignore++; return; }
      const id = uid();
      S.procedures.push(Object.assign({ id }, Object.fromEntries([...TABLES.procedures.cols.map(c => c.f), ...PROC_TEXTES.map(([f]) => f)].map(f => [f, str(p[f])]))));
      (inv.proc || []).filter(s => s && s.pid === p.id).forEach(s => { S.etapes.push(Object.assign({ id: uid(), pid: id }, Object.fromEntries(ETAPE_COLS.map(c => [c.f, str(s[c.f])])))); etapes++; });
      ajout++;
    });
    journaliser("Import", "Procédures", nom, "", "", `${ajout} procédure(s), ${etapes} étape(s) depuis WerbMap ; ${ignore} déjà présente(s)`);
    marquer();
    return { ajout, ignore, etapes };
  }

  /* ===================================================== intégration WerbSMSI */
  const espaceOk = () => E.ouvert && LIAISON.portee === "groupe" && LIAISON.groupeId === E.groupe.groupeId;
  async function smsiCharger() {
    SMSI.err = ""; SMSI.sites = {};
    try {
      SMSI.pubGroupe = await E.publications("groupe");
      for (const s of E.groupe.sites || []) {
        const info = await E.site(s.code);
        SMSI.sites[s.code] = info ? { accessible: true, pub: await E.publications("site", s.code) } : { accessible: false };
      }
    } catch (e) { SMSI.err = e.message; }
  }
  const objetsSite = (code, nom) => (((SMSI.sites[code] || {}).pub || {}).objets || {})[nom] || [];
  const sitesLisibles = () => (E.groupe ? E.groupe.sites || [] : []).filter(s => (SMSI.sites[s.code] || {}).accessible);
  function etatSocle(code, id) {
    const syn = objetsSite(code, "syntheseConformite");
    if (!syn.length) return ["pas de synthèse", ""];
    return syn.some(s => (s.mesuresSocleNonAppliquees || []).includes(id)) ? ["non appliquée", "b-ko"] : ["appliquée", "b-ok"];
  }
  // Indicateurs de formation du groupe (groupe:formations, WerbAcademie) : objet unique, aucun nom ; lus dans l'espace
  const formationsGroupe = () => { const f = ((SMSI.pubGroupe || {}).objets || {}).formations; return espaceOk() && f && !Array.isArray(f) && f.global ? f : null; };
  const libSiteF = c => c === "GROUPE" ? "Groupe (siège)" : c || "Sans site";
  const pctF = x => x && x.taux !== null && x.taux !== undefined ? x.taux + " %" : "—";
  const texteFormation = f => `Formation et sensibilisation (WerbAcademie, indicateurs du ${frDate(f.majLe)}) : ${pctF(f.global)} des formations exigées à jour pour le groupe`
    + ` (${(f.parSite || []).map(x => `${libSiteF(x.site)} ${pctF(x)}`).join(", ")}) ; ${f.global.retard} formation(s) en retard, ${f.global.jamais} jamais suivie(s) ;`
    + ` dirigeants à jour : ${f.dirigeants ? `${f.dirigeants.personnesAJour}/${f.dirigeants.personnes}` : "—"} ; ${f.sessions12Mois ?? 0} session(s) sur les douze derniers mois.`;
  function carteFormation(f) {
    return `<div class="card" data-formations><h2>Formation et sensibilisation</h2><p class="small muted">Indicateurs publiés par WerbAcademie le ${esc(frDate(f.majLe))} : formations exigées selon la population de chaque personne, sans aucun nom.</p>
      <table class="t"><thead><tr><th>Périmètre</th><th>Personnes</th><th>Formations exigées</th><th>À jour</th><th>À renouveler</th><th>En retard</th><th>Jamais</th><th>Taux à jour</th></tr></thead><tbody>
      ${[...(f.parSite || []).map(x => [libSiteF(x.site), x]), ["Groupe", f.global]].map(([l, x]) => `<tr${l === "Groupe" ? ' class="b"' : ""}><td>${esc(l)}</td><td>${esc(x.personnes)}</td><td>${esc(x.obligations)}</td><td>${esc(x.ajour)}</td><td>${esc(x.arenouveler)}</td>
        <td>${x.retard ? badge(x.retard, "b-ko") : "0"}</td><td>${x.jamais ? badge(x.jamais, "b-ko") : "0"}</td><td>${esc(pctF(x))}</td></tr>`).join("")}</tbody></table>
      <p class="small">Dirigeants à jour (NIS2, article 20) : <b>${esc(f.dirigeants ? f.dirigeants.personnesAJour : 0)} / ${esc(f.dirigeants ? f.dirigeants.personnes : 0)}</b> · sessions des douze derniers mois : <b>${esc(f.sessions12Mois ?? 0)}</b></p></div>`;
  }
  // Revue de direction : la plus récente (date la plus grande, sinon la dernière saisie)
  const derniereRevue = () => S.revues.slice().sort((a, b) => String(a.date || "").localeCompare(String(b.date || ""))).pop();
  function objetsPublies() {
    return {
      mesuresSocle: S.mesures.map(m => ({ id: m.id, titre: m.titre, domaine: m.domaine, obligatoire: m.obligatoire, references: m.references })),
      roles: S.roles.map(r => ({ id: r.id, nom: r.nom, niveau: NIVEAUX.includes(r.niveau) ? r.niveau : "groupe", missions: r.missions })),
      prestataires: S.prestataires.map(p => ({ id: p.id, nom: p.nom, role: p.role, contrat: p.contrat })),
    };
  }

  /* ===================================================== vues */
  const VUES = {};
  // Menu latéral commun WerbSMSI (socle) : une catégorie = un groupe de vues, repliable
  const MENU = [
    { g: "pilot", i: "📊", l: "Tableau de bord", c: "bleu", t: [["tdb", "Tableau de bord"]] },
    { g: "cadre", i: "🏛️", l: "Cadre", c: "violet", t: [["politique", "Politique et périmètre"], ["roles", "Rôles"], ["mesures", "Socle de mesures"], ["prestataires", "Prestataires cadre"]] },
    { g: "doc", i: "📘", l: "Documentation", c: "cyan", t: [["procedures", "Procédures"], ["etapes", "Fiches de procédure"]] },
    { g: "suivi", i: "🎯", l: "Pilotage", c: "ambre", t: [["revues", "Revues de direction"], ["actions", "Plan d'actions"]] },
    { g: "adm", i: "⚙️", l: "Base", c: "ardoise", t: [["werbsmsi", "Intégration WerbSMSI"], ["journal", "Journal"], ["apropos", "À propos"]] },
    { g: "aide", i: "❓", l: "Aide", c: "olive", t: [["aide", "Guide du module"], ...WerbGuides.entrees()] },
  ];
  // Guides d'accompagnement (charte §7.4) : guides/*.md intégrés au livrable, lus par WerbGuides
  const lienGuide = id => `data-nav="${id}"`;
  const menu = WerbSocle.menu($("#sidebar"), MENU, { surNav: id => { vue = id; render(); $("#main").scrollTop = 0; } });

  function alertes() {
    const a = [], j = auj(), p = S.organisation.politique;
    if (p.prochaineRevue && p.prochaineRevue < j) a.push(["b-ko", "Politique", `Revue de la politique échue depuis le ${frDate(p.prochaineRevue)}`]);
    if (!p.dateApprobation) a.push(["b-warn", "Politique", "Politique non approuvée (date d'approbation vide)"]);
    S.procedures.filter(x => x.statut !== "Obsolète" && x.revue && x.revue < j).forEach(x => a.push(["b-ko", "Procédure " + x.code, `Revue échue depuis le ${frDate(x.revue)}`]));
    S.procedures.filter(x => x.statut === "Validée" && !x.approb).forEach(x => a.push(["b-warn", "Procédure " + x.code, "Validée sans approbateur"]));
    S.procedures.filter(x => !S.etapes.some(s => s.pid === x.id)).forEach(x => a.push(["b-warn", "Procédure " + (x.code || x.titre), "Aucune étape décrite"]));
    S.actions.filter(x => x.echeance && x.echeance < j && !["Terminée", "Abandonnée"].includes(x.statut)).forEach(x => a.push(["b-ko", "Action " + x.id, `Échéance dépassée (${frDate(x.echeance)})`]));
    S.mesures.filter(m => !m.references.length).forEach(m => a.push(["b-warn", "Mesure " + m.id, "Aucune référence normative"]));
    S.roles.filter(r => r.niveau === "groupe" && !r.titulaire).forEach(r => a.push(["b-warn", "Rôle " + r.id, "Rôle du groupe sans titulaire"]));
    return a;
  }

  VUES.tdb = () => {
    const al = alertes(), ouvertes = S.actions.filter(x => !["Terminée", "Abandonnée"].includes(x.statut));
    const kpi = (v, l, alerte = false) => `<div class="kpi${alerte ? " alerte" : ""}"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`;
    let h = `<h1>${esc(S.organisation.nom || "Gouvernance du SMSI")}</h1><p class="sub">Tableau de bord du groupe</p>
      <div class="kpis">${kpi(S.mesures.length, `mesures du socle (${S.mesures.filter(m => m.obligatoire).length} obligatoires)`)}${kpi(S.roles.length, "rôles")}
      ${kpi(`${S.procedures.filter(p => p.statut === "Validée").length} / ${S.procedures.length}`, "procédures validées")}${kpi(ouvertes.length, "actions ouvertes")}
      ${kpi(al.filter(x => x[0] === "b-ko").length, "alertes", al.some(x => x[0] === "b-ko"))}</div>
      <div class="card"><h2>Points d'attention</h2>${al.length ? `<table class="t"><tbody>${al.map(([c, o, m]) => `<tr><td style="width:120px">${badge(c === "b-ko" ? "à traiter" : "à vérifier", c)}</td><td style="width:220px">${esc(o)}</td><td>${esc(m)}</td></tr>`).join("")}</tbody></table>` : `<p class="muted">Aucun point d'attention.</p>`}</div>`;
    if (!espaceOk()) return h + `<div class="infobox">Ouvrez l'espace WerbSMSI et rattachez la base au groupe (menu <b>Intégration WerbSMSI</b>) pour voir l'application du socle et la conformité de chaque site.</div>`;
    const sites = sitesLisibles(), mes = S.mesures;
    h += `<div class="card"><h2>Application du socle par site</h2><p class="small muted">D'après les synthèses de conformité publiées par les sites (WerbIEC62443). « + Action » ajoute l'écart au plan d'actions.</p>
      ${mes.length && sites.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Mesure</th>${sites.map(s => `<th>${esc(s.code)}</th>`).join("")}</tr></thead><tbody>
      ${mes.map(m => `<tr><td><b>${esc(m.id)}</b> ${esc(m.titre)}${m.obligatoire ? ` <span class="small muted">(obligatoire)</span>` : ""}</td>${sites.map(s => { const [l, c] = etatSocle(s.code, m.id);
        const existe = S.actions.some(a => a.site === s.code && a.titre.startsWith(`Mettre en œuvre ${m.id} `));
        return `<td>${badge(l, c)}${c === "b-ko" ? (existe ? ` <span class="small muted">action créée</span>` : ` <button class="small edit" data-act="actionSocle" data-m="${esc(m.id)}" data-s="${esc(s.code)}">+ Action</button>`) : ""}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`
      : `<p class="muted">Aucune mesure ou aucun site lisible.</p>`}</div>`;
    const conf = sites.flatMap(s => objetsSite(s.code, "syntheseConformite").map(c => ({ s: s.code, c })));
    const rq = sites.flatMap(s => objetsSite(s.code, "syntheseRisques").map(r => ({ s: s.code, r })));
    h += `<div class="grid g2"><div class="card"><h2>Conformité par site</h2>${conf.length ? `<table class="t"><thead><tr><th>Site</th><th>Référentiel</th><th>Périmètre</th><th>Taux</th><th>Écarts</th></tr></thead><tbody>
      ${conf.map(({ s, c }) => `<tr><td>${esc(s)}</td><td>${esc(c.referentiel)}</td><td>${esc(c.perimetre || "")}</td><td>${esc(c.taux)} %</td><td>${esc(c.ecartsMajeurs ?? "")}</td></tr>`).join("")}</tbody></table>` : `<p class="muted">Aucune synthèse publiée.</p>`}</div>
      <div class="card"><h2>Risques résiduels des sites</h2>${rq.length ? `<table class="t"><thead><tr><th>Site</th><th>Risque</th><th>Résiduel</th><th>Traitement</th></tr></thead><tbody>
      ${rq.sort((a, b) => (b.r.niveauResiduel ?? b.r.niveauBrut) - (a.r.niveauResiduel ?? a.r.niveauBrut)).slice(0, 10).map(({ s, r }) => `<tr><td>${esc(s)}</td><td>${esc(r.libelle)}</td><td>${esc(r.niveauResiduel ?? r.niveauBrut)}</td><td>${esc(r.traitement || "")}</td></tr>`).join("")}</tbody></table>` : `<p class="muted">Aucune synthèse publiée.</p>`}</div></div>`;
    const fo = formationsGroupe();
    h += fo ? carteFormation(fo) : `<div class="card"><h2>Formation et sensibilisation</h2><p class="muted">Aucun indicateur de formation publié (WerbAcademie, niveau groupe › Intégration WerbSMSI › Publier).</p></div>`;
    return h;
  };

  VUES.politique = () => {
    const o = S.organisation, p = o.politique;
    const fld = (k, l, t = "text") => `<div><label class="f">${esc(l)}</label>${t === "area" ? `<textarea data-o="${k}">${esc(p[k])}</textarea>` : `<input type="${t}" data-o="${k}" value="${esc(p[k])}">`}</div>`;
    return `<h1>Politique et périmètre</h1><p class="sub">Document de politique du SMSI (référence, approbation, revue) et périmètre du groupe.</p>
      <div class="card"><div class="grid g3"><div><label class="f">Organisation (groupe)</label><input data-org="nom" value="${esc(o.nom)}"></div></div>
      <label class="f">Périmètre du SMSI</label><textarea data-org="perimetre">${esc(o.perimetre)}</textarea></div>

      <button class="choice" data-act="nouveau"><b>✨ Nouvelle base</b><span class="small muted">Politique, rôles, socle, procédures, revues, plan d'actions.</span></button>
      <button class="choice" data-act="exemple"><b>🧪 Base d'exemple</b><span class="small muted">Groupe fictif : 5 rôles, 8 mesures du socle, procédures, revues, plan d'actions.</span></button></div>
      ${WerbSocle.accesDirect ? "" : `<div class="warnbox">Mode compatibilité : l'enregistrement produit un téléchargement. Utilisez Microsoft Edge.</div>`}
      <div class="infobox small">Rien n'est conservé dans le navigateur : la base est un fichier, redemandé à chaque session.</div>
      ${WerbGuides.guides().length ? `<h2 style="margin-top:22px">📚 Guides d'accompagnement</h2>${WerbGuides.cartes(lienGuide)}` : ""}</div>`;
  }
  function renderTopbar() {
    $("#tb-base").textContent = S ? `${S.organisation.nom || "Base de gouvernance"}${fichier.nom ? " — " + fichier.nom : ""}` : "Aucune base ouverte";
    $("#tb-status").innerHTML = S ? `${user ? `<span class="pill">👤 ${esc(user)}</span>` : ""}${LIAISON.portee ? `<span class="pill">Groupe</span>` : ""}${dirty ? `<span class="pill dirty">● Non enregistré</span>` : `<span class="pill">✓ Enregistré</span>`}` : "";
    // Bandeau commun (charte §7.6, socle 1.8.0) : 📊 Export Excel = toute la base, 🖨 PDF = impression (socle)
    $("#tb-actions").innerHTML = S ? WerbSocle.bandeau.boutons(["ouvrir", "enregistrer", "enregistrerSous", "exportExcel", "pdf", "fermer"]) : "";
  }
  function renderNav() {
    const sig = `<footer class="sig"><b>${esc(WERB.produit)}</b><br>${esc(WERB.signature)}<br>v${esc(WERB.version)} · ${esc(window.BUILD_DATE)}</footer>`;
    if (!S) { menu.rendre({ vide: true, pied: sig }); return; }
    const cnt = { roles: S.roles.length, mesures: S.mesures.length, prestataires: S.prestataires.length, procedures: S.procedures.length, revues: S.revues.length, actions: S.actions.filter(a => !["Terminée", "Abandonnée"].includes(a.statut)).length };
    menu.rendre({ vide: false, actif: vue, compteurs: cnt, pied: sig });
  }
  function render() {
    renderTopbar(); renderNav();
    const m = $("#main"), haut = m.scrollTop;
    m.innerHTML = S ? (VUES[vue] || VUES.tdb)()
      : user && WerbGuides.trouver(vue) ? WerbGuides.vue(vue, { lien: lienGuide, retour: `<button data-nav="accueil">← Accueil</button>` }) : accueil();
    if (S && TABLES[vue]) WerbSocle.tables.redimensionner(m.querySelector("table[data-table]"), S.largeurs[vue] || {}, (col, w) => largeur(vue, col, w));
    m.scrollTop = haut;
    const n = $("#nomUtil"); if (n) n.focus();
  }

  /* ===================================================== actions */
  /* ===================================================== export Excel de toute la base (bandeau commun, charte §7.6) */
  // Feuille Informations puis une feuille par table ; dates AAAA-MM-JJ en dates Excel, listes jointes, booléens OUI / NON, jamais de formule
  const celXl = v => Array.isArray(v) ? v.map(x => x && typeof x === "object" ? JSON.stringify(x) : x).join(", ") : typeof v === "boolean" ? (v ? "OUI" : "NON")
    : v && typeof v === "object" ? JSON.stringify(v) : /^\d{4}-\d{2}-\d{2}$/.test(String(v ?? "")) ? WerbXlsx.date(String(v)) : String(v ?? "");
  // cols : [champ, ou fonction (ligne) → valeur ; titre ; largeur]
  const feuilleXl = (nom, cols, lignes) => ({ nom, largeurs: cols.map(c => c[2] || 22), lignes: [cols.map(c => c[1]), ...lignes.map(r => cols.map(c => celXl(typeof c[0] === "function" ? c[0](r) : r[c[0]])))] });
  async function exportBase(nomBase, info, feuilles) {
    const T1 = v => ({ v, s: WerbXlsx.STYLE.titre }), noms = new Set(), jour = new Date().toISOString().slice(0, 10);
    feuilles.forEach(f => { const base = f.nom.replace(/[[\]:*?/\\]/g, " "); let n = base.slice(0, 31), k = 2; while (noms.has(n.toLowerCase())) n = base.slice(0, 28) + " " + k++; noms.add(n.toLowerCase()); f.nom = n; });
    const tete = { nom: "Informations", largeurs: [32, 70], lignes: [[T1("Rubrique"), T1("Valeur")], ...info.map(([l, v]) => [l, celXl(v)]),
      ["Produit", WERB.ligne], ["Date de l'export", WerbXlsx.date(jour)], ["Exporté par", user], [], [T1("Feuille"), T1("Lignes")], ...feuilles.map(f => [f.nom, String(f.lignes.length - 1)])] };
    try {
      const blob = await WerbXlsx.classeur([tete, ...feuilles], { titre: `${WERB.produit} – ${nomBase}`, signature: WERB.ligne });
      WerbSocle.telecharger(blob, `${String(nomBase || WERB.produit).replace(/[^\w-]+/g, "_")}_${WERB.produit}_${jour}.xlsx`, WerbXlsx.TYPE);
      journaliser("Export", "Base", nomBase, "", "", "Excel (toute la base)"); marquer();
    } catch (e) { toast("Export Excel impossible : " + e.message, "err"); }
  }

  const ACTIONS = {
    // Outils des tables (charte §7.7)
    selArchiver() { selAppliquer("archiver"); },
    selDesarchiver() { selAppliquer("desarchiver"); },
    async selSupprimer() {
      const n = (ui.sel[vue] || new Set()).size;
      if (!n || !(await confirmer(`Supprimer définitivement <b>${n}</b> ligne(s) de « ${esc(TABLES[vue].titre)} » ?${vue === "procedures" ? "<br>Leurs fiches (étapes) sont supprimées aussi." : ""}<br><span class="small">Pour les garder hors publication et alertes sans les perdre, utilisez plutôt « Archiver ».</span>`, "Supprimer"))) return;
      selAppliquer("supprimer");
    },
    selVider() { ui.sel[vue] = new Set(); render(); },
    remplacer(el) {
      const key = el.dataset.t, T = TABLES[key];
      const cols = T.cols.filter(c => ["text", "area"].includes(c.t) && !["id", "code"].includes(c.f)).map(c => ({ id: c.f, libelle: c.l }));
      WerbSocle.tables.remplacer({ titre: `Chercher / remplacer · ${T.titre}`, colonnes: cols, lignes: S[key], lire: (r, f) => r[f], nomLigne: r => nomLigneT(key, r),
        surAppliquer: ch => { ch.forEach(({ ligne, col, avant, apres }) => { ligne[col] = apres; journaliser("Modification", T.obj, nomLigneT(key, ligne), (T.cols.find(c => c.f === col) || {}).l || col, avant, apres + " (chercher / remplacer)"); }); marquer(); render(); toast(`${ch.length} cellule(s) modifiée(s).`, "ok"); } });
    },
    largeursDefaut(el) { const key = el.dataset.t; delete S.largeurs[key]; journaliser("Modification", "Présentation", TABLES[key].titre, "Largeurs des colonnes", "", "automatiques"); marquer(); render(); },
    exportExcel() {   // bandeau commun : toute la base
      const o = S.organisation, pol = o.politique || {};
      exportBase(o.nom || "Groupe", [["Organisation", o.nom], ["Périmètre", o.perimetre], ["Politique", [pol.titre, pol.reference, pol.version && "v" + pol.version].filter(Boolean).join(" · ")], ["Base", fichier.nom || "(non enregistrée)"]],
        [...Object.entries(TABLES).map(([k, T]) => feuilleXl(T.titre, T.cols.map(c => [c.f, c.l]), S[k] || [])),
          feuilleXl("Fiches de procédure", [[r => ((S.procedures || []).find(p => p.id === r.pid) || {}).code || "", "Procédure", 14], ...ETAPE_COLS.map(c => [c.f, c.l])], S.etapes || [])]);
    },
    entrer() { const v = $("#nomUtil").value.trim(); if (!v) { toast("Saisissez votre nom.", "err"); return; } user = v; WerbSocle.verrou.identifier(v); render(); },
    nouveau() { S = vide(); LIAISON = {}; ENV = { creeLe: "", journal: [] }; fichier = { poignee: null, nom: "", modifie: null }; journaliser("Création", "Base"); vue = "politique"; dirty = true; render(); },
    // Base d'exemple intégrée au livrable (module.json › exemple) : ouverte en mémoire, sans fichier associé
    async exemple() {
      if (dirty && !(await confirmer("Des modifications ne sont pas enregistrées. Ouvrir la base d'exemple quand même ?", "Ouvrir"))) return;
      if (!window.WERB_EXEMPLE) { toast("Aucune base d'exemple dans cette version.", "err"); return; }
      try { charger(window.WERB_EXEMPLE.texte, {}); toast("Base d'exemple ouverte : « Enregistrer » demandera où la ranger.", "ok"); }
      catch (e) { toast("Base d'exemple illisible : " + e.message, "err"); }
    },
    async ouvrirLien() {
      const d = WerbSocle.lien.lire();
      if (!d) return;
      if (dirty && !(await confirmer("Des modifications ne sont pas enregistrées. Ouvrir la base demandée quand même ?", "Ouvrir"))) return;
      try { const f = await WerbSocle.lien.ouvrir(d); charger(f.texte, f); WerbSocle.lien.effacer(); await smsiCharger(); toast(`Base ${f.nom} ouverte depuis l'espace.`, "ok"); }
      catch (e) { if (e.name !== "AbortError") toast(e.message, "err"); }
      render();
    },
    ouvrir, enregistrer: () => enregistrer(false), enregistrerSous: () => enregistrer(true), fermer,
    ajout(el) {
      const key = el.dataset.t, T = TABLES[key], r = {};
      T.cols.forEach(c => r[c.f] = c.t === "bool" ? false : c.t === "liste" ? [] : "");
      if (T.prefixe) r.id = prochainId(S[key], T.prefixe);
      if (key === "procedures") { r.id = uid(); r.code = "PRO-XXX-" + String(S.procedures.length + 1).padStart(3, "0"); r.titre = "Nouvelle procédure"; r.version = "1.0"; r.statut = "Brouillon"; r.frequence = "Annuelle"; PROC_TEXTES.forEach(([f]) => r[f] = ""); }
      if (key === "actions") { r.statut = "À lancer"; }
      if (key === "mesures") { r.obligatoire = true; }
      if (key === "roles") { r.niveau = "groupe"; }
      S[key].push(r); journaliser("Ajout", T.obj, r.id && key !== "procedures" ? r.id : r.code); marquer(); render();
    },
    async suppr(el) {
      const key = el.dataset.t, i = +el.dataset.i, r = S[key][i], T = TABLES[key] || { obj: "Étape" };
      const nom = r.id && key !== "procedures" && key !== "etapes" ? r.id : (r.code || r.etape || "").slice(0, 60);
      if (!(await confirmer(`Supprimer ${esc(T.obj.toLowerCase())} <b>${esc(nom)}</b>${key === "procedures" ? " et ses étapes" : ""} ?`, "Supprimer"))) return;
      S[key].splice(i, 1);
      if (key === "procedures") S.etapes = S.etapes.filter(s => s.pid !== r.id);
      journaliser("Suppression", T.obj, nom); marquer(); render();
    },
    fiche(el) { ui.pid = el.dataset.id; ui.redige = false; vue = "etapes"; render(); },
    redige() { ui.redige = !ui.redige; render(); },
    imprimer() { window.print(); },
    ajoutEtape() {
      const der = S.etapes.filter(s => s.pid === ui.pid).pop();
      S.etapes.push({ id: uid(), pid: ui.pid, phase: der ? der.phase : "", section: der ? der.section : "", etape: "", role: "", moyens: "", preuve: "", lien: "" });
      journaliser("Ajout", "Étape", S.procedures.find(p => p.id === ui.pid).code); marquer(); render();
    },
    monter(el) { deplacer(+el.dataset.i, -1); },
    descendre(el) { deplacer(+el.dataset.i, 1); },
    importWM() {
      const inp = $("#file-input"); inp.value = ""; inp.accept = ".json,application/json";
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        try { const r = importerWerbMap(await f.text(), f.name); render(); toast(`${r.ajout} procédure(s) et ${r.etapes} étape(s) importées${r.ignore ? `, ${r.ignore} déjà présente(s)` : ""}.`, "ok"); }
        catch (e) { toast(e.message, "err"); }
      };
      inp.click();
    },
    actionSocle(el) {
      const m = S.mesures.find(x => x.id === el.dataset.m), site = el.dataset.s;
      const a = { id: prochainId(S.actions, "A-"), titre: `Mettre en œuvre ${m.id} – ${m.titre}`, origine: "Socle non appliqué", site, responsable: "", echeance: "", statut: "À lancer", commentaire: "Écart constaté dans la synthèse de conformité publiée par le site." };
      S.actions.push(a); journaliser("Ajout", "Action", a.id, "", "", a.titre + " (" + site + ")"); marquer(); render(); toast(`Action ${a.id} ajoutée au plan d'actions.`, "ok");
    },
    async smsiOpen() {
      try { await E.choisir(); await smsiCharger(); toast(`Espace « ${E.groupe.organisation} » ouvert.`, "ok"); }
      catch (e) { if (e.name !== "AbortError") toast(e.message, "err"); }
      render();
    },
    async smsiRelire() { await smsiCharger(); render(); },
    entreeFormation() {
      const f = formationsGroupe(), r = derniereRevue(); if (!f || !r) return;
      const av = r.entrees || "", t = texteFormation(f);
      r.entrees = av ? `${av}\n${t}` : t;
      journaliser("Modification", "Revue de direction", r.id, "Éléments d'entrée", av, r.entrees); marquer(); render(); toast(`Indicateurs de formation ajoutés à ${r.id}.`, "ok");
    },
    async smsiLink() {
      LIAISON = { portee: "groupe", groupeId: E.groupe.groupeId };
      journaliser("Rattachement", "WerbSMSI", E.groupe.organisation); marquer(); await smsiCharger(); render();
    },
    async smsiUnlink() {
      if (!(await confirmer("Détacher la base de l'espace WerbSMSI ? La publication déjà faite n'est pas retirée.", "Détacher"))) return;
      journaliser("Détachement", "WerbSMSI"); LIAISON = {}; marquer(); render();
    },
    async smsiPublier() {
      const o = objetsPublies();
      if (!(await confirmer(`Publier ${o.mesuresSocle.length} mesure(s) du socle, ${o.roles.length} rôle(s) et ${o.prestataires.length} prestataire(s) cadre pour tous les sites ?`, "Publier"))) return;
      try {
        const chemin = await E.publier({ niveau: "groupe", objets: o, utilisateur: user });
        journaliser("Publication", "WerbSMSI", chemin); marquer(); await smsiCharger(); render();
        toast("Publication effectuée ; elle est tracée au journal : enregistrez la base.", "ok");
      } catch (e) { SMSI.err = "Publication impossible : " + e.message; render(); }
    },
  };
  function deplacer(i, sens) {
    const s = S.etapes[i], meme = S.etapes.filter(x => x.pid === s.pid), k = meme.indexOf(s) + sens;
    if (k < 0 || k >= meme.length) return;
    const j = S.etapes.indexOf(meme[k]);
    [S.etapes[i], S.etapes[j]] = [S.etapes[j], S.etapes[i]];
    journaliser("Ordre", "Étape", s.etape.slice(0, 60)); marquer(); render();
  }

  // Modification d'un champ : valeur, journal (avant / après), base non enregistrée
  function appliquer(el) {
    if (el.dataset.o || el.dataset.org) {
      const cible = el.dataset.o ? S.organisation.politique : S.organisation, f = el.dataset.o || el.dataset.org;
      const avant = cible[f]; cible[f] = el.value.trim();
      if (avant !== cible[f]) { journaliser("Modification", el.dataset.o ? "Politique" : "Organisation", "", f, avant, cible[f]); marquer(); }
      return;
    }
    const key = el.dataset.t, r = S[key][+el.dataset.i], f = el.dataset.f;
    const c = (TABLES[key] ? [...TABLES[key].cols, ...PROC_TEXTES.map(([g, l]) => col(g, l))] : ETAPE_COLS).find(x => x.f === f);
    const avant = Array.isArray(r[f]) ? r[f].join(", ") : r[f];
    r[f] = c.t === "bool" ? el.checked : c.t === "liste" ? el.value.split(",").map(x => x.trim()).filter(Boolean) : el.value.trim();
    const apres = Array.isArray(r[f]) ? r[f].join(", ") : r[f];
    if (String(avant) === String(apres)) return;
    const element = key === "etapes" ? (S.procedures.find(p => p.id === r.pid) || {}).code : key === "procedures" ? r.code : r.id;
    journaliser("Modification", TABLES[key] ? TABLES[key].obj : "Étape", element, c.l, avant, apres);
    marquer();
    if (c.t === "select" || c.t === "bool" || f === "code" || f === "titre") renderNav();
  }

  document.addEventListener("click", e => {
    const nav = e.target.closest("[data-nav]");
    if (nav) { vue = nav.dataset.nav; render(); $("#main").scrollTop = 0; return; }
    const a = e.target.closest("[data-act]");
    if (a && ACTIONS[a.dataset.act]) ACTIONS[a.dataset.act](a, e);
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (el.id === "choixProc") { ui.pid = el.value; render(); return; }
    if (el.dataset.sel) { const k = el.dataset.sel, o = el.dataset.pos, r = (o[0] === "a" ? S[k] : S.archives[k] || [])[+o.slice(1)], s = ui.sel[k] = ui.sel[k] || new Set(); if (r) { if (el.checked) s.add(r); else s.delete(r); } render(); return; }
    if (el.dataset.selall) { const k = el.dataset.selall, s = ui.sel[k] = new Set(); if (el.checked) S[k].forEach(r => s.add(r)); render(); return; }
    if (el.dataset.voirarch) { ui.arch[el.dataset.voirarch] = el.checked; render(); return; }
    if (el.dataset.t || el.dataset.o || el.dataset.org) appliquer(el);
  });
  document.addEventListener("input", e => { if (e.target.id === "filtreJournal") { ui.jq = e.target.value; const pos = e.target.selectionStart; render(); const f = $("#filtreJournal"); f.focus(); f.setSelectionRange(pos, pos); } });
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); const a = document.activeElement; if (a && (a.dataset.t || a.dataset.o || a.dataset.org)) appliquer(a); enregistrer(false); }
    if (e.key === "Enter" && e.target.id === "nomUtil") ACTIONS.entrer();
  });
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  render();
})();
</script>
</body>
</html>
