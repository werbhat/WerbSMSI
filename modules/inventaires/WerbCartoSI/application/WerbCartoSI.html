   interne, ancre ignorée). Tout le HTML du texte est échappé, sauf les commentaires
   <!-- … --> placés entre deux blocs, qui ne sont pas affichés ; le premier porte la signature du guide (charte §7.4).
   Thème clair / sombre (charte §7.5, 1.2.0) : fonds sur les variables communes (--card, --info-bg…, repli clair), valeurs sombres
   propres au lecteur à l'écran seulement ; titres sous texte blanc sur --navy-fond ; impression en clair.
   Images (1.3.0) : une ligne seule « ![légende](images/schema.svg) » affiche une figure légendée, agrandie au clic. L'image est
   rangée dans le dossier des guides (images/ par exemple) et intégrée au livrable par le build en data: URI
   (window.WERB_GUIDES_IMAGES = { "images/schema.svg": "data:image/svg+xml;base64,…" }) : rien n'est chargé hors de la page
   (CSP img-src data:). Seuls les formats SVG, PNG, JPEG et WebP sont acceptés ; une image absente est signalée à sa place.
   L'image porte son propre fond (opaque) : le lecteur n'en ajoute pas, et l'atténue légèrement en thème sombre. */
const WerbGuides = Object.freeze((() => {
  const VERSION = "1.3.0";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const sansAccent = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

  /* ---------------------------------------------------------------- texte en ligne */
  let dossierCourant = "";                                   // dossier du guide en cours de rendu (liens relatifs)
  // Chemin d'une page .md citée par un lien relatif, à partir du dossier du guide (« ../2-NIST/0-carte.md »)
  function cheminRelatif(url) {
    let u = url.replace(/#.*$/, "");
    try { u = decodeURIComponent(u); } catch { /* adresse mal encodée : prise telle quelle */ }
    const parts = [];
    for (const p of ((dossierCourant ? dossierCourant + "/" : "") + u.replace(/^\.\//, "")).split("/")) {
      if (p === "..") parts.pop(); else if (p && p !== ".") parts.push(p);
    }
    return parts.join("/");
  }
  // Image d'un guide, intégrée par le build : data: URI d'une image (SVG, PNG, JPEG, WebP), sinon null
  const RE_IMAGE = /^data:image\/(?:svg\+xml|png|jpeg|webp);base64,[A-Za-z0-9+/]+=*$/;
  function image(url) {
    const imgs = globalThis.WERB_GUIDES_IMAGES && typeof globalThis.WERB_GUIDES_IMAGES === "object" ? globalThis.WERB_GUIDES_IMAGES : {};
    const v = Object.prototype.hasOwnProperty.call(imgs, cheminRelatif(url)) ? imgs[cheminRelatif(url)] : null;
    return typeof v === "string" && RE_IMAGE.test(v) ? v : null;
  }
  function figure(lib, url) {
    const src = image(url);
    if (!src) return `<p class="wg-absent-img" title="Image absente : ${esc(cheminRelatif(url))}">🖼 ${esc(lib || cheminRelatif(url))} (image absente)</p>`;
    return `<figure class="wg-fig"><img src="${src}" alt="${esc(lib)}" data-werb-zoom title="Cliquer pour agrandir">${lib ? `<figcaption>${enLigne(lib)}</figcaption>` : ""}</figure>`;
  }
  function enLigne(s, liens = true) {
    const gardes = [];
    const garder = h => `\u0000${gardes.push(h) - 1}\u0000`;
    s = s.replace(/`([^`]+)`/g, (_, c) => garder(`<code>${esc(c)}</code>`));
    s = s.replace(/\[([^\]]+)\]\((?:<([^>]+)>|([^)\s]+))\)/g, (t, lib, url1, url2) => {
      const url = url1 || url2;
      if (/^(https?:|mailto:)/i.test(url)) return garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${enLigne(lib, false)}</a>`);
      if (/^[^:]+\.md(#.*)?$/i.test(url)) return garder(`<a class="wg-int" data-werb-page="${esc(cheminRelatif(url))}">${enLigne(lib, false)}</a>`);
      return t;
    });
    if (liens) s = s.replace(/\bhttps?:\/\/[^\s<>()]+[^\s<>().,;:!?]/g, url => garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`));
    s = esc(s);
    s = s.replace(/\*\*(?=\S)(.+?)\*\*/g, "<strong>$1</strong>").replace(/__(?=\S)(.+?)__(?![\p{L}\d])/gu, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*(?=\S)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>").replace(/(^|[^\p{L}\d_])_(?=\S)([^_]+?)_(?![\p{L}\d_])/gu, "$1<em>$2</em>");
    return s.replace(/\u0000(\d+)\u0000/g, (_, n) => gardes[+n]);
  }

  /* ---------------------------------------------------------------- blocs */
  const RE_LISTE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const cellules = l => l.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  const estSeparateur = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);

  function rendre(md) {
    const lignes = String(md || "").replace(/\r\n?/g, "\n").split("\n");
    const sommaire = [], ancres = new Set();
    let titre = "", signature = "";
    const ancre = t => {
      const base = "g-" + (sansAccent(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "section");
      let a = base, n = 2;
      while (ancres.has(a)) a = `${base}-${n++}`;
      ancres.add(a);
      return a;
    };
    const html = [];
    let i = 0;
    while (i < lignes.length) {
      const l = lignes[i];
      if (!l.trim()) { i++; continue; }
      if (/^\s*<!--/.test(l)) {                                                     // commentaire : non affiché
        const debut = i;
        while (i < lignes.length && !lignes[i].includes("-->")) i++;
        const c = lignes.slice(debut, i + 1).join(" ").replace(/^\s*<!--|-->[\s\S]*$/g, "").trim();
        if (!signature && !html.length) signature = c;
        i++;
        continue;
      }
      let m;
      if ((m = l.match(/^\s*(`{3,}|~{3,})\s*([\w-]*)/))) {                       // bloc de code
        const fin = m[1], corps = [];
        i++;
        while (i < lignes.length && !lignes[i].trim().startsWith(fin)) corps.push(lignes[i++]);
        i++;
        html.push(`<pre class="wg-code"><code>${esc(corps.join("\n"))}</code></pre>`);
        continue;
      }
      if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {                          // titre
        const niv = m[1].length, txt = m[2], a = ancre(txt);
        if (!titre && niv <= 2) titre = txt.replace(/[*_`]/g, "");
        sommaire.push({ niv, texte: txt.replace(/[*_`]/g, ""), ancre: a });
        html.push(`<h${niv} id="${a}" class="wg-h${niv}">${enLigne(txt)}</h${niv}>`);
        i++;
        continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { html.push("<hr>"); i++; continue; } // filet
      if ((m = l.match(/^\s*!\[([^\]]*)\]\(([^)\s]+)\)\s*$/))) { html.push(figure(m[1], m[2])); i++; continue; } // image seule sur sa ligne
      if (l.includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1])) { // tableau
        const tete = cellules(l), alig = cellules(lignes[i + 1]).map(c => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : "");
        const st = k => alig[k] ? ` style="text-align:${alig[k]}"` : "";
        i += 2;
        const corps = [];
        while (i < lignes.length && lignes[i].includes("|") && lignes[i].trim()) corps.push(cellules(lignes[i++]));
        html.push(`<div class="wg-table"><table><thead><tr>${tete.map((c, k) => `<th${st(k)}>${enLigne(c)}</th>`).join("")}</tr></thead>`
          + `<tbody>${corps.map(r => `<tr>${tete.map((_, k) => `<td${st(k)}>${enLigne(r[k] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        continue;
      }
      if (/^\s*>/.test(l)) {                                                       // citation
        const corps = [];
        while (i < lignes.length && /^\s*>/.test(lignes[i])) corps.push(lignes[i++].replace(/^\s*>\s?/, ""));
        html.push(`<blockquote>${rendre(corps.join("\n")).html}</blockquote>`);
        continue;
      }
      if (RE_LISTE.test(l)) {                                                      // liste (imbrication par l'indentation)
        const items = [];
        while (i < lignes.length) {
          const x = lignes[i].match(RE_LISTE);
          if (x) { items.push({ ind: x[1].replace(/\t/g, "    ").length, num: /\d/.test(x[2]), txt: x[3] }); i++; continue; }
          if (lignes[i].trim() && /^\s{2,}/.test(lignes[i]) && items.length) { items[items.length - 1].txt += " " + lignes[i].trim(); i++; continue; }
          break;
        }
        html.push(liste(items));
        continue;
      }
      const para = [];                                                             // paragraphe
      while (i < lignes.length && lignes[i].trim() && !/^(#{1,6}\s|\s*>|\s*(`{3,}|~{3,}))/.test(lignes[i]) && !RE_LISTE.test(lignes[i])
        && !(lignes[i].includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1]))) para.push(lignes[i++]);
      html.push(`<p>${para.map((p, k) => enLigne(p.trim()) + (k < para.length - 1 && / {2,}$/.test(p) ? "<br>" : "")).join(" ")}</p>`);
    }
    return { html: html.join("\n"), sommaire, titre, signature };
  }

  function liste(items) {
    let h = "", pile = [];
    const ouvrir = it => { const t = it.num ? "ol" : "ul"; pile.push({ ind: it.ind, t }); h += `<${t}>`; };
    for (const it of items) {
      while (pile.length && it.ind < pile[pile.length - 1].ind) { h += `</li></${pile.pop().t}>`; }
      if (!pile.length || it.ind > pile[pile.length - 1].ind) ouvrir(it);
      else h += "</li>";
      const c = it.txt.match(/^\[([ xX])\]\s+(.*)$/);
      h += c ? `<li class="wg-tache"><input type="checkbox" disabled${c[1] !== " " ? " checked" : ""}> <span class="wg-li">${enLigne(c[2])}</span>`
        : `<li><span class="wg-li">${enLigne(it.txt)}</span>`;
    }
    while (pile.length) h += `</li></${pile.pop().t}>`;
    return h;
  }

  /* ---------------------------------------------------------------- guides du module */
  const EMOJIS = [[/correspondance|tableau crois[ée]/i, "🔀"], [/^(\d+\s*[-_. ]\s*)?carte\b/i, "🧭"], [/^sources?\b/i, "🔗"], [/obligation/i, "⚖️"], [/industriel/i, "🏭"], [/checklist|contr[oô]le|audit/i, "✅"], [/plan|feuille de route|mise en [oœ]uvre|[ée]tape/i, "🗺️"],
    [/cadrage|p[ée]rim[eè]tre/i, "🎯"], [/matrice|atelier/i, "🧮"], [/socle|mesure/i, "🛡️"], [/rapport|synth[eè]se/i, "📑"],
    [/registre/i, "🗂️"], [/mod[eè]le|gabarit/i, "🧩"], [/guide|r[ée]f[ée]rentiel|m[ée]thode/i, "📘"]];
  let cache = null;
  function liste_guides() {
    if (cache) return cache;
    const src = Array.isArray(globalThis.WERB_GUIDES) ? globalThis.WERB_GUIDES : [];
    cache = src.map((g, n) => {
      const chemin = String(g.fichier || `guide-${n + 1}.md`).replace(/\\/g, "/");
      const dossier = chemin.includes("/") ? chemin.slice(0, chemin.lastIndexOf("/")) : "";
      dossierCourant = dossier;
      const r = rendre(g.texte);
      dossierCourant = "";
      const nom = chemin.slice(dossier ? dossier.length + 1 : 0).replace(/\.md$/i, "");
      // Titre : premier titre (# ou ##) du document, avant « — » ; trop long ou absent : nom du fichier sans numéro
      let titre = (r.sommaire.find(s => s.niv <= 2) || { texte: "" }).texte.replace(/[*_`]/g, "").split(/\s+[—–]\s+/)[0].trim();
      if (!titre || titre.length > 60) titre = nom.replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " ");
      titre = titre.charAt(0).toUpperCase() + titre.slice(1);
      const id = "guide:" + (sansAccent((dossier ? dossier + "/" : "") + nom).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || n + 1);
      const mots = String(g.texte || "").split(/\s+/).filter(Boolean).length;
      // Sommaire : les deux plus hauts niveaux de titres, sans le titre du document
      const titres = r.sommaire.slice(1), niveaux = [...new Set(titres.map(s => s.niv))].sort();
      const som = titres.filter(s => niveaux.indexOf(s.niv) > -1 && niveaux.indexOf(s.niv) < 2).map(s => ({ ...s, rang: niveaux.indexOf(s.niv) + 1 }));
      return Object.freeze({ id, fichier: chemin, dossier, titre, signature: r.signature, emoji: (EMOJIS.find(([re]) => re.test(titre) || re.test(nom)) || [, "📄"])[1],
        html: r.html, sommaire: som, minutes: Math.max(1, Math.round(mots / 200)) });
    });
    return cache;
  }
  const trouver = id => liste_guides().find(g => g.id === id) || null;
  const duDossier = dossier => liste_guides().filter(g => dossier === undefined || g.dossier === dossier);
  const racine = () => String(globalThis.WERB_GUIDES_RACINE || "guides");

  // Entrées du menu ❓ Aide : [[idVue, libellé], …] ; idVue commence par « guide: ». dossier : ceux d'un seul dossier ("" = racine)
  const entrees = dossier => duDossier(dossier).map(g => [g.id, `${g.emoji} ${g.titre}`]);

  // Dossiers des guides, dans l'ordre de leurs fichiers : [{ dossier, nom (sans numéro), guides }] ; "" = racine
  function dossiers() {
    const ds = [];
    for (const g of liste_guides()) {
      let d = ds.find(x => x.dossier === g.dossier);
      if (!d) ds.push(d = { dossier: g.dossier, nom: g.dossier.split("/").pop().replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " "), guides: [] });
      d.guides.push(g);
    }
    return ds;
  }

  // Liens relatifs du texte (data-werb-page) : navigation propre au module vers la page citée, ou texte simple si elle manque
  const liensInternes = (html, lien) => html.replace(/<a class="wg-int" data-werb-page="([^"]*)">([\s\S]*?)<\/a>/g, (_, chemin, lib) => {
    const cible = liste_guides().find(g => esc(g.fichier) === chemin);
    return cible ? `<a href="#" class="wg-int" ${lien(cible.id)}>${lib}</a>` : `<span class="wg-absent" title="Page absente : ${chemin}">${lib}</span>`;
  });

  // Cartes des guides, pour la page d'aide ou l'accueil. lien(id) : attributs HTML de navigation propres au module ; dossier : facultatif
  function cartes(lien, dossier) {
    const gs = duDossier(dossier);
    if (!gs.length) return "";
    return `<div class="wg-cartes">${gs.map((g, n) => `<button type="button" class="wg-carte" ${lien(g.id)}><span class="wg-etape">${n + 1}</span>`
      + `<span class="wg-ct"><b>${g.emoji} ${esc(g.titre)}</b><small>${g.sommaire.filter(s => s.rang === 1).length} sections · ≈ ${g.minutes} min de lecture</small></span></button>`).join("")}</div>`;
  }

  // Page de lecture d'un guide (étapes : les guides de son dossier). lien(id) : attributs HTML de navigation propres au module ;
  // retour : HTML d'un bouton facultatif ; mot : nom d'un document dans le bandeau (« Guide », « Page »…)
  function vue(id, { lien, retour = "", mot = "Guide" } = {}) {
    const g = trouver(id);
    if (!g) return `<div class="wg"><p>Guide introuvable.</p>${retour}</div>`;
    const gs = duDossier(g.dossier);
    const n = gs.indexOf(g), prec = gs[n - 1], suiv = gs[n + 1];
    const etapes = gs.map((x, k) => `<button type="button" class="wg-pas${x === g ? " actif" : ""}" ${lien(x.id)} title="${esc(x.titre)}"><span class="wg-etape">${k + 1}</span>${x.emoji} ${esc(x.titre)}</button>`).join("");
    const som = g.sommaire.map(s => `<a class="wg-s${s.rang}" data-werb-ancre="${s.ancre}">${esc(s.texte)}</a>`).join("");
    const pied = `<div class="wg-pied">${prec ? `<button type="button" ${lien(prec.id)}>← ${esc(prec.titre)}</button>` : "<span></span>"}`
      + `${suiv ? `<button type="button" class="primary" ${lien(suiv.id)}>${esc(suiv.titre)} →</button>` : ""}</div>`;
    return `<div class="wg"><div class="wg-tete"><div class="wg-pas-liste">${etapes}</div>${retour}</div>
      <div class="wg-corps"><article class="wg-doc"><div class="wg-meta">${g.emoji} ${esc(mot)} ${n + 1} / ${gs.length} · ≈ ${g.minutes} min de lecture · <span class="wg-fichier">${esc(racine())}/${esc(g.fichier)}</span>${g.signature ? `<span class="wg-sig">${esc(g.signature)}</span>` : ""}</div>${liensInternes(g.html, lien)}${pied}</article>
      ${som ? `<aside class="wg-som"><div class="wg-som-t">📑 Sommaire</div>${som}</aside>` : ""}</div></div>`;
  }

  /* ---------------------------------------------------------------- style et ancres */
  const CSS = `
.wg{--wg-a:var(--navy,#1f3864);--wg-b:var(--navy-2,#2e5090);--wg-l:var(--line,#dfe3ea);--wg-m:var(--muted,#5d6676);--wg-f:#f6f8fc;--wg-fond:var(--card,#fff);--wg-i:var(--info-bg,#e8eef9);--wg-h:var(--navy-fond,var(--navy,#1f3864));--wg-h2:#2e5090;--wg-code:#eef1f6;--wg-cit:#fff8e6;--wg-cit-b:#e0a100;--wg-th-b:#c9d5ea;--wg-pre:#1d2330;--wg-pre-t:#e8ecf3}
@media screen{:root[data-theme=sombre] .wg,:root[data-theme=sombre] .wg-cartes{--wg-f:#1b2533;--wg-h2:#2a4a7a;--wg-code:#243041;--wg-cit:#3a2d0c;--wg-cit-b:#c79a00;--wg-th-b:#2e4a75;--wg-pre:#0b0f14}}
.wg-tete{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.wg-pas-liste{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.wg-pas{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--wg-l);background:var(--wg-fond);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font:inherit;font-size:13px;color:inherit}
.wg-pas:hover{border-color:var(--wg-b)}
.wg-pas.actif{background:var(--wg-h);border-color:var(--wg-h);color:#fff;font-weight:600}
.wg-etape{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--wg-i);color:var(--wg-a);font-weight:700;font-size:12px}
.wg-pas.actif .wg-etape{background:rgba(255,255,255,.22);color:#fff}

.wg-doc h2{font-size:20px;color:#fff;background:linear-gradient(90deg,var(--wg-h),var(--wg-h2));border-radius:6px;padding:7px 12px;margin:26px 0 12px}

.wg-doc pre.wg-code{background:var(--wg-pre);color:var(--wg-pre-t);border-radius:8px;padding:14px 16px;overflow:auto;line-height:1.35;font-size:13px}

.wg-som{position:sticky;top:0;max-height:calc(100vh - 110px);overflow:auto;background:var(--wg-fond);border:1px solid var(--wg-l);border-radius:10px;padding:10px 8px;font-size:13px}
.wg-som-t{font-weight:700;color:var(--wg-a);padding:0 6px 6px;border-bottom:1px solid var(--wg-l);margin-bottom:6px}
.wg-som a{display:block;padding:3px 6px;border-radius:5px;color:inherit;text-decoration:none;cursor:pointer;line-height:1.3}
.wg-som a:hover{background:var(--wg-i);color:var(--wg-a)}
.wg-som .wg-s1{font-weight:600;margin-top:3px}
.wg-som .wg-s2{padding-left:16px;color:var(--wg-m);font-size:12.5px}
.wg-pied{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:14px;border-top:1px solid var(--wg-l)}
.wg-fig{margin:16px 0 18px;text-align:center}
.wg-fig img{max-width:100%;height:auto;border:1px solid var(--wg-l);border-radius:8px;cursor:zoom-in}
@media screen{:root[data-theme=sombre] .wg-fig img{filter:brightness(.88)}}
.wg-fig figcaption{font-size:13px;color:var(--wg-m);margin-top:6px;font-style:italic}
.wg-absent-img{color:var(--wg-m);border:1px dashed var(--wg-l);border-radius:6px;padding:8px 10px}
.wg-zoom{position:fixed;inset:0;z-index:10000;background:rgba(10,14,20,.86);display:flex;align-items:center;justify-content:center;padding:2vh 2vw;cursor:zoom-out}
.wg-zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.wg-cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:8px 0}
.wg-carte{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line,#dfe3ea);border-left:5px solid var(--navy-2,#2e5090);background:var(--card,#fff);border-radius:8px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;white-space:normal}
.wg-carte:hover{background:var(--wg-f,#f6f8fc)}
.wg-carte .wg-etape{background:var(--info-bg,#e8eef9);color:var(--navy,#1f3864)}
.wg-ct{display:flex;flex-direction:column;gap:2px}
.wg-ct small{color:var(--muted,#5d6676)}
.wmenu .wm-it[data-wnav^="guide:"],.wmenu .wm-it[data-wnav^="guide:"] span{white-space:normal;line-height:1.3}
@media (max-width:1100px){.wg-corps{grid-template-columns:minmax(0,1fr)}.wg-som{position:static;max-height:none;order:-1}}
@media print{.wg-tete,.wg-som,.wg-pied,.wg-zoom{display:none}.wg-doc{border:0;padding:0;max-width:none}.wg-fig{break-inside:avoid}.wg-fig img{border:0}}`;

  if (typeof document !== "undefined" && document.head && !document.getElementById("werb-guides-style")) {
    const st = document.createElement("style");
    st.id = "werb-guides-style";
    st.textContent = CSS;
    document.head.appendChild(st);
    // Sommaire : défilement vers la section sans toucher à l'adresse de la page
    document.addEventListener("click", e => {
      // Image agrandie : un clic l'ouvre en plein écran, un second clic (ou Échap) la referme
      const z = document.querySelector(".wg-zoom");
      if (z && (e.target === z || z.contains(e.target))) { z.remove(); return; }
      const im = e.target.closest && e.target.closest("img[data-werb-zoom]");
      if (im) {
        const fond = document.createElement("div");
        fond.className = "wg-zoom";
        fond.setAttribute("role", "dialog");
        const grand = document.createElement("img");
        grand.src = im.src; grand.alt = im.alt;
        fond.appendChild(grand);
        document.body.appendChild(fond);
        return;
      }
      const a = e.target.closest && e.target.closest("[data-werb-ancre]");
      if (!a) return;
      e.preventDefault();
      const cible = document.getElementById(a.dataset.werbAncre);
      if (cible) cible.scrollIntoView({ behavior: "smooth", block: "start" });

/*! WerbCartoSI – Développé par @WerbHat */
/* Classeurs Excel (.xlsx) sans bibliothèque externe : archive ZIP compressée par le navigateur (CompressionStream),
   feuilles en SpreadsheetML. Écriture : ligne de titres, largeurs, volet figé, filtre, listes déroulantes (valeurs ou
   plage d'une feuille de listes), dates au format date Excel, feuilles masquées, propriétés signées. Lecture : valeurs
   des cellules (texte partagé ou en ligne, nombres, booléens), feuille par feuille.
   Les cellules sont toujours écrites en valeurs, jamais en formules. Version commune (TRV-7), reprise de WerbAssets 1.4.0 et WerbExploitation 1.4.0. */
"use strict";
const WerbXlsx = (() => {
  const TYPE = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  const NS_R = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const TAILLE_MAX = 20 * 1024 * 1024;

  const STYLE = { titre: 1, cellule: 2, info: 3, date: 4 };   // index cellXfs de styles()
  const EPOQUE = Date.UTC(1899, 11, 30);                   // jour 0 des dates Excel (calendrier 1900)
  // Date ISO (AAAA-MM-JJ) → cellule date Excel ; autre texte : inchangé
  const date = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? { v: (Date.UTC(+m[1], +m[2] - 1, +m[3]) - EPOQUE) / 86400000, s: STYLE.date, n: true } : iso; };
  // Numéro de série Excel → date ISO
  const isoDe = n => new Date(EPOQUE + Math.round(+n) * 86400000).toISOString().slice(0, 10);

  const CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;

  const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const flux = (data, transformation) => new Response(new Blob([data]).stream().pipeThrough(transformation)).arrayBuffer();
  const X = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const lettre = n => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const numero = s => { let n = 0; for (const ch of s) n = n * 26 + ch.charCodeAt(0) - 64; return n; };

  /* ---------- ZIP ---------- */
  async function zip(entrees, type = TYPE) {   // [[chemin, texte]] → Blob
    const te = new TextEncoder(), parts = [], central = [];
    let off = 0;
    for (const [chemin, texte] of entrees) {
      const brut = te.encode(texte), nom = te.encode(chemin), crc = crc32(brut);
      let data = brut, meth = 0;
      if ("CompressionStream" in window) {
        try { data = new Uint8Array(await flux(brut, new CompressionStream("deflate-raw"))); meth = 8; } catch (e) { data = brut; meth = 0; }
      }
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, meth, true); h.setUint16(12, 0x21, true);
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, brut.length, true); h.setUint16(26, nom.length, true);
      parts.push(h.buffer, nom, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, meth, true); c.setUint16(14, 0x21, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, brut.length, true); c.setUint16(28, nom.length, true); c.setUint32(42, off, true);
      central.push(c.buffer, nom);
      off += 30 + nom.length + data.length;
    }
    const taille = central.reduce((s, p) => s + p.byteLength, 0), fin = new DataView(new ArrayBuffer(22));
    fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, entrees.length, true); fin.setUint16(10, entrees.length, true);
    fin.setUint32(12, taille, true); fin.setUint32(16, off, true);

  // Renvoie une fonction chemin → texte (null si absent)
  function unzip(buf) {
    const dv = new DataView(buf);
    let e = buf.byteLength - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error("Fichier Excel illisible (archive invalide).");

    let o = dv.getUint32(e + 16, true);
    for (let i = 0; i < n; i++) {
      const meth = dv.getUint16(o + 10, true), csz = dv.getUint32(o + 20, true), nl = dv.getUint16(o + 28, true), xl = dv.getUint16(o + 30, true), cl = dv.getUint16(o + 32, true), lo = dv.getUint32(o + 42, true);
      fichiers[td.decode(new Uint8Array(buf, o + 46, nl))] = { meth, csz, lo };
      o += 46 + nl + xl + cl;
    }
    return async chemin => {
      const f = fichiers[chemin];
      if (!f) return null;
      const data = new Uint8Array(buf, f.lo + 30 + dv.getUint16(f.lo + 26, true) + dv.getUint16(f.lo + 28, true), f.csz);
      if (f.meth === 0) return td.decode(data);
      if (!("DecompressionStream" in window)) throw new Error("Navigateur trop ancien pour lire les fichiers Excel.");
      return td.decode(await flux(data, new DecompressionStream("deflate-raw")));
    };
  }

  /* ---------- Écriture ---------- */
  function styles() {
    const bord = `<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>`;
    const xf = (police, fond, format = 49) => `<xf numFmtId="${format}" fontId="${police}" fillId="${fond}" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
      + `<numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts>`
      + `<fonts count="3"><font><sz val="10"/><name val="Calibri"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><i/><sz val="10"/><color rgb="FF595959"/><name val="Calibri"/></font></fonts>`
      + `<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F3864"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEEF2F7"/><bgColor indexed="64"/></patternFill></fill></fills>`
      + `<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${bord}</borders>`
      + `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`
      + `<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(1, 2)}${xf(0, 0)}${xf(2, 3)}${xf(0, 0, 164)}</cellXfs>`
      + `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles><\/styleSheet>`;   // « <\/ » : pas de fin de balise style dans le livrable
  }
  // Feuille : { nom, lignes: [[valeur | { v, s, n }]], largeurs: [n], listes: [{ col (0 = A), valeurs: [] | plage: "Listes!$A$2:$A$9", strict }],
  //           info: [index de colonnes grisées], cachee }
  // Les cellules sont au format Texte (numFmt 49) : Excel garde « 0012 », « 10.1.1.0/24 » ou « 1;254 » tels quels ; n : nombre (dates).
  // Liste stricte : Excel refuse une autre valeur ; sinon il avertit seulement. Une plage évite la limite de 255 caractères des valeurs.
  function feuille(f) {
    const nc = Math.max(1, ...f.lignes.map(l => l.length)), info = new Set(f.info || []);
    const cellule = (c, i, j) => {
      const o = c !== null && typeof c === "object" ? c : { v: c };
      const ref = lettre(j + 1) + (i + 1), s = ` s="${o.s ?? (i === 0 ? STYLE.titre : info.has(j) ? STYLE.info : STYLE.cellule)}"`, v = o.v;
      if (v === "" || v === null || v === undefined) return `<c r="${ref}"${s}/>`;
      if (o.n && Number.isFinite(+v)) return `<c r="${ref}"${s}><v>${+v}</v></c>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`;
    };
    const donnees = f.lignes.map((l, i) => `<row r="${i + 1}">${l.map((c, j) => cellule(c, i, j)).join("")}</row>`).join("");
    const listes = (f.listes || []).filter(l => l.plage || (l.valeurs && l.valeurs.length)).map(l => {
      const col = lettre(l.col + 1), formule = l.plage || `"${l.valeurs.map(v => String(v).replace(/[",]/g, " ")).join(",")}"`;
      const msg = l.strict ? `errorStyle="stop" errorTitle="Valeur hors liste" error="Choisissez une valeur de la liste : une autre valeur serait rejetée à l'import."`
        : `errorStyle="warning" errorTitle="Valeur hors liste" error="Cette valeur n'est pas dans la liste : elle sera signalée à l'import."`;
      return `<dataValidation type="list" ${msg} allowBlank="1" showErrorMessage="1" sqref="${col}2:${col}${LIGNES_LISTES + 1}"><formula1>${X(formule)}</formula1></dataValidation>`;
    });
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
      + `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
      + `<cols>${Array.from({ length: nc }, (_, j) => `<col min="${j + 1}" max="${j + 1}" width="${(f.largeurs && f.largeurs[j]) || 18}" customWidth="1"/>`).join("")}</cols>`
      + `<sheetData>${donnees}</sheetData>${f.lignes.length > 1 ? `<autoFilter ref="A1:${lettre(nc)}${f.lignes.length}"/>` : ""}`
      + (listes.length ? `<dataValidations count="${listes.length}">${listes.join("")}</dataValidations>` : "") + `</worksheet>`;
  }
  // Classeur à partir de feuilles (voir feuille) ; titre et signature dans les propriétés du fichier
  function classeur(feuilles, { titre = "", signature = "" } = {}) {
    const nom = f => X(f.nom.replace(/[[\]:*?/\\]/g, " ").slice(0, 31));
    const fichiers = [
      ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>${feuilles.map((f, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
      ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`],
      ["docProps/core.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${X(titre)}</dc:title><dc:creator>@WerbHat</dc:creator><dc:description>${X(signature)}</dc:description><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0, 19)}Z</dcterms:created></cp:coreProperties>`],
      ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${NS_R}"><sheets>${feuilles.map((f, i) => `<sheet name="${nom(f)}" sheetId="${i + 1}"${f.cachee ? ` state="hidden"` : ""} r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`],
      ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${feuilles.map((f, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${feuilles.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ["xl/styles.xml", styles()],
      ...feuilles.map((f, i) => [`xl/worksheets/sheet${i + 1}.xml`, feuille(f)]),
    ];
    return zip(fichiers);
  }

  /* ---------- Lecture ---------- */
  // Renvoie { noms: [feuilles], lignes(nom) → [[valeur]] } ; lignes[0] = ligne 1, lignes[i][0] = colonne A
  async function lire(fichier) {
    if (fichier.size > TAILLE_MAX) throw new Error("Classeur trop volumineux (20 Mo au plus).");
    const texte = unzip(await fichier.arrayBuffer()), P = new DOMParser();
    const xml = async chemin => { const t = await texte(chemin); return t ? P.parseFromString(t, "application/xml") : null; };
    const balises = (d, t) => [...d.getElementsByTagNameNS("*", t)];
    const wb = await xml("xl/workbook.xml"), rel = await xml("xl/_rels/workbook.xml.rels");
    if (!wb || !rel) throw new Error("Ce fichier n'est pas un classeur Excel valide (.xlsx).");
    const cibles = {};
    balises(rel, "Relationship").forEach(r => { cibles[r.getAttribute("Id")] = r.getAttribute("Target"); });
    const feuilles = {};
    balises(wb, "sheet").forEach(s => {
      const t = cibles[s.getAttributeNS(NS_R, "id") || s.getAttribute("r:id")];
      if (t) feuilles[s.getAttribute("name")] = t.startsWith("/") ? t.slice(1) : "xl/" + t;
    });
    const partages = [], ss = await xml("xl/sharedStrings.xml");
    if (ss) balises(ss, "si").forEach(si => partages.push(balises(si, "t").filter(t => t.parentNode.localName !== "rPh").map(t => t.textContent).join("")));
    async function lignes(nom) {
      const d = feuilles[nom] ? await xml(feuilles[nom]) : null;
      if (!d) return [];
      const out = [];
      balises(d, "c").forEach(c => {
        const m = /^([A-Z]+)(\d+)$/.exec(c.getAttribute("r") || "");
        if (!m) return;
        const t = c.getAttribute("t"), v = balises(c, "v")[0];
        let val = "";
        if (t === "s") val = v ? partages[+v.textContent] ?? "" : "";
        else if (t === "inlineStr") val = balises(c, "t").map(x => x.textContent).join("");
        else if (t === "b") val = v ? v.textContent === "1" : "";
        else if (t === "d") val = v ? v.textContent.slice(0, 10) : "";   // date ISO (rare : LibreOffice, saisie stricte)
        else if (t !== "e" && v) val = t === "str" || isNaN(+v.textContent) ? v.textContent : +v.textContent;
        (out[+m[2] - 1] = out[+m[2] - 1] || [])[numero(m[1]) - 1] = val;
      });
      return out;
    }
    return { noms: Object.keys(feuilles), lignes };
  }

  return Object.freeze({ TYPE, STYLE, classeur, lire, lettre, date, isoDe, zip });
})();

/*! WerbCartoSI – Développé par @WerbHat */
/* Modèles de schémas Visio (.vsdx dessin, .vstx modèle) sans bibliothèque externe. Un fichier Visio est une archive ZIP de parties XML
   (Open Packaging Conventions) : on lit le répertoire central, on ne décompresse que les parties XML de visio/ et docProps/ (pages,
   masters, propriétés), on y remplace les balises {{NOM}} du cartouche, et l'on recopie toutes les autres parties octet pour octet
   (images, thèmes, données binaires). Un modèle .vstx devient un dessin .vsdx (type de contenu du document principal).
   Une balise coupée par une mise en forme (<cp IX='1'/> au milieu de {{VERSION}}) est reconnue : les éléments XML rencontrés sont
   conservés après la valeur. Les fichiers à macros (.vsdm, .vstm) et l'ancien format binaire (.vsd, .vst) sont refusés. */
"use strict";
const WerbVisio = (() => {
  const TYPE_VSDX = "application/vnd.ms-visio.drawing";
  const CT_MODELE = "application/vnd.ms-visio.template.main+xml";
  const CT_DESSIN = "application/vnd.ms-visio.drawing.main+xml";
  const TAILLE_MAX = 50 * 1024 * 1024;
  const EXT_OK = /\.(vsdx|vstx)$/i;
  // Balises reconnues dans le cartouche : nom → libellé (l'ordre est celui de la page Modèles)
  const BALISES = [
    ["TITRE", "Titre du schéma"], ["NOM", "Titre du schéma (alias de TITRE)"], ["ID", "Identifiant (SCH-nnn)"], ["SITE", "Code du site"], ["SITE_NOM", "Nom du site"],
    ["ORGANISATION", "Organisation (espace WerbSMSI)"], ["TYPE", "Type de schéma"], ["EXIGENCES", "Exigences couvertes (codes)"], ["VERSION", "Version"],
    ["DATE", "Date de création (JJ/MM/AAAA)"], ["AUTEUR", "Auteur (nom saisi à l'ouverture)"], ["PROPRIETAIRE", "Propriétaire (fonction)"],

"use strict";

      ligne = (points, o = {}) => P.push(Object.assign({ k: "ligne", points }, o));

    texte(800, 6, 170, 16, "ÉBAUCHE À REPRENDRE", { taille: 10, gras: true, couleur: ORANGE, aligne: 2 });

  /* ---------------- fiche d'un schéma */

  function perimetreMap(s, dis) {
    const absents = absentsMap(s);
    const cases = (k, l, lib, sansId) => l.map(x => `<label class="chk-in"><input type="checkbox" data-sref="${k}" value="${esc(x.id)}"${s[k].includes(x.id) ? " checked" : ""}${dis}> ${sansId ? `<span>${esc(lib(x))}</span>` : `<span class="mono">${esc(x.id)}</span> <span class="small">${esc(lib(x))}</span>`}</label>`).join("");
    if (!recu("si") && !recu("zones") && !recu("actifs")) return `<div class="card" data-perimetre-map><h2>Périmètre WerbMap</h2><p class="small muted">Ouvrez l'espace et rattachez la base au site : les SI, zones et actifs publiés par WerbMap pourront être liés au schéma.</p>
      ${[...s.sis, ...s.zones, ...s.actifs].length ? `<p class="small">Liens enregistrés : <span class="mono">${esc([...s.sis, ...s.zones, ...s.actifs].join(", "))}</span></p>` : ""}</div>`;
    const q = norm(ui.fa), parSI = new Set(items("si").filter(x => s.sis.includes(x.id)).flatMap(x => x.actifs));
    const acts = items("actifs").filter(x => s.actifs.includes(x.id) || !q || norm([x.id, x.libelle, x.type, x.zone].join(" ")).includes(q)).slice(0, 300);
    return `<div class="card" data-perimetre-map><h2>Périmètre WerbMap</h2><p class="small muted">Ce que le schéma représente, d'après l'inventaire publié par WerbMap (reçu le ${esc(frDate((recu("si") || recu("actifs") || {}).majLe))}). Sert à la couverture des SI et sera publié avec la couverture.</p>
      ${absents.length ? `<div class="warnbox small">Absent de la dernière publication de WerbMap : <span class="mono">${esc(absents.join(", "))}</span> (renommé ou retiré dans WerbMap).</div>` : ""}
      <label class="f">Systèmes d'information</label><div class="chk-grille">${cases("sis", items("si"), x => x.nom || x.id, true) || `<span class="muted small">Aucun SI publié.</span>`}</div>
      <label class="f">Zones</label><div class="chk-grille">${cases("zones", items("zones"), x => x.nom) || `<span class="muted small">Aucune zone publiée.</span>`}</div>
      <label class="f">Actifs</label>${parSI.size ? `<p class="small muted">Actifs des SI cochés : <span class="mono">${esc([...parSI].join(", "))}</span></p>` : ""}
      <input id="filtreActifs" type="search" placeholder="Filtrer les actifs (TAG, libellé, type, zone)" value="${esc(ui.fa)}" style="max-width:340px;margin-bottom:6px">
      <div class="chk-grille">${cases("actifs", acts, x => `${x.libelle || x.type}${x.zone ? " · " + x.zone : ""}`) || `<span class="muted small">Aucun actif ${recu("actifs") ? "ne correspond" : "publié"}.</span>`}</div></div>`;
  }
  // Historique des versions (CSI-8)
  function historiqueHtml(s, ro) {
    const nv = ui.nv && ui.nv.id === s.id ? ui.nv : null, appr = s.statut === "approuve";
    return `<div class="card" data-historique><h2>Historique des versions</h2>
      ${ro ? "" : `<div class="row noprint" style="margin-bottom:8px"><button class="small" data-act="revueFaite"${appr ? "" : ' disabled title="Réservé à un schéma approuvé"'}>✔ Revue faite, sans changement</button>
        <button class="small" data-act="nouvelleVersion">📌 Nouvelle version…</button><span class="small muted">Une nouvelle version repasse le schéma en brouillon : il est à faire approuver.</span></div>`}
      ${nv ? `<div class="infobox" data-nv><div class="fiche"><div><label class="f">Nouvelle version (actuelle : ${esc(s.version)})</label><input id="nvVersion" value="${esc(nv.version)}"></div>
        <div class="lg"><label class="f">Nature du changement</label><input id="nvComment" value="${esc(nv.commentaire)}" placeholder="Ex. ajout de la liaison avec le site de secours"></div></div>
        <div class="row" style="margin-top:8px"><button class="primary small" data-act="validerVersion">Enregistrer la nouvelle version</button><button class="small" data-act="annulerVersion">Annuler</button></div></div>` : ""}
      <div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Événement</th><th>Version</th><th>Par</th><th>Approbateur</th><th>Commentaire</th><th>Empreinte</th></tr></thead><tbody>
      ${s.historique.slice().reverse().map(h => `<tr><td class="mono">${esc(frDate(h.date))}</td><td>${esc(h.evenement)}</td><td class="mono">${h.precedente ? `${esc(h.precedente)} → ` : ""}${esc(h.version)}</td><td>${esc(h.par)}</td><td>${esc(h.approbateur)}</td><td class="small"${h.controles ? ` title="${esc(h.controles.join(" ; "))}"` : ""}>${esc(h.commentaire)}</td><td class="mono small" title="${esc(h.empreinte || "")}">${esc(courte(h.empreinte))}</td></tr>`).join("")
        || `<tr><td colspan="7" class="empty">Aucun événement : l'historique commence à la prochaine approbation, revue ou nouvelle version.</td></tr>`}</tbody></table></div></div>`;
  }

  /* ---------------- modèles de schémas */
  VUES.modeles = () => {

    const fichiers = (MODS || []).map(f => ({ f, m: modeleDe(f.chemin) }));
    const absents = decrits.filter(m => MODS && !MODS.some(f => f.chemin === m.fichier));
    const ligne = ({ f, m }) => `<tr data-mod="${esc(f.chemin)}"><td>${lib(ORIGINES, f.origine)}</td><td class="mono small">${esc(f.nom)}</td>
      <td>${m ? `<b>${esc(m.nom || f.nom)}</b><div class="small muted">${esc(m.type)}${m.exigences.length ? " · " + esc(m.exigences.join(", ")) : ""}</div>` : badge("à décrire", "b-warn")}</td>
      <td class="small">${m ? (m.balises.length ? esc(m.balises.join(", ")) : badge("aucune balise", "b-warn")) + (m.inconnues.length ? ` ${badge("inconnues : " + m.inconnues.join(", "), "b-warn")}` : "") : ""}</td>
      <td style="white-space:nowrap">${m ? `<button class="small primary" data-act="preparer" data-chemin="${esc(f.chemin)}">▶ Créer un schéma</button> <button class="small" data-act="editModele" data-chemin="${esc(f.chemin)}">✎</button>`
        : `<button class="small" data-act="decrireModele" data-chemin="${esc(f.chemin)}">➕ Décrire</button>`}</td></tr>`;
    const edit = ui.editModele && modeleDe(ui.editModele);
    return `<h1>Modèles de schémas</h1><p class="sub">Les modèles Visio de l'entreprise (.vstx ou .vsdx) avec un cartouche à balises. Créer un schéma depuis un modèle remplit le cartouche, nomme le fichier et pré-remplit la fiche.</p>
      <div class="card"><h2>Bibliothèque</h2>
        <p class="small muted">Modèles communs du groupe : <code>${esc(DOSSIER_MODELES_GROUPE)}/</code> à la racine de l'espace (déposés par l'équipe du groupe). Modèles du site : <code>${esc(ok ? siteDossier() + "/modeles" : "sites/<CODE>/" + DOSSIER_MODELES_SITE)}/</code>. Déposez les fichiers avec l'Explorateur, puis 🔄 Actualiser.</p>
        ${E.ouvert ? "" : `<div class="warnbox small">Ouvrez l'espace (Intégration WerbSMSI) pour voir la bibliothèque. Sans espace, un modèle de votre poste reste utilisable.</div>`}
        <div class="row noprint" style="margin:8px 0">${E.ouvert ? `<button class="small" data-act="actualiserModeles">🔄 Actualiser</button>` : ""}${ok ? `<button class="small" data-act="creerDossierModeles">📁 Créer le dossier des modèles du site</button>` : ""}
          <label class="bt-fichier small">📂 Modèle de mon poste…<input type="file" id="modeleLocal" accept=".vstx,.vsdx" hidden></label></div>
        ${E.ouvert ? `<div class="tablewrap"><table class="t"><thead><tr><th>Origine</th><th>Fichier</th><th>Modèle</th><th>Balises du cartouche</th><th></th></tr></thead><tbody>
          ${fichiers.map(ligne).join("") || `<tr><td colspan="5" class="empty">Aucun modèle dans ces dossiers.</td></tr>`}</tbody></table></div>` : ""}
        ${absents.length ? `<p class="small">${badge("introuvable", "b-ko")} Décrits mais absents de l'espace : ${absents.map(m => `<span class="mono">${esc(m.fichier)}</span> <button class="small danger" data-act="supprModele" data-chemin="${esc(m.fichier)}">✕ Retirer</button>`).join(" · ")}</p>` : ""}</div>
      ${edit ? `<div class="card" data-edit-modele><h2>Modèle ${esc(edit.fichier.split("/").pop())}</h2><div class="fiche">
        <div><label class="f">Nom</label><input data-mf="nom" value="${esc(edit.nom)}"></div>
        <div><label class="f">Type proposé</label><select data-mf="type">${opt(S.refs.types, edit.type, "—")}</select></div>
        <div><label class="f">Classification proposée</label><select data-mf="classification">${opt(CLASSIFS, edit.classification)}</select></div>
        <div class="lg"><label class="f">Description</label><textarea data-mf="description" rows="2">${esc(edit.description)}</textarea></div></div>
        <label class="f">Exigences proposées</label><div class="chk-grille">${S.refs.exigences.map(([c, l]) => `<label class="chk-in"><input type="checkbox" data-mexig value="${esc(c)}"${edit.exigences.includes(c) ? " checked" : ""}> <b>${esc(c)}</b> ${esc(l)}</label>`).join("")}</div>
        <div class="row" style="margin-top:8px"><button class="small" data-act="analyserModele" data-chemin="${esc(edit.fichier)}">🔎 Relire les balises</button><span class="small muted">Analysé le ${esc(frDate(edit.analyseLe))}</span><span class="spacer"></span>
          <button class="small danger" data-act="supprModele" data-chemin="${esc(edit.fichier)}">✕ Retirer de la bibliothèque</button><button class="small" data-act="fermerModele">Fermer</button></div></div>` : ""}
      ${ebaucheHtml()}
      <div class="card"><h2>Balises du cartouche</h2><p class="small muted">Dans le modèle Visio, écrivez la balise telle quelle dans le texte d'une forme du cartouche (par exemple <code>Version : {{VERSION}}</code>). Elle est remplacée à la création ; une balise inconnue reste telle quelle.</p>
        <table class="t"><tbody>${WerbVisio.BALISES.map(([b, l]) => `<tr><td class="mono" style="width:200px">{{${esc(b)}}}</td><td>${esc(l)}</td></tr>`).join("")}</tbody></table></div>`;
  };
  /* ---------------- ébauche « Zones et conduits » générée depuis WerbMap (1.10.0) */
  // Données du périmètre : tout le site, ou un SI (ses actifs, leurs zones, les conduits et flux entre ces zones)
  function ebaucheDonnees() {
    const e = ui.eb || {}, si = e.perim ? items("si").find(x => x.id === e.perim) : null;
    let acts = items("actifs");
    if (si) acts = acts.filter(a => si.actifs.includes(a.id));
    const zids = new Set(si ? acts.map(a => a.zone).filter(Boolean) : items("zones").map(z => z.id));
    const zones = items("zones").filter(z => zids.has(z.id));
    acts = acts.filter(a => zids.has(a.zone));
    return { si, zones, actifs: acts, conduits: items("conduits").filter(c => zids.has(c.de) && zids.has(c.vers)),
      flux: items("flux").filter(f => zids.has(f.zoneSrc) && zids.has(f.zoneDst)) };
  }
  function ebauche(id) {
    const e = ui.eb || {}, dd = ebaucheDonnees();
    return WerbEbauche.construire(Object.assign(dd, { titre: e.titre || "Zones et conduits", id, site: LIAISON.site || "SITE", siteNom: S.site.nom, organisation: E.ouvert && E.groupe ? E.groupe.organisation || "" : "",
      version: "0.1", date: frDate(auj()), auteur: user, proprietaire: e.proprietaire || "", classification: "Diffusion restreinte", exigences: "EX-ZONES, EX-CARTO",
      perimetre: dd.si ? `SI ${dd.si.nom || dd.si.id}` : "tout le site", genereLe: frDate(auj()), examiner: pointsFlux }));
  }
  function ebaucheHtml() {
    if (!recu("zones") || !recu("actifs")) return `<div class="card" data-ebauche><h2>Ébauche depuis WerbMap</h2><p class="muted small">Ouvrez l'espace et rattachez la base au site : les zones, actifs, conduits et flux publiés par WerbMap permettent de générer une ébauche du schéma « Zones et conduits ».</p></div>`;
    const e = ui.eb = ui.eb || { perim: "", titre: "Zones et conduits", proprietaire: "" }, r = ebauche(prochainId());
    return `<div class="card" data-ebauche><h2>Ébauche « Zones et conduits » depuis WerbMap</h2>
      <p class="small muted">Le module dessine une première version du schéma à partir de l'inventaire publié par WerbMap : zones (couleur de criticité, SL-T), actifs de chaque zone (TAG), conduits entre zones avec le pare-feu de la matrice de flux, tableau des conduits, légende et cartouche rempli. Le fichier Visio est enregistré dans le dossier des schémas et sa fiche est créée en brouillon (EX-ZONES, EX-CARTO), liée aux SI et aux zones. <b>Une ébauche se reprend à la main</b> : disposition, regroupements, libellés ; comparez-la au terrain avant de l'approuver.</p>
      <div class="fiche"><div><label class="f" for="ebPerim">Périmètre</label><select id="ebPerim">${opt(items("si").map(x => [x.id, `SI ${x.nom || x.id}`]), e.perim, "Tout le site")}</select></div>
        <div class="lg"><label class="f" for="ebTitre">Titre</label><input id="ebTitre" value="${esc(e.titre)}"></div>
        <div><label class="f" for="ebProp">Propriétaire (fonction)</label><input id="ebProp" value="${esc(e.proprietaire)}" placeholder="Ex. Responsable automatisme"></div></div>
      <p class="small" style="margin-top:8px" data-ebauche-bilan>${r.stats.zones} zone(s), ${r.stats.conduits} conduit(s)${r.stats.sansParefeu ? ` · ${badge(`${r.stats.sansParefeu} conduit(s) sans pare-feu dans la matrice`, "b-warn")}` : ""}</p>
      <div class="ebauche-apercu" data-apercu style="border:1px solid var(--line);border-radius:8px;overflow:auto;max-width:100%">${WerbEbauche.svg(r.formes)}</div>
      <div class="row noprint" style="margin-top:8px"><button class="primary" data-act="creerEbauche"${r.stats.zones ? "" : " disabled"}>✨ Créer le schéma (Visio)</button>
        <button data-act="svgEbauche"${r.stats.zones ? "" : " disabled"}>⬇ Aperçu SVG</button>
        <span class="small muted">${espaceOk() ? `Edge demande où l'enregistrer : choisissez <code>${esc(siteDossier())}/</code>.` : ""}</span></div></div>`;
  }
  // Formulaire de création depuis un modèle
  function formCreation() {
    const c = ui.cree, nom = WerbSocle.nommage.fichier(nomNormalise(c));   // nom final, préfixé (socle 1.12.0)
    return `<div class="row noprint" style="margin-bottom:8px"><button data-act="annulerCreation">← Modèles de schémas</button></div>
      <h1>Nouveau schéma depuis un modèle</h1><p class="sub">Modèle <span class="mono">${esc(c.modele)}</span>${c.balises ? ` · balises : ${esc(c.balises.join(", ") || "aucune")}` : ""}</p>

        <p style="margin-top:10px">Fichier créé : <code data-nom-cree>${esc(nom)}</code></p>
        <p class="small muted">${espaceOk() ? `Edge demande où l'enregistrer : choisissez le dossier des schémas du site <code>${esc(siteDossier())}/</code> (Edge le retient ensuite). La fiche est créée en brouillon, liée au fichier.`

        <div class="row"><button class="primary" data-act="creerSchema">✨ Créer le schéma</button><button data-act="annulerCreation">Annuler</button></div></div>`;
  }

      <div class="card"><h2>Paramètres du site</h2><div class="fiche">
        <div class="lg"><label class="f">Racine de l'espace sur le disque (lecteur ou partage réseau)</label><input data-par="racine" value="${esc(S.parametres.racine)}" placeholder="S:\\SMSI_GROUPE"></div>
        <div><label class="f">Fréquence de revue par défaut (mois)</label><input data-par="revueMois" type="number" min="1" max="60" value="${S.parametres.revueMois}"><div class="small muted">Schémas et non-applicabilités.</div></div>

        <div class="lg"><label class="chk-in"><input type="checkbox" data-par="visioDirect"${S.parametres.visioDirect ? " checked" : ""}> Ouverture directe dans Visio (essai)</label>
          <div class="small muted">Ajoute « 🖉 Ouvrir dans Visio » aux fiches des schémas Visio (lien <code>ms-visio:</code> d'Office). Edge demande l'autorisation ; selon la version d'Office, seul un fichier sur un site web (SharePoint) s'ouvre. À essayer avant de le recommander.</div></div></div>
        <p class="small muted">Le navigateur ne connaît pas l'emplacement du dossier de l'espace : la racine permet de reconstituer le chemin complet de chaque fichier, à coller dans l'Explorateur. Exemples : <code>S:\\SMSI_GDI</code>, <code>\\\\serveur\\partage\\SMSI_GDI</code>.</p></div>

    },
    // Modèles de schémas (lot B)
    async actualiserModeles() { await listerModeles(); render(); toast(`${(MODS || []).length} modèle(s) trouvé(s) dans l'espace.`, "ok"); },
    async creerDossierModeles() {
      if (!espaceOk()) return;
      try { await E.creerDossier(`${siteDossier()}/modeles`); await listerModeles(); render(); toast(`Dossier ${siteDossier()}/modeles/ prêt : déposez-y les modèles du site.`, "ok"); }
      catch (e) { toast("Création impossible : " + e.message, "err"); }
    },
    async decrireModele(el) { await analyserEtDecrire(el.dataset.chemin, true); },
    async analyserModele(el) { await analyserEtDecrire(el.dataset.chemin, false); },
    editModele(el) { ui.editModele = el.dataset.chemin; render(); },
    fermerModele() { ui.editModele = null; render(); },
    supprModele(el) {
      const m = modeleDe(el.dataset.chemin); if (!m) return;
      S.modeles = S.modeles.filter(x => x !== m); if (ui.editModele === m.fichier) ui.editModele = null;
      journaliser("Suppression", "Modèle", m.fichier, "", m.nom, ""); marquer(); render(); toast("Modèle retiré de la bibliothèque (le fichier n'est pas touché).", "ok");
    },
    async preparer(el) {
      const m = modeleDe(el.dataset.chemin); if (!m) return;
      ui.cree = { source: m.fichier, modele: m.fichier.split("/").pop(), balises: m.balises, id: prochainId(), titre: "", type: m.type, classification: m.classification,
        version: "0.1", proprietaire: "", exigences: m.exigences.slice() };
      ui.editModele = null; render(); $("#main").scrollTop = 0;
    },
    annulerCreation() { ui.cree = null; LOCAL = null; render(); },
    async creerSchema() { await creerDepuisModele(); },
    // Non-applicabilité justifiée (exigence pour le site, ou pour un SI)
    ouvrirNA(el) { const e = el.dataset.ex, si = el.dataset.si || ""; if (!S.refs.exigences.some(p => p[0] === e)) return; ui.na = { exigence: e, si }; vue = "exigences"; render(); $("#main").scrollTop = 0; const f = $("#naJustif"); if (f) f.focus(); },
    annulerNA() { ui.na = null; render(); },
    validerNA() {
      const n = ui.na; if (!n) return;
      const j = $("#naJustif").value.trim(), par = $("#naPar").value.trim(), le = date($("#naLe").value);
      Object.assign(n, { justification: j, decidePar: par, decideLe: le });
      if (!j) { toast("La justification est obligatoire : c'est elle que l'auditeur lira.", "err"); return; }
      if (!par) { toast("Indiquez la fonction qui décide (par exemple RSSI du site).", "err"); return; }
      if (!le) { toast("Indiquez la date de la décision.", "err"); return; }
      S.nonApplicables = S.nonApplicables.filter(x => !(x.exigence === n.exigence && x.si === n.si));
      S.nonApplicables.push(normNA(n));
      journaliser("Non-applicabilité", "Exigence", n.exigence, n.si ? "SI " + n.si : "site", "", `${j} (décidée par ${par} le ${frDate(le)})`);
      ui.na = null; marquer(); render(); toast(`${n.exigence} déclarée non applicable${n.si ? " pour " + n.si : " pour le site"}.`, "ok");
    },
    revueNA(el) {
      const n = naDe(el.dataset.ex, el.dataset.si || ""); if (!n) return;
      const av = n.revueLe; n.revueLe = auj();
      journaliser("Revue", "Non-applicabilité", n.exigence, n.si ? "SI " + n.si : "site", av, n.revueLe); marquer(); render();
      toast(`Non-applicabilité confirmée : prochaine revue le ${frDate(naEcheance(n))}.`, "ok");
    },
    async retirerNA(el) {
      const n = naDe(el.dataset.ex, el.dataset.si || ""); if (!n) return;
      if (!(await confirmer(`Retirer la non-applicabilité de <b>${esc(n.exigence)}</b>${n.si ? ` pour ${esc(n.si)}` : ""} ? L'exigence redevient attendue.`, "Retirer"))) return;
      S.nonApplicables = S.nonApplicables.filter(x => x !== n);
      journaliser("Retrait", "Non-applicabilité", n.exigence, n.si ? "SI " + n.si : "site", n.justification, ""); marquer(); render();
    },
    cellule(el) { ui.cel = { si: el.dataset.si, ex: el.dataset.ex }; render(); const d = $("[data-cellule]"); if (d && d.scrollIntoView) d.scrollIntoView({ block: "nearest" }); },
    fermerCellule() { ui.cel = null; render(); },
    // Valeurs propres au site (celles du groupe restent en tête, intactes)
    ajoutExig() {
      const c = $("#nvExigCode").value.trim().toUpperCase().replace(/\s+/g, "-"), l = $("#nvExigLib").value.trim();
      if (!c || !l) { toast("Code et libellé obligatoires.", "err"); return; }
      if (S.refs.exigences.some(p => LCLE(p[0]) === LCLE(c))) { toast("Ce code existe déjà.", "err"); return; }
      S.refs.exigences.push([c, l]); journaliser("Ajout", "Référentiel", "exigences", "", "", `${c} — ${l}`); marquer(); render();
    },
    ajoutType() {
      const v = $("#nvType").value.trim(); if (!v) return;
      if (S.refs.types.some(x => LCLE(x) === LCLE(v))) { toast("Ce type existe déjà.", "err"); return; }
      S.refs.types.push(v); journaliser("Ajout", "Référentiel", "types", "", "", v); marquer(); render();
    },
    supprRef(el) {
      const id = el.dataset.ref, i = +el.dataset.i, v = S.refs[id][i];
      if (duGroupe(id, v) || emplois(id, Array.isArray(v) ? v[0] : v)) return;
      S.refs[id].splice(i, 1); journaliser("Suppression", "Référentiel", id, "", Array.isArray(v) ? v.join(" — ") : v, ""); marquer(); render();
    },
    // Outils des tables (liste à plat)
    selArchiver() { selAppliquer("archiver"); },
    selDesarchiver() { selAppliquer("desarchiver"); },
    async selSupprimer() { const n = cochees().length; if (n && await confirmer(`Supprimer définitivement ${n} fiche(s) de schéma ? Les fichiers ne sont pas touchés.`, "Supprimer")) selAppliquer("supprimer"); },
    selVider() { ui.coche.schemas = new Set(); render(); },
    remplacer() {
      WerbSocle.tables.remplacer({ titre: "Chercher / remplacer · Schémas", colonnes: COLS_REMPL.map(([id, libelle]) => ({ id, libelle })), lignes: lignesT().filter(r => !r.archive),
        lire: (r, f) => r[f], nomLigne: r => `${r.id} ${r.titre}`,
        surAppliquer: l => {
          l.forEach(ch => { ch.ligne[ch.col] = ch.apres; journaliser("Modification", "Schéma", ch.ligne.id, ch.col, ch.avant, ch.apres); });
          marquer(); render(); toast(`${l.length} cellule(s) remplacée(s).`, "ok");
        } });
    },
    largeursDefaut() { delete S.largeurs.schemas; journaliser("Modification", "Présentation", "Registre des schémas", "Largeurs", "", "automatiques"); marquer(); render(); },
    async smsiOpen() { SMSI.err = ""; try { await E.choisir(); toast(`Espace « ${E.groupe.organisation} » ouvert.`, "ok"); await apresEspace(); } catch (e) { if (e.name !== "AbortError") SMSI.err = e.message; } render(); },
    async smsiLink() {
      const v = $("#smsiCible").value; if (!v) { toast("Choisissez un site.", "err"); return; }
      const avant = LIAISON.site || "";
      LIAISON = { site: v, groupeId: E.groupe.groupeId }; if (!S.site.nom) S.site.nom = ((E.groupe.sites || []).find(s => s.code === v) || {}).nom || "";
      journaliser("Rattachement", "WerbSMSI", E.groupe.organisation, "Site", avant, v); marquer(); await apresEspace();
    },
    async smsiUnlink() { if (!(await confirmer("Détacher la base de son site ?", "Détacher"))) return; journaliser("Détachement", "WerbSMSI", "", "Site", LIAISON.site, ""); LIAISON = {}; marquer(); render(); },
  };

  // Modification d'un champ
  function appliquer(el) {
    const d = el.dataset;
    if (d.par) {
      const k = d.par, av = S.parametres[k], v = k === "visioDirect" ? el.checked : k === "revueMois" ? Math.max(1, Math.min(60, Math.round(+el.value) || 12))
        : k === "seuilDIC" ? Math.max(1, Math.min(9, Math.round(+el.value) || 3)) : el.value.trim();
      if (av === v) return;
      S.parametres[k] = v; journaliser("Modification", "Paramètres", "", k, av, v); marquer(); render(); return;
    }
    if (d.portee) {
      const c = d.portee, av = portee(c), v = el.value;
      if (av === v || !PORTEES.some(p => p[0] === v)) return;
      if (v === (PORTEES_DEF[c] || "site")) delete S.parametres.portees[c]; else S.parametres.portees[c] = v;
      journaliser("Modification", "Paramètres", c, "attendue pour", lib(PORTEES, av), lib(PORTEES, v)); marquer(); render(); return;
    }
    if (d.ref) {
      const id = d.ref, i = +d.i, v = S.refs[id][i], nv = el.value.trim();
      if (!nv || duGroupe(id, v)) { render(); return; }
      if (Array.isArray(v)) { const av = v[1]; if (av === nv) return; v[1] = nv; journaliser("Modification", "Référentiel", id, v[0], av, nv); }
      else {
        if (v === nv) return;
        if (S.refs[id].some((x, j) => j !== i && LCLE(x) === LCLE(nv))) { toast("Cette valeur existe déjà.", "err"); render(); return; }
        tous().filter(s => s.type === v).forEach(s => { s.type = nv; });   // un type renommé suit dans les fiches
        S.refs[id][i] = nv; journaliser("Modification", "Référentiel", id, "", v, nv);
      }
      marquer(); render(); return;
    }
    const s = SC(); if (!s || s.archive) return;
    if (d.sref !== undefined) {
      const k = d.sref, c = el.value; s[k] = el.checked ? [...new Set([...s[k], c])] : s[k].filter(x => x !== c);
      journaliser("Modification", "Schéma", s.id, { sis: "SI", zones: "zones", actifs: "actifs" }[k], el.checked ? "" : c, el.checked ? c : ""); marquer(); render(); return;
    }
    if (d.sexig !== undefined) {
      const c = el.value; s.exigences = el.checked ? [...new Set([...s.exigences, c])] : s.exigences.filter(x => x !== c);
      journaliser("Modification", "Schéma", s.id, "exigences", el.checked ? "" : c, el.checked ? c : ""); marquer(); render(); return;
    }
    if (d.sl) {
      const k = d.sl, av = s.lien[k], v = el.value.trim();
      if (av === v) return;
      s.lien[k] = v; if (k === "type") s.lien.valeur = ""; delete VERIF[s.id];
      journaliser("Modification", "Schéma", s.id, k === "type" ? "emplacement" : "fichier", av, v); marquer(); render(); return;
    }
    if (d.sf) {
      const k = d.sf, av = s[k], v = el.value.trim();
      if (k === "titre" && !v) { toast("Le titre est obligatoire.", "err"); render(); return; }
      if (k === "statut" && v === "approuve" && !s.approbateur.trim()) { toast("Renseignez l'approbateur avant d'approuver le schéma.", "err"); render(); return; }
      if (k === "statut" && v === "approuve" && av !== "approuve") { ui.appro = { id: s.id }; render(); const c = $("[data-approbation]"); if (c && c.scrollIntoView) c.scrollIntoView({ block: "nearest" }); return; }   // contrôles d'abord
      if (av === v) return;
      s[k] = v;
      if (k === "statut") { ui.appro = null; if (v !== "approuve") delete EMP[s.id]; }
      journaliser("Modification", "Schéma", s.id, k, av, v); marquer();
      if (["titre", "type", "statut", "version", "approuveLe", "revueLe", "prochaineRevue", "classification", "proprietaire", "approbateur", "format", "creeLe"].includes(k)) render();
    }
  }

  document.addEventListener("click", e => {
    const nav = e.target.closest("[data-nav]");
    if (nav && !nav.closest("#sidebar")) {
      e.preventDefault();
      const n = nav.dataset.nav;
      if (n.startsWith("fiche:")) { ouvrirFiche(n.slice(6)); return; }
      vue = n; ui.s = null; render(); $("#main").scrollTop = 0; return;
    }
    if (e.target.closest("td.sel, th.sel")) return;   // case de sélection
    const a = e.target.closest("[data-act]");
    if (a && ACTIONS[a.dataset.act] && !a.disabled) { e.preventDefault(); ACTIONS[a.dataset.act](a, e); }
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (!S) return;
    if (el.dataset.coche) { const s = ui.coche.schemas = ui.coche.schemas || new Set(), r = lignesT()[+el.dataset.i]; if (r) s[el.checked ? "add" : "delete"](r); render(); return; }
    if (el.dataset.cochetout) { ui.coche.schemas = new Set(el.checked ? lignesT() : []); render(); return; }
    if (el.id === "vuePlat") { ui.plat = el.checked; ui.coche = {}; render(); return; }
    if (el.id === "voirArch") { ui.arch = el.checked; ui.coche = {}; render(); return; }
    if (el.id === "horizon") { ui.hz = +el.value || 60; render(); return; }
    if (el.id === "dossierEx") { ui.dx = el.value; render(); return; }
    if (["ebPerim", "ebTitre", "ebProp"].includes(el.id)) { ui.eb = Object.assign(ui.eb || {}, { [{ ebPerim: "perim", ebTitre: "titre", ebProp: "proprietaire" }[el.id]]: el.value.trim() }); render(); return; }
    if (el.id === "dossierFlux") { ui.dxFlux = el.checked; render(); return; }
    if (["filtreExig", "filtreType", "filtreStatut", "filtreSI"].includes(el.id)) { ui[{ filtreExig: "fe", filtreType: "ft", filtreStatut: "fs", filtreSI: "fsi" }[el.id]] = el.value; ui.coche = {}; render(); return; }
    if (el.id === "filtreActifs") return;
    if (["smsiCible", "filtreJournal", "filtreSch", "nvExigCode", "nvExigLib", "nvType", "naJustif", "naPar", "naLe"].includes(el.id)) return;
    if (el.id === "modeleLocal") { choisirLocal(el); return; }
    if (el.id === "empFichier") { empreinteDuPoste(el); return; }
    if (el.dataset.ctrl !== undefined) return;   // contrôles avant approbation : lus au clic sur « Approuver »
    if (el.dataset.cf !== undefined && ui.cree) { ui.cree[el.dataset.cf] = el.value.trim(); const n = $("[data-nom-cree]"); if (n) n.textContent = WerbSocle.nommage.fichier(nomNormalise(ui.cree)); return; }   // sans rendu : le clic sur « Créer » n'est pas perdu
    if (el.dataset.cexig !== undefined && ui.cree) { const k = el.value; ui.cree.exigences = el.checked ? [...new Set([...ui.cree.exigences, k])] : ui.cree.exigences.filter(x => x !== k); return; }
    if ((el.dataset.mf !== undefined || el.dataset.mexig !== undefined) && ui.editModele) { modifierModele(el); return; }
    appliquer(el);
  });
  document.addEventListener("input", e => {
    const id = e.target.id;
    if (id !== "filtreJournal" && id !== "filtreSch" && id !== "filtreActifs") return;
    if (id === "filtreJournal") ui.jq = e.target.value; else if (id === "filtreActifs") ui.fa = e.target.value; else ui.q = e.target.value;
    const pos = e.target.selectionStart; render(); const f = $("#" + id); f.focus(); f.setSelectionRange(pos, pos);
  });
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); const a = document.activeElement; if (S && a && a.closest && a.closest("#main") && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName) && !a.id) appliquer(a); enregistrer(false); }
    if (e.key === "Enter" && e.target.id === "nomUtil") ACTIONS.entrer();
  });
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  WerbSocle.nommage.contexte(() => ({ site: LIAISON.site || "", siteNom: S && S.site ? S.site.nom || "" : "" }));   // nommage des exports « SIGLE-SITE_ » et titres (socle 1.12.0, charte §7.8)
  render();
  WerbSocle.lien.ouvrirSansClic(user, () => ACTIONS.ouvrirLienPortail());   // base demandée par le portail : ouverte sans clic si l'espace est accessible (socle 1.11.0)
})();
</script>
</body>
</html>
