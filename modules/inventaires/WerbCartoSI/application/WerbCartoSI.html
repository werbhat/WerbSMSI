   interne, ancre ignorée). Tout le HTML du texte est échappé, sauf les commentaires
   <!-- … --> placés entre deux blocs, qui ne sont pas affichés ; le premier porte la signature du guide (charte §7.4).
   Thème clair / sombre (charte §7.5, 1.2.0) : fonds sur les variables communes (--card, --info-bg…, repli clair), valeurs sombres
   propres au lecteur à l'écran seulement ; titres sous texte blanc sur --navy-fond ; impression en clair. */
const WerbGuides = Object.freeze((() => {
  const VERSION = "1.1.0";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const sansAccent = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

  /* ---------------------------------------------------------------- texte en ligne */
  let dossierCourant = "";                                   // dossier du guide en cours de rendu (liens relatifs)
  // Chemin d'une page .md citée par un lien relatif, à partir du dossier du guide (« ../2-NIST/0-carte.md »)
  function cheminRelatif(url) {
    let u = url.replace(/#.*$/, "");
    try { u = decodeURIComponent(u); } catch { /* adresse mal encodée : prise telle quelle */ }
    const parts = [];
    for (const p of ((dossierCourant ? dossierCourant + "/" : "") + u.replace(/^\.\//, "")).split("/")) {
      if (p === "..") parts.pop(); else if (p && p !== ".") parts.push(p);
    }
    return parts.join("/");
  }
  function enLigne(s, liens = true) {
    const gardes = [];
    const garder = h => `\u0000${gardes.push(h) - 1}\u0000`;
    s = s.replace(/`([^`]+)`/g, (_, c) => garder(`<code>${esc(c)}</code>`));
    s = s.replace(/\[([^\]]+)\]\((?:<([^>]+)>|([^)\s]+))\)/g, (t, lib, url1, url2) => {
      const url = url1 || url2;
      if (/^(https?:|mailto:)/i.test(url)) return garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${enLigne(lib, false)}</a>`);
      if (/^[^:]+\.md(#.*)?$/i.test(url)) return garder(`<a class="wg-int" data-werb-page="${esc(cheminRelatif(url))}">${enLigne(lib, false)}</a>`);
      return t;
    });
    if (liens) s = s.replace(/\bhttps?:\/\/[^\s<>()]+[^\s<>().,;:!?]/g, url => garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`));
    s = esc(s);
    s = s.replace(/\*\*(?=\S)(.+?)\*\*/g, "<strong>$1</strong>").replace(/__(?=\S)(.+?)__(?![\p{L}\d])/gu, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*(?=\S)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>").replace(/(^|[^\p{L}\d_])_(?=\S)([^_]+?)_(?![\p{L}\d_])/gu, "$1<em>$2</em>");
    return s.replace(/\u0000(\d+)\u0000/g, (_, n) => gardes[+n]);
  }

  /* ---------------------------------------------------------------- blocs */
  const RE_LISTE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const cellules = l => l.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  const estSeparateur = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);

  function rendre(md) {
    const lignes = String(md || "").replace(/\r\n?/g, "\n").split("\n");
    const sommaire = [], ancres = new Set();
    let titre = "", signature = "";
    const ancre = t => {
      const base = "g-" + (sansAccent(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "section");
      let a = base, n = 2;
      while (ancres.has(a)) a = `${base}-${n++}`;
      ancres.add(a);
      return a;
    };
    const html = [];
    let i = 0;
    while (i < lignes.length) {
      const l = lignes[i];
      if (!l.trim()) { i++; continue; }
      if (/^\s*<!--/.test(l)) {                                                     // commentaire : non affiché
        const debut = i;
        while (i < lignes.length && !lignes[i].includes("-->")) i++;
        const c = lignes.slice(debut, i + 1).join(" ").replace(/^\s*<!--|-->[\s\S]*$/g, "").trim();
        if (!signature && !html.length) signature = c;
        i++;
        continue;
      }
      let m;
      if ((m = l.match(/^\s*(`{3,}|~{3,})\s*([\w-]*)/))) {                       // bloc de code
        const fin = m[1], corps = [];
        i++;
        while (i < lignes.length && !lignes[i].trim().startsWith(fin)) corps.push(lignes[i++]);
        i++;
        html.push(`<pre class="wg-code"><code>${esc(corps.join("\n"))}</code></pre>`);
        continue;
      }
      if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {                          // titre
        const niv = m[1].length, txt = m[2], a = ancre(txt);
        if (!titre && niv <= 2) titre = txt.replace(/[*_`]/g, "");
        sommaire.push({ niv, texte: txt.replace(/[*_`]/g, ""), ancre: a });
        html.push(`<h${niv} id="${a}" class="wg-h${niv}">${enLigne(txt)}</h${niv}>`);
        i++;
        continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { html.push("<hr>"); i++; continue; } // filet
      if (l.includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1])) { // tableau
        const tete = cellules(l), alig = cellules(lignes[i + 1]).map(c => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : "");
        const st = k => alig[k] ? ` style="text-align:${alig[k]}"` : "";
        i += 2;
        const corps = [];
        while (i < lignes.length && lignes[i].includes("|") && lignes[i].trim()) corps.push(cellules(lignes[i++]));
        html.push(`<div class="wg-table"><table><thead><tr>${tete.map((c, k) => `<th${st(k)}>${enLigne(c)}</th>`).join("")}</tr></thead>`
          + `<tbody>${corps.map(r => `<tr>${tete.map((_, k) => `<td${st(k)}>${enLigne(r[k] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        continue;
      }
      if (/^\s*>/.test(l)) {                                                       // citation
        const corps = [];
        while (i < lignes.length && /^\s*>/.test(lignes[i])) corps.push(lignes[i++].replace(/^\s*>\s?/, ""));
        html.push(`<blockquote>${rendre(corps.join("\n")).html}</blockquote>`);
        continue;
      }
      if (RE_LISTE.test(l)) {                                                      // liste (imbrication par l'indentation)
        const items = [];
        while (i < lignes.length) {
          const x = lignes[i].match(RE_LISTE);
          if (x) { items.push({ ind: x[1].replace(/\t/g, "    ").length, num: /\d/.test(x[2]), txt: x[3] }); i++; continue; }
          if (lignes[i].trim() && /^\s{2,}/.test(lignes[i]) && items.length) { items[items.length - 1].txt += " " + lignes[i].trim(); i++; continue; }
          break;
        }
        html.push(liste(items));
        continue;
      }
      const para = [];                                                             // paragraphe
      while (i < lignes.length && lignes[i].trim() && !/^(#{1,6}\s|\s*>|\s*(`{3,}|~{3,}))/.test(lignes[i]) && !RE_LISTE.test(lignes[i])
        && !(lignes[i].includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1]))) para.push(lignes[i++]);
      html.push(`<p>${para.map((p, k) => enLigne(p.trim()) + (k < para.length - 1 && / {2,}$/.test(p) ? "<br>" : "")).join(" ")}</p>`);
    }
    return { html: html.join("\n"), sommaire, titre, signature };
  }

  function liste(items) {
    let h = "", pile = [];
    const ouvrir = it => { const t = it.num ? "ol" : "ul"; pile.push({ ind: it.ind, t }); h += `<${t}>`; };
    for (const it of items) {
      while (pile.length && it.ind < pile[pile.length - 1].ind) { h += `</li></${pile.pop().t}>`; }
      if (!pile.length || it.ind > pile[pile.length - 1].ind) ouvrir(it);
      else h += "</li>";
      const c = it.txt.match(/^\[([ xX])\]\s+(.*)$/);
      h += c ? `<li class="wg-tache"><input type="checkbox" disabled${c[1] !== " " ? " checked" : ""}> <span class="wg-li">${enLigne(c[2])}</span>`
        : `<li><span class="wg-li">${enLigne(it.txt)}</span>`;
    }
    while (pile.length) h += `</li></${pile.pop().t}>`;
    return h;
  }

  /* ---------------------------------------------------------------- guides du module */
  const EMOJIS = [[/correspondance|tableau crois[ée]/i, "🔀"], [/^(\d+\s*[-_. ]\s*)?carte\b/i, "🧭"], [/^sources?\b/i, "🔗"], [/obligation/i, "⚖️"], [/industriel/i, "🏭"], [/checklist|contr[oô]le|audit/i, "✅"], [/plan|feuille de route|mise en [oœ]uvre|[ée]tape/i, "🗺️"],
    [/cadrage|p[ée]rim[eè]tre/i, "🎯"], [/matrice|atelier/i, "🧮"], [/socle|mesure/i, "🛡️"], [/rapport|synth[eè]se/i, "📑"],
    [/registre/i, "🗂️"], [/mod[eè]le|gabarit/i, "🧩"], [/guide|r[ée]f[ée]rentiel|m[ée]thode/i, "📘"]];
  let cache = null;
  function liste_guides() {
    if (cache) return cache;
    const src = Array.isArray(globalThis.WERB_GUIDES) ? globalThis.WERB_GUIDES : [];
    cache = src.map((g, n) => {
      const chemin = String(g.fichier || `guide-${n + 1}.md`).replace(/\\/g, "/");
      const dossier = chemin.includes("/") ? chemin.slice(0, chemin.lastIndexOf("/")) : "";
      dossierCourant = dossier;
      const r = rendre(g.texte);
      dossierCourant = "";
      const nom = chemin.slice(dossier ? dossier.length + 1 : 0).replace(/\.md$/i, "");
      // Titre : premier titre (# ou ##) du document, avant « — » ; trop long ou absent : nom du fichier sans numéro
      let titre = (r.sommaire.find(s => s.niv <= 2) || { texte: "" }).texte.replace(/[*_`]/g, "").split(/\s+[—–]\s+/)[0].trim();
      if (!titre || titre.length > 60) titre = nom.replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " ");
      titre = titre.charAt(0).toUpperCase() + titre.slice(1);
      const id = "guide:" + (sansAccent((dossier ? dossier + "/" : "") + nom).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || n + 1);
      const mots = String(g.texte || "").split(/\s+/).filter(Boolean).length;
      // Sommaire : les deux plus hauts niveaux de titres, sans le titre du document
      const titres = r.sommaire.slice(1), niveaux = [...new Set(titres.map(s => s.niv))].sort();
      const som = titres.filter(s => niveaux.indexOf(s.niv) > -1 && niveaux.indexOf(s.niv) < 2).map(s => ({ ...s, rang: niveaux.indexOf(s.niv) + 1 }));
      return Object.freeze({ id, fichier: chemin, dossier, titre, signature: r.signature, emoji: (EMOJIS.find(([re]) => re.test(titre) || re.test(nom)) || [, "📄"])[1],
        html: r.html, sommaire: som, minutes: Math.max(1, Math.round(mots / 200)) });
    });
    return cache;
  }
  const trouver = id => liste_guides().find(g => g.id === id) || null;
  const duDossier = dossier => liste_guides().filter(g => dossier === undefined || g.dossier === dossier);
  const racine = () => String(globalThis.WERB_GUIDES_RACINE || "guides");

  // Entrées du menu ❓ Aide : [[idVue, libellé], …] ; idVue commence par « guide: ». dossier : ceux d'un seul dossier ("" = racine)
  const entrees = dossier => duDossier(dossier).map(g => [g.id, `${g.emoji} ${g.titre}`]);

  // Dossiers des guides, dans l'ordre de leurs fichiers : [{ dossier, nom (sans numéro), guides }] ; "" = racine
  function dossiers() {
    const ds = [];
    for (const g of liste_guides()) {
      let d = ds.find(x => x.dossier === g.dossier);
      if (!d) ds.push(d = { dossier: g.dossier, nom: g.dossier.split("/").pop().replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " "), guides: [] });
      d.guides.push(g);
    }
    return ds;
  }

  // Liens relatifs du texte (data-werb-page) : navigation propre au module vers la page citée, ou texte simple si elle manque
  const liensInternes = (html, lien) => html.replace(/<a class="wg-int" data-werb-page="([^"]*)">([\s\S]*?)<\/a>/g, (_, chemin, lib) => {
    const cible = liste_guides().find(g => esc(g.fichier) === chemin);
    return cible ? `<a href="#" class="wg-int" ${lien(cible.id)}>${lib}</a>` : `<span class="wg-absent" title="Page absente : ${chemin}">${lib}</span>`;
  });

  // Cartes des guides, pour la page d'aide ou l'accueil. lien(id) : attributs HTML de navigation propres au module ; dossier : facultatif
  function cartes(lien, dossier) {
    const gs = duDossier(dossier);
    if (!gs.length) return "";
    return `<div class="wg-cartes">${gs.map((g, n) => `<button type="button" class="wg-carte" ${lien(g.id)}><span class="wg-etape">${n + 1}</span>`
      + `<span class="wg-ct"><b>${g.emoji} ${esc(g.titre)}</b><small>${g.sommaire.filter(s => s.rang === 1).length} sections · ≈ ${g.minutes} min de lecture</small></span></button>`).join("")}</div>`;
  }

  // Page de lecture d'un guide (étapes : les guides de son dossier). lien(id) : attributs HTML de navigation propres au module ;
  // retour : HTML d'un bouton facultatif ; mot : nom d'un document dans le bandeau (« Guide », « Page »…)
  function vue(id, { lien, retour = "", mot = "Guide" } = {}) {
    const g = trouver(id);
    if (!g) return `<div class="wg"><p>Guide introuvable.</p>${retour}</div>`;
    const gs = duDossier(g.dossier);
    const n = gs.indexOf(g), prec = gs[n - 1], suiv = gs[n + 1];
    const etapes = gs.map((x, k) => `<button type="button" class="wg-pas${x === g ? " actif" : ""}" ${lien(x.id)} title="${esc(x.titre)}"><span class="wg-etape">${k + 1}</span>${x.emoji} ${esc(x.titre)}</button>`).join("");
    const som = g.sommaire.map(s => `<a class="wg-s${s.rang}" data-werb-ancre="${s.ancre}">${esc(s.texte)}</a>`).join("");
    const pied = `<div class="wg-pied">${prec ? `<button type="button" ${lien(prec.id)}>← ${esc(prec.titre)}</button>` : "<span></span>"}`
      + `${suiv ? `<button type="button" class="primary" ${lien(suiv.id)}>${esc(suiv.titre)} →</button>` : ""}</div>`;
    return `<div class="wg"><div class="wg-tete"><div class="wg-pas-liste">${etapes}</div>${retour}</div>
      <div class="wg-corps"><article class="wg-doc"><div class="wg-meta">${g.emoji} ${esc(mot)} ${n + 1} / ${gs.length} · ≈ ${g.minutes} min de lecture · <span class="wg-fichier">${esc(racine())}/${esc(g.fichier)}</span>${g.signature ? `<span class="wg-sig">${esc(g.signature)}</span>` : ""}</div>${liensInternes(g.html, lien)}${pied}</article>
      ${som ? `<aside class="wg-som"><div class="wg-som-t">📑 Sommaire</div>${som}</aside>` : ""}</div></div>`;
  }

  /* ---------------------------------------------------------------- style et ancres */
  const CSS = `
.wg{--wg-a:var(--navy,#1f3864);--wg-b:var(--navy-2,#2e5090);--wg-l:var(--line,#dfe3ea);--wg-m:var(--muted,#5d6676);--wg-f:#f6f8fc;--wg-fond:var(--card,#fff);--wg-i:var(--info-bg,#e8eef9);--wg-h:var(--navy-fond,var(--navy,#1f3864));--wg-h2:#2e5090;--wg-code:#eef1f6;--wg-cit:#fff8e6;--wg-cit-b:#e0a100;--wg-th-b:#c9d5ea;--wg-pre:#1d2330;--wg-pre-t:#e8ecf3}
@media screen{:root[data-theme=sombre] .wg,:root[data-theme=sombre] .wg-cartes{--wg-f:#1b2533;--wg-h2:#2a4a7a;--wg-code:#243041;--wg-cit:#3a2d0c;--wg-cit-b:#c79a00;--wg-th-b:#2e4a75;--wg-pre:#0b0f14}}
.wg-tete{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.wg-pas-liste{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.wg-pas{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--wg-l);background:var(--wg-fond);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font:inherit;font-size:13px;color:inherit}
.wg-pas:hover{border-color:var(--wg-b)}
.wg-pas.actif{background:var(--wg-h);border-color:var(--wg-h);color:#fff;font-weight:600}

.wg-pas.actif .wg-etape{background:rgba(255,255,255,.22);color:#fff}

/* Modèles de schémas Visio (.vsdx dessin, .vstx modèle) sans bibliothèque externe. Un fichier Visio est une archive ZIP de parties XML
   (Open Packaging Conventions) : on lit le répertoire central, on ne décompresse que les parties XML de visio/ et docProps/ (pages,
   masters, propriétés), on y remplace les balises {{NOM}} du cartouche, et l'on recopie toutes les autres parties octet pour octet
   (images, thèmes, données binaires). Un modèle .vstx devient un dessin .vsdx (type de contenu du document principal).
   Une balise coupée par une mise en forme (<cp IX='1'/> au milieu de {{VERSION}}) est reconnue : les éléments XML rencontrés sont
   conservés après la valeur. Les fichiers à macros (.vsdm, .vstm) et l'ancien format binaire (.vsd, .vst) sont refusés. */

    ["ORGANISATION", "Organisation (espace WerbSMSI)"], ["TYPE", "Type de schéma"], ["EXIGENCES", "Exigences couvertes (codes)"], ["VERSION", "Version"],
    ["DATE", "Date de création (JJ/MM/AAAA)"], ["AUTEUR", "Auteur (nom saisi à l'ouverture)"], ["PROPRIETAIRE", "Propriétaire (fonction)"],
    ["CLASSIFICATION", "Classification"], ["STATUT", "Statut"],
  ];
  const CONNUES = new Set(BALISES.map(b => b[0]));

  const CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const flux = (data, tr) => new Response(new Blob([data]).stream().pipeThrough(tr)).arrayBuffer();
  const X = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const aTraiter = nom => /\.xml$/i.test(nom) && /^(visio\/|docProps\/)/.test(nom);

  function lireArchive(buf) {

    const dv = new DataView(buf);
    let e = buf.byteLength - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error("Ce fichier n'est pas un fichier Visio (.vsdx ou .vstx) : archive illisible.");

      const nl = dv.getUint16(o + 28, true), xl = dv.getUint16(o + 30, true), cl = dv.getUint16(o + 32, true), lo = dv.getUint32(o + 42, true);

    <td class="mono"><a href="#" data-nav="fiche:${esc(s.id)}">${esc(s.id)}</a></td><td><b>${esc(s.titre)}</b><div class="small muted">${esc(s.type)}</div></td><td>${statutBadge(s)}</td>
    <td class="mono">${esc(s.version)}</td><td>${esc(s.proprietaire) || `<span class="muted">—</span>`}</td><td>${esc(frDate(echeance(s)))}</td><td>${esc(s.classification)}</td><td style="white-space:nowrap">${lienCellule(s)}</td></tr>`;
  const ENTETE = cases => `<tr>${cases ? `<th class="c sel"><input type="checkbox" data-cochetout="schemas"${lignesT().length && lignesT().every(r => (ui.coche.schemas || new Set()).has(r)) ? " checked" : ""} aria-label="Tout sélectionner"></th>` : ""}
    <th data-col="id">ID</th><th data-col="titre">Schéma</th><th data-col="statut">Statut</th><th data-col="version">Version</th><th data-col="proprietaire">Propriétaire</th><th data-col="revue">Prochaine revue</th><th data-col="classification">Classification</th><th data-col="lien">Fichier</th></tr>`;
  VUES.schemas = () => {
    if (ui.s) { const s = sch(ui.s); if (s) return fiche(s); ui.s = null; }
    const nArch = S.archives.schemas.length;
    const barreF = `<div class="row noprint" style="margin:10px 0"><button class="primary" data-act="ajout">➕ Schéma</button><span class="spacer"></span>
      <input id="filtreSch" type="search" placeholder="Rechercher" value="${esc(ui.q)}" style="max-width:200px">
      <select id="filtreExig">${opt(S.refs.exigences.map(([c, l]) => [c, `${c} — ${l}`]), ui.fe, "Toutes les exigences")}</select>
      <select id="filtreType">${opt(S.refs.types, ui.ft, "Tous les types")}</select>
      ${recu("si") ? `<select id="filtreSI">${opt(items("si").map(x => [x.id, `${x.id} — ${x.nom}`]), ui.fsi, "Tous les SI")}</select>` : ""}
      <select id="filtreStatut">${opt([...STATUTS.map(t => [t[0], t[1]]), ["arevoir", "Revue dépassée"]], ui.fs, "Tous les statuts")}</select>
      <label class="chk-in"><input type="checkbox" id="vuePlat"${ui.plat ? " checked" : ""}> Liste à plat</label></div>`;
    let corps;
    if (!ui.plat) {
      const l0 = filtres(S.schemas), grp = S.refs.exigences.map(([c]) => [c, l0.filter(s => s.exigences.includes(c))]), sans = l0.filter(s => !s.exigences.some(c => S.refs.exigences.some(p => p[0] === c)));
      corps = grp.filter(([c, l]) => l.length || !ui.fe || ui.fe === c).filter(([c]) => !ui.fe || ui.fe === c).map(([c, l]) => `<div class="card" data-groupe="${esc(c)}"><h2>${esc(exigNom(c))} ${couvBadge(couverture(c).etat)}</h2>
        ${l.length ? `<div class="tablewrap"><table class="t"><thead>${ENTETE(false)}</thead><tbody>${l.map(s => ligneSchema(s, 0, false)).join("")}</tbody></table></div>` : `<p class="muted small">Aucun schéma pour cette exigence.</p>`}</div>`).join("")
        + (sans.length && !ui.fe ? `<div class="card" data-groupe=""><h2>Sans exigence ${badge("à classer", "b-warn")}</h2><div class="tablewrap"><table class="t"><thead>${ENTETE(false)}</thead><tbody>${sans.map(s => ligneSchema(s, 0, false)).join("")}</tbody></table></div></div>` : "");
    } else {
      const l = lignesT(), sel = cochees(), larg = Object.keys(S.largeurs.schemas || {}).length;
      const barre = WerbSocle.tables.barre(sel.length, { archivees: sel.filter(r => r.archive).length, lectureSeule: WerbSocle.verrou.lectureSeule });
      corps = `<div class="row noprint outils-t"><button class="small" data-act="remplacer" title="Remplacer un texte dans une colonne, avec aperçu avant d'appliquer">🔁 Chercher / remplacer</button>
        ${nArch ? `<label class="chk-in"><input type="checkbox" id="voirArch"${ui.arch ? " checked" : ""}> Afficher les archivés (${nArch})</label>` : ""}
        ${larg ? `<button class="small" data-act="largeursDefaut" title="Revenir aux largeurs automatiques">↔ Largeurs par défaut</button>` : ""}<span class="small muted">Glisser le bord d'un en-tête pour régler la largeur d'une colonne.</span></div>${barre}
        <div class="card"><div class="tablewrap"><table class="t" data-table="schemas"><thead>${ENTETE(true)}</thead><tbody>${l.map((s, n) => ligneSchema(s, n, true)).join("") || `<tr><td colspan="9" class="empty">Aucun schéma.</td></tr>`}</tbody></table></div></div>`;
    }
    return `<h1>Registre des schémas</h1><p class="sub">Classés par catégorie d'exigence (un schéma qui couvre plusieurs exigences apparaît sous chacune). « Liste à plat » donne la sélection multiple, l'archivage et le chercher / remplacer.</p>
      ${LISTES_MSG ? `<div class="infobox small">${esc(LISTES_MSG)}</div>` : ""}${barreF}${corps || `<div class="card"><p class="muted">Aucun schéma.</p></div>`}`;
  };

  /* ---------------- fiche d'un schéma */
  function fiche(s) {
    const ro = !!s.archive, dis = ro ? " disabled" : "", pts = pointsSchema(s), dossier = siteDossier();
    const champ = (k, l, type = "text") => `<div><label class="f">${esc(l)}</label>${type === "area" ? `<textarea data-sf="${k}" rows="2"${dis}>${esc(s[k])}</textarea>` : `<input data-sf="${k}" type="${type}" value="${esc(s[k])}"${dis}>`}</div>`;
    const complet = cheminComplet(s);
    const ph = s.lien.type === "espace" ? (dossier || "sites/<CODE>/" + DOSSIER) + "/nom_du_schema.vsdx" : s.lien.type === "https" ? "https://…" : "\\\\serveur\\partage\\schemas\\nom.vsdx";
    return `<div class="row noprint" style="margin-bottom:8px"><button data-act="fermerFiche">← Registre des schémas</button><span class="spacer"></span>
        ${ro ? "" : `<button class="danger small" data-act="supprSchema" data-id="${esc(s.id)}">✕ Supprimer</button>`}</div>
      <h1>${esc(s.id)} — ${esc(s.titre || "Sans titre")} ${statutBadge(s)}</h1><p class="sub">${esc(s.type || "Type à préciser")} · version ${esc(s.version)} · classification ${esc(s.classification)}${s.modele ? ` · créé depuis le modèle <span class="mono">${esc(s.modele)}</span>` : ""}${ro ? " · <b>archivé</b> (lecture seule)" : ""}</p>
      ${pts.length ? `<div class="warnbox">${pts.map(esc).join(" · ")}</div>` : ""}
      <div class="card"><h2>Identification</h2><div class="fiche">${champ("titre", "Titre")}
        <div><label class="f">Type de schéma</label><select data-sf="type"${dis}>${opt(S.refs.types, s.type, "—")}</select></div>
        <div><label class="f">Format du fichier</label><select data-sf="format"${dis}>${opt(FORMATS, s.format)}</select></div>
        <div><label class="f">Classification</label><select data-sf="classification"${dis}>${opt(CLASSIFS, s.classification)}</select></div>
        <div class="lg">${champ("description", "Objet du schéma", "area")}</div><div class="lg">${champ("perimetre", "Périmètre (SI, zones, bâtiments…)", "area")}</div></div></div>
      <div class="card"><h2>Exigences couvertes</h2><p class="small muted">Ce que le schéma permet de démontrer. Un schéma peut couvrir plusieurs exigences.</p>
        <div class="chk-grille">${S.refs.exigences.map(([c, l]) => `<label class="chk-in"><input type="checkbox" data-sexig="1" value="${esc(c)}"${s.exigences.includes(c) ? " checked" : ""}${dis}> <b>${esc(c)}</b> ${esc(l)}</label>`).join("")}</div>
        ${s.exigences.filter(c => !S.refs.exigences.some(p => p[0] === c)).map(c => `<div class="small">${badge("retirée de la liste", "b-warn")} ${esc(c)}</div>`).join("")}</div>
      ${perimetreMap(s, dis)}
      <div class="card"><h2>Responsabilités et cycle de vie</h2><div class="fiche">${champ("proprietaire", "Propriétaire (fonction)")}${champ("responsable", "Responsable de la mise à jour")}${champ("version", "Version")}
        <div><label class="f">Statut</label><select data-sf="statut"${dis}>${opt(STATUTS.map(t => [t[0], t[1]]), s.statut)}</select></div>
        ${champ("approbateur", "Approbateur (fonction)")}${champ("approuveLe", "Approuvé le", "date")}${champ("creeLe", "Créé le", "date")}${champ("revueLe", "Dernière revue le", "date")}
        <div><label class="f">Prochaine revue</label><input data-sf="prochaineRevue" type="date" value="${esc(s.prochaineRevue)}"${dis}><div class="small muted">${s.prochaineRevue ? "Saisie" : echeance(s) ? `Calculée : ${esc(frDate(echeance(s)))} (dernière revue + ${S.parametres.revueMois} mois)` : `À défaut : dernière revue + ${S.parametres.revueMois} mois`}</div></div></div>
        <p class="small muted">« Approuvé » exige l'approbateur ; la date d'approbation est posée au jour si elle est vide. Après une revue : mettez à jour la version, la date de revue et, si le schéma change, la date d'approbation.</p></div>
      <div class="card"><h2>Fichier du schéma</h2><p class="small muted">WerbCartoSI référence le fichier : il ne le copie jamais dans sa base. Rangez les schémas dans l'espace du site${dossier ? ` (<code>${esc(dossier)}/</code>)` : ""} : le module vérifie leur présence et donne leur chemin complet.</p>
        <div class="fiche"><div><label class="f">Emplacement</label><select data-sl="type"${dis}>${opt(LIENS, s.lien.type)}</select></div>
          <div class="lg"><label class="f">${s.lien.type === "espace" ? "Chemin dans l'espace (depuis le dossier de l'espace)" : s.lien.type === "https" ? "Adresse web (https://…)" : "Chemin (serveur, partage ou lecteur)"}</label>
            <input data-sl="valeur" value="${esc(s.lien.valeur)}" placeholder="${esc(ph)}"${ro || !s.lien.type ? " disabled" : ""}></div></div>
        ${s.lien.type === "espace" && !ro ? `<div class="row" style="margin-top:8px"><button class="small" data-act="choisirFichier"${espaceOk() ? "" : ' disabled title="Ouvrez l\'espace et rattachez la base au site"'}>📁 Choisir dans le dossier des schémas…</button>
          <button class="small" data-act="verifier"${espaceOk() ? "" : " disabled"}>🔎 Vérifier la présence</button>${VERIF[s.id] === true ? badge("présent dans l'espace", "b-ok") : VERIF[s.id] === false ? badge("introuvable", "b-ko") : ""}</div><div id="choixFichiers"></div>` : ""}
        ${s.lien.valeur ? `<div class="row" style="margin-top:8px">${lienVisio(s) ? `<a class="bt-lien" data-visio href="${esc(lienVisio(s))}" title="Essai : Edge demande l'autorisation d'ouvrir Visio">🖉 Ouvrir dans Visio (essai)</a>` : ""}${s.lien.type === "https" && httpsOk(s.lien.valeur) ? `<button class="primary" data-act="ouvrirLien" data-id="${esc(s.id)}">🌐 Ouvrir</button>` : ""}
          ${complet ? `<code class="small" data-chemin>${esc(complet)}</code><button data-act="copierChemin" data-id="${esc(s.id)}">📋 Copier le chemin</button>` : s.lien.type === "espace" ? `<span class="small muted">Déclarez la <a href="#" data-nav="referentiels">racine de l'espace</a> pour obtenir le chemin complet.</span>` : ""}</div>` : ""}</div>
      ${historiqueHtml(s, ro)}
      <div class="card"><h2>Commentaire</h2><textarea data-sf="commentaire" rows="3"${dis}>${esc(s.commentaire)}</textarea></div>`;
  }
  // Périmètre WerbMap : SI, zones et actifs publiés par le site (CSI-7)
  function perimetreMap(s, dis) {
    const absents = absentsMap(s);
    const cases = (k, l, lib) => l.map(x => `<label class="chk-in"><input type="checkbox" data-sref="${k}" value="${esc(x.id)}"${s[k].includes(x.id) ? " checked" : ""}${dis}> <span class="mono">${esc(x.id)}</span> <span class="small">${esc(lib(x))}</span></label>`).join("");
    if (!recu("si") && !recu("zones") && !recu("actifs")) return `<div class="card" data-perimetre-map><h2>Périmètre WerbMap</h2><p class="small muted">Ouvrez l'espace et rattachez la base au site : les SI, zones et actifs publiés par WerbMap pourront être liés au schéma.</p>
      ${[...s.sis, ...s.zones, ...s.actifs].length ? `<p class="small">Liens enregistrés : <span class="mono">${esc([...s.sis, ...s.zones, ...s.actifs].join(", "))}</span></p>` : ""}</div>`;
    const q = norm(ui.fa), parSI = new Set(items("si").filter(x => s.sis.includes(x.id)).flatMap(x => x.actifs));
    const acts = items("actifs").filter(x => s.actifs.includes(x.id) || !q || norm([x.id, x.libelle, x.type, x.zone].join(" ")).includes(q)).slice(0, 300);
    return `<div class="card" data-perimetre-map><h2>Périmètre WerbMap</h2><p class="small muted">Ce que le schéma représente, d'après l'inventaire publié par WerbMap (reçu le ${esc(frDate((recu("si") || recu("actifs") || {}).majLe))}). Sert à la couverture des SI et sera publié avec la couverture.</p>
      ${absents.length ? `<div class="warnbox small">Absent de la dernière publication de WerbMap : <span class="mono">${esc(absents.join(", "))}</span> (renommé ou retiré dans WerbMap).</div>` : ""}
      <label class="f">Systèmes d'information</label><div class="chk-grille">${cases("sis", items("si"), x => x.nom) || `<span class="muted small">Aucun SI publié.</span>`}</div>
      <label class="f">Zones</label><div class="chk-grille">${cases("zones", items("zones"), x => x.nom) || `<span class="muted small">Aucune zone publiée.</span>`}</div>
      <label class="f">Actifs</label>${parSI.size ? `<p class="small muted">Actifs des SI cochés : <span class="mono">${esc([...parSI].join(", "))}</span></p>` : ""}
      <input id="filtreActifs" type="search" placeholder="Filtrer les actifs (TAG, libellé, type, zone)" value="${esc(ui.fa)}" style="max-width:340px;margin-bottom:6px">
      <div class="chk-grille">${cases("actifs", acts, x => `${x.libelle || x.type}${x.zone ? " · " + x.zone : ""}`) || `<span class="muted small">Aucun actif ${recu("actifs") ? "ne correspond" : "publié"}.</span>`}</div></div>`;
  }
  // Historique des versions (CSI-8)
  function historiqueHtml(s, ro) {
    const nv = ui.nv && ui.nv.id === s.id ? ui.nv : null, appr = s.statut === "approuve";
    return `<div class="card" data-historique><h2>Historique des versions</h2>
      ${ro ? "" : `<div class="row noprint" style="margin-bottom:8px"><button class="small" data-act="revueFaite"${appr ? "" : ' disabled title="Réservé à un schéma approuvé"'}>✔ Revue faite, sans changement</button>
        <button class="small" data-act="nouvelleVersion">📌 Nouvelle version…</button><span class="small muted">Une nouvelle version repasse le schéma en brouillon : il est à faire approuver.</span></div>`}
      ${nv ? `<div class="infobox" data-nv><div class="fiche"><div><label class="f">Nouvelle version (actuelle : ${esc(s.version)})</label><input id="nvVersion" value="${esc(nv.version)}"></div>
        <div class="lg"><label class="f">Nature du changement</label><input id="nvComment" value="${esc(nv.commentaire)}" placeholder="Ex. ajout de la liaison avec le site de secours"></div></div>
        <div class="row" style="margin-top:8px"><button class="primary small" data-act="validerVersion">Enregistrer la nouvelle version</button><button class="small" data-act="annulerVersion">Annuler</button></div></div>` : ""}
      <div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Événement</th><th>Version</th><th>Par</th><th>Approbateur</th><th>Commentaire</th></tr></thead><tbody>
      ${s.historique.slice().reverse().map(h => `<tr><td class="mono">${esc(frDate(h.date))}</td><td>${esc(h.evenement)}</td><td class="mono">${h.precedente ? `${esc(h.precedente)} → ` : ""}${esc(h.version)}</td><td>${esc(h.par)}</td><td>${esc(h.approbateur)}</td><td class="small">${esc(h.commentaire)}</td></tr>`).join("")
        || `<tr><td colspan="6" class="empty">Aucun événement : l'historique commence à la prochaine approbation, revue ou nouvelle version.</td></tr>`}</tbody></table></div></div>`;
  }

  /* ---------------- modèles de schémas */
  VUES.modeles = () => {
    if (ui.cree) return formCreation();
    const ok = espaceOk(), decrits = S.modeles;
    const fichiers = (MODS || []).map(f => ({ f, m: modeleDe(f.chemin) }));
    const absents = decrits.filter(m => MODS && !MODS.some(f => f.chemin === m.fichier));
    const ligne = ({ f, m }) => `<tr data-mod="${esc(f.chemin)}"><td>${lib(ORIGINES, f.origine)}</td><td class="mono small">${esc(f.nom)}</td>
      <td>${m ? `<b>${esc(m.nom || f.nom)}</b><div class="small muted">${esc(m.type)}${m.exigences.length ? " · " + esc(m.exigences.join(", ")) : ""}</div>` : badge("à décrire", "b-warn")}</td>
      <td class="small">${m ? (m.balises.length ? esc(m.balises.join(", ")) : badge("aucune balise", "b-warn")) + (m.inconnues.length ? ` ${badge("inconnues : " + m.inconnues.join(", "), "b-warn")}` : "") : ""}</td>
      <td style="white-space:nowrap">${m ? `<button class="small primary" data-act="preparer" data-chemin="${esc(f.chemin)}">▶ Créer un schéma</button> <button class="small" data-act="editModele" data-chemin="${esc(f.chemin)}">✎</button>`
        : `<button class="small" data-act="decrireModele" data-chemin="${esc(f.chemin)}">➕ Décrire</button>`}</td></tr>`;
    const edit = ui.editModele && modeleDe(ui.editModele);
    return `<h1>Modèles de schémas</h1><p class="sub">Les modèles Visio de l'entreprise (.vstx ou .vsdx) avec un cartouche à balises. Créer un schéma depuis un modèle remplit le cartouche, nomme le fichier et pré-remplit la fiche.</p>
      <div class="card"><h2>Bibliothèque</h2>
        <p class="small muted">Modèles communs du groupe : <code>${esc(DOSSIER_MODELES_GROUPE)}/</code> à la racine de l'espace (déposés par l'équipe du groupe). Modèles du site : <code>${esc(ok ? siteDossier() + "/modeles" : "sites/<CODE>/" + DOSSIER_MODELES_SITE)}/</code>. Déposez les fichiers avec l'Explorateur, puis 🔄 Actualiser.</p>
        ${E.ouvert ? "" : `<div class="warnbox small">Ouvrez l'espace (Intégration WerbSMSI) pour voir la bibliothèque. Sans espace, un modèle de votre poste reste utilisable.</div>`}
        <div class="row noprint" style="margin:8px 0">${E.ouvert ? `<button class="small" data-act="actualiserModeles">🔄 Actualiser</button>` : ""}${ok ? `<button class="small" data-act="creerDossierModeles">📁 Créer le dossier des modèles du site</button>` : ""}
          <label class="bt-fichier small">📂 Modèle de mon poste…<input type="file" id="modeleLocal" accept=".vstx,.vsdx" hidden></label></div>
        ${E.ouvert ? `<div class="tablewrap"><table class="t"><thead><tr><th>Origine</th><th>Fichier</th><th>Modèle</th><th>Balises du cartouche</th><th></th></tr></thead><tbody>
          ${fichiers.map(ligne).join("") || `<tr><td colspan="5" class="empty">Aucun modèle dans ces dossiers.</td></tr>`}</tbody></table></div>` : ""}
        ${absents.length ? `<p class="small">${badge("introuvable", "b-ko")} Décrits mais absents de l'espace : ${absents.map(m => `<span class="mono">${esc(m.fichier)}</span> <button class="small danger" data-act="supprModele" data-chemin="${esc(m.fichier)}">✕ Retirer</button>`).join(" · ")}</p>` : ""}</div>
      ${edit ? `<div class="card" data-edit-modele><h2>Modèle ${esc(edit.fichier.split("/").pop())}</h2><div class="fiche">
        <div><label class="f">Nom</label><input data-mf="nom" value="${esc(edit.nom)}"></div>
        <div><label class="f">Type proposé</label><select data-mf="type">${opt(S.refs.types, edit.type, "—")}</select></div>
        <div><label class="f">Classification proposée</label><select data-mf="classification">${opt(CLASSIFS, edit.classification)}</select></div>
        <div class="lg"><label class="f">Description</label><textarea data-mf="description" rows="2">${esc(edit.description)}</textarea></div></div>
        <label class="f">Exigences proposées</label><div class="chk-grille">${S.refs.exigences.map(([c, l]) => `<label class="chk-in"><input type="checkbox" data-mexig value="${esc(c)}"${edit.exigences.includes(c) ? " checked" : ""}> <b>${esc(c)}</b> ${esc(l)}</label>`).join("")}</div>
        <div class="row" style="margin-top:8px"><button class="small" data-act="analyserModele" data-chemin="${esc(edit.fichier)}">🔎 Relire les balises</button><span class="small muted">Analysé le ${esc(frDate(edit.analyseLe))}</span><span class="spacer"></span>
          <button class="small danger" data-act="supprModele" data-chemin="${esc(edit.fichier)}">✕ Retirer de la bibliothèque</button><button class="small" data-act="fermerModele">Fermer</button></div></div>` : ""}
      <div class="card"><h2>Balises du cartouche</h2><p class="small muted">Dans le modèle Visio, écrivez la balise telle quelle dans le texte d'une forme du cartouche (par exemple <code>Version : {{VERSION}}</code>). Elle est remplacée à la création ; une balise inconnue reste telle quelle.</p>
        <table class="t"><tbody>${WerbVisio.BALISES.map(([b, l]) => `<tr><td class="mono" style="width:200px">{{${esc(b)}}}</td><td>${esc(l)}</td></tr>`).join("")}</tbody></table></div>`;
  };
  // Formulaire de création depuis un modèle
  function formCreation() {
    const c = ui.cree, nom = nomNormalise(c);
    return `<div class="row noprint" style="margin-bottom:8px"><button data-act="annulerCreation">← Modèles de schémas</button></div>
      <h1>Nouveau schéma depuis un modèle</h1><p class="sub">Modèle <span class="mono">${esc(c.modele)}</span>${c.balises ? ` · balises : ${esc(c.balises.join(", ") || "aucune")}` : ""}</p>

      ["format", "Format", 12], [s => lib(LIENS, s.lien.type), "Emplacement", 26], [s => s.lien.valeur, "Fichier", 50], ["perimetre", "Périmètre", 30], ["description", "Objet", 40], ["modele", "Modèle d'origine", 30], ["sis", "SI (WerbMap)", 24], ["zones", "Zones", 18], ["actifs", "Actifs (TAG)", 30], [s => pointsSchema(s).join(" ; "), "Points d'attention", 50]];
    const feuilles = [
      feuilleXl("Couverture des exigences", [[x => x[0], "Code", 12], [x => x[1], "Exigence", 34], [x => lib(COUV, couverture(x[0]).etat), "Couverture", 14],
        [x => couverture(x[0]).schemas.map(s => `${s.id} ${s.titre} (${lib(STATUTS, s.statut)}, v${s.version}, revue ${frDate(echeance(s))})`).join(" ; "), "Schémas", 80],
        [x => (REPERES[x[0]] || ["", ""])[0], "Attendu", 50], [x => (REPERES[x[0]] || ["", ""])[1], "Repères", 50]], S.refs.exigences),
      feuilleXl("Schémas par exigence", [[x => x.c, "Code", 12], [x => exigLib(x.c), "Exigence", 30], ...colsSch.map(([f, l, w]) => [x => typeof f === "function" ? f(x.s) : x.s[f], l, w])],
        S.refs.exigences.flatMap(([c]) => S.schemas.filter(s => s.exigences.includes(c)).map(s => ({ c, s })))),
      feuilleXl("Schémas", colsSch, S.schemas),
      feuilleXl("Archivés", [["id", "ID", 9], ["titre", "Schéma", 36], ["type", "Type", 26], [s => s.archive.le.slice(0, 10), "Archivé le", 14], [s => s.archive.par, "Par", 20]], S.archives.schemas),
      feuilleXl("Historique des versions", [[x => x.s.id, "ID", 9], [x => x.s.titre, "Schéma", 36], [x => x.h.date, "Date", 12], [x => x.h.evenement, "Événement", 16], [x => x.h.precedente, "Version précédente", 10],
        [x => x.h.version, "Version", 10], [x => x.h.par, "Par", 20], [x => x.h.approbateur, "Approbateur", 22], [x => x.h.commentaire, "Commentaire", 40]],
        [...S.schemas, ...S.archives.schemas].flatMap(s => s.historique.map(h => ({ s, h })))),
      ...(recu("si") ? [feuilleXl("Couverture des SI", [[x => x.id, "SI", 18], [x => x.nom, "Nom", 30], [x => lib(COUV, couvertureSI(x.id).etat), "Couverture", 14],
        [x => couvertureSI(x.id).schemas.map(s => `${s.id} ${s.titre} (${lib(STATUTS, s.statut)}, v${s.version})`).join(" ; "), "Schémas", 80]], items("si"))] : []),
      feuilleXl("Modèles", [[m => lib(ORIGINES, m.origine).replace(/^\S+ /, ""), "Origine", 10], ["fichier", "Fichier", 50], ["nom", "Modèle", 30], ["type", "Type proposé", 26], ["exigences", "Exigences proposées", 30],
        ["classification", "Classification", 18], ["balises", "Balises", 40], ["description", "Description", 40]], S.modeles),
    ];
    const tete = { nom: "Informations", largeurs: [32, 70], lignes: [[T1("Rubrique"), T1("Valeur")], ["Site", LIAISON.site || ""], ["Base", fichier.nom || "(non enregistrée)"], ["Produit", WERB.ligne],

  // Lit un modèle de l'espace, détecte ses balises et l'ajoute (ou met à jour sa description) dans la bibliothèque
  async function analyserEtDecrire(chemin, nouveau) {
    let f = null;
    try { f = await E.fichier(chemin); } catch (e) { f = null; }
    if (!f) { toast(`${chemin} : fichier absent ou non autorisé.`, "err"); return; }
    let a;
    try { a = await WerbVisio.analyser(f); } catch (e) { toast(`${f.name} : ${e.message}`, "err"); return; }
    let m = modeleDe(chemin);
    if (!m) {
      m = normModele({ fichier: chemin, origine: chemin.startsWith(DOSSIER_MODELES_GROUPE + "/") ? "groupe" : "site", nom: f.name.replace(/\.(vsdx|vstx)$/i, "").replace(/[_-]+/g, " ") });
      S.modeles.push(m); journaliser("Ajout", "Modèle", chemin, "", "", m.nom);
    } else journaliser("Modification", "Modèle", chemin, "balises", m.balises.join(", "), a.balises.join(", "));
    Object.assign(m, { balises: a.balises, inconnues: a.inconnues, analyseLe: new Date().toISOString() });
    ui.editModele = chemin; marquer(); render();
    toast(a.balises.length ? `${a.balises.length} balise(s) reconnue(s) : ${a.balises.join(", ")}.` : "Aucune balise reconnue : le cartouche ne sera pas rempli.", a.balises.length ? "ok" : "err");
  }

    }

  }

  // Modification d'un champ
  function appliquer(el) {
    const d = el.dataset;
    if (d.par) {
      const k = d.par, av = S.parametres[k], v = k === "visioDirect" ? el.checked : k === "revueMois" ? Math.max(1, Math.min(60, Math.round(+el.value) || 12)) : el.value.trim();
      if (av === v) return;
      S.parametres[k] = v; journaliser("Modification", "Paramètres", "", k, av, v); marquer(); render(); return;
    }
    if (d.ref) {
      const id = d.ref, i = +d.i, v = S.refs[id][i], nv = el.value.trim();
      if (!nv || duGroupe(id, v)) { render(); return; }
      if (Array.isArray(v)) { const av = v[1]; if (av === nv) return; v[1] = nv; journaliser("Modification", "Référentiel", id, v[0], av, nv); }
      else {
        if (v === nv) return;
        if (S.refs[id].some((x, j) => j !== i && LCLE(x) === LCLE(nv))) { toast("Cette valeur existe déjà.", "err"); render(); return; }
        tous().filter(s => s.type === v).forEach(s => { s.type = nv; });   // un type renommé suit dans les fiches
        S.refs[id][i] = nv; journaliser("Modification", "Référentiel", id, "", v, nv);
      }
      marquer(); render(); return;
    }
    const s = SC(); if (!s || s.archive) return;
    if (d.sref !== undefined) {
      const k = d.sref, c = el.value; s[k] = el.checked ? [...new Set([...s[k], c])] : s[k].filter(x => x !== c);
      journaliser("Modification", "Schéma", s.id, { sis: "SI", zones: "zones", actifs: "actifs" }[k], el.checked ? "" : c, el.checked ? c : ""); marquer(); render(); return;
    }
    if (d.sexig !== undefined) {
      const c = el.value; s.exigences = el.checked ? [...new Set([...s.exigences, c])] : s.exigences.filter(x => x !== c);
      journaliser("Modification", "Schéma", s.id, "exigences", el.checked ? "" : c, el.checked ? c : ""); marquer(); render(); return;
    }
    if (d.sl) {
      const k = d.sl, av = s.lien[k], v = el.value.trim();
      if (av === v) return;
      s.lien[k] = v; if (k === "type") s.lien.valeur = ""; delete VERIF[s.id];
      journaliser("Modification", "Schéma", s.id, k === "type" ? "emplacement" : "fichier", av, v); marquer(); render(); return;
    }
    if (d.sf) {
      const k = d.sf, av = s[k], v = el.value.trim();
      if (k === "titre" && !v) { toast("Le titre est obligatoire.", "err"); render(); return; }
      if (k === "statut" && v === "approuve" && !s.approbateur.trim()) { toast("Renseignez l'approbateur avant d'approuver le schéma.", "err"); render(); return; }
      if (av === v) return;
      s[k] = v;
      if (k === "statut" && v === "approuve") {
        if (!s.approuveLe) s.approuveLe = auj(); if (!s.revueLe) s.revueLe = s.approuveLe;
        historiser(s, { evenement: "Approbation", date: s.approuveLe, approbateur: s.approbateur, fichier: s.lien.valeur });
      }
      journaliser("Modification", "Schéma", s.id, k, av, v); marquer();
      if (["titre", "type", "statut", "version", "approuveLe", "revueLe", "prochaineRevue", "classification", "proprietaire", "approbateur", "format", "creeLe"].includes(k)) render();
    }
  }

  document.addEventListener("click", e => {
    const nav = e.target.closest("[data-nav]");
    if (nav && !nav.closest("#sidebar")) {
      e.preventDefault();
      const n = nav.dataset.nav;
      if (n.startsWith("fiche:")) { ouvrirFiche(n.slice(6)); return; }
      vue = n; ui.s = null; render(); $("#main").scrollTop = 0; return;
    }
    if (e.target.closest("td.sel, th.sel")) return;   // case de sélection
    const a = e.target.closest("[data-act]");
    if (a && ACTIONS[a.dataset.act] && !a.disabled) { e.preventDefault(); ACTIONS[a.dataset.act](a, e); }
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (!S) return;
    if (el.dataset.coche) { const s = ui.coche.schemas = ui.coche.schemas || new Set(), r = lignesT()[+el.dataset.i]; if (r) s[el.checked ? "add" : "delete"](r); render(); return; }
    if (el.dataset.cochetout) { ui.coche.schemas = new Set(el.checked ? lignesT() : []); render(); return; }
    if (el.id === "vuePlat") { ui.plat = el.checked; ui.coche = {}; render(); return; }
    if (el.id === "voirArch") { ui.arch = el.checked; ui.coche = {}; render(); return; }
    if (["filtreExig", "filtreType", "filtreStatut", "filtreSI"].includes(el.id)) { ui[{ filtreExig: "fe", filtreType: "ft", filtreStatut: "fs", filtreSI: "fsi" }[el.id]] = el.value; ui.coche = {}; render(); return; }
    if (el.id === "filtreActifs") return;
    if (["smsiCible", "filtreJournal", "filtreSch", "nvExigCode", "nvExigLib", "nvType"].includes(el.id)) return;
    if (el.id === "modeleLocal") { choisirLocal(el); return; }
    if (el.dataset.cf !== undefined && ui.cree) { ui.cree[el.dataset.cf] = el.value.trim(); const n = $("[data-nom-cree]"); if (n) n.textContent = nomNormalise(ui.cree); return; }   // sans rendu : le clic sur « Créer » n'est pas perdu
    if (el.dataset.cexig !== undefined && ui.cree) { const k = el.value; ui.cree.exigences = el.checked ? [...new Set([...ui.cree.exigences, k])] : ui.cree.exigences.filter(x => x !== k); return; }
    if ((el.dataset.mf !== undefined || el.dataset.mexig !== undefined) && ui.editModele) { modifierModele(el); return; }
    appliquer(el);
  });
  document.addEventListener("input", e => {
    const id = e.target.id;
    if (id !== "filtreJournal" && id !== "filtreSch" && id !== "filtreActifs") return;
    if (id === "filtreJournal") ui.jq = e.target.value; else if (id === "filtreActifs") ui.fa = e.target.value; else ui.q = e.target.value;
    const pos = e.target.selectionStart; render(); const f = $("#" + id); f.focus(); f.setSelectionRange(pos, pos);
  });
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); const a = document.activeElement; if (S && a && a.closest && a.closest("#main") && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName) && !a.id) appliquer(a); enregistrer(false); }
    if (e.key === "Enter" && e.target.id === "nomUtil") ACTIONS.entrer();
  });
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  render();
})();
</script>
