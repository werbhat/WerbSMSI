* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
#app { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
#topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--navy-fond); color: #fff; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand small { display: block; opacity: .8; font-size: 12px; }
.tb-status, .tb-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--bandeau-pill); }
.pill.dirty { background: var(--modif); }
#topbar button { background: transparent; color: #fff; border-color: var(--bandeau-bord); }
#sidebar { background: var(--card); border-right: 1px solid var(--line); overflow-y: auto; }   /* menu : WerbSocle.menu */
.sig { margin: 18px 8px 8px; font-size: 11px; color: var(--muted); }
#main { padding: 18px 22px 40px; overflow: auto; }
h1 { margin: 0 0 4px; font-size: 22px; color: var(--navy); }
h2 { font-size: 16px; color: var(--navy); margin: 0 0 8px; }
h3 { font-size: 14px; color: var(--navy); margin: 14px 0 6px; }
.sub { margin: 0 0 16px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); margin-bottom: 14px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.kpi .v { font-size: 24px; font-weight: 700; color: var(--navy); }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi.alerte .v { color: var(--ko); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--card); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--navy-2); }
button.primary { background: var(--navy-fond); border-color: var(--navy-fond); color: #fff; }
button.danger { color: var(--ko); }
button.small { padding: 2px 8px; font-size: 12px; }
button:disabled { opacity: .5; cursor: default; }
/* Lien ou sélecteur de fichier présentés comme un bouton (ouverture dans Visio, modèle du poste) */
.bt-lien, .bt-fichier { display: inline-block; font: inherit; padding: 5px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; }
.bt-fichier.small { padding: 2px 8px; font-size: 12px; }
.bt-lien:hover, .bt-fichier:hover { border-color: var(--navy-2); }
input, select, textarea { font: inherit; width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--champ); color: var(--ink); }
textarea { min-height: 54px; resize: vertical; }
input[type=checkbox] { width: auto; }
.row input, .row select { width: auto; }
label.f { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
table.t { width: 100%; border-collapse: collapse; }
table.t th, table.t td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--th); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
table.t td.c { text-align: center; }
table.t td.n { text-align: right; white-space: nowrap; }
table.t tr.dom td { background: var(--rubrique-bg); color: var(--navy); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
td.empty { color: var(--muted); font-style: italic; text-align: center; }
.tablewrap { overflow: auto; max-height: calc(100vh - 210px); }
table.t.edit td { min-width: 110px; }
table.t.edit td.c, table.t.edit td.act, table.t.edit td.n { min-width: 0; white-space: nowrap; }
table.t.edit td.lg { min-width: 220px; }
table.t.edit td.sm { min-width: 92px; }
table.t.edit textarea { min-height: 34px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--na-bg); white-space: nowrap; }
.b-ok { background: var(--ok-bg); color: var(--ok); }
.b-warn { background: var(--warn-bg); color: var(--warn); }
.b-ko { background: var(--ko-bg); color: var(--ko); }

.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: Consolas, monospace; font-size: 12px; }
.infobox, .warnbox { padding: 10px 12px; border-radius: 6px; margin: 8px 0; }
.infobox { background: var(--info-bg); }
.warnbox { background: var(--warn-bg); color: var(--warn-t); }
.welcome { max-width: 760px; margin: 30px auto; }
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 14px; }
.choice { text-align: left; padding: 14px; display: grid; gap: 4px; }
.modal-back { position: fixed; inset: 0; background: var(--voile); display: grid; place-items: center; z-index: 40; }
.modal { background: var(--card); color: var(--ink); border-radius: 8px; padding: 18px 20px; width: min(560px, 92vw); max-height: 88vh; overflow-y: auto; }
.modal.large { width: min(980px, 95vw); }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.fiche { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.fiche .lg { grid-column: 1 / -1; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 50; }
.toast { padding: 10px 14px; border-radius: 6px; background: var(--toast); color: #fff; border: 1px solid var(--bandeau-pill); box-shadow: 0 4px 14px var(--ombre); }
.toast.ok { background: var(--toast-ok); }
.toast.err { background: var(--toast-ko); }

  body { background: #fff; }
}

.niv.n1 { background: var(--n1); } .niv.n2 { background: var(--n2); } .niv.n3 { background: var(--n3); } .niv.n4 { background: var(--n4); }
.crit { display: inline-block; min-width: 20px; margin: 0 2px 2px 0; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 700; text-align: center; background: var(--info-bg); color: var(--navy); }
.recu { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 400; background: var(--info-bg); color: var(--info); }
.kobox { background: var(--ko-bg); color: var(--kobox-t); border-left: 4px solid var(--n4); padding: 10px 12px; border-radius: 6px; margin: 8px 0; }
.b-muted { background: var(--na-bg); color: var(--muted); }
table.t tr.vm td { background: var(--rubrique-bg); color: var(--navy); font-weight: 700; }
.texte-pcr { max-width: 900px; line-height: 1.55; }
.texte-pcr h3 { margin: 16px 0 6px; }
.texte-pcr p { margin: 0 0 10px; }
.texte-pcr ul { margin: 0 0 10px; padding-left: 22px; }
.texte-pcr li { margin-bottom: 6px; }
textarea.texte-src { min-height: 420px; font-family: Consolas, monospace; font-size: 13px; }
@media print { .noprint { display: none !important; } table.t tr { break-inside: avoid; } }
/* Listes de choix du groupe (charte §5.9) */
.lg-grp { margin: 2px 0 4px; padding: 4px 8px; border-radius: 5px; background: var(--info-bg); color: var(--navy); }
.lg-ret { margin-top: 3px; color: var(--warn); }

/* Outils des tables (charte §7.7) */
table.t th.c, table.t td.c { width: 34px; min-width: 0; text-align: center; }
table.t th.c input, table.t td.c input { width: auto; }
tr.archivee td { opacity: .55; }
tr.archivee td.c { opacity: 1; }
.outils-t { margin: 4px 0 8px; gap: 8px; flex-wrap: wrap; }
label.chk-in { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
label.chk-in input { width: auto; }
/* Fiche prestataire : un bloc par rubrique ; liste d actifs à cocher */
.chk-grille { display: grid; gap: 2px 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.crit-detail td { padding: 2px 8px; }

window.WERB_GUIDES = [{ fichier: "1-Tenir_le_registre_des_schemas.md", texte: "<!-- WerbCartoSI – Développé par @WerbHat -->\n# Tenir le registre des schémas d'architecture\n\nUn auditeur NIS2, ISO 27001 ou IEC 62443 pose toujours les mêmes questions : **avez-vous un schéma de votre architecture ? est-il à jour ? qui l'a validé ? montrez-le-moi.** Un schéma qui existe mais que personne ne retrouve, ou dont la dernière version date de cinq ans, ne prouve rien. Et le jour d'un incident, c'est ce schéma que l'équipe ouvrira en premier.\n\nWerbCartoSI tient le **registre** des schémas d'un site. Il ne dessine pas : les schémas restent dans leurs fichiers (Visio, PDF…) ; le registre dit **ce qu'ils démontrent, qui en répond, quand ils ont été revus, et où ils sont**.\n\n## 1. Le principe : un schéma, une fiche, une ou plusieurs exigences\n\n| Notion | Ce que c'est | Exemple |\n|---|---|---|\n| **Type de schéma** | Sa nature | Réseau logique, zones et conduits, architecture d'administration |\n| **Catégorie d'exigence** (code `EX-…`) | Ce qu'il permet de démontrer | `EX-ZONES` « Zones et conduits » (NIS2 7.A, IEC 62443-3-2), `EX-CARTO` « Cartographie du SI » (NIS2 5.A.1-EI/EE, ISO/IEC 27001 A.5.9) |\n| **Couverture** | L'exigence a-t-elle au moins un schéma approuvé et revu à temps ? | Couverte, à revoir, en cours, non couverte |\n\n**EX = exigence** : `EX-ZONES` se lit « exigence : zones et conduits ». Ce n'est ni un exemple, ni un numéro de schéma (les schémas sont numérotés `SCH-001`…).\n\nUn même schéma peut couvrir plusieurs exigences : un schéma des zones et conduits sert aussi la cartographie du SI. Ce que chaque catégorie attend, avec un exemple annoté : [Les schémas attendus, un par un](3-Les_schemas_attendus_un_par_un.md).\n\nLes catégories d'exigence et les types sont des **listes de choix du groupe** : le RSSI les ajuste une fois dans le portail (*Administration › Listes de choix du groupe*), tous les sites parlent le même langage. Chaque site peut ajouter ses propres valeurs.\n\n## 2. Mettre en place\n\n1. **Ouvrir l'espace et rattacher la base au site** (*⚙️ Base › Intégration WerbSMSI*). Ranger la base dans `sites/<CODE>/inventaires/`.\n2. **Créer le dossier des schémas** (bouton 📁 de la même page) : `sites/<CODE>/inventaires/schemas/`. Il hérite des droits du dossier du site : seule l'équipe du site y accède.\n3. **Déclarer la racine de l'espace** (*Référentiels et paramètres*), par exemple `S:\\SMSI_GROUPE` ou `\\\\serveur\\partage\\SMSI_GROUPE`. Le navigateur ne connaît pas l'emplacement du dossier sur le disque : cette racine permet au module de reconstituer le chemin complet de chaque fichier.\n4. **Fixer la fréquence de revue** par défaut (12 mois proposés).\n\n## 3. Enregistrer un schéma\n\nDeux façons de commencer : **depuis un modèle** (*Modèles de schémas* › ▶ Créer un schéma : le fichier Visio est créé, cartouche rempli, et la fiche est pré-remplie — voir le guide [Préparer les modèles de schémas](2-Preparer_les_modeles_de_schemas.md)), ou pour un schéma qui existe déjà, *Registre des schémas* › **➕ Schéma**, puis la fiche :\n\n- **Identification** : titre, type, format, **classification** (un schéma d'architecture est presque toujours en *Diffusion restreinte* ou *Confidentiel*), objet, périmètre.\n- **Exigences couvertes** : cochez ce que le schéma démontre.\n- **Responsabilités** : le **propriétaire** (la fonction qui répond du schéma) et le **responsable de la mise à jour**.\n- **Cycle de vie** : version, statut, dates de création, de dernière revue et d'approbation, prochaine revue (calculée ou saisie).\n- **Fichier** :\n  - *dans l'espace SMSI du site* (recommandé) : **📁 Choisir dans le dossier des schémas** propose les fichiers rangés ; le module **vérifie leur présence** et **📋 copie le chemin complet**, à coller dans la barre d'adresse de l'Explorateur pour ouvrir le fichier dans Visio ;\n  - *adresse web* (SharePoint, OneDrive, Git) : **🌐 Ouvrir** dans un nouvel onglet ;\n  - *chemin réseau* : **📋** copie le chemin.\n\n> Un navigateur ne peut pas lancer Visio directement sur un fichier du disque : c'est pourquoi le module copie le chemin complet plutôt que d'ouvrir le fichier.\n\n## 4. Lier le schéma à l'inventaire WerbMap\n\nQuand l'espace est ouvert et que le site a publié son inventaire depuis WerbMap, la fiche propose un **Périmètre WerbMap** : cochez les **SI**, les **zones** et, si besoin, les **actifs** (par leur TAG) que le schéma représente.\n\n- *Couverture des exigences* montre alors la **couverture de chaque SI** : un SI sans schéma approuvé est signalé au tableau de bord. C'est la question que pose l'auditeur : « montrez-moi le schéma de ce système ».\n- Si un SI, une zone ou un actif disparaît de WerbMap (renommé ou retiré), la fiche le signale : le schéma est probablement à revoir.\n- Les données reçues sont copiées dans la base : la fiche reste lisible sans l'espace.\n\n## 5. Approuver et revoir\n\n| Statut | Signification |\n|---|---|\n| Brouillon | En cours de dessin |\n| En validation | Soumis au propriétaire ou au RSSI |\n| **Approuvé** | Validé : l'**approbateur** (fonction) est obligatoire, la date d'approbation est posée au jour |\n| Obsolète | Remplacé ou plus valable : il sort de la couverture, la fiche reste pour la trace |\n\nÀ chaque **revue** (une fois par an au moins, et après tout changement d'architecture) : vérifiez le schéma, mettez à jour la **version** et la **date de revue**, et l'**approbation** si le schéma a changé. Un schéma approuvé dont la revue est dépassée passe « à revoir » : l'exigence qu'il couvre n'est plus démontrée.\n\nDeux boutons de la fiche tiennent l'**historique des versions** :\n\n- **✔ Revue faite, sans changement** : le schéma a été vérifié et reste juste ; la date de revue passe au jour, la prochaine revue est recalculée.\n- **📌 Nouvelle version…** : le schéma a changé ; saisissez la nouvelle version (proposée) et la **nature du changement**. Un schéma approuvé repasse en **brouillon** : l'exigence qu'il couvre n'est plus démontrée tant que la nouvelle version n'est pas approuvée.\n\nChaque approbation y est aussi inscrite, avec l'approbateur. L'auditeur voit ainsi qui a validé quelle version, et quand.\n\n**Approuver, c'est contrôler.** Passer le statut à *Approuvé* ouvre la liste des contrôles avant approbation (cartouche, légende, TAG, chemins interdits, exceptions, aucun secret, comparaison au terrain, exigences ; détail au guide [Les schémas attendus, un par un](3-Les_schemas_attendus_un_par_un.md), §11). Les huit sont exigés ; ils sont gardés dans l'historique avec l'approbation.\n\n**Le fichier approuvé est figé par son empreinte.** À l'approbation, le module calcule l'empreinte SHA-256 du fichier rangé dans l'espace (pour un schéma sur SharePoint ou sur un partage : 📂 *Relever depuis un fichier du poste*). Si le fichier change ensuite sans nouvelle version, le schéma passe *à revoir* : le schéma montré en audit ne serait plus celui qui a été approuvé. Deux sorties : 📌 *Nouvelle version* si le dessin a changé, *Approuver à nouveau* si la modification est mineure (avec les contrôles). La revue « sans changement » est alors refusée.\n\n**WerbMap déclenche la revue.** À l'approbation et à chaque revue, le module prend un **instantané** du périmètre du schéma dans WerbMap : les actifs qu'il représente (liés, des SI liés, des zones liées) et les conduits entre zones qui les touchent. Quand WerbMap publie un actif ou un conduit ajouté ou retiré, le schéma passe *à revoir* et la fiche liste les écarts. Si le schéma reste juste, ✔ *Revue faite* (l'instantané est repris, les écarts examinés sont tracés) ; sinon 📌 *Nouvelle version*.\n\n**Préparer les revues.** *📊 Pilotage › Échéances* liste les revues des schémas et des non-applicabilités : en retard, dans les 30 à 180 jours, au-delà. Le menu signale celles à moins de 30 jours.\n\nUn schéma qui n'a plus lieu d'être : **Obsolète** (il reste visible et tracé) ou **archivage** (*Liste à plat*, sélection, 🗄 Archiver : il sort du registre, son identifiant n'est jamais réattribué).\n\n## 6. Couverture par SI et exigences non applicables\n\nUne exigence couverte « quelque part » ne suffit pas : l'auditeur choisit un système et demande **son** schéma. *Couverture des exigences › Couverture par SI* croise les SI publiés par WerbMap et les exigences.\n\n**Quelles exigences sont attendues pour un SI ?** Chaque catégorie a une **portée**, réglable dans *Référentiels et paramètres* :\n\n| Portée | Signification | Par défaut |\n|---|---|---|\n| **Chaque SI** | Un schéma par SI | `EX-CARTO` |\n| **Les SI sensibles** | Un schéma pour chaque SI sensible | `EX-ZONES`, `EX-FLUX`, `EX-ADMIN`, `EX-REPRISE` |\n| **Le site (une fois)** | Un schéma pour tout le site, hors tableau par SI | `EX-RESEAU`, `EX-ACCES`, `EX-LOCAUX` |\n\nUn SI est **sensible** quand WerbMap le dit : D, I ou C au seuil (3 par défaut, réglable), un actif dans une zone *process* ou *métier critique* (ou de SL-T 2 et plus), ou un actif critique. Un SI que WerbMap n'a pas encore coté en D, I, C est traité comme sensible, par prudence : cotez-le dans WerbMap.\n\n**Quand une case est-elle couverte ?** Un schéma approuvé et revu à temps vise l'exigence **et** il est lié au SI, ou à une zone où le SI a des actifs (fiche du schéma › *Périmètre WerbMap*). Une case « ✕ Absent » est un schéma à produire, ou un schéma existant qu'il faut lier. Le tableau de bord le signale.\n\n**Non applicable, justifié.** Certaines exigences ne concernent pas le site, ou un SI : pas d'accès distant, pas de local technique propre, un SI administré uniquement en local. Ne laissez pas l'exigence « non couverte » : déclarez-la **non applicable** (bouton *Non applicable…* de l'exigence, ou d'une case du tableau par SI). Trois éléments sont exigés, ceux qu'un auditeur attend :\n\n1. la **justification**, écrite pour être relue par quelqu'un qui ne connaît pas le site ;\n2. la **fonction** qui décide (RSSI du site, direction du site), pas un nom ;\n3. la **date** de la décision.\n\nLa décision se **revoit** comme un schéma (même fréquence) : *✔ Revue faite* confirme qu'elle reste vraie ; un changement d'architecture (nouvel accès distant, nouvelle salle) peut la rendre fausse, retirez-la alors. Les exigences non applicables sortent du décompte des exigences couvertes, sont publiées avec leur justification et sont proposées dans WerbNIS2 comme élément de preuve.\n\n> Non applicable n'est pas « pas encore fait ». Une exigence qui s'applique mais n'a pas de schéma reste non couverte : c'est un écart à traiter, pas à masquer.\n\n## 7. Suivre et prouver\n\n- Le **tableau de bord** liste les points d'attention : exigence non couverte, schéma sans propriétaire, sans lien, introuvable dans l'espace, revue dépassée.\n- *Couverture des exigences* donne, pour chaque catégorie, l'état et les schémas qui la couvrent, avec les **repères** (articles NIS2, mesures ISO, exigences IEC 62443) qui la demandent.\n- **📤 Publier la couverture** (*Intégration WerbSMSI*) : le portail affiche alors, pour le site et pour le groupe, les exigences couvertes par des schémas. Seules des métadonnées sont publiées (titres, versions, dates), jamais l'emplacement des fichiers ni la description de l'architecture. Quand la couverture change, le module signale qu'il faut publier à nouveau. La fiche SI de WerbMap affiche les schémas de chaque SI, et l'audit NIS2 du site (WerbNIS2) les propose comme preuves des points de cartographie, de cloisonnement, de filtrage, d'administration, d'accès distants, de continuité et d'accès physiques.\n- **📊 Export Excel** : couverture des exigences, schémas par exigence, liste complète. C'est la preuve à fournir en audit ou à verser dans WerbNIS2 et WerbIEC62443. Le classeur décrit l'architecture du site : rangez-le avec les mêmes droits que les schémas.\n\n### Matrice des flux et dossier de preuve\n\n- Un schéma de flux montre les conduits ; l'auditeur demande aussi **chaque flux** : source, destination, port, qui le filtre, pourquoi. La fiche d'un schéma `EX-FLUX` ou `EX-ZONES` reprend en **annexe** les règles de la matrice de flux de WerbMap qui touchent son périmètre, et signale celles à examiner : flux entre zones sans pare-feu, sans justification, règle « any ». Corrigez-les dans WerbMap, publiez, puis 📊 *Annexe Excel* pour joindre la matrice au schéma.\n- *📊 Pilotage › Dossier de preuve* rassemble tout pour l'audit : une page par catégorie d'exigence, avec l'objectif, les repères, la décision de non-applicabilité, les schémas (approbation, contrôles, empreinte), la couverture par SI et la matrice des flux. 🖨 *Imprimer / PDF* ; le jour de l'audit, ouvrez les schémas depuis leur fichier : l'empreinte montre que c'est la version approuvée.\n\n## Bonnes pratiques\n\n- **Un nom de fichier qui porte l'identifiant** : `SCH-012_Reseau_logique_L2_v1.3.vsdx`. On retrouve la fiche depuis le fichier, et l'inverse.\n- **Un cartouche dans chaque schéma** : titre, site, version, date, classification, propriétaire. Un schéma imprimé ou copié garde ainsi son contexte.\n- **Pas de secret dans un schéma** : ni mot de passe, ni clé, ni configuration complète. Les adresses et les noms d'équipements suffisent.\n- **Revoir après chaque changement** : un nouvel équipement, un nouveau flux ou une nouvelle interconnexion rendent le schéma faux, donc dangereux en cas d'incident.\n- **Dessiner à partir de l'inventaire** : les actifs, zones, VLAN et flux de WerbMap sont la source ; le schéma les représente, il ne les remplace pas.\n" },
{ fichier: "2-Preparer_les_modeles_de_schemas.md", texte: "<!-- WerbCartoSI – Développé par @WerbHat -->\n# Préparer les modèles de schémas\n\nDes schémas dessinés chacun à sa façon se relisent mal : on ne sait plus quelle version on a sous les yeux, ni qui l'a validée, ni s'il est diffusable. Un **modèle commun** règle cela une fois pour toutes : même format de page, même légende, et surtout un **cartouche** (titre, site, version, date, classification, propriétaire) que WerbCartoSI remplit tout seul à la création.\n\n## 1. Le principe\n\n1. L'entreprise prépare un ou plusieurs **modèles Visio** (.vstx de préférence, ou .vsdx) avec un cartouche contenant des **balises**.\n2. Les modèles sont déposés dans l'espace WerbSMSI : modèles **communs** au groupe ou modèles **propres au site**.\n3. Dans WerbCartoSI, chaque modèle est **décrit** une fois (nom, type et exigences proposés).\n4. **▶ Créer un schéma** : le module copie le modèle, remplit le cartouche, donne au fichier un **nom normalisé** et crée la fiche du schéma en brouillon, déjà liée au fichier.\n\n\n## 2. Écrire le cartouche\n\nDans Visio, ouvrez le modèle et écrivez les balises **telles quelles** dans le texte des formes du cartouche, par exemple `Version : {{VERSION}}`.\n\n| Balise | Remplacée par |\n|---|---|\n| `{{TITRE}}` (ou `{{NOM}}`) | Titre du schéma |\n| `{{ID}}` | Identifiant de la fiche (SCH-012) |\n| `{{SITE}}`, `{{SITE_NOM}}` | Code et nom du site |\n| `{{ORGANISATION}}` | Organisation de l'espace WerbSMSI |\n| `{{TYPE}}`, `{{EXIGENCES}}` | Type de schéma, codes des exigences couvertes |\n| `{{VERSION}}`, `{{DATE}}`, `{{STATUT}}` | Version, date de création, statut (Brouillon) |\n| `{{AUTEUR}}`, `{{PROPRIETAIRE}}` | Votre nom, propriétaire (fonction) |\n| `{{CLASSIFICATION}}` | Classification (Diffusion restreinte, Confidentiel…) |\n\nConseils :\n\n- Tapez chaque balise **d'un seul trait**. Si vous changez la mise en forme au milieu d'une balise, WerbCartoSI la reconnaît quand même, mais c'est plus sûr de l'éviter.\n- Les balises peuvent aussi figurer dans les **propriétés du fichier** (Fichier › Informations › Propriétés : titre, sujet, mots-clés) : elles sont remplies de la même façon.\n- Une balise inconnue (faute de frappe) reste telle quelle : la page Modèles la signale après description.\n- Enregistrez le modèle au format **Modèle Visio (.vstx)** : Visio crée alors un nouveau dessin à chaque ouverture. Les fichiers à macros (.vsdm, .vstm) et l'ancien format (.vsd, .vst) ne sont pas acceptés.\n- **Aucune donnée réelle dans un modèle** : ni adresse, ni nom d'équipement, ni mot de passe. C'est un gabarit vide.\n\n## 3. Où déposer les modèles\n\n| Dossier | Pour qui | Qui l'alimente |\n|---|---|---|\n| `modeles/schemas/` à la racine de l'espace | Tous les sites : modèles communs du groupe | L'équipe SMSI du groupe |\n| `sites/<CODE>/inventaires/schemas/modeles/` | Le site seulement | L'équipe du site (📁 Créer le dossier des modèles du site) |\n\nDéposez les fichiers avec l'Explorateur, puis dans WerbCartoSI : *Modèles de schémas* › **🔄 Actualiser**. Un nouveau fichier apparaît « à décrire » : **➕ Décrire** lit ses balises ; donnez-lui un nom, le type et les exigences qu'il sert le plus souvent, et la classification proposée.\n\nSans espace ouvert (ou pour un essai), **📂 Modèle de mon poste…** utilise un fichier de votre ordinateur pour une création, sans l'ajouter à la bibliothèque.\n\n## 4. Créer un schéma\n\n1. **▶ Créer un schéma** sur la ligne du modèle.\n2. Saisissez le titre, ajustez le type, la classification, la version (0.1 par défaut), le propriétaire et les exigences.\n3. Le nom du fichier s'affiche : `SCH-012_Zones_et_conduits_ligne_3_LYON_v0.1.vsdx`.\n4. **✨ Créer le schéma** : Edge demande où enregistrer. La première fois, allez dans le **dossier des schémas du site** (`sites/<CODE>/inventaires/schemas/`) ; Edge s'en souvient ensuite.\n5. La fiche s'ouvre en **brouillon**, liée au fichier. **📋 Copier le chemin**, collez-le dans la barre d'adresse de l'Explorateur : le schéma s'ouvre dans Visio, cartouche déjà rempli.\n\nSi le fichier a été enregistré ailleurs, la fiche le signale (« introuvable ») : déplacez-le dans le dossier des schémas du site, ou corrigez le chemin dans la fiche.\n\n> Le module n'écrit jamais dans le dossier des modèles et ne copie jamais un modèle dans sa base : il le lit, en fait une copie remplie, et c'est vous qui choisissez où l'enregistrer.\n\n## 5. Les modèles fournis\n\nCinq modèles d'exemple accompagnent le module (dossier `exemples/modeles/`, et `modeles/schemas/` de l'espace de démonstration). Copiez-les dans `modeles/schemas/` de votre espace, adaptez-les à la charte graphique de l'entreprise, puis décrivez-les.\n\n| Modèle | Pour quoi | Ce qu'il contient |\n|---|---|---|\n| `Modele_schema_A3_cartouche.vstx` | Tout schéma | Une zone de dessin libre et le cartouche à balises |\n| `Modele_zones_conduits_A3.vstx` | **EX-ZONES** (et EX-CARTO) | Zones par criticité (couleurs de WerbMap) avec leur SL-T, conduits et équipement de filtrage de chacun, tableau des conduits (de → vers, équipement, SL-T visé, contre-mesures) |\n| `Modele_acces_distants_A3.vstx` | **EX-ACCES** | Tiers et sites extérieurs, point d'entrée unique (VPN, bastion, MFA), zones atteintes, chemins interdits (modem 4G, prise en main directe, contournement), tableau des accès externes |\n| `Modele_administration_A3.vstx` | **EX-ADMIN** | Poste et réseau d'administration dédiés, bastion, ressources administrées par zone, exceptions justifiées, chemin interdit depuis la bureautique, tableau des ressources administrées |\n| `Modele_sauvegarde_reprise_A3.vstx` | **EX-REPRISE** | Zones, flux de sauvegarde avec leur heure, copie hors ligne mise en évidence, restauration testée, ordre de redémarrage avec RTO et RPO |\n\nToutes les planches spécialisées ont la même organisation : le dessin en haut, un tableau à remplir au milieu (les détails que l'auditeur demande), la légende en bas à gauche, le cartouche en bas à droite. Les chemins **interdits** sont dessinés en rouge pointillé : s'ils existent sur le site, ils sont à supprimer, pas à documenter comme normaux.\n\n| Modèle | Points NIS2 qu'il aide à prouver |\n|---|---|\n| Zones et conduits | 7.A.1-EI/EE à 7.A.4-EE, 7.B.1-EI/EE et 7.B.2-EE (et IEC 62443-3-2) |\n| Accès distants et interconnexions | 3.A.1-EI/EE, 7.A.7-EI/EE et 7.A.8-EE, 8.1-EI/EE |\n| Architecture d'administration | 19.1-EE, 19.7-EE et 19.8-EE (entités essentielles) |\n| Sauvegarde et reprise | 13.1-EI/EE, 13.3-EI/EE et 13.6-EE (et 13.2-EI/EE par la date du test, à confirmer par le registre de WerbExploitation) |\n\nLe modèle « Sauvegarde et reprise » répond aux questions de l'auditeur sur la continuité :\n\n| Question de l'auditeur | Où sur la planche | Point NIS2 |\n|---|---|---|\n| Qu'est-ce qui est sauvegardé, et à quelle fréquence ? | Les flèches pleines vers le stockage de sauvegarde, avec leur heure | 13.1-EI/EE |\n| Une copie échappe-t-elle à un rançongiciel ? | Le cadre orange en pointillés : support déconnecté, lieu protégé | 13.3-EI/EE |\n| Dans quel ordre redémarrer, en combien de temps ? | Le bandeau « Ordre de redémarrage », avec RTO et RPO | 13.6-EE |\n| La restauration a-t-elle été testée ? | La flèche en pointillés, avec la date et la durée du dernier essai | 13.2-EI/EE |\n\nEn remplissant la planche :\n\n- remplacez chaque « TAG … » par le TAG réel de WerbMap ;\n- n'oubliez pas les **programmes des automates** : sans eux, un automate remplacé ne redémarre pas ;\n- écrivez la date et la durée du **dernier test de restauration réel**, pas une intention ;\n- gardez le lieu de la copie hors ligne générique (« armoire forte »), jamais son code d'accès.\n\nLe schéma montre l'architecture voulue. La preuve que les sauvegardes tournent et sont testées reste le registre des sauvegardes de WerbExploitation.\n\n## 6. Partir d'une ébauche générée depuis WerbMap\n\nPour un premier schéma « Zones et conduits », inutile de partir d'une page blanche : *Modèles de schémas › Ébauche « Zones et conduits » depuis WerbMap* dessine les **zones** du site (couleur de criticité, SL-T), leurs **actifs** (TAG) et les **conduits** entre zones, avec le **pare-feu** que désigne la matrice de flux. Un conduit sans pare-feu est tracé en rouge pointillé : c'est un point à traiter, dans la matrice ou sur le terrain.\n\n1. Choisissez le **périmètre** : tout le site, ou un SI (ses actifs et leurs zones) si le site a beaucoup de zones.\n2. Donnez le **titre** et le **propriétaire** ; relisez l'aperçu.\n3. **✨ Créer le schéma** : le fichier Visio est enregistré dans le dossier des schémas et sa fiche est créée en brouillon (EX-ZONES, EX-CARTO, SI et zones liés).\n4. Ouvrez-le dans Visio et **reprenez-le** : disposition, regroupements, libellés, contre-mesures des conduits. Comparez-le au terrain, puis faites-le approuver (contrôles avant approbation).\n\nL'ébauche ne remplace pas le dessin : elle évite la saisie et garantit que les TAG et les zones sont ceux de l'inventaire.\n\n## 7. Ouvrir directement dans Visio (essai)\n\n*Référentiels et paramètres* › **Ouverture directe dans Visio (essai)** ajoute un bouton « 🖉 Ouvrir dans Visio » aux fiches des schémas Visio. Il utilise le lien `ms-visio:` d'Office : Edge demande l'autorisation d'ouvrir Visio. Selon la version d'Office, cela fonctionne pour un fichier sur SharePoint ou OneDrive, et pas toujours pour un fichier d'un lecteur réseau. Essayez sur votre poste avant de le recommander ; la copie du chemin reste la méthode sûre.\n\n## Bonnes pratiques\n\n- **Un modèle par usage**, pas un par personne : réseau, zones et conduits, administration, sauvegarde et reprise suffisent souvent.\n- **Versionner les modèles** eux-mêmes (`Modele_reseau_v2.vstx`) et retirer de la bibliothèque ceux qui ne doivent plus servir.\n- **Une légende commune** dans le modèle (couleurs des zones, symboles des pare-feu, des liaisons distantes) : les schémas de tous les sites se lisent de la même façon.\n- **La classification bien visible** dans le cartouche : un schéma imprimé ou envoyé par erreur doit montrer tout de suite qu'il ne se diffuse pas.\n" },
{ fichier: "3-Les_schemas_attendus_un_par_un.md", texte: "<!-- WerbCartoSI – Développé par @WerbHat -->\n# Les schémas attendus, un par un\n\nUn auditeur ne demande pas « un schéma » : il demande **la preuve** que le SI est connu, cloisonné, filtré, administré proprement, joignable de l'extérieur seulement par un chemin maîtrisé, et qu'il peut repartir après un sinistre. Chacune de ces preuves a son schéma. Ce guide les présente un par un : **à quoi sert le schéma, ce que l'auditeur y cherche, ce qu'il doit montrer, ce qu'il ne doit pas contenir**, et les exigences précises des référentiels qu'il aide à démontrer.\n\n## 1. Lire les codes « EX- »\n\n**EX = exigence.** `EX-ZONES` se lit « exigence : zones et conduits ». Les huit codes proposés sont des **catégories d'exigence** : ce qu'un schéma doit **démontrer**, quel que soit son dessin. Ce ne sont ni des exemples, ni des numéros de schéma (les schémas sont numérotés `SCH-001`, `SCH-002`…).\n\n| Notion | Question à laquelle elle répond | Exemple |\n|---|---|---|\n| **Type de schéma** | Qu'est-ce que c'est ? (sa forme) | « Réseau physique (câblage, baies) » |\n| **Catégorie d'exigence** (`EX-…`) | Qu'est-ce que ça prouve ? | `EX-RESEAU` et `EX-LOCAUX` |\n| **Repères** | Quel texte le demande ? | NIS2 5.A.1-EI/EE, ISO/IEC 27001 A.7.12, guide d'hygiène de l'ANSSI mesure 4 |\n\nChaque catégorie est attendue soit **pour chaque SI**, soit **pour les SI sensibles**, soit **une fois pour le site** : c'est sa portée, qui règle la *couverture par SI* (guide [Tenir le registre des schémas](1-Tenir_le_registre_des_schemas.md), §6). Une catégorie qui ne concerne pas le site se déclare **non applicable**, avec sa justification : elle ne se laisse pas « non couverte ».\n\nLes codes sont les mêmes dans tous les sites et dans les autres modules (WerbNIS2 les utilise pour proposer les schémas comme preuves). Un site peut ajouter ses propres catégories (*Référentiels et paramètres*), par exemple `EX-OT-SURETE` ; gardez alors le préfixe `EX-` pour qu'on les reconnaisse.\n\nLe type le plus courant pour chaque catégorie :\n\n| Type de schéma | Catégorie(s) qu'il couvre en général |\n|---|---|\n| Architecture générale du SI | `EX-CARTO` |\n| Zones et conduits | `EX-ZONES` (et souvent `EX-CARTO`) |\n| Flux | `EX-FLUX` |\n| Réseau logique (VLAN, adressage) | `EX-RESEAU` |\n| Réseau physique (câblage, baies) | `EX-RESEAU`, `EX-LOCAUX` |\n| Architecture d'administration | `EX-ADMIN` |\n| Accès distants et interconnexions | `EX-ACCES` |\n| Sauvegarde et reprise | `EX-REPRISE` |\n| Sûreté (vidéo, contrôle d'accès) | `EX-LOCAUX` |\n| Architecture applicative | aucune par défaut : catégorie propre au site si besoin |\n\n> Un schéma peut couvrir plusieurs catégories, mais un schéma qui veut tout montrer devient illisible et se périme vite. Six à huit planches tenues à jour valent mieux qu'un grand plan que personne n'ose modifier.\n\n## 2. Lire les exemples\n\nChaque exemple est dessiné sur une **usine fictive** (« Site EXEMPLE ») : deux lignes de production, une supervision, une DMZ industrielle, une bureautique. Tous les noms, TAG, réseaux et dates sont inventés.\n\n- Les **repères violets** ① ② ③… renvoient à la liste « Ce que montre l'exemple » sous chaque image.\n- Les **couleurs des zones** sont celles de WerbMap : rouge pour le process, orange pour les métiers critiques, jaune pour la DMZ et les prestataires, vert pour la sûreté, gris pour la bureautique.\n- En **sarcelle** : ce qui filtre ou autorise. En **rouge pointillé** : ce qui est **interdit** ; s'il existe sur le site, on le supprime, on ne le documente pas comme normal.\n- Chaque planche porte son **cartouche** (identifiant, version, date de revue, approbation, classification).\n\nCliquez sur une image pour l'agrandir.\n\n**Par où commencer ?** Dans cet ordre, chaque schéma s'appuie sur le précédent : cartographie, zones et conduits, flux, accès distants, administration, sauvegarde et reprise, puis plan d'adressage et locaux.\n\n## 3. EX-CARTO — Cartographie du SI\n\n**Objectif.** Savoir quels systèmes d'information existent sur le site, qui en répond, ce qu'ils valent, et avec quoi ils communiquent. C'est le premier schéma demandé : sans lui, aucun autre ne se comprend.\n\n**Questions de l'auditeur.** Quels SI sont dans le périmètre, et lesquels en sont exclus, pourquoi ? Qui est responsable de chacun ? Lesquels sont critiques ? Quelles liaisons sortent du site ?\n\n![Cartographie du SI : exemple fictif annoté](images/ex-carto.svg)\n\n**Ce que montre l'exemple**\n\n1. Chaque **SI** est nommé, avec son **propriétaire** (une fonction, pas une personne), sa **criticité** et ses **besoins** de disponibilité, d'intégrité et de confidentialité (repris de la fiche SI de WerbMap).\n2. Le **nombre d'actifs** et la zone renvoient à l'**inventaire** : la cartographie ne recopie pas la liste des équipements, elle dit où la trouver.\n3. Chaque **interconnexion**, interne ou externe, apparaît avec son moyen : pare-feu, tunnel, DMZ, accès distant.\n4. Un SI **exclu du périmètre** (ici le Wi-Fi visiteurs) est montré avec sa justification : l'exclusion est une décision, pas un oubli.\n5. Le **cartouche** dit quelle version on regarde, quand elle a été revue et qui l'a approuvée.\n\n**À ne pas y mettre.** Le détail des équipements, des adresses et des règles : ils ont leurs propres schémas. Une cartographie trop détaillée n'est jamais à jour.\n\n**Repères**\n\n| Référentiel | Exigence |\n|---|---|\n| NIS2 | Objectif 1, 1.1 à 1.3 (recenser les SI, exclusions justifiées) ; objectif 5, **5.A.1-EI/EE** (cartographie à jour, assez détaillée pour le maintien en condition de sécurité et la gestion d'incident) |\n| Directive (UE) 2022/2555 | Art. 21 §2 i) : gestion des actifs |\n| ISO/IEC 27001:2022 | A.5.9 : inventaire des informations et autres actifs associés |\n| IEC 62443 | 62443-3-2 ZCR 1 : identification du système étudié ; 62443-3-3 SR 7.8 : inventaire des composants |\n| ANSSI, guide d'hygiène | Mesure 4 : identifier les informations et serveurs sensibles et maintenir un schéma du réseau |\n\n## 4. EX-ZONES — Zones et conduits\n\n**Objectif.** Regrouper les actifs qui ont les mêmes exigences de sécurité dans des **zones**, et n'autoriser entre elles que des **conduits** identifiés et filtrés. Une compromission de la bureautique ne doit pas atteindre le process.\n\n**Questions de l'auditeur.** Comment le réseau est-il découpé ? Quel niveau de sécurité vise chaque zone ? Par où passe-t-on d'une zone à l'autre, et qui filtre ? Existe-t-il un passage direct entre la bureautique et le process ?\n\n![Zones et conduits : exemple fictif annoté](images/ex-zones.svg)\n\n**Ce que montre l'exemple**\n\n1. Chaque **zone** a un identifiant (Z-PROC-L1), sa **criticité** (couleur) et son **niveau de sécurité cible** (SL-T, IEC 62443).\n2. Chaque **conduit** est numéroté (C-01…) et **filtré par un équipement nommé** (FW-01…).\n3. **Aucun conduit direct** entre la bureautique et la supervision ou le process : tout passe par la DMZ industrielle.\n4. Les **sous-systèmes** (lignes 1 et 2) sont cloisonnés **entre eux** : un incident sur une ligne ne se propage pas à l'autre.\n5. Le **tableau des conduits** donne, pour chacun, les zones reliées, l'équipement, le SL-T et les contre-mesures.\n\n**À ne pas y mettre.** Les règles de pare-feu détaillées (elles vont sur le schéma des flux et dans la configuration), les adresses IP.\n\n**Repères**\n\n| Référentiel | Exigence |\n|---|---|\n| NIS2 | Objectif 7, **7.A.1-EI/EE à 7.A.4-EE** : SI cloisonnés entre eux et vis-à-vis des tiers ; sous-systèmes étudiés, justifiés et cloisonnés |\n| IEC 62443 | 62443-3-2 **ZCR 3** : découpage en zones et conduits ; SL-T fixé par l'évaluation détaillée des risques (ZCR 5) ; 62443-3-3 SR 5.1 (segmentation du réseau), SR 5.2 (protection des frontières de zone) |\n| ISO/IEC 27001:2022 | A.8.22 : cloisonnement des réseaux |\n| ANSSI | Guide d'hygiène, mesure 19 : segmenter le réseau et cloisonner les zones ; « La cybersécurité des systèmes industriels » (classes de cybersécurité) |\n\n## 5. EX-FLUX — Flux et filtrage\n\n**Objectif.** Montrer **chaque communication autorisée** : qui parle à qui, avec quel protocole, dans quel sens, et quel équipement la filtre. Tout ce qui n'est pas sur le schéma est refusé.\n\n**Questions de l'auditeur.** Les flux entre zones sont-ils définis et documentés ? Qui a demandé chaque ouverture, et pourquoi ? Que se passe-t-il pour un flux non prévu ?\n\n![Flux et filtrage : exemple fictif annoté](images/ex-flux.svg)\n\n**Ce que montre l'exemple**\n\n1. Chaque **flux** a un numéro, une **source**, une **destination** (TAG), un **protocole et un port**, et un **sens** : la flèche part de celui qui initie la connexion.\n2. Chaque passage d'une zone à l'autre traverse un **point de filtrage** nommé.\n3. Les flux entre la bureautique et la supervision **s'arrêtent en DMZ** (F-01 et F-02 aboutissent à SRV-DMZ-01) : aucun flux ne traverse directement de la bureautique au process.\n4. Un **flux interdit** est montré barré : il est refusé par la règle par défaut. C'est la preuve que le filtrage fonctionne en « tout ce qui n'est pas autorisé est interdit ».\n5. La **matrice des flux** porte la **justification** de chaque flux ; elle vient de la demande de flux (WerbExploitation) et correspond à la matrice de WerbMap.\n\n**À ne pas y mettre.** Les comptes de service, les mots de passe, les clés de chiffrement ; les adresses publiques.\n\n**Repères**\n\n| Référentiel | Exigence |\n|---|---|\n| NIS2 | Objectif 7, **7.B.1-EI/EE et 7.B.2-EE** : communications nécessaires définies et documentées ; 7.A.7-EI/EE et 7.A.8-EE : seules les interconnexions nécessaires |\n| ISO/IEC 27001:2022 | A.8.20 (sécurité des réseaux), A.8.21 (sécurité des services réseau), A.8.22 (cloisonnement des réseaux) |\n| IEC 62443-3-3 | SR 5.1, SR 5.2 (protection des frontières de zone, refus par défaut) |\n| ANSSI, guide d'hygiène | Mesures 19 (cloisonnement), 22 (passerelle d'accès sécurisé à Internet), 23 (cloisonner les services visibles depuis Internet) |\n\n## 6. EX-RESEAU — Plan d'adressage et réseau physique\n\n**Objectif.** Savoir **où** se trouve chaque équipement réseau, **comment** il est relié, et **dans quel réseau** (VLAN) se trouve chaque zone. C'est le schéma qu'on ouvre en premier pendant une panne ou un incident.\n\n**Questions de l'auditeur.** Le plan d'adressage est-il tenu ? Les VLAN correspondent-ils aux zones ? Peut-on brancher n'importe quel équipement sur une prise libre ?\n\n![Plan d'adressage et réseau physique : exemple fictif annoté](images/ex-reseau.svg)\n\n**Ce que montre l'exemple**\n\n1. Chaque équipement est rangé dans sa **baie** et son **local** (le local technique, l'atelier).\n2. Les **liens physiques** entre baies portent leur support (fibre, cuivre) et leurs **ports**.\n3. Le **plan d'adressage** : un VLAN par zone, avec son identifiant, son nom, son réseau et sa zone.\n4. Les **ports inutilisés** sont désactivés et placés dans un VLAN sans réseau : seuls les équipements connus sont raccordés.\n5. Le plan d'adressage est celui que WerbMap publie (`site:vlans`) : le schéma le représente, il ne le remplace pas.\n\n**À ne pas y mettre.** Les communautés SNMP, les mots de passe des équipements, les configurations complètes. Les adresses de chaque machine restent dans l'inventaire.\n\n**Repères**\n\n| Référentiel | Exigence |\n|---|---|\n| NIS2 | 5.A.1-EI/EE : ressources matérielles et interconnexions identifiables |\n| ISO/IEC 27001:2022 | A.8.20 (sécurité des réseaux), A.7.12 (sécurité du câblage), A.5.9 (inventaire) |\n| IEC 62443-3-3 | SR 7.8 : inventaire des composants |\n| ANSSI, guide d'hygiène | Mesures 4 (schéma du réseau) et 7 (n'autoriser la connexion qu'aux équipements maîtrisés) |\n\n## 7. EX-ADMIN — Architecture d'administration\n\n**Objectif.** Montrer que l'administration du SI passe par des **moyens dédiés**, maîtrisés et tracés. Un attaquant qui prend un poste d'administrateur prend tout le SI : c'est la cible prioritaire.\n\n**Questions de l'auditeur.** D'où administre-t-on ? Les postes et les comptes d'administration sont-ils séparés de la bureautique ? Les actions sont-elles tracées ? Peut-on administrer un serveur depuis son poste de messagerie ?\n\n![Architecture d'administration : exemple fictif annoté](images/ex-admin.svg)\n\n**Ce que montre l'exemple**\n\n1. Des **postes d'administration dédiés**, sans messagerie ni accès à Internet, et des **comptes d'administration** nominatifs, distincts des comptes bureautiques.\n2. Un **réseau d'administration dédié** (ici le VLAN 90) : les interfaces d'administration n'y sont joignables que depuis ce réseau.\n3. Un **bastion**, passage obligé : authentification forte, sessions enregistrées, revue des accès.\n4. Les flux d'administration sont **filtrés** vers chaque zone : le réseau d'administration ne crée pas de chemin que le cloisonnement interdit.\n5. L'administration **depuis la bureautique est interdite** : c'est le chemin le plus utilisé par les attaquants.\n6. Une **exception** (un automate programmé en direct avec le logiciel du constructeur) est montrée, justifiée et revue : on ne la cache pas.\n\n**À ne pas y mettre.** La liste des comptes et de leurs droits (registre à part), les mots de passe, l'emplacement des secrets.\n\n**Repères**\n\n| Référentiel | Exigence |\n|---|---|\n| NIS2 | Objectif 11, 11.A (comptes d'administration) ; objectif 19 (entités essentielles), **19.1-EE** (réseau d'administration dédié), **19.7-EE** (liaison physique dédiée), **19.8-EE** (cloisonnement et filtrage respectés) |\n| ISO/IEC 27001:2022 | A.8.2 (droits d'accès à privilèges), A.8.5 (authentification sécurisée), A.8.15 (journalisation) |\n| IEC 62443-3-3 | SR 1.1 (identification et authentification des utilisateurs humains), SR 2.1 (application des autorisations), SR 2.8 (événements journalisés) |\n| ANSSI | Guide d'hygiène, mesures 27 (pas d'Internet depuis les postes d'administration), 28 (réseau d'administration dédié et cloisonné), 29 (droits d'administration limités) ; recommandations relatives à l'administration sécurisée des SI |\n\n## 8. EX-ACCES — Accès distants et interconnexions\n\n**Objectif.** Montrer **qui** entre dans le SI depuis l'extérieur (prestataires, éditeurs, télétravail, autres sites), **par où**, avec **quelle authentification**, et **jusqu'où**. Les accès des tiers sont l'une des premières portes d'entrée des attaques.\n\n**Questions de l'auditeur.** Combien de chemins mènent de l'extérieur au SI ? Sont-ils tous chiffrés et protégés par une authentification multifacteur ? Un prestataire peut-il se connecter quand il veut, à tout ? Avez-vous recherché les accès « oubliés » (modem, prise en main à distance installée par un intervenant) ?\n\n![Accès distants et interconnexions : exemple fictif annoté](images/ex-acces.svg)\n\n**Ce que montre l'exemple**\n\n1. Un **point d'entrée unique** en DMZ : tout accès externe y passe.\n2. Une **passerelle VPN** avec **authentification multifacteur** et un chiffrement conforme aux recommandations de l'ANSSI.\n3. Chaque accès va **jusqu'à une cible précise**, à la demande et pour une durée limitée quand c'est un tiers ; les sessions passent par le bastion et sont enregistrées.\n4. L'**interconnexion** avec le siège est permanente mais limitée aux flux nécessaires (messagerie, ERP).\n5. Un **accès interdit** trouvé sur le site (un modem 4G posé sur un automate) est montré pour être **retiré** : il contourne toutes les protections.\n\n**À ne pas y mettre.** Les adresses publiques, les identifiants des prestataires, les clés ou certificats. Les contrats et interlocuteurs restent dans WerbPresta.\n\n**Repères**\n\n| Référentiel | Exigence |\n|---|---|\n| NIS2 | Objectif 8, **8.1-EI/EE** (accès à travers un SI tiers protégés par un chiffrement conforme aux recommandations de l'ANSSI) ; objectif 3, 3.A.1-EI/EE (cartographie de l'écosystème : prestataires, accès) ; 7.A.7-EI/EE et 7.A.8-EE |\n| Directive (UE) 2022/2555 | Art. 21 §2 d) (sécurité de la chaîne d'approvisionnement) et j) (authentification multifacteur, communications sécurisées) |\n| ISO/IEC 27001:2022 | A.5.19 à A.5.22 (relations avec les fournisseurs), A.6.7 (travail à distance), A.5.14 (transfert de l'information) |\n| IEC 62443-3-3 | SR 1.13 (accès via des réseaux non sûrs), SR 5.2 (protection des frontières de zone) |\n| ANSSI, guide d'hygiène | Mesure 25 : sécuriser les interconnexions réseau dédiées avec les partenaires |\n\n## 9. EX-REPRISE — Sauvegarde et reprise\n\n**Objectif.** Montrer **ce qui est sauvegardé**, **où**, si **une copie échappe à un rançongiciel**, si la **restauration a été testée**, et **dans quel ordre** redémarrer. Le jour d'une attaque, c'est ce schéma qui guide la reprise.\n\n**Questions de l'auditeur.** Qu'est-ce qui est sauvegardé, et à quelle fréquence ? Une copie est-elle hors ligne ? Quand avez-vous restauré pour la dernière fois, et combien de temps cela a-t-il pris ? Dans quel ordre redémarrez-vous, et en combien de temps ?\n\n![Sauvegarde et reprise : exemple fictif annoté](images/ex-reprise.svg)\n\n**Ce que montre l'exemple**\n\n1. Les **flux de sauvegarde**, chacun avec sa **fréquence et son heure**, vers un stockage dont la rétention est indiquée.\n2. Une **copie hors ligne** (support déconnecté, rangé dans un autre bâtiment) : c'est elle qui permet de repartir après un rançongiciel.\n3. Le **dernier test de restauration réel** : ce qui a été restauré, quand, en combien de temps, avec quel résultat.\n4. L'**ordre de redémarrage**, avec la durée maximale d'interruption admissible (RTO) et la perte de données maximale admissible (RPO).\n5. Les **programmes des automates** sont sauvegardés à chaque modification : sans eux, un automate remplacé ne redémarre pas.\n\n**À ne pas y mettre.** Le code d'accès de l'armoire forte, les mots de passe de chiffrement des sauvegardes, les procédures détaillées.\n\n> Le schéma prouve la **conception**. La preuve que les sauvegardes tournent et que la restauration est testée reste le **registre des sauvegardes** de WerbExploitation.\n\n**Repères**\n\n| Référentiel | Exigence |\n|---|---|\n| NIS2 | Objectif 13, **13.1-EI/EE** (procédures de sauvegarde et de restauration), **13.2-EI/EE** (tests au moins une fois par an), **13.3-EI/EE** (sauvegardes protégées, par exemple hors ligne), **13.6-EE** (PCA et PRA, entités essentielles) |\n| Directive (UE) 2022/2555 | Art. 21 §2 c) : continuité des activités, gestion des sauvegardes, reprise |\n| ISO/IEC 27001:2022 | A.8.13 (sauvegarde des informations), A.5.30 (préparation des TIC pour la continuité), A.8.14 (redondance) |\n| IEC 62443-3-3 | SR 7.3 (sauvegarde du système), SR 7.4 (restauration et reconstitution) |\n| ANSSI, guide d'hygiène | Mesure 37 : politique de sauvegarde des composants critiques |\n\n## 10. EX-LOCAUX — Locaux techniques et baies\n\n**Objectif.** Montrer **où** sont les équipements et **comment leurs locaux sont protégés** : contre l'accès non autorisé (badge, serrure, caméra, alarme) et contre les sinistres (alimentation, climatisation, incendie).\n\n**Questions de l'auditeur.** Qui peut entrer dans la salle serveurs ? Les baies de l'atelier sont-elles fermées ? Les accès sont-ils surveillés ? Que se passe-t-il en cas de coupure de courant ou de surchauffe ?\n\n![Locaux techniques et baies : exemple fictif annoté](images/ex-locaux.svg)\n\n**Ce que montre l'exemple**\n\n1. La **salle serveurs** est fermée et son accès contrôlé par **badge**.\n2. Les **baies de terrain** de l'atelier sont **fermées à clé**.\n3. **Caméras** et **alarme** couvrent les accès des locaux techniques, reliées au poste de garde.\n4. L'**alimentation secourue** (onduleur, avec son autonomie), la **climatisation** et la **détection incendie** du local technique.\n5. Les **câbles** entre le local technique et les baies passent dans un **chemin protégé**.\n\n**À ne pas y mettre.** Les codes d'alarme, la liste nominative des badges, l'emplacement des clés : ils restent dans les procédures de sûreté.\n\n**Repères**\n\n| Référentiel | Exigence |\n|---|---|\n| NIS2 | Objectif 6, **6.2-EE** (entités essentielles) : protection physique des locaux, salles serveurs et locaux techniques (vidéosurveillance, gardiennage, alarme) |\n| Directive (UE) 2022/2555 | Art. 21 §2 : approche « tous risques », qui couvre l'environnement physique des SI |\n| ISO/IEC 27001:2022 | A.7.1 à A.7.4 (périmètres, entrées, bureaux et salles, surveillance), A.7.5 (menaces physiques et environnementales), A.7.8 (emplacement du matériel), A.7.11 (services généraux), A.7.12 (câblage) |\n| ANSSI, guide d'hygiène | Mesure 26 : contrôler et protéger l'accès aux salles serveurs et aux locaux techniques |\n\n## 11. Avant d'approuver un schéma\n\n- [ ] Le **cartouche** est rempli : identifiant, version, date, propriétaire, **classification**.\n- [ ] La **légende** explique chaque couleur et chaque type de trait.\n- [ ] Les équipements sont désignés par leur **TAG** de WerbMap, les zones par leur identifiant.\n- [ ] Les chemins **interdits** trouvés sur le site sont signalés pour être supprimés, pas dessinés comme normaux.\n- [ ] Les **exceptions** sont visibles et justifiées.\n- [ ] **Aucun secret** : ni mot de passe, ni clé, ni code d'accès, ni adresse publique.\n- [ ] Le schéma a été **comparé au terrain** (ou à l'inventaire) lors de cette revue.\n- [ ] Les **exigences** cochées dans la fiche sont bien celles que le schéma démontre (voir les objectifs ci-dessus).\n\nLes modèles Visio fournis pour EX-ZONES, EX-ACCES, EX-ADMIN et EX-REPRISE reprennent ces conventions : voir [Préparer les modèles de schémas](2-Preparer_les_modeles_de_schemas.md).\n\n> **À propos des repères.** Ils indiquent les exigences que le schéma aide à démontrer, pas une équivalence officielle entre référentiels. Les codes NIS2 (5.A.1-EI/EE, 7.A.1-EI/EE…) sont les identifiants des moyens acceptables de conformité du référentiel NIS2, repris par WerbNIS2 1.12.0 ; le suffixe indique si la mesure est attendue d'une entité importante et essentielle (EI/EE) ou des seules entités essentielles (EE). Les numéros de mesures de l'ANSSI sont ceux du guide d'hygiène informatique (version 2.0, 42 mesures).\n" }];

    }
    if (WERB.formatsLus.includes(fmt) || (fmt === undefined && WERB.formatsLus.includes(""))) {
      return { format: fmt, schema: j.schema, meta: j.meta || {}, verrou: null, journal: [], data: j, ancien: true };
    }
    throw new Error(`Ce fichier n'est pas une base ${WERB.produit} (format « ${fmt ?? "inconnu"} »).`);
  }

  /* ---------- Empreinte ---------- */

  async function sha256(entree) {
    const buf = typeof entree === "string" ? new TextEncoder().encode(entree) : entree instanceof Blob ? await entree.arrayBuffer() : entree;
    const h = await crypto.subtle.digest("SHA-256", buf);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  /* ---------- Fichiers (File System Access, repli par téléchargement) ---------- */

  const accesDirect = typeof globalThis.showOpenFilePicker === "function";
  const types = () => [{ description: `Base ${WERB.produit}`, accept: { "application/json": [".json"] } }];

  // Ouvre une base. Renvoie { poignee, nom, texte, modifie, lecture } ; poignee est null en mode compatibilité.
  // Le verrou de la base est pris (charte §5.7) sauf { verrou: false } : choix lecture seule / prise de main si un collègue l'a ouverte.
  async function ouvrir({ verrou: prendreVerrou = true } = {}) {
    if (accesDirect) {
      const [poignee] = await showOpenFilePicker({ types: types(), multiple: false });
      const f = await poignee.getFile();
      const r = { poignee, nom: f.name, texte: await f.text(), modifie: f.lastModified };
      return prendreVerrou ? verrou.prendre(r) : r;
    }
    return new Promise((resolve, reject) => {
      const inp = Object.assign(document.createElement("input"), { type: "file", accept: ".json,application/json" });
      inp.onchange = async () => {
        const f = inp.files[0];
        if (!f) return reject(new Error("Aucun fichier choisi."));
        resolve({ poignee: null, nom: f.name, texte: await f.text(), modifie: f.lastModified });
      };
      inp.click();
    });
  }

  // Enregistre. Si « modifie » est fourni et que le fichier a changé depuis, lève une erreur code CONFLIT.
  // Le verrou est contrôlé avant l'écriture (un collègue a-t-il pris la main ?) et inscrit dans l'enveloppe ; refus = AbortError.
  async function enregistrer(objet, { poignee = null, nomSuggere = `base${WERB.extension}`, modifie = null } = {}) {
    const enveloppee = objet && typeof objet === "object" && objet.famille === FAMILLE;
    if (accesDirect) {
      const nouveau = !poignee;
      if (!poignee) poignee = await showSaveFilePicker({ suggestedName: nomSuggere, types: types() });
      const acces = await verrou.avantEcriture(poignee, { nouveau });
      if (!acces) throw annule();
      if (enveloppee) objet.verrou = verrou.valeur();
      if (modifie !== null && acces !== "reprise") {
        const actuel = await poignee.getFile();
        if (actuel.lastModified !== modifie) { const e = new Error("Le fichier a été modifié par ailleurs depuis son ouverture."); e.code = "CONFLIT"; throw e; }
      }
      const fin = await ecrireTexte(poignee, JSON.stringify(objet, null, 1));
      verrou.apresEcriture(poignee, fin);
      return { poignee, modifie: fin };
    }
    if (enveloppee) objet.verrou = null;                     // copie téléchargée : aucun verrou
    telecharger(JSON.stringify(objet, null, 1), nomSuggere, "application/json");
    return { poignee: null, modifie: null };
  }
  async function ecrireTexte(poignee, texte) {
    const w = await poignee.createWritable();
    await w.write(texte);
    await w.close();
    return (await poignee.getFile()).lastModified;
  }
  const annule = () => new DOMException("Opération annulée.", "AbortError");

  /* ---------- Verrou d'une base ouverte (charte §5.7) ---------- */

  // Une base ouverte en écriture porte { par, depuis, vu, session } dans « verrou » ; un collègue qui l'ouvre choisit entre
  // lecture seule et prise de main. Le verrou d'une autre session expire 12 h après sa dernière écriture (« vu »).
  // Le bandeau s'affiche dans l'élément #werb-verrou de la page, s'il existe. Une seule base suivie par page.
  const verrou = (() => {
    const SESSION = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const DUREE_H = 12;
    let utilisateur = nomDuLien(), etat = { mode: "aucun" }, rappel = null, surveillance = false;   // nom transmis par le portail (§5.5)
    const STYLE = `
.werb-verrou:empty{display:none}
.werb-verrou{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:#e1f3e5;color:#1d6631;border:1px solid #b7dfc1}
.werb-verrou.lecture{background:#fcefd2;color:#7f5300;border-color:#efd59a}
.werb-verrou.perdu{background:#fbe3e1;color:#962a20;border-color:#f0b9b3}
.wv-back{position:fixed;inset:0;z-index:10000;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.wv-box{background:#fff;color:#1d2330;max-width:520px;width:100%;border-radius:10px;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.3);font:14px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
.wv-box h2{margin:0 0 8px;font-size:17px;color:#1f3864}.wv-box p{margin:0 0 8px}.wv-box .wv-n{font-size:12px;color:#5b6474}
.wv-box .wv-a{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:14px}
.wv-box button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid #c4cad4;background:#fff;cursor:pointer}
.wv-box button.p{background:#1f3864;border-color:#1f3864;color:#fff}.wv-box button.d{background:#b3261e;border-color:#b3261e;color:#fff}
@media print{.werb-verrou{display:none!important}}`;
    function style() {
      if (typeof document !== "undefined" && !document.getElementById("werb-verrou-style")) {
        document.head.appendChild(Object.assign(document.createElement("style"), { id: "werb-verrou-style", textContent: STYLE }));
      }
    }
    const date = iso => new Date(iso);
    const quand = iso => {
      const d = date(iso); if (isNaN(d)) return "";
      const h = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      return d.toDateString() === new Date().toDateString() ? `depuis ${h}` : `depuis le ${d.toLocaleDateString("fr-FR")} à ${h}`;
    };
    // Verrou posé par une autre session et encore valable
    function actif(v) {
      if (!v || typeof v !== "object" || !v.par || v.session === SESSION) return false;
      const t = Date.parse(v.vu || v.depuis);
      return !isNaN(t) && Date.now() - t < DUREE_H * 3600e3;
    }
    const poser = () => ({ par: utilisateur || "Utilisateur inconnu", depuis: maintenant(), vu: maintenant(), session: SESSION });
    const lireVerrou = texte => { try { const j = JSON.parse(texte); return j && typeof j === "object" ? j.verrou ?? null : null; } catch (e) { return null; } };

    function dialogue(titre, html, boutons) {
      style();
      return new Promise(res => {
        const back = document.createElement("div");
        back.className = "wv-back";
        back.innerHTML = `<div class="wv-box" role="dialog" aria-modal="true"><h2>${esc(titre)}</h2>${html}<div class="wv-a">${boutons.map(([k, l, c]) => `<button type="button" data-wv="${k}" class="${c || ""}">${esc(l)}</button>`).join("")}</div></div>`;
        const fin = k => { back.remove(); res(k); };
        back.addEventListener("click", e => { const k = e.target.dataset && e.target.dataset.wv; if (k) fin(k); });
        back.addEventListener("keydown", e => { if (e.key === "Escape") fin(boutons[0][0]); });
        document.body.appendChild(back);
        const p = back.querySelector("button.p, button.d") || back.querySelector("button"); if (p) p.focus();
      });
    }
    async function permission(poignee) {
      try {
        let p = await poignee.queryPermission({ mode: "readwrite" });
        if (p !== "granted") p = await poignee.requestPermission({ mode: "readwrite" });
        return p === "granted";
      } catch (e) { return false; }
    }
    async function memeFichier(a, b) {
      if (!a || !b) return false;
      if (a === b) return true;
      try { return await a.isSameEntry(b); } catch (e) { return false; }
    }

    function afficher() {
      if (typeof document === "undefined") return;
      style();
      const el = document.getElementById("werb-verrou");
      if (el) {
        const e = etat, v = e.v || {};
        const [cls, txt, titre] = e.mode === "mien" ? ["", `🔒 Ouvert par ${v.par === utilisateur ? "vous" : v.par} ${quand(v.depuis)}`, "Vous avez la main : un collègue qui ouvre cette base la verra en lecture seule jusqu'à sa fermeture."]
          : e.mode === "lecture" && e.droits ? ["lecture", `🔒 Lecture seule · ${e.droits}`, "Votre compte n'a pas le rôle Éditeur sur ce périmètre : un administrateur du groupe le donne dans le portail (Comptes et droits)."]
          : e.mode === "lecture" ? (e.libre ? ["lecture", "🔓 Lecture seule · base libérée", `${e.libre} a fermé la base : rouvrez-la pour la modifier.`]
            : ["lecture", `🔒 Ouvert par ${v.par} ${quand(v.depuis)} · lecture seule`, "Vos modifications ne pourront pas être enregistrées sans prendre la main."])
          : e.mode === "perdu" ? ["perdu", `⚠ ${v.par} a pris la main ${quand(v.depuis)}`, "Vos modifications en cours n'écraseront son travail que si vous reprenez la main à l'enregistrement."]
          : ["", "", ""];
        el.className = `werb-verrou ${cls}`.trim();
        el.textContent = txt;
        el.title = titre;
      }
      if (rappel) try { rappel(etat); } catch (e) { /* sans effet */ }
    }

    // Relit le verrou du fichier suivi (retour sur l'onglet, toutes les minutes, avant d'écrire) : signale une prise de main.
    async function verifier() {
      const e = etat;
      if (!e.poignee || e.mode === "aucun") return etat;
      let f;
      try { f = await e.poignee.getFile(); } catch (x) { return etat; }
      if (e.modifie && f.lastModified === e.modifie) return etat;
      const v = lireVerrou(await f.text());
      if (etat !== e) return etat;                           // base changée entre-temps
      e.modifie = f.lastModified;
      if (e.mode === "mien" && actif(v)) etat = { ...e, mode: "perdu", v };
      else if (e.mode === "perdu" && !actif(v)) etat = { ...e, mode: "mien", v: e.mien };
      else if (e.mode === "lecture" && e.droits) etat = e;
      else if (e.mode === "lecture") etat = actif(v) ? { ...e, v, libre: "" } : { ...e, libre: e.libre || (e.v && e.v.par) || "Le titulaire" };
      // A la main mais son verrou n'est plus dans le fichier (collègue parti, écriture d'un outil sans verrou) : il est réinscrit
      if (etat.mode === "mien" && !(v && v.session === SESSION)) {
        try {
          const j = JSON.parse(await f.text());
          if (j && typeof j === "object" && j.famille === FAMILLE && etat.poignee === e.poignee) { j.verrou = { ...etat.v, vu: maintenant() }; etat.modifie = await ecrireTexte(e.poignee, JSON.stringify(j, null, 1)); }
        } catch (x) { /* fichier illisible : inscrit au prochain enregistrement */ }
      }
      afficher();
      return etat;
    }
    function surveiller() {
      if (surveillance || typeof addEventListener !== "function") return;
      surveillance = true;
      addEventListener("focus", () => { verifier(); });
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") verifier(); });
      setInterval(() => { verifier(); }, 60000);
      addEventListener("pagehide", () => { liberer(); });   // au mieux : le verrou expire de toute façon
    }

    // Prend le verrou de la base ouverte { poignee, nom, texte, modifie }. Renvoie le même objet complété de
    // { modifie (après écriture du verrou), lecture, ecriture } ; « Annuler » lève une AbortError.
    // { droits } (1.14.0) : lecture seule imposée par le rôle du compte (texte affiché), sans poser de verrou
    async function prendre(f, { droits = "" } = {}) {
      const v = lireVerrou(f.texte);
      if (droits && f.poignee) { await liberer(); surveiller(); etat = { mode: "lecture", v, poignee: f.poignee, modifie: f.modifie, libre: "", droits }; afficher(); return { ...f, lecture: true, ecriture: false }; }
      let choix = "main";
      if (f.poignee && actif(v)) {
        choix = await dialogue("Base déjà ouverte", `<p>Cette base est ouverte par <b>${esc(v.par)}</b> ${esc(quand(v.depuis))}.</p>
          <p>En <b>lecture seule</b>, vous consultez sans pouvoir enregistrer. <b>Prendre la main</b> lui retire la main : ses modifications non enregistrées ne pourront plus être écrites sans écraser les vôtres.</p>
          <p class="wv-n">Si cette personne a fermé son navigateur sans fermer la base, le verrou expire ${DUREE_H} h après son dernier enregistrement.</p>`,
          [["annuler", "Annuler"], ["lecture", "Ouvrir en lecture seule"], ["main", "Prendre la main", "p"]]);
        if (choix === "annuler") throw annule();
      }
      await liberer();                                       // base précédente
      if (!f.poignee) { etat = { mode: "aucun" }; afficher(); return { ...f, lecture: false, ecriture: false }; }
      surveiller();
      if (choix === "lecture") { etat = { mode: "lecture", v, poignee: f.poignee, modifie: f.modifie, libre: "" }; afficher(); return { ...f, lecture: true, ecriture: false }; }
      if (!(await permission(f.poignee))) { etat = { mode: "aucun" }; afficher(); return { ...f, lecture: false, ecriture: false }; }
      const mien = poser();
      etat = { mode: "mien", v: mien, mien, poignee: f.poignee, modifie: f.modifie };
      let modifie = f.modifie;
      try {
        const j = JSON.parse(f.texte);
        if (j && typeof j === "object" && j.famille === FAMILLE) { j.verrou = mien; modifie = await ecrireTexte(f.poignee, JSON.stringify(j, null, 1)); }
      } catch (e) { /* format historique : le verrou sera écrit au premier enregistrement */ }
      etat.modifie = modifie;
      afficher();
      return { ...f, modifie, lecture: false, ecriture: true };
    }

    // Avant d'écrire la base : faux si l'utilisateur renonce, "reprise" s'il reprend la main sur un collègue, "ok" sinon.
    // Pour les modules qui écrivent eux-mêmes ; WerbSocle.enregistrer l'appelle de lui-même.
    async function avantEcriture(poignee, { nouveau = false } = {}) {
      if (!poignee) return "ok";
      const suivi = await memeFichier(etat.poignee, poignee);
      if (suivi && etat.droits && !nouveau) {
        await dialogue("Enregistrement impossible", `<p>Votre compte est en <b>lecture seule</b> sur cette base (${esc(etat.droits)}).</p><p>Pour garder vos modifications, utilisez « Enregistrer sous » vers un autre fichier, ou demandez le rôle Éditeur à un administrateur du groupe.</p>`, [["ok", "Fermer", "p"]]);
        return false;
      }
      if (!nouveau) {
        let v = null;
        try { v = lireVerrou(await (await poignee.getFile()).text()); } catch (e) { /* fichier illisible : écrit tel quel */ }
        if (actif(v)) {
          if (suivi && etat.mode !== "lecture") { etat = { ...etat, mode: "perdu", v }; afficher(); }
          const lecture = suivi && etat.mode === "lecture";
          const c = await dialogue(lecture ? "Base ouverte en lecture seule" : "Un collègue a pris la main",
            `<p>${lecture ? `<b>${esc(v.par)}</b> a la main sur cette base ${esc(quand(v.depuis))}.` : `<b>${esc(v.par)}</b> a pris la main sur cette base ${esc(quand(v.depuis))}, pendant que vous travailliez.`}</p>
            <p>Enregistrer maintenant <b>remplace son travail</b> par le vôtre et lui retire la main. Pour garder les deux versions, annulez puis utilisez « Enregistrer sous ».</p>`,
            [["non", "Annuler"], ["oui", "Reprendre la main et enregistrer", "d"]]);
          if (c !== "oui") return false;
          await marquer(poignee, suivi);
          return "reprise";
        }
      }
      await marquer(poignee, suivi);
      return "ok";
    }
    async function marquer(poignee, suivi) {
      if (suivi && etat.mode === "mien") return;
      if (!suivi) await liberer();                            // « Enregistrer sous » : l'ancien fichier est libéré
      surveiller();
      const mien = poser();
      etat = { mode: "mien", v: mien, mien, poignee, modifie: null };
      afficher();
    }
    function apresEcriture(poignee, modifie) { if (etat.poignee === poignee || etat.mode === "mien") etat.modifie = modifie ?? null; }

    // Verrou à inscrire dans l'enveloppe : le sien s'il a la main, null sinon. « vu » repousse l'expiration.
    function valeur() {
      if (etat.mode !== "mien") return null;
      etat.v.vu = maintenant();
      return { ...etat.v };
    }

    // Libère la base suivie : son verrou est retiré du fichier s'il est encore le sien (fermeture, autre base).
    async function liberer() {
      const e = etat;
      etat = { mode: "aucun" };
      afficher();
      if (e.mode !== "mien" || !e.poignee) return;
      try {
        const j = JSON.parse(await (await e.poignee.getFile()).text());
        if (j && j.verrou && j.verrou.session === SESSION) { j.verrou = null; await ecrireTexte(e.poignee, JSON.stringify(j, null, 1)); }
      } catch (x) { /* fichier inaccessible : le verrou expirera */ }
    }

    return Object.freeze({
      SESSION, DUREE_H, actif, quand, prendre, avantEcriture, apresEcriture, valeur, liberer, verifier,
      identifier(nom) { utilisateur = String(nom || ""); if (etat.mode === "mien" && etat.v) { etat.v.par = utilisateur || etat.v.par; afficher(); } },
      surChangement(fn) { rappel = typeof fn === "function" ? fn : null; },
      get etat() { return { mode: etat.mode, par: etat.v ? etat.v.par : "", depuis: etat.v ? etat.v.depuis : "", libre: etat.libre || "" }; },
      get lectureSeule() { return etat.mode === "lecture"; },
      get lectureDroits() { return etat.mode === "lecture" ? etat.droits || "" : ""; },
      get utilisateur() { return utilisateur; },
      afficher,
    });
  })();

  /* ---------- Espace de données SMSI_<GROUPE> (charte §5.3 et §5.4) ---------- */

  // Le dossier est demandé une fois par session ; sa poignée n'est jamais mémorisée.
  const espace = (() => {
    let racine = null, groupe = null;
    const accesDossier = typeof globalThis.showDirectoryPicker === "function";

    async function dossier(chemin, creer = false) {
      let d = racine;
      for (const part of chemin.split("/").filter(Boolean)) d = await d.getDirectoryHandle(part, { create: creer });
      return d;
    }
    function decouper(chemin) { const i = chemin.lastIndexOf("/"); return [chemin.slice(0, i + 1), chemin.slice(i + 1)]; }

    // Lit un JSON relatif à la racine. Renvoie null si absent ou non autorisé (droits du drive).
    async function lire(chemin) {
      if (!racine) throw new Error("Aucun espace WerbSMSI ouvert.");
      try {
        const [rep, nom] = decouper(chemin);
        const f = await (await (await dossier(rep)).getFileHandle(nom)).getFile();
        if (f.size > TAILLE_MAX) throw new Error(`${chemin} : fichier trop volumineux.`);
        return JSON.parse(await f.text());
      } catch (e) {
        if (["NotFoundError", "NotAllowedError", "SecurityError", "TypeMismatchError"].includes(e.name)) return null;
        throw e;
      }
    }

    // Contenu d'un dossier relatif à la racine : [{ nom, type, taille, modifie }], ou null si absent ou non autorisé.
    async function lister(chemin = "") {
      if (!racine) throw new Error("Aucun espace WerbSMSI ouvert.");
      try {
        const res = [];
        for await (const [nom, h] of (await dossier(chemin)).entries()) {
          if (h.kind === "directory") { res.push({ nom, type: "directory" }); continue; }
          const f = await h.getFile();
          res.push({ nom, type: "file", taille: f.size, modifie: f.lastModified });
        }
        return res.sort((a, b) => a.nom.localeCompare(b.nom));
      } catch (e) {
        if (["NotFoundError", "NotAllowedError", "SecurityError", "TypeMismatchError"].includes(e.name)) return null;
        throw e;
      }
    }

    async function ecrire(chemin, objet) {
      const [rep, nom] = decouper(chemin);
      const w = await (await (await dossier(rep, true)).getFileHandle(nom, { create: true })).createWritable();
      await w.write(JSON.stringify(objet, null, 1));
      await w.close();
    }

    // L'identifiant « werbsmsi-espace » permet à Edge de rouvrir le sélecteur sur le dernier espace choisi lorsque la page a une
    // origine (http) ; en file://, Edge ne le retient pas d'une page à l'autre.
    async function choisir() {
      if (!accesDossier) throw new Error("Ce navigateur ne permet pas d'ouvrir un dossier : utilisez Microsoft Edge.");
      return adopter(await showDirectoryPicker({ mode: "readwrite", id: "werbsmsi-espace" }));
    }

    // Retient comme espace un dossier déjà obtenu (dossier créé par le portail, par exemple).
    async function adopter(d) {
      const avant = racine;
      racine = d;
      const g = await lire("werbsmsi.groupe.json");
      if (!g || g.format !== "WERBSMSI-GROUPE" || !g.data || !g.data.groupeId) {
        racine = avant;
        throw new Error("Ce dossier n'est pas un espace WerbSMSI (werbsmsi.groupe.json absent ou illisible).");
      }
      const groupeAvant = groupe;
      groupe = g.data;
      try { await comptes.exiger(); }   // 1.14.0 : espace avec comptes → ticket du portail ou connexion
      catch (e) { racine = avant; groupe = groupeAvant; throw e; }
      ia.charger().catch(() => {});     // 1.15.0 : assistant IA optionnel (rien si le module ne l'a pas activé ou sans déclaration)
      return groupe;
    }

    const prefixeNiveau = (niveau, site) => {
      if (niveau === "groupe") return "";
      if (!CODE_SITE.test(site || "")) throw new Error("Code de site invalide.");
      return `sites/${site}/`;
    };

    // Fusionne les fichiers de publication d'un niveau. Renvoie { objets: {nom: [élément…]}, fichiers: [...], conflits: [...] }.
    async function publications(niveau, site) {
      const res = { objets: {}, fichiers: [], conflits: [] };
      let rep;
      try { rep = await dossier(prefixeNiveau(niveau, site) + "publications"); } catch (e) { return res; }
      const proprio = {};
      for await (const [nom, h] of rep.entries()) {
        if (h.kind !== "file" || !nom.endsWith(".json")) continue;
        let j;
        try { const f = await h.getFile(); if (f.size > TAILLE_MAX) continue; j = JSON.parse(await f.text()); } catch (e) { continue; }
        if (!j || j.format !== "WERBSMSI-PUBLICATION" || !j.data || typeof j.data !== "object") continue;
        const module = nom.slice(0, -5);
        res.fichiers.push({ module, publieLe: j.meta && j.meta.publieLe, publiePar: j.meta && j.meta.publiePar });
        for (const [cle, val] of Object.entries(j.data)) {
          if (proprio[cle] && proprio[cle] !== module) { res.conflits.push({ objet: cle, modules: [proprio[cle], module] }); continue; }
          proprio[cle] = module;
          res.objets[cle] = val;
        }
      }
      return res;
    }

    // Écrit publications/<id>.json du niveau. « objets » : {nom: [éléments]} ; pour chaque nom fourni, les éléments existants
    // pour lesquels remplacer(élément) est vrai sont retirés avant ajout (tous par défaut).
    async function publier({ niveau, site, objets, utilisateur = "", remplacer = () => true }) {
      comptes.exigerRole(niveau === "groupe" ? comptes.GROUPE : site, "editeur", "publier");   // 1.14.0
      if (!racine) throw new Error("Aucun espace WerbSMSI ouvert.");
      if (!WERB.portees.includes(niveau)) throw new Error(`${WERB.produit} ne publie pas au niveau « ${niveau} ».`);
      const chemin = `${prefixeNiveau(niveau, site)}publications/${WERB.id}.json`;
      const actuel = await lire(chemin);
      const data = actuel && actuel.format === "WERBSMSI-PUBLICATION" && actuel.data ? actuel.data : {};
      const jour = maintenant();
      const signe = e => Object.assign({}, e, { source: WERB.id, majLe: jour.slice(0, 10) });
      for (const [nom, elements] of Object.entries(objets)) {
        if (!Array.isArray(elements)) { data[nom] = signe(elements); continue; }   // objet unique (ex. échelles) : remplacé en entier
        const gardes = Array.isArray(data[nom]) ? data[nom].filter(e => !remplacer(e)) : [];
        data[nom] = gardes.concat(elements.map(signe));
      }
      const meta = {
        produit: WERB.produit, appVersion: WERB.version, auteur: WERB.auteur, generateur: WERB.ligne,
        creeLe: (actuel && actuel.meta && actuel.meta.creeLe) || jour.slice(0, 10), modifieLe: jour, modifiePar: utilisateur,
        groupeId: groupe.groupeId, module: WERB.id, portee: niveau, publiePar: utilisateur, publieLe: jour,
      };
      if (niveau === "site") meta.site = site;
      await ecrire(chemin, { format: "WERBSMSI-PUBLICATION", schema: 1, famille: FAMILLE, meta, data });
      return chemin;
    }

    // Ouvre une base rangée dans l'espace. Renvoie { poignee, nom, texte, modifie }, comme ouvrir() : la base s'enregistre à sa place.
    async function ouvrirFichier(chemin) {
      if (!racine) throw new Error("Aucun espace WerbSMSI ouvert.");
      if (!chemin || /[\\:*?"<>|\u0000-\u001f]/.test(chemin) || chemin.split("/").some(p => !p || p === "." || p === "..")) throw new Error(`Chemin invalide : ${chemin}`);
      const [rep, nom] = decouper(chemin);
      let poignee;
      try { poignee = await (await dossier(rep)).getFileHandle(nom); }
      catch (e) { throw new Error(`${chemin} : fichier absent de l'espace ou non autorisé par les droits du dossier.`); }
      const f = await poignee.getFile();
      if (f.size > TAILLE_MAX) throw new Error(`${chemin} : fichier trop volumineux.`);
      return { poignee, nom: f.name, texte: await f.text(), modifie: f.lastModified };
    }
