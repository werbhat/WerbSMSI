/></marker><marker id="d-2E5090" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2E5090"/></marker></defs><rect x="0" y="0" width="1000" height="700" fill="#FFFFFF"/><rect x="0" y="0" width="1000" height="58" fill="#1C2733"/><text x="24" y="27" font-size="19" font-weight="700" fill="#FFFFFF">Architecture d&#x27;administration</text><text x="24" y="47" font-size="11.5" fill="#C9D3DE">Objectif : montrer que l&#x27;administration passe par des moyens dédiés, maîtrisés et tracés.</text><rect x="786" y="15" width="190" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#8FA3B8"/><text x="881" y="34" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">EX-ADMIN · exemple fictif</text><rect x="24" y="76" width="280" height="330" rx="8" fill="#FFF6CC" stroke="#9A7B00" stroke-width="1.6"/><text x="34" y="94" font-size="11.5" fill="#9A7B00" text-anchor="start" font-weight="700">Z-ADM · ADMINISTRATION</text><text x="34" y="109" font-size="10" fill="#5B6876" text-anchor="start">VLAN 90 · réseau dédié</text><rect x="44" y="124" width="240" height="64" rx="4" fill="#FFFFFF" stroke="#1C2733" stroke-width="1.2"/><text x="164.0" y="146.3" font-size="11" fill="#1C2733" text-anchor="middle" font-weight="700">PAA-01, PAA-02</text><text x="164.0" y="160.0" font-size="10" fill="#5B6876" text-anchor="middle">postes d&#x27;administration dédiés</text><text x="164.0" y="173.6" font-size="10" fill="#5B6876" text-anchor="middle">ni messagerie, ni Internet</text><rect x="44" y="206" width="240" height="56" rx="4" fill="#FFFFFF" stroke="#1C2733" stroke-width="1.2"/><text x="164.0" y="224.3" font-size="11" fill="#1C2733" text-anchor="middle" font-weight="700">Comptes d&#x27;administration</text><text x="164.0" y="238.0" font-size="10" fill="#5B6876" text-anchor="middle">nominatifs, distincts des comptes</text><text x="164.0" y="251.6" font-size="10" fill="#5B6876" text-anchor="middle">bureautiques (annuaire dédié)</text><rect x="24" y="424" width="280" height="90" rx="8" fill="#F3F6F9" stroke="#7B8794" stroke-width="1.6"/><text x="34" y="442" font-size="11.5" fill="#7B8794" text-anchor="start" font-weight="700">Z-IT · BUREAUTIQUE</text><rect x="44" y="452" width="240" height="48" rx="4" fill="#F3F6F9" stroke="#5B6876" stroke-width="1.2"/><text x="164.0" y="473.1" font-size="11" fill="#5B6876" text-anchor="middle" font-weight="700">PC-IT-07</text><text x="164.0" y="486.8" font-size="10" fill="#5B6876" text-anchor="middle">poste bureautique de l&#x27;administrateur</text><rect x="350" y="76" width="250" height="330" rx="8" fill="#FDEBD3" stroke="#B26A00" stroke-width="1.6"/><text x="360" y="94" font-size="11.5" fill="#B26A00" text-anchor="start" font-weight="700">BASTION</text><text x="360" y="109" font-size="10" fill="#5B6876" text-anchor="start">passage obligé · Z-ADM</text><rect x="370" y="140" width="210" height="110" rx="4" fill="#FFFFFF" stroke="#1C2733" stroke-width="1.2"/><text x="475.0" y="171.7" font-size="11" fill="#1C2733" text-anchor="middle" font-weight="700">BAS-01</text><text x="475.0" y="185.3" font-size="10" fill="#5B6876" text-anchor="middle">authentification forte</text><text x="475.0" y="199.0" font-size="10" fill="#5B6876" text-anchor="middle">sessions enregistrées</text><text x="475.0" y="212.6" font-size="10" fill="#5B6876" text-anchor="middle">revue mensuelle des accès</text><text x="475.0" y="226.2" font-size="10" fill="#5B6876" text-anchor="middle">accès par cible, pas de rebond</text><rect x="646" y="76" width="330" height="438" rx="8" fill="#FBE4E2" stroke="#B3261E" stroke-width="1.6"/><text x="656" y="94" font-size="11.5" fill="#B3261E" text-anchor="start" font-weight="700">RESSOURCES ADMINISTRÉES</text><text x="656" y="109" font-size="10" fill="#5B6876" text-anchor="start">interfaces d&#x27;administration, par zone</text><rect x="666" y="120" width="290" height="50" rx="4" fill="#FFFFFF" stroke="#1C2733" stroke-width="1.2"/><te