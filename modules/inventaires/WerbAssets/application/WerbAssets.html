<script>window.WERB_GUIDES = [{ fichier: "1-Maitriser_et_durcir_les_assets.md", texte: "<!-- WerbAssets – Développé par @WerbHat -->\n# Maîtriser et durcir les assets du site\n\nCe guide s'adresse à ceux qui installent, exploitent ou financent les équipements réseau d'un site industriel : pare-feu, switch, baies de brassage, automates, IHM, passerelles, onduleurs communicants. Il défend deux idées :\n\n1. **Un asset mal connu se répare lentement.** Une configuration non documentée ou un raccordement mal repéré dans une baie allongent **toujours** la durée d'interruption après une panne ou une attaque : ils font monter le RTO réel.\n2. **Un asset se durcit à sa première configuration.** Le durcir plus tard, une fois en production, est plus long, plus cher et plus risqué.\n\nLa dernière partie explique comment tenir WerbAssets pour que ces deux idées deviennent une habitude du site.\n\n---\n\n## 1. Ce que l'on ne connaît pas allonge la reprise\n\n### Le RTO se joue avant l'incident\n\nLe **RTO** (*Recovery Time Objective*, durée maximale d'interruption admissible) se fixe avec le métier dans le plan de reprise informatique (WerbPCR, *Plan PRI*). Ce n'est pas un souhait : le temps réel de reprise est la **somme de durées bien concrètes**, et chacune s'allonge dès qu'il manque une information.\n\n| Étape de la reprise | Ce qui la rallonge quand l'asset est mal connu |\n|---|---|\n| Comprendre ce qui est tombé | Aucun plan des flux ni des raccordements : on cherche quel équipement porte quel réseau, en interrogeant les uns et les autres |\n| Trouver l'équipement et ses câbles | Baie mal identifiée, bandeau sans plan, câbles sans repère : on suit les câbles à la main |\n| Remplacer ou réinitialiser | Modèle, version de firmware ou options inconnus : la pièce de rechange n'est pas la bonne, ou ne se comporte pas pareil |\n| Reconfigurer | VLAN, ports, règles de filtrage reconstitués de mémoire ou par essais successifs |\n| Vérifier | Aucune référence de ce qui est « normal » : on découvre les oublis quand la production les réclame, un par un |\n\nChaque inconnue transforme quelques minutes en heures. Cumulées, elles transforment une panne de matériel banale en arrêt de production.\n\n### Des situations très courantes\n\n- **Un switch de cellule est remplacé.** Avec la fiche (ports, VLAN par port, ports en tronc, ports bloqués) et la configuration sauvegardée, on restaure et on vérifie. Sans elles, on rebranche port par port en essayant de deviner ce que faisait chaque câble ; un VLAN mal affecté place une machine dans la mauvaise zone, et le défaut n'apparaît que plus tard.\n- **Le pare-feu tombe.** Sans sauvegarde de configuration ni fiche des interfaces, les règles se reconstruisent à partir des souvenirs de chacun. Les flux oubliés (télémaintenance, synchronisation d'horloge, remontée vers l'historique) réapparaissent sous forme d'incidents dans les jours qui suivent.\n- **Un câble est débranché pendant une intervention.** Sans repère aux deux extrémités ni plan de raccordement, impossible de savoir où il allait. Un petit switch ajouté « provisoirement » dans un coffret et jamais documenté devient une panne fantôme.\n- **Le mot de passe d'administration est introuvable.** Il ne reste que le retour aux paramètres d'usine, donc une reconfiguration complète, souvent sans plan.\n- **La version de firmware est inconnue.** On installe la plus récente : le comportement change, un automate ne dialogue plus avec sa supervision.\n- **Seul le prestataire sait.** Son délai d'intervention (la nuit, le week-end) s'ajoute au RTO.\n\n### Un ordre de grandeur\n\nLes durées ci-dessous sont **illustratives** : elles donnent l'écart typique entre un asset maîtrisé et un asset inconnu, pour le remplacement d'un switch de cellule de 24 ports.\n\n| Ce qui est disponible | Durée typique de remise en service |\n|---|---|\n| Fiche à jour, configuration sauvegardée et testée, câbles repérés | Environ une heure |\n| Fiche à jour, sans sauvegarde de configuration | Deux à trois heures (reconfiguration à la main, d'après la fiche) |\n| Ni fiche, ni sauvegarde, ni repère | Une demi-journée à plusieurs jours, puis des défauts découverts après le redémarrage |\n\nL'écart ne vient pas de la compétence des équipes : il vient de **ce qu'elles trouvent en arrivant**.\n\n### Après une cyberattaque, c'est pire\n\nAprès une attaque, on ne peut plus faire confiance à la configuration en place : un attaquant a pu ajouter une règle, un compte, une redirection de port. Pour reprendre, il faut savoir **ce qui est légitime**. Sans configuration de référence documentée, on ne distingue pas une règle ajoutée par l'attaquant d'une règle oubliée : il faut tout reconstruire, sans plan, alors même que la pression est la plus forte.\n\n> **Repère** : un RTO de 4 h annoncé dans le PRI n'est tenable que si les fiches des assets du système sont à jour. Sinon, le RTO réel est inconnu, et presque toujours plus long.\n\n### Ce que « connaître un asset en profondeur » veut dire\n\nPour chaque équipement, on doit pouvoir répondre sans aller le voir :\n\n- **qui il est** : TAG, type, marque, modèle, numéro de série, version de firmware ;\n- **où il est** : site, zone, baie, position, bandeau ;\n- **comment il est raccordé** : chaque port utilisé, son câble, son repère, ce qu'il y a au bout ;\n- **comment il est configuré** : interfaces, VLAN, adresses, règles, adresse d'administration ;\n- **qui l'administre et comment on y accède** (le mot de passe, lui, reste dans le coffre-fort, jamais dans la fiche) ;\n- **où est la sauvegarde de sa configuration**, et quand sa restauration a été testée ;\n- **comment il a été durci**, et ce qui reste à faire.\n\nC'est exactement ce que tient une fiche WerbAssets.\n\n---\n\n## 2. Durcir un asset : de quoi parle-t-on ?\n\nUn équipement sort de l'usine configuré pour **fonctionner partout, facilement** : comptes par défaut, mots de passe connus de tous, services ouverts, tous les ports actifs. C'est pratique pour l'installer, et tout aussi pratique pour un attaquant.\n\n**Durcir** (*hardening*), c'est réduire sa **surface d'attaque** : tout ce qui n'est pas nécessaire à son rôle est retiré, désactivé ou fermé ; ce qui reste est protégé, tracé et tenu à jour. On passe de « fonctionne partout » à **« ne fait que ce qu'on attend de lui, et seulement pour ceux qui doivent »**.\n\n### Les domaines du durcissement\n\n| Domaine | Mesures typiques |\n|---|---|\n| Mises à jour | Firmware à jour, validé par le constructeur pour l'usage industriel ; version notée dans la fiche |\n| Comptes | Compte d'usine supprimé ou désactivé, mots de passe par défaut remplacés, comptes nominatifs, droits au strict nécessaire |\n| Authentification | Mots de passe longs conservés dans le coffre-fort, verrouillage après plusieurs erreurs, double authentification quand l'équipement le permet |\n| Administration | Protocoles chiffrés (SSH, HTTPS) à la place de Telnet et HTTP ; administration seulement depuis le réseau d'administration ; fermeture de session après inactivité |\n| Services | Désactivation de ce qui ne sert pas : serveur web inutile, SNMP v1 et v2c (communauté « public »), UPnP, protocoles de découverte hors besoin, fonctions d'écriture OT non utilisées |\n| Ports | Ports inutilisés désactivés ou placés dans un VLAN sans issue ; contrôle des équipements raccordés ; VLAN 1 non utilisé pour les flux |\n| Filtrage | Tout est interdit sauf ce qui est explicitement autorisé ; règles au plus juste, sans « tout vers tout » ; protection contre l'usurpation d'adresse (antispoofing) |\n| Traçabilité | Horloge synchronisée (NTP), journaux envoyés vers un serveur central (syslog), bannière d'avertissement |\n| Sauvegarde | Configuration sauvegardée **après** durcissement, restauration testée |\n| Physique | Baie fermée à clé, ports en façade obturés, sélecteur RUN / PROG des automates en position protégée |\n\n### Les particularités d'un site industriel\n\n- On ne met pas à jour un automate comme un poste de bureau : une mise à jour se **valide** avec le constructeur ou l'intégrateur, et se planifie sur un arrêt.\n- Quand une mesure est impossible (équipement ancien, logiciel figé), on la **compense** : cloisonnement par le pare-feu, accès limité, surveillance renforcée. La compensation se note dans la fiche.\n- Certains équipements supportent mal les analyses réseau : les scans se font **hors production**.\n- Références utiles : l'IEC 62443-4-2 (exigences de sécurité des composants), l'IEC 62443-3-3 (exigences du système), les guides de l'ANSSI sur l'hygiène informatique et sur la cybersécurité des systèmes industriels.\n\nDurcir ne doit rien casser : c'est pour cela qu'on teste, et que le bon moment pour le faire est le suivant.\n\n---\n\n## 3. Durcir dès la première configuration\n\n### Pourquoi à la mise en service\n\n|  | À la mise en service | En production |\n|---|---|---|\n| Arrêt | L'équipement n'est pas encore critique : on redémarre librement | Chaque redémarrage (mise à jour, changement de mode) demande une fenêtre d'arrêt négociée avec la production |\n| Flux | Aucun flux métier à casser | Fermer un port ou couper un service peut arrêter un flux que personne n'avait documenté |\n| Tests | Scans et captures sans risque | Un scan peut perturber un automate ou une IHM fragile |\n| Retour arrière | On recommence | Il faut une procédure de retour arrière, préparée et testée |\n| Coût | Quelques heures, prévues dans le projet | Un projet à part, souvent repoussé : la « dette de sécurité » s'accumule |\n| Référence | La configuration durcie devient la référence documentée | La référence n'existe pas : on la découvre en même temps qu'on la modifie |\n\nDurcir à la mise en service coûte peu ; durcir en production coûte cher et expose à l'arrêt. Chaque équipement installé sans durcissement est une **dette** que le site paiera plus tard, au pire moment.\n\n### Une procédure, dès la première configuration\n\nLa procédure est **écrite**, la même pour tous les équipements d'un même type, et appliquée **avant** le raccordement au réseau de production :\n\n1. **Mettre à jour le firmware** vers la version validée.\n2. **Sécuriser l'accès** : type d'interface, authentification, compte d'usine supprimé, mot de passe par défaut remplacé, complexité, politique d'erreur.\n3. **Configurer le réseau** : interfaces, VLAN, adresse d'administration, antispoofing.\n4. **Désactiver les services** inutiles.\n5. **Poser les règles** au plus juste.\n6. **Sauvegarder la configuration** et inscrire la sauvegarde au registre.\n7. **Analyser hors production** : découverte des ports ouverts, capture des échanges, vulnérabilités connues de la version installée.\n8. **Contrôler en production**, une fois raccordé.\n\nCe sont les **8 étapes et 23 points** de la *Procédure de configuration et de sécurisation* de chaque fiche pare-feu et switch de WerbAssets : chaque point est **Fait**, **À faire** ou **Non applicable**, avec une valeur ou un commentaire, jamais un mot de passe.\n\nQuand l'équipement est livré par un intégrateur, exigez qu'il le livre **durci et documenté** : fiche remplie, procédure suivie, configuration sauvegardée. C'est une clause du cahier d'exigences cyber du prestataire (WerbPresta).\n\n### Durcir un équipement déjà en production\n\nQuand il faut le faire quand même :\n\n1. **Connaître d'abord** : compléter la fiche, observer les flux réels (capture sur un port miroir pendant un cycle de production complet).\n2. **Sauvegarder** la configuration actuelle : c'est le retour arrière.\n3. **Prioriser** : pare-feu en frontière de zone, équipements joignables à distance, ports accessibles en façade.\n4. **Changer par petits lots**, sur une fenêtre de maintenance, avec l'exploitation présente, un équipement à la fois.\n5. **Vérifier** les flux après chaque lot ; revenir en arrière au moindre doute.\n6. **Mettre à jour la fiche** et sauvegarder la nouvelle configuration.\n\n---\n\n## 4. Bien tenir WerbAssets\n\n### Les principes\n\n- **WerbMap fait foi pour l'inventaire** : un équipement se déclare d'abord dans WerbMap (TAG, type, zone, coffret), qui le publie ; WerbAssets le reprend au rechargement de l'inventaire. *+ Asset hors inventaire* reste provisoire, le temps de le déclarer dans WerbMap.\n- **Une base par site**, rangée dans `sites/<CODE>/inventaires/`, avec des droits réservés à l'équipe du site : elle décrit la configuration du réseau.\n- **Aucun secret** : ni mot de passe, ni clé, ni fichier de configuration dans WerbAssets. Les mots de passe vont dans le coffre-fort (guide « Les mots de passe » de WerbMap), les configurations dans l'espace de sauvegarde inscrit au registre des sauvegardes (WerbExploitation).\n- **Règle d'or : une intervention, une fiche à jour.** Le jour même, par celui qui est intervenu. Le journal garde qui a changé quoi.\n\n### À la mise en service d'un équipement\n\n- [ ] Actif créé dans WerbMap (TAG, type, zone, coffret) et inventaire publié\n- [ ] Inventaire rechargé dans WerbAssets, fiche créée (modèle, numéro de série, firmware, administrateur, adresse d'administration)\n- [ ] Interfaces, VLAN et ports saisis ; ports inutilisés bloqués\n- [ ] Raccordements saisis dans le brassage, câbles repérés aux deux extrémités (repère câble, repère fil / brin, aboutissant)\n- [ ] Procédure de configuration et de sécurisation : chaque point **Fait** ou **Non applicable** (avec la raison)\n- [ ] Configuration sauvegardée après durcissement, sauvegarde inscrite au registre, restauration testée\n- [ ] Mot de passe d'administration rangé dans le coffre-fort\n- [ ] Fiche et baie imprimées\n\n### Garder une copie hors de l'outil\n\nPendant une panne réseau, l'ordinateur qui ouvre WerbAssets peut lui-même être inaccessible. **Imprimez la baie** (*Imprimer la baie* : tous ses bandeaux) et les fiches de ses équipements, et rangez-les dans la baie ou dans le classeur d'exploitation. Remplacez-les à chaque modification importante.\n\n### Saisir sur le terrain\n\nPour un relevé en baie ou une mise en service de plusieurs équipements, utilisez **Saisie Excel** : *Modèle de saisie* (une ligne par asset de l'inventaire), remplissage sur place, puis *Importer un classeur*. Le rapport montre chaque création, mise à jour ou ligne rejetée **avant** d'appliquer.\n\n### La revue périodique\n\nChaque mois, ou chaque trimestre sur un petit site, ouvrez le **tableau de bord** et traitez ses points d'attention :\n\n| Point d'attention | Action |\n|---|---|\n| Inventaire WerbMap absent ou de plus de 90 jours | Faire publier l'inventaire dans WerbMap, puis le recharger |\n| Fiches à renseigner | Compléter en priorité les pare-feu et les switch de cœur |\n| Points de sécurisation à faire | Planifier, ou noter une mesure compensatoire et passer le point en Non applicable avec sa raison |\n| Fiche orpheline | L'équipement a disparu de WerbMap : retiré du site (effacer la fiche) ou oublié dans l'inventaire (le redéclarer) |\n| Écart de modèle ou de firmware avec WerbMap | Vérifier sur l'équipement, puis corriger la source fautive |\n\n### Avec les autres modules\n\n- **WerbMap** : l'inventaire, les zones et les systèmes d'information dont les assets font partie.\n- **WerbPCR** : le RTO de chaque système et ses procédures de reprise s'appuient sur les fiches WerbAssets. Une procédure qui dit « reconfigurer le switch » doit pouvoir renvoyer à une fiche à jour et à une configuration sauvegardée.\n- **WerbExploitation** : le registre des sauvegardes des configurations, les mises à jour de firmware et les interventions.\n- **WerbRecette** : la recette réseau après une mise en service ou une modification, et les contrôles de non-régression.\n- **WerbPresta** : les exigences envers les intégrateurs et les mainteneurs (livrer durci et documenté).\n\n> **En résumé** : chaque heure passée à documenter et à durcir un équipement à sa mise en service est une heure, souvent bien plus, gagnée le jour où il tombe.\n" }];

  async function ouvrir({ verrou: prendreVerrou = true } = {}) {
    if (accesDirect) {
      const [poignee] = await showOpenFilePicker({ types: types(), multiple: false });
      const f = await poignee.getFile();
      const r = { poignee, nom: f.name, texte: await f.text(), modifie: f.lastModified };
      return prendreVerrou ? verrou.prendre(r) : r;
    }
    return new Promise((resolve, reject) => {
      const inp = Object.assign(document.createElement("input"), { type: "file", accept: ".json,application/json" });
      inp.onchange = async () => {
        const f = inp.files[0];
        if (!f) return reject(new Error("Aucun fichier choisi."));
        resolve({ poignee: null, nom: f.name, texte: await f.text(), modifie: f.lastModified });
      };
      inp.click();
    });
  }

  // Enregistre. Si « modifie » est fourni et que le fichier a changé depuis, lève une erreur code CONFLIT.
  // Le verrou est contrôlé avant l'écriture (un collègue a-t-il pris la main ?) et inscrit dans l'enveloppe ; refus = AbortError.
  async function enregistrer(objet, { poignee = null, nomSuggere = `base${WERB.extension}`, modifie = null } = {}) {
    const enveloppee = objet && typeof objet === "object" && objet.famille === FAMILLE;
    if (accesDirect) {
      const nouveau = !poignee;
      if (!poignee) poignee = await showSaveFilePicker({ suggestedName: nomSuggere, types: types() });
      const acces = await verrou.avantEcriture(poignee, { nouveau });
      if (!acces) throw annule();
      if (enveloppee) objet.verrou = verrou.valeur();
      if (modifie !== null && acces !== "reprise") {
        const actuel = await poignee.getFile();
        if (actuel.lastModified !== modifie) { const e = new Error("Le fichier a été modifié par ailleurs depuis son ouverture."); e.code = "CONFLIT"; throw e; }
      }
      const fin = await ecrireTexte(poignee, JSON.stringify(objet, null, 1));
      verrou.apresEcriture(poignee, fin);
      return { poignee, modifie: fin };
    }
    if (enveloppee) objet.verrou = null;                     // copie téléchargée : aucun verrou
    telecharger(JSON.stringify(objet, null, 1), nomSuggere, "application/json");
    return { poignee: null, modifie: null };
  }
  async function ecrireTexte(poignee, texte) {
    const w = await poignee.createWritable();
    await w.write(texte);
    await w.close();
    return (await poignee.getFile()).lastModified;
  }
  const annule = () => new DOMException("Opération annulée.", "AbortError");

  /* ---------- Verrou d'une base ouverte (charte §5.7) ---------- */

  // Une base ouverte en écriture porte { par, depuis, vu, session } dans « verrou » ; un collègue qui l'ouvre choisit entre
  // lecture seule et prise de main. Le verrou d'une autre session expire 12 h après sa dernière écriture (« vu »).
  // Le bandeau s'affiche dans l'élément #werb-verrou de la page, s'il existe. Une seule base suivie par page.
  const verrou = (() => {
    const SESSION = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const DUREE_H = 12;
    let utilisateur = "", etat = { mode: "aucun" }, rappel = null, surveillance = false;
    const STYLE = `
.werb-verrou:empty{display:none}
.werb-verrou{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:#e1f3e5;color:#1d6631;border:1px solid #b7dfc1}
.werb-verrou.lecture{background:#fcefd2;color:#7f5300;border-color:#efd59a}
.werb-verrou.perdu{background:#fbe3e1;color:#962a20;border-color:#f0b9b3}
.wv-back{position:fixed;inset:0;z-index:10000;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.wv-box{background:#fff;color:#1d2330;max-width:520px;width:100%;border-radius:10px;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.3);font:14px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
.wv-box h2{margin:0 0 8px;font-size:17px;color:#1f3864}.wv-box p{margin:0 0 8px}.wv-box .wv-n{font-size:12px;color:#5b6474}
.wv-box .wv-a{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:14px}
.wv-box button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid #c4cad4;background:#fff;cursor:pointer}
.wv-box button.p{background:#1f3864;border-color:#1f3864;color:#fff}.wv-box button.d{background:#b3261e;border-color:#b3261e;color:#fff}
@media print{.werb-verrou{display:none!important}}`;
    function style() {
      if (typeof document !== "undefined" && !document.getElementById("werb-verrou-style")) {
        document.head.appendChild(Object.assign(document.createElement("style"), { id: "werb-verrou-style", textContent: STYLE }));
      }
    }
    const date = iso => new Date(iso);
    const quand = iso => {
      const d = date(iso); if (isNaN(d)) return "";
      const h = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      return d.toDateString() === new Date().toDateString() ? `depuis ${h}` : `depuis le ${d.toLocaleDateString("fr-FR")} à ${h}`;
    };
    // Verrou posé par une autre session et encore valable
    function actif(v) {
      if (!v || typeof v !== "object" || !v.par || v.session === SESSION) return false;
      const t = Date.parse(v.vu || v.depuis);
      return !isNaN(t) && Date.now() - t < DUREE_H * 3600e3;
    }
    const poser = () => ({ par: utilisateur || "Utilisateur inconnu", depuis: maintenant(), vu: maintenant(), session: SESSION });
    const lireVerrou = texte => { try { const j = JSON.parse(texte); return j && typeof j === "object" ? j.verrou ?? null : null; } catch (e) { return null; } };

    function dialogue(titre, html, boutons) {
      style();
      return new Promise(res => {
        const back = document.createElement("div");
        back.className = "wv-back";
        back.innerHTML = `<div class="wv-box" role="dialog" aria-modal="true"><h2>${esc(titre)}</h2>${html}<div class="wv-a">${boutons.map(([k, l, c]) => `<button type="button" data-wv="${k}" class="${c || ""}">${esc(l)}</button>`).join("")}</div></div>`;
        const fin = k => { back.remove(); res(k); };
        back.addEventListener("click", e => { const k = e.target.dataset && e.target.dataset.wv; if (k) fin(k); });
        back.addEventListener("keydown", e => { if (e.key === "Escape") fin(boutons[0][0]); });
        document.body.appendChild(back);
        const p = back.querySelector("button.p, button.d") || back.querySelector("button"); if (p) p.focus();
      });
    }
    async function permission(poignee) {
      try {
        let p = await poignee.queryPermission({ mode: "readwrite" });
        if (p !== "granted") p = await poignee.requestPermission({ mode: "readwrite" });
        return p === "granted";
      } catch (e) { return false; }
    }
    async function memeFichier(a, b) {
      if (!a || !b) return false;
      if (a === b) return true;
      try { return await a.isSameEntry(b); } catch (e) { return false; }
    }

    function afficher() {
      if (typeof document === "undefined") return;
      style();
      const el = document.getElementById("werb-verrou");
      if (el) {
        const e = etat, v = e.v || {};
        const [cls, txt, titre] = e.mode === "mien" ? ["", `🔒 Ouvert par ${v.par === utilisateur ? "vous" : v.par} ${quand(v.depuis)}`, "Vous avez la main : un collègue qui ouvre cette base la verra en lecture seule jusqu'à sa fermeture."]
          : e.mode === "lecture" ? (e.libre ? ["lecture", "🔓 Lecture seule · base libérée", `${e.libre} a fermé la base : rouvrez-la pour la modifier.`]
            : ["lecture", `🔒 Ouvert par ${v.par} ${quand(v.depuis)} · lecture seule`, "Vos modifications ne pourront pas être enregistrées sans prendre la main."])
          : e.mode === "perdu" ? ["perdu", `⚠ ${v.par} a pris la main ${quand(v.depuis)}`, "Vos modifications en cours n'écraseront son travail que si vous reprenez la main à l'enregistrement."]
          : ["", "", ""];
        el.className = `werb-verrou ${cls}`.trim();
        el.textContent = txt;
        el.title = titre;
      }
      if (rappel) try { rappel(etat); } catch (e) { /* sans effet */ }
    }

    // Relit le verrou du fichier suivi (retour sur l'onglet, toutes les minutes, avant d'écrire) : signale une prise de main.
    async function verifier() {
      const e = etat;
      if (!e.poignee || e.mode === "aucun") return etat;
      let f;
      try { f = await e.poignee.getFile(); } catch (x) { return etat; }
      if (e.modifie && f.lastModified === e.modifie) return etat;
      const v = lireVerrou(await f.text());
      if (etat !== e) return etat;                           // base changée entre-temps
      e.modifie = f.lastModified;
      if (e.mode === "mien" && actif(v)) etat = { ...e, mode: "perdu", v };
      else if (e.mode === "perdu" && !actif(v)) etat = { ...e, mode: "mien", v: e.mien };
      else if (e.mode === "lecture") etat = actif(v) ? { ...e, v, libre: "" } : { ...e, libre: e.libre || (e.v && e.v.par) || "Le titulaire" };
      // A la main mais son verrou n'est plus dans le fichier (collègue parti, écriture d'un outil sans verrou) : il est réinscrit
      if (etat.mode === "mien" && !(v && v.session === SESSION)) {
        try {
          const j = JSON.parse(await f.text());
          if (j && typeof j === "object" && j.famille === FAMILLE && etat.poignee === e.poignee) { j.verrou = { ...etat.v, vu: maintenant() }; etat.modifie = await ecrireTexte(e.poignee, JSON.stringify(j, null, 1)); }
        } catch (x) { /* fichier illisible : inscrit au prochain enregistrement */ }
      }
      afficher();
      return etat;
    }
    function surveiller() {
      if (surveillance || typeof addEventListener !== "function") return;
      surveillance = true;
      addEventListener("focus", () => { verifier(); });
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") verifier(); });
      setInterval(() => { verifier(); }, 60000);
      addEventListener("pagehide", () => { liberer(); });   // au mieux : le verrou expire de toute façon
    }

    // Prend le verrou de la base ouverte { poignee, nom, texte, modifie }. Renvoie le même objet complété de
    // { modifie (après écriture du verrou), lecture, ecriture } ; « Annuler » lève une AbortError.
    async function prendre(f) {
      const v = lireVerrou(f.texte);
      let choix = "main";
      if (f.poignee && actif(v)) {
        choix = await dialogue("Base déjà ouverte", `<p>Cette base est ouverte par <b>${esc(v.par)}</b> ${esc(quand(v.depuis))}.</p>
          <p>En <b>lecture seule</b>, vous consultez sans pouvoir enregistrer. <b>Prendre la main</b> lui retire la main : ses modifications non enregistrées ne pourront plus être écrites sans écraser les vôtres.</p>
          <p class="wv-n">Si cette personne a fermé son navigateur sans fermer la base, le verrou expire ${DUREE_H} h après son dernier enregistrement.</p>`,
          [["annuler", "Annuler"], ["lecture", "Ouvrir en lecture seule"], ["main", "Prendre la main", "p"]]);
        if (choix === "annuler") throw annule();
      }
      await liberer();                                       // base précédente
      if (!f.poignee) { etat = { mode: "aucun" }; afficher(); return { ...f, lecture: false, ecriture: false }; }
      surveiller();
      if (choix === "lecture") { etat = { mode: "lecture", v, poignee: f.poignee, modifie: f.modifie, libre: "" }; afficher(); return { ...f, lecture: true, ecriture: false }; }
      if (!(await permission(f.poignee))) { etat = { mode: "aucun" }; afficher(); return { ...f, lecture: false, ecriture: false }; }
      const mien = poser();
      etat = { mode: "mien", v: mien, mien, poignee: f.poignee, modifie: f.modifie };
      let modifie = f.modifie;
      try {
        const j = JSON.parse(f.texte);
        if (j && typeof j === "object" && j.famille === FAMILLE) { j.verrou = mien; modifie = await ecrireTexte(f.poignee, JSON.stringify(j, null, 1)); }
      } catch (e) { /* format historique : le verrou sera écrit au premier enregistrement */ }
      etat.modifie = modifie;
      afficher();
      return { ...f, modifie, lecture: false, ecriture: true };
    }

    // Avant d'écrire la base : faux si l'utilisateur renonce, "reprise" s'il reprend la main sur un collègue, "ok" sinon.
    // Pour les modules qui écrivent eux-mêmes ; WerbSocle.enregistrer l'appelle de lui-même.
    async function avantEcriture(poignee, { nouveau = false } = {}) {
      if (!poignee) return "ok";
      const suivi = await memeFichier(etat.poignee, poignee);
      if (!nouveau) {
        let v = null;
        try { v = lireVerrou(await (await poignee.getFile()).text()); } catch (e) { /* fichier illisible : écrit tel quel */ }
        if (actif(v)) {
          if (suivi && etat.mode !== "lecture") { etat = { ...etat, mode: "perdu", v }; afficher(); }
          const lecture = suivi && etat.mode === "lecture";
          const c = await dialogue(lecture ? "Base ouverte en lecture seule" : "Un collègue a pris la main",
            `<p>${lecture ? `<b>${esc(v.par)}</b> a la main sur cette base ${esc(quand(v.depuis))}.` : `<b>${esc(v.par)}</b> a pris la main sur cette base ${esc(quand(v.depuis))}, pendant que vous travailliez.`}</p>
            <p>Enregistrer maintenant <b>remplace son travail</b> par le vôtre et lui retire la main. Pour garder les deux versions, annulez puis utilisez « Enregistrer sous ».</p>`,
            [["non", "Annuler"], ["oui", "Reprendre la main et enregistrer", "d"]]);
          if (c !== "oui") return false;
          await marquer(poignee, suivi);
          return "reprise";
        }
      }
      await marquer(poignee, suivi);
      return "ok";
    }
    async function marquer(poignee, suivi) {
      if (suivi && etat.mode === "mien") return;
      if (!suivi) await liberer();                            // « Enregistrer sous » : l'ancien fichier est libéré
      surveiller();
      const mien = poser();
      etat = { mode: "mien", v: mien, mien, poignee, modifie: null };
      afficher();
    }
    function apresEcriture(poignee, modifie) { if (etat.poignee === poignee || etat.mode === "mien") etat.modifie = modifie ?? null; }

    // Verrou à inscrire dans l'enveloppe : le sien s'il a la main, null sinon. « vu » repousse l'expiration.
    function valeur() {
      if (etat.mode !== "mien") return null;
      etat.v.vu = maintenant();
      return { ...etat.v };
    }

    // Libère la base suivie : son verrou est retiré du fichier s'il est encore le sien (fermeture, autre base).
    async function liberer() {
      const e = etat;
      etat = { mode: "aucun" };
      afficher();
      if (e.mode !== "mien" || !e.poignee) return;
      try {
        const j = JSON.parse(await (await e.poignee.getFile()).text());
        if (j && j.verrou && j.verrou.session === SESSION) { j.verrou = null; await ecrireTexte(e.poignee, JSON.stringify(j, null, 1)); }
      } catch (x) { /* fichier inaccessible : le verrou expirera */ }
    }

    return Object.freeze({
      SESSION, DUREE_H, actif, quand, prendre, avantEcriture, apresEcriture, valeur, liberer, verifier,
      identifier(nom) { utilisateur = String(nom || ""); if (etat.mode === "mien" && etat.v) { etat.v.par = utilisateur || etat.v.par; afficher(); } },
      surChangement(fn) { rappel = typeof fn === "function" ? fn : null; },
      get etat() { return { mode: etat.mode, par: etat.v ? etat.v.par : "", depuis: etat.v ? etat.v.depuis : "", libre: etat.libre || "" }; },
      get lectureSeule() { return etat.mode === "lecture"; },
      afficher,
    });
  })();

  /* ---------- Espace de données SMSI_<GROUPE> (charte §5.3 et §5.4) ---------- */

  // Le dossier est demandé une fois par session ; sa poignée n'est jamais mémorisée.
  const espace = (() => {
    let racine = null, groupe = null;
    const accesDossier = typeof globalThis.showDirectoryPicker === "function";

    async function dossier(chemin, creer = false) {
      let d = racine;
      for (const part of chemin.split("/").filter(Boolean)) d = await d.getDirectoryHandle(part, { create: creer });
      return d;
    }
    function decouper(chemin) { const i = chemin.lastIndexOf("/"); return [chemin.slice(0, i + 1), chemin.slice(i + 1)]; }

    // Lit un JSON relatif à la racine. Renvoie null si absent ou non autorisé (droits du drive).
    async function lire(chemin) {
      if (!racine) throw new Error("Aucun espace WerbSMSI ouvert.");
      try {
        const [rep, nom] = decouper(chemin);
        const f = await (await (await dossier(rep)).getFileHandle(nom)).getFile();
        if (f.size > TAILLE_MAX) throw new Error(`${chemin} : fichier trop volumineux.`);
        return JSON.parse(await f.text());
      } catch (e) {
        if (["NotFoundError", "NotAllowedError", "SecurityError", "TypeMismatchError"].includes(e.name)) return null;
        throw e;
      }
    }

    // Contenu d'un dossier relatif à la racine : [{ nom, type, taille, modifie }], ou null si absent ou non autorisé.
    async function lister(chemin = "") {
      if (!racine) throw new Error("Aucun espace WerbSMSI ouvert.");
      try {
        const res = [];
        for await (const [nom, h] of (await dossier(chemin)).entries()) {
          if (h.kind === "directory") { res.push({ nom, type: "directory" }); continue; }
          const f = await h.getFile();
          res.push({ nom, type: "file", taille: f.size, modifie: f.lastModified });
        }
        return res.sort((a, b) => a.nom.localeCompare(b.nom));
      } catch (e) {
        if (["NotFoundError", "NotAllowedError", "SecurityError", "TypeMismatchError"].includes(e.name)) return null;
        throw e;
      }
    }

    async function ecrire(chemin, objet) {
      const [rep, nom] = decouper(chemin);
      const w = await (await (await dossier(rep, true)).getFileHandle(nom, { create: true })).createWritable();
      await w.write(JSON.stringify(objet, null, 1));
      await w.close();
    }

    // L'identifiant « werbsmsi-espace » permet à Edge de rouvrir le sélecteur sur le dernier espace choisi lorsque la page a une
    // origine (http) ; en file://, Edge ne le retient pas d'une page à l'autre.
    async function choisir() {
      if (!accesDossier) throw new Error("Ce navigateur ne permet pas d'ouvrir un dossier : utilisez Microsoft Edge.");
      return adopter(await showDirectoryPicker({ mode: "readwrite", id: "werbsmsi-espace" }));
    }

    // Retient comme espace un dossier déjà obtenu (dossier créé par le portail, par exemple).
    async function adopter(d) {
      const avant = racine;
      racine = d;
      const g = await lire("werbsmsi.groupe.json");
      if (!g || g.format !== "WERBSMSI-GROUPE" || !g.data || !g.data.groupeId) {
        racine = avant;
        throw new Error("Ce dossier n'est pas un espace WerbSMSI (werbsmsi.groupe.json absent ou illisible).");
      }
      groupe = g.data;
      return groupe;
    }

    const prefixeNiveau = (niveau, site) => {
      if (niveau === "groupe") return "";
      if (!CODE_SITE.test(site || "")) throw new Error("Code de site invalide.");
      return `sites/${site}/`;
    };

    // Fusionne les fichiers de publication d'un niveau. Renvoie { objets: {nom: [élément…]}, fichiers: [...], conflits: [...] }.
    async function publications(niveau, site) {
      const res = { objets: {}, fichiers: [], conflits: [] };
      let rep;
      try { rep = await dossier(prefixeNiveau(niveau, site) + "publications"); } catch (e) { return res; }
      const proprio = {};
      for await (const [nom, h] of rep.entries()) {
        if (h.kind !== "file" || !nom.endsWith(".json")) continue;
        let j;
        try { const f = await h.getFile(); if (f.size > TAILLE_MAX) continue; j = JSON.parse(await f.text()); } catch (e) { continue; }
        if (!j || j.format !== "WERBSMSI-PUBLICATION" || !j.data || typeof j.data !== "object") continue;
        const module = nom.slice(0, -5);
        res.fichiers.push({ module, publieLe: j.meta && j.meta.publieLe, publiePar: j.meta && j.meta.publiePar });
        for (const [cle, val] of Object.entries(j.data)) {
          if (proprio[cle] && proprio[cle] !== module) { res.conflits.push({ objet: cle, modules: [proprio[cle], module] }); continue; }
          proprio[cle] = module;
          res.objets[cle] = val;
        }
      }
      return res;
    }

    // Écrit publications/<id>.json du niveau. « objets » : {nom: [éléments]} ; pour chaque nom fourni, les éléments existants
    // pour lesquels remplacer(élément) est vrai sont retirés avant ajout (tous par défaut).
    async function publier({ niveau, site, objets, utilisateur = "", remplacer = () => true }) {
      if (!racine) throw new Error("Aucun espace WerbSMSI ouvert.");
      if (!WERB.portees.includes(niveau)) throw new Error(`${WERB.produit} ne publie pas au niveau « ${niveau} ».`);
      const chemin = `${prefixeNiveau(niveau, site)}publications/${WERB.id}.json`;
      const actuel = await lire(chemin);
      const data = actuel && actuel.format === "WERBSMSI-PUBLICATION" && actuel.data ? actuel.data : {};
      const jour = maintenant();
      const signe = e => Object.assign({}, e, { source: WERB.id, majLe: jour.slice(0, 10) });
      for (const [nom, elements] of Object.entries(objets)) {
        if (!Array.isArray(elements)) { data[nom] = signe(elements); continue; }   // objet unique (ex. échelles) : remplacé en entier
        const gardes = Array.isArray(data[nom]) ? data[nom].filter(e => !remplacer(e)) : [];
        data[nom] = gardes.concat(elements.map(signe));
      }
      const meta = {
        produit: WERB.produit, appVersion: WERB.version, auteur: WERB.auteur, generateur: WERB.ligne,
        creeLe: (actuel && actuel.meta && actuel.meta.creeLe) || jour.slice(0, 10), modifieLe: jour, modifiePar: utilisateur,
        groupeId: groupe.groupeId, module: WERB.id, portee: niveau, publiePar: utilisateur, publieLe: jour,
      };
      if (niveau === "site") meta.site = site;
      await ecrire(chemin, { format: "WERBSMSI-PUBLICATION", schema: 1, famille: FAMILLE, meta, data });
      return chemin;
    }

    // Ouvre une base rangée dans l'espace. Renvoie { poignee, nom, texte, modifie }, comme ouvrir() : la base s'enregistre à sa place.
    async function ouvrirFichier(chemin) {
      if (!racine) throw new Error("Aucun espace WerbSMSI ouvert.");
      if (!chemin || /[\\:*?"<>|\u0000-\u001f]/.test(chemin) || chemin.split("/").some(p => !p || p === "." || p === "..")) throw new Error(`Chemin invalide : ${chemin}`);
      const [rep, nom] = decouper(chemin);
      let poignee;
      try { poignee = await (await dossier(rep)).getFileHandle(nom); }
      catch (e) { throw new Error(`${chemin} : fichier absent de l'espace ou non autorisé par les droits du dossier.`); }
      const f = await poignee.getFile();
      if (f.size > TAILLE_MAX) throw new Error(`${chemin} : fichier trop volumineux.`);
      return { poignee, nom: f.name, texte: await f.text(), modifie: f.lastModified };
    }

    /* Raccourci d'espace (exception à P2, charte §1 et §5.5) : le portail mémorise la poignée du dossier de l'espace ouvert
       dans « werb.werbsmsi.raccourcis » ; les modules ouverts depuis ses puces la réutilisent au lieu du sélecteur.
       Une poignée n'est pas une donnée : c'est une référence au dossier, soumise à l'autorisation d'Edge. La base est effacée
       à la fermeture du portail ou quand l'option est désactivée. Toute erreur ramène au sélecteur de dossier. */
    const BASE_RACCOURCIS = "werb.werbsmsi.raccourcis";
    function baseRaccourcis() {
      return new Promise((ok, ko) => {
        const r = indexedDB.open(BASE_RACCOURCIS, 1);
        r.onupgradeneeded = () => r.result.createObjectStore("espaces");
        r.onsuccess = () => ok(r.result);
        r.onerror = () => ko(r.error);
      });
    }
    async function transaction(mode, fn) {
      const db = await baseRaccourcis();
      try {
        return await new Promise((ok, ko) => {
          const tx = db.transaction("espaces", mode), req = fn(tx.objectStore("espaces"));
          tx.oncomplete = () => ok(req && req.result);
          tx.onerror = () => ko(tx.error);
          tx.onabort = () => ko(tx.error);
        });
      } finally { db.close(); }
    }
    // Portail : mémorise le dossier de l'espace ouvert. Renvoie false si le navigateur le refuse.
    async function memoriser() {
      if (!racine || !groupe) return false;
      try { await transaction("readwrite", s => s.put({ poignee: racine, nom: racine.name, organisation: groupe.organisation, le: maintenant() }, groupe.groupeId)); return true; }
      catch (e) { return false; }
    }
    // Portail : efface tous les raccourcis.
    function oublier() {
      return new Promise(ok => { try { const r = indexedDB.deleteDatabase(BASE_RACCOURCIS); r.onsuccess = r.onerror = r.onblocked = () => ok(); } catch (e) { ok(); } });
    }
    // Module : ouvre l'espace d'un groupe depuis le raccourci du portail (autorisation d'Edge au besoin). Renvoie true si l'espace est ouvert.
    async function depuisRaccourci(groupeId) {
      try {
        const e = await transaction("readonly", s => s.get(groupeId));
        if (!e || !e.poignee) return false;
        let p = await e.poignee.queryPermission({ mode: "readwrite" });
        if (p !== "granted") p = await e.poignee.requestPermission({ mode: "readwrite" });
        if (p !== "granted") return false;
        await adopter(e.poignee);
        return groupe.groupeId === groupeId;
      } catch (err) { return false; }
    }

    return Object.freeze({
      get disponible() { return accesDossier; },
      memoriser, oublier, depuisRaccourci,
      get ouvert() { return !!racine; },
      get nom() { return racine ? racine.name : ""; },
      get groupe() { return groupe; },
      choisir, adopter, lire, lister, ecrire, ouvrirFichier, publications, publier,
      creerDossier: chemin => dossier(chemin, true).then(() => undefined),
      // Fichier quelconque de l'espace (modèle Word commun, par exemple) : objet File, ou null si absent ou non autorisé
      async fichier(chemin) {
        if (!racine) throw new Error("Aucun espace WerbSMSI ouvert.");
        try { const [rep, nom] = decouper(chemin); return await (await (await dossier(rep)).getFileHandle(nom)).getFile(); }
        catch (e) { if (["NotFoundError", "NotAllowedError", "SecurityError", "TypeMismatchError"].includes(e.name)) return null; throw e; }
      },
      // Relit werbsmsi.groupe.json après une modification (site ajouté, base déclarée)
      async relire() { const g = await lire("werbsmsi.groupe.json"); if (g && g.format === "WERBSMSI-GROUPE" && g.data) groupe = g.data; return groupe; },
      site: code => lire(`${prefixeNiveau("site", code)}werbsmsi.site.json`).then(j => (j && j.format === "WERBSMSI-SITE" ? j.data : null)),
      fermer() { racine = null; groupe = null; },
    });
  })();

  /* ---------- Listes de choix du groupe (charte §5.9) ---------- */

  // Le portail publie « groupe:listes » ; une base de site fusionne ces valeurs avec les siennes à l'ouverture et en garde une copie
  // (« copies ») pour fonctionner sans espace. Valeur du groupe : non modifiable dans le site ; retirée par le groupe mais encore
  // utilisée : conservée comme valeur du site, signalée. Les données des tables ne sont jamais modifiées ici : les renommages et
  // harmonisations sont seulement proposés. Une liste « paires » contient des [clé, libellé] : la clé seule compte.
  const listes = (() => {
    const valeurCle = v => (Array.isArray(v) ? v[0] : v);
    const cle = v => String(valeurCle(v) ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
    const idComplet = id => `${WERB.id}.${id}`;

    // Listes publiées par le groupe : { "<module>.<liste>": { valeurs, retirees, renommees, majLe } } ; null sans espace ouvert.
    async function lireGroupe() {
      if (!espace.ouvert) return null;
      const p = await espace.publications("groupe");
      const l = p.objets.listes;
      return Object.fromEntries((Array.isArray(l) ? l : []).filter(x => x && typeof x.id === "string" && Array.isArray(x.valeurs)).map(x => [x.id, x]));
    }

    // Fusionne une liste. locale : valeurs de la base (groupe et site mêlés) ; copie : { valeurs, majLe } gardée dans la base ;
    // publiee : entrée de groupe:listes, ou null/undefined (espace absent ou liste non publiée : la copie fait foi) ;
    // utilisation(valeur) : nombre de lignes de la base qui l'emploient.
    function fusionner(locale, copie, publiee, utilisation = () => 0) {
      locale = Array.isArray(locale) ? locale : [];
      const groupe = publiee ? publiee.valeurs : (copie && Array.isArray(copie.valeurs) ? copie.valeurs : []);
      const avant = new Set((copie && Array.isArray(copie.valeurs) ? copie.valeurs : []).map(cle));
      const retireesPub = new Set((publiee && Array.isArray(publiee.retirees) ? publiee.retirees : []).map(cle));
      const renommees = publiee && publiee.renommees && typeof publiee.renommees === "object" ? publiee.renommees : {};
      const parCle = new Map(groupe.map(v => [cle(v), v]));
      const res = { valeurs: [], details: [], ajoutees: [], supprimees: [], retireesUtilisees: [], propositions: [] };
      const vus = new Set();
      for (const v of groupe) {
        const k = cle(v);
        if (vus.has(k)) continue;
        vus.add(k);
        const l = locale.find(x => cle(x) === k);
        if (!l) res.ajoutees.push(v);
        else if (String(valeurCle(l)) !== String(valeurCle(v)) && utilisation(l) > 0) res.propositions.push({ ancien: l, nouveau: v, n: utilisation(l), motif: "harmonisation" });
        res.valeurs.push(v);
        res.details.push({ valeur: v, origine: "groupe" });
      }
      for (const v of locale) {
        const k = cle(v);
        if (vus.has(k)) continue;
        vus.add(k);
        if (avant.has(k) || retireesPub.has(k)) {                      // retirée par le groupe
          const n = utilisation(v);
          if (!n) { res.supprimees.push(v); continue; }
          const nouveau = Object.entries(renommees).find(([a]) => cle(a) === k);
          if (nouveau && parCle.has(cle(nouveau[1]))) res.propositions.push({ ancien: v, nouveau: parCle.get(cle(nouveau[1])), n, motif: "renommage" });
          res.retireesUtilisees.push({ valeur: v, n });
          res.valeurs.push(v);
          res.details.push({ valeur: v, origine: "retiree", n });
          continue;
        }
        res.valeurs.push(v);
        res.details.push({ valeur: v, origine: "site" });
      }
      res.copie = publiee ? { valeurs: groupe.slice(), majLe: publiee.majLe || "" } : (copie || { valeurs: [], majLe: "" });
      res.change = res.ajoutees.length > 0 || res.supprimees.length > 0 || res.valeurs.length !== locale.length
        || res.valeurs.some((v, i) => JSON.stringify(v) !== JSON.stringify(locale[i]))
        || JSON.stringify(res.copie) !== JSON.stringify(copie || { valeurs: [], majLe: "" });
      return res;
    }

    // Fusionne toutes les listes déclarées. definitions : [{ id }] (id court, comme dans module.json › listes) ;
    // locales : { id: [valeurs] } ; copies : { id: { valeurs, majLe } } ; groupe : résultat de lireGroupe() ;
    // utilisation(id, valeur) : nombre d'emplois. Renvoie { listes: { id: résultat }, locales, copies, change, message }.
    function appliquer({ definitions = [], locales = {}, copies = {}, groupe = null, utilisation = () => 0 }) {
      const out = { listes: {}, locales: {}, copies: {}, change: false };
      for (const d of definitions) {
        const r = fusionner(locales[d.id], copies[d.id], groupe ? groupe[idComplet(d.id)] : null, v => utilisation(d.id, v));
        out.listes[d.id] = r;
        out.locales[d.id] = r.valeurs;
        out.copies[d.id] = r.copie;
        out.change = out.change || r.change;
      }
      out.message = message(out.listes);
      return out;
    }

    // Texte du bandeau d'information affiché à l'ouverture de la base ("" s'il n'y a rien à signaler).
    function message(resultats) {
      const t = k => Object.values(resultats).reduce((n, r) => n + r[k].length, 0);
      const [a, s, u, p] = [t("ajoutees"), t("supprimees"), t("retireesUtilisees"), t("propositions")];
      const pl = (n, x) => `${n} ${x}${n > 1 ? "s" : ""}`;
      const parts = [];
      if (a) parts.push(`${pl(a, "valeur")} ajoutée${a > 1 ? "s" : ""} par le groupe`);
      if (s) parts.push(`${pl(s, "valeur")} retirée${s > 1 ? "s" : ""} par le groupe`);
      if (u) parts.push(`⚠ ${pl(u, "valeur")} retirée${u > 1 ? "s" : ""} par le groupe mais encore utilisée${u > 1 ? "s" : ""}`);
      if (p) parts.push(`${pl(p, "remplacement")} proposé${p > 1 ? "s" : ""}`);
      return parts.length ? `Listes de choix du groupe : ${parts.join(" · ")}.` : "";
    }

    // Valeur venant du groupe (copie gardée dans la base) : non modifiable ni supprimable dans le site.
    const duGroupe = (copie, v) => !!copie && Array.isArray(copie.valeurs) && copie.valeurs.some(x => cle(x) === cle(v));

    // Contrôle une liste modifiée dans le site : les valeurs du groupe retirées ou modifiées sont remises à leur place.
    // Renvoie { valeurs, refusees }.
    function proteger(copie, apres) {
      apres = Array.isArray(apres) ? apres : [];
      const groupe = copie && Array.isArray(copie.valeurs) ? copie.valeurs : [];
      const presentes = new Map(apres.map(v => [cle(v), v]));
      const refusees = groupe.filter(g => !presentes.has(cle(g)) || JSON.stringify(presentes.get(cle(g))) !== JSON.stringify(g));
      const ks = new Set(groupe.map(cle));
      return { valeurs: groupe.concat(apres.filter(v => !ks.has(cle(v)))), refusees };
    }

    const REPERES = Object.freeze({ groupe: "🏢", site: "📍", retiree: "⚠" });
    return Object.freeze({ cle, idComplet, lireGroupe, fusionner, appliquer, message, duGroupe, proteger, REPERES });
  })();

  /* ---------- Thème clair / sombre (charte §7.5) ---------- */

  // Trois modes : « auto » (thème de Windows, par défaut), « clair », « sombre ». Le choix n'est pas mémorisé (charte §1) : le portail
  // le transmet au module qu'il ouvre dans son lien (#werbsmsi=…, champ th). Le thème effectif est posé sur <html data-theme>.
  // Les variables communes (--bg, --card, --ink, --navy…) prennent leurs valeurs sombres à l'écran seulement : impression en clair.
  // --navy reste la couleur des titres et liens ; --navy-fond est celle des fonds (bandeau, bouton principal) sous un texte blanc.
  const theme = (() => {
    const MODES = { auto: ["🖥️", "Auto (thème de Windows)"], clair: ["☀️", "Clair"], sombre: ["🌙", "Sombre"] };
    const ORDRE = ["auto", "clair", "sombre"];
    const SOMBRE = {
      "--navy": "#9dbcf0", "--navy-2": "#7aa2e6", "--navy-fond": "#20375e", "--ink": "#e3e8ef", "--muted": "#9ba6b5", "--line": "#2e3947",
      "--bg": "#0f141b", "--card": "#17202b", "--ok": "#73cf8a", "--ok-bg": "#173822", "--warn": "#e9b850", "--warn-bg": "#3a2d0c",
      "--ko": "#f2918a", "--ko-bg": "#401917", "--na": "#9ba6b5", "--na-bg": "#242d39", "--info-bg": "#1b2a40", "--th": "#1c2632", "--champ": "#111821",
      "--sch": "#1b2f4d", "--sch-t": "#9cc1f5", "--comp": "#173822", "--comp-t": "#86d69a", "--post": "#3a2d0c", "--post-t": "#e8c06a",
      "--canc": "#242d39", "--canc-t": "#a3adbb", "--focus": "#7aa2e6",
    };
    // Teintes du menu commun et des titres de cartes en sombre : [fond, texte] (en clair : TEINTES)
    const TEINTES_SOMBRE = {
      bleu: ["#1b2f4d", "#9cc1f5"], vert: ["#173822", "#86d69a"], ambre: ["#3a2d0c", "#e8c06a"], rouge: ["#401917", "#f2a19a"],
      violet: ["#2c2246", "#c7b2f0"], cyan: ["#0f3338", "#86d3dd"], rose: ["#3c172a", "#f0a8c9"], olive: ["#2b3110", "#c9d589"],
      orange: ["#3e2311", "#f2b48c"], ardoise: ["#252e3a", "#b9c4d2"],
    };
    const vars = o => Object.entries(o).map(([k, v]) => `${k}:${v}`).join(";");
    const STYLE = `
:where(:root){--navy-fond:var(--navy,#1f3864);--th:#fafbfc;--champ:#fff;--info-bg:#e8eef9}
.werb-theme{font:inherit;font-size:14px;line-height:1;padding:4px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer}
.werb-theme:hover{background:rgba(255,255,255,.12)}
@media print{.werb-theme{display:none!important}}
@media screen{
:root[data-theme=sombre]{color-scheme:dark;${vars(SOMBRE)};${Object.entries(TEINTES_SOMBRE).map(([k, [f, t]]) => `--werb-t-${k}-f:${f};--werb-t-${k}-t:${t}`).join(";")}}
:root[data-theme=sombre] body{background:var(--bg);color:var(--ink)}
:root[data-theme=sombre] #topbar{background:var(--navy-fond)}
:root[data-theme=sombre] button.primary,:root[data-theme=sombre] .btn.primary{background:var(--navy-fond);border-color:var(--navy-2);color:#fff}
/* Champs : spécificité minimale (0,1,0), une règle du module qui vise un champ par une classe (select.etat…) l'emporte (§7.5) */
:where(:root)[data-theme=sombre] :where(input:not([type=checkbox]):not([type=radio]),select,textarea){background:var(--champ);color:var(--ink);border-color:var(--line)}
:root[data-theme=sombre] th{background:var(--th)}
:root[data-theme=sombre] .modal{background:var(--card);color:var(--ink)}
:root[data-theme=sombre] .werb-verrou{background:var(--ok-bg);color:var(--ok);border-color:var(--line)}
:root[data-theme=sombre] .werb-verrou.lecture{background:var(--warn-bg);color:var(--warn)}
:root[data-theme=sombre] .werb-verrou.perdu{background:var(--ko-bg);color:var(--ko)}
:root[data-theme=sombre] .wv-box{background:var(--card);color:var(--ink)}
:root[data-theme=sombre] .wv-box h2{color:var(--navy)}
:root[data-theme=sombre] .wv-box .wv-n{color:var(--muted)}
:root[data-theme=sombre] .wv-box button{background:var(--card);color:var(--ink);border-color:var(--line)}
:root[data-theme=sombre] .wv-box button.p{background:var(--navy-fond);border-color:var(--navy-2);color:#fff}
:root[data-theme=sombre] .wmenu .wm-it:hover{background:rgba(255,255,255,.06)}
}`;
    let mode = "auto", rappel = null;
    const media = typeof matchMedia === "function" ? matchMedia("(prefers-color-scheme: dark)") : null;
    const effectif = () => (mode === "auto" ? (media && media.matches ? "sombre" : "clair") : mode);
    function appliquer() {
      if (typeof document === "undefined") return;
      if (!document.getElementById("werb-theme-style")) document.head.appendChild(Object.assign(document.createElement("style"), { id: "werb-theme-style", textContent: STYLE }));
      document.documentElement.dataset.theme = effectif();
      afficher();
      if (rappel) try { rappel(effectif(), mode); } catch (e) { /* sans effet */ }
    }
    // Bouton du bandeau : dans l'élément #werb-theme s'il existe, sinon juste avant le bandeau du verrou (#werb-verrou)
    function afficher() {
      if (typeof document === "undefined") return;
      let b = document.querySelector("button.werb-theme");
      if (!b) {
        const hote = document.getElementById("werb-theme"), verrouEl = document.getElementById("werb-verrou");
        if (!hote && !verrouEl) return;
        b = Object.assign(document.createElement("button"), { type: "button", className: "werb-theme" });
        b.addEventListener("click", e => { e.stopPropagation(); suivant(); });
        if (hote) hote.appendChild(b); else verrouEl.parentNode.insertBefore(b, verrouEl);
      }
      const [i, l] = MODES[mode];
      b.textContent = i;
      b.title = `Thème : ${l}${mode === "auto" ? ` — actuellement ${effectif()}` : ""}. Cliquer pour changer.`;
      b.dataset.mode = mode;
    }
    function choisir(m) { if (MODES[m]) { mode = m; appliquer(); } return mode; }
    function suivant() { return choisir(ORDRE[(ORDRE.indexOf(mode) + 1) % ORDRE.length]); }
    if (media) { try { media.addEventListener("change", () => { if (mode === "auto") appliquer(); }); } catch (e) { /* ancien navigateur */ } }
    return Object.freeze({
      MODES, SOMBRE, TEINTES_SOMBRE, choisir, suivant, appliquer, afficher,
      get mode() { return mode; }, get effectif() { return effectif(); },
      surChangement(fn) { rappel = typeof fn === "function" ? fn : null; },
    });
  })();

  function telecharger(contenu, nom, type = "application/octet-stream") {
    const url = URL.createObjectURL(contenu instanceof Blob ? contenu : new Blob([contenu], { type }));
    const a = Object.assign(document.createElement("a"), { href: url, download: nom });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ---------- Lien vers une base de l'espace (charte §5.5) ---------- */

  function lireLien() {
    const m = typeof location !== "undefined" ? /[#&]werbsmsi=([^&]+)/.exec(location.hash || "") : null;
    if (!m) return null;
    try { const d = JSON.parse(decodeURIComponent(m[1])); return d && typeof d === "object" ? d : null; } catch (e) { return null; }
  }
  const themeDuLien = d => (d && (d.th === "clair" || d.th === "sombre") ? d.th : "");
  // Le portail ouvre un module avec « #werbsmsi=<JSON> » : { g: groupeId, f: chemin de la base dans l'espace, s: site, l: libellé,
  // e: nom du dossier de l'espace }. Rien n'est conservé : le lien ne contient qu'un chemin relatif, le module redemande un dossier.
  // En file://, Edge ne retient pas le dernier dossier choisi : on accepte donc le dossier de l'espace, du site ou du module.
  const lien = Object.freeze({
    // theme (facultatif) : mode choisi dans le portail (« clair » ou « sombre » ; « auto » n'est pas transmis), §7.5
    creer(url, { groupeId, fichier, site = "", libelle = "", espace: nomEspace = "", theme: th = "" }) {
      const d = { g: groupeId, f: fichier, s: site, l: libelle, e: nomEspace };
      if (th === "clair" || th === "sombre") d.th = th;
      return `${url}#werbsmsi=${encodeURIComponent(JSON.stringify(d))}`;
    },
    lire() {
      const d = lireLien();
      return d && typeof d.f === "string" && typeof d.g === "string"
        ? { groupeId: d.g, fichier: d.f, site: String(d.s || ""), libelle: String(d.l || ""), espace: String(d.e || ""), theme: themeDuLien(d) } : null;
    },
    // Lien vers un module sans base : seulement le thème choisi dans le portail (rien si « auto »)
    avecTheme(url, th) { return th === "clair" || th === "sombre" ? `${url}#werbsmsi=${encodeURIComponent(JSON.stringify({ th }))}` : url; },
    // Thème seul transmis par le portail (lien sans base, ou avant que le module ne lise la demande)
    theme() { return themeDuLien(lireLien()); },
    effacer() { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* sans effet */ } },
    // Dossiers que l'utilisateur peut choisir pour atteindre la base : espace, puis chaque dossier du chemin (site, module).
    dossiersPossibles(demande) {
      const parts = demande.fichier.split("/").slice(0, -1);
      return [demande.espace || "SMSI_<SIGLE>", ...parts.filter(x => x !== "sites" && x !== "groupe")];
    },
    // Consigne affichée avant le sélecteur de dossier (texte brut, à échapper).
    consigne(demande) {
      const l = lien.dossiersPossibles(demande);
      return `Portail ouvert sur l'espace : il suffit d'autoriser l'accès si Edge le demande. Sinon, dans la fenêtre qui s'ouvre, choisissez le dossier ${l.map(x => `« ${x} »`).join(", ").replace(/, ([^,]*)$/, " ou $1")} puis « Sélectionner un dossier » : inutile d'aller jusqu'au fichier.`;
    },
    // Ouvre la base demandée et en prend le verrou (§5.7, sauf { verrou: false }). Renvoie { poignee, nom, texte, modifie, lecture }. Si le dossier choisi est l'espace, il est aussi ouvert
    // (publications, rattachement) ; sinon la base est cherchée sous le dossier choisi, par la fin de son chemin.
    async ouvrir(demande, { verrou: prendreVerrou = true } = {}) {
      const r = await lien.ouvrirBrut(demande);
      return prendreVerrou ? verrou.prendre(r) : r;
    },
    async ouvrirBrut(demande) {
      if (espace.ouvert && espace.groupe.groupeId === demande.groupeId) return espace.ouvrirFichier(demande.fichier);
      if (await espace.depuisRaccourci(demande.groupeId)) return espace.ouvrirFichier(demande.fichier);   // raccourci du portail
      if (!espace.disponible) throw new Error("Ce navigateur ne permet pas d'ouvrir un dossier : utilisez Microsoft Edge.");
      const d = await showDirectoryPicker({ mode: "readwrite", id: "werbsmsi-espace" });
      let estEspace = false;
      try { await d.getFileHandle("werbsmsi.groupe.json"); estEspace = true; } catch (e) { /* pas la racine d'un espace */ }
      if (estEspace) {
        await espace.adopter(d);
        if (espace.groupe.groupeId !== demande.groupeId) {
          throw new Error(`Le dossier « ${d.name} » est l'espace « ${espace.groupe.organisation} », pas celui de la base demandée : choisissez l'espace d'origine${demande.espace ? ` (« ${demande.espace} »)` : ""}.`);
        }
        return espace.ouvrirFichier(demande.fichier);
      }
      const parts = demande.fichier.split("/");
      for (let k = 1; k < parts.length; k++) {
        try {
          let h = d;
          for (const p of parts.slice(k, -1)) h = await h.getDirectoryHandle(p);
          const poignee = await h.getFileHandle(parts[parts.length - 1]);
          const f = await poignee.getFile();
          if (f.size > TAILLE_MAX) throw new Error(`${demande.fichier} : fichier trop volumineux.`);
          return { poignee, nom: f.name, texte: await f.text(), modifie: f.lastModified };
        } catch (e) { if (e.message && e.message.includes("trop volumineux")) throw e; }
      }
      throw new Error(`Le dossier « ${d.name} » ne mène pas à ${demande.fichier}. ${lien.consigne(demande)}`);
    },
  });

  /* ---------- Menu latéral commun (charte §7.1) ---------- */

  // Teintes des catégories : [fond, texte]. Texte foncé sur fond clair, contraste supérieur à 7:1.
  const TEINTES = {
    bleu: ["#e3edfa", "#1b4b8a"], vert: ["#e1f3e5", "#1d6631"], ambre: ["#fcefd2", "#7f5300"], rouge: ["#fbe3e1", "#962a20"],
    violet: ["#eee6fa", "#56338e"], cyan: ["#dcf2f5", "#0f5e6a"], rose: ["#fbe5ef", "#8a2958"], olive: ["#edf1d9", "#4f5d12"],
    orange: ["#fde8da", "#93410f"], ardoise: ["#e7ebf0", "#384657"],
  };
  const ORDRE_TEINTES = Object.keys(TEINTES);
  // Teinte suivant le thème (§7.5) : [fond, texte] en variables CSS, la valeur claire servant de repli
  const teinteCss = k => { const c = TEINTES[k] ? k : "bleu", [f, t] = TEINTES[c]; return [`var(--werb-t-${c}-f,${f})`, `var(--werb-t-${c}-t,${t})`]; };
  const STYLE_MENU = `
.wmenu{display:flex;flex-direction:column;padding:6px 8px 10px}
.wmenu .wm-grp{margin-top:6px}
.wmenu .wm-cat{display:flex;align-items:center;gap:7px;width:100%;margin:0;padding:6px 10px;border:none;border-radius:6px;background:var(--wm-f);color:var(--wm-t);font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;text-align:left;cursor:pointer;user-select:none}
.wmenu .wm-cat:hover{filter:brightness(.96)}
.wmenu .wm-cat:focus-visible,.wmenu .wm-it:focus-visible{outline:2px solid var(--wm-t);outline-offset:1px}
.wmenu .wm-i{font-size:14px;line-height:1}
.wmenu .wm-chev{margin-left:auto;transition:transform .15s}
.wmenu .wm-grp.ferme .wm-chev{transform:rotate(-90deg)}
.wmenu .wm-grp.ferme .wm-items{display:none}
.wmenu .wm-items{padding-top:2px}
.wmenu .wm-it{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;margin:1px 0;padding:6px 10px 6px 31px;border:none;border-left:3px solid transparent;border-radius:0 5px 5px 0;background:none;color:inherit;font:inherit;font-weight:600;text-align:left;cursor:pointer}
.wmenu .wm-it:hover{background:rgba(16,24,40,.05);border-color:transparent}
.wmenu .wm-it.act{border-left-color:var(--wm-t);background:var(--wm-f);color:var(--wm-t)}
.wmenu .wm-n{font-size:11px;font-weight:400;opacity:.75}
@media print{.wmenu{display:none!important}}`;

  // Menu à catégories repliables. def : [{ g: "pilot", i: "📊", l: "Pilotage", c: "bleu", t: [["dash", "Tableau de bord"], …] }]
  // (c facultatif : teinte de TEINTES, sinon dans l'ordre). surNav(id) est appelé au clic sur une entrée.
  // Les catégories repliées sont gardées en mémoire le temps de l'onglet seulement (rien dans le navigateur).
  function menu(conteneur, def, { surNav = () => {} } = {}) {
    if (!document.getElementById("werb-menu-style")) {
      document.head.appendChild(Object.assign(document.createElement("style"), { id: "werb-menu-style", textContent: STYLE_MENU }));
    }
    const fermees = new Set();
    let actif = null, compteurs = {}, pied = "", vide = false;
    conteneur.classList.add("wmenu");
    conteneur.addEventListener("click", e => {
      const c = e.target.closest("[data-wcat]");
      if (c && conteneur.contains(c)) {
        const g = c.dataset.wcat;
        if (fermees.has(g)) fermees.delete(g); else fermees.add(g);
        c.parentElement.classList.toggle("ferme", fermees.has(g));
        c.setAttribute("aria-expanded", String(!fermees.has(g)));
        return;
      }
      const b = e.target.closest("[data-wnav]");
      if (b && conteneur.contains(b)) surNav(b.dataset.wnav);
    });
    const teinte = (m, n) => teinteCss(TEINTES[m.c] ? m.c : ORDRE_TEINTES[n % ORDRE_TEINTES.length]);
    // opts : { actif, compteurs: {id: n}, pied: HTML déjà échappé, vide: true pour n'afficher que le pied }
    function rendre(opts = {}) {
      if ("actif" in opts) actif = opts.actif;
      if (opts.compteurs) compteurs = opts.compteurs;
      if ("pied" in opts) pied = opts.pied;
      if ("vide" in opts) vide = !!opts.vide;
      conteneur.innerHTML = (vide ? "" : def.map((m, n) => {
        const [f, t] = teinte(m, n), ouvert = !fermees.has(m.g);
        return `<div class="wm-grp${ouvert ? "" : " ferme"}" data-wgrp="${esc(m.g)}" style="--wm-f:${f};--wm-t:${t}">`
          + `<button type="button" class="wm-cat" data-wcat="${esc(m.g)}" aria-expanded="${ouvert}" title="Replier / déplier"><span class="wm-i">${esc(m.i)}</span><span>${esc(m.l)}</span><span class="wm-chev">▾</span></button>`
          + `<div class="wm-items">${m.t.map(([id, l]) => `<button type="button" class="wm-it${id === actif ? " act" : ""}" data-wnav="${esc(id)}">`
            + `<span>${esc(l)}</span>${compteurs[id] !== undefined ? `<span class="wm-n">${esc(compteurs[id])}</span>` : ""}</button>`).join("")}</div></div>`;
      }).join("")) + pied;
    }
    return Object.freeze({ rendre, get actif() { return actif; }, deplier(g) { fermees.delete(g); rendre(); } });
  }

  /* ---------- Bandeau commun (charte §7.6, socle 1.8.0) ---------- */

  // Boutons d'action du bandeau avec leur icône, identiques dans tous les modules. Le module place le HTML dans sa zone d'actions
  // (#tb-actions) et traite les data-act comme avant ; 🖨 PDF est traité par le socle (impression du navigateur, en clair).
  // Le bouton ☰ (afficher / masquer le menu latéral) est posé par le socle à droite du logo dès qu'un #sidebar existe.
  const bandeau = (() => {
    const ACTIONS = {
      nouveau: ["✨", "Nouveau", "Créer une nouvelle base"],
      ouvrir: ["📂", "Ouvrir", "Ouvrir une autre base"],
      enregistrer: ["💾", "Enregistrer", "Enregistrer la base (Ctrl+S)"],
      enregistrerSous: ["📑", "Enregistrer sous…", "Enregistrer dans un autre fichier : la base ouverte devient ce fichier"],
      importExcel: ["📥", "Import Excel", "Importer un classeur Excel"],
      exportExcel: ["📊", "Export Excel", "Exporter toute la base dans un classeur Excel"],
      pdf: ["🖨", "PDF", "Imprimer la page affichée ou l'enregistrer en PDF"],
      fermer: ["⏏", "Fermer", "Fermer la base"],
    };
    const STYLE = `
.werb-menu-bt{font:inherit;font-size:16px;line-height:1;padding:4px 9px;border-radius:5px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;flex:none}
.werb-menu-bt:hover,.werb-menu-bt[aria-pressed=true]{background:rgba(255,255,255,.14)}
body.werb-sans-menu #sidebar{display:none!important}
body.werb-sans-menu #app{grid-template-columns:1fr!important}
.werb-bt-i{margin-right:5px}
@media (max-width:1280px){.werb-bt .werb-bt-l{display:none}.werb-bt .werb-bt-i{margin-right:0}}
@media print{.werb-menu-bt{display:none!important}}`;
    function style() {
      if (typeof document !== "undefined" && !document.getElementById("werb-bandeau-style"))
        document.head.appendChild(Object.assign(document.createElement("style"), { id: "werb-bandeau-style", textContent: STYLE }));
    }
    // HTML des boutons : noms d'ACTIONS ou [action, icône, libellé, infobulle] ; opts.desactives : actions désactivées (lecture seule…)
    function boutons(liste, { desactives = [] } = {}) {
      style();
      return liste.map(x => {
        const [act, i, l, tt] = Array.isArray(x) ? x : [x, ...(ACTIONS[x] || ["", x, x])];
        const attr = act === "pdf" ? `data-werb="pdf"` : `data-act="${esc(act)}"`;
        return `<button type="button" class="werb-bt" ${attr} title="${esc(tt || l)}"${desactives.includes(act) ? " disabled" : ""}>`
          + `<span class="werb-bt-i" aria-hidden="true">${esc(i)}</span><span class="werb-bt-l">${esc(l)}</span></button>`;
      }).join("");
    }
    // ☰ : à droite du logo ; l'état (menu masqué) ne vaut que pour l'onglet ouvert, rien n'est conservé (§1)
    function menuBouton() {
      if (typeof document === "undefined" || !document.getElementById("sidebar") || document.querySelector(".werb-menu-bt")) return;
      style();
      const b = Object.assign(document.createElement("button"), { type: "button", className: "werb-menu-bt", textContent: "☰", title: "Afficher / masquer le menu" });
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", e => { e.stopPropagation(); b.setAttribute("aria-pressed", String(document.body.classList.toggle("werb-sans-menu"))); });
      const logo = document.querySelector(".werb-logo");
      if (logo) logo.after(b); else { const tb = document.getElementById("topbar"); if (tb) tb.prepend(b); }
    }
    if (typeof document !== "undefined") document.addEventListener("click", e => { if (e.target.closest && e.target.closest("[data-werb=pdf]")) window.print(); });
    return Object.freeze({ ACTIONS, boutons, menuBouton });
  })();

  /* ---------- Tables d'inventaire (charte §7.7, socle 1.9.0) ---------- */

  // Trois aides communes aux tables d'inventaire (pas aux pages formulaire) :
  // - redimensionner(table, largeurs, surChange) : poignée au bord droit de chaque en-tête (th[data-col]) ; glisser = largeur en px,
  //   double-clic = largeur automatique (null). Le module garde les largeurs dans sa base (rien dans le navigateur, §1).
  // - barre(n, opts) : barre d'actions de la sélection multiple (archiver, désarchiver, supprimer) ; data-act traités par le module.
  // - remplacer({ titre, colonnes, lignes, lire, nomLigne, surAppliquer }) : fenêtre chercher / remplacer sur une colonne choisie,
  //   aperçu des cellules qui changent avant d'appliquer ; surAppliquer([{ ligne, col, avant, apres }]) fait les modifications.
  const tables = (() => {
    const STYLE = `
.wt-th{position:relative}
.wt-poignee{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:2;user-select:none}
.wt-poignee:hover,.wt-poignee.actif{background:var(--navy-2,#2e5090);opacity:.45}
body.wt-glisse{cursor:col-resize!important;user-select:none!important}
.wt-barre{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;margin:0 0 8px;border-radius:6px;background:var(--info-bg,#e8eef9);color:var(--ink,#1d2330)}
.wt-barre b{margin-right:4px}
.wt-voile{position:fixed;inset:0;background:rgba(10,20,40,.5);display:grid;place-items:center;z-index:60}
.wt-fen{background:var(--card,#fff);color:var(--ink,#1d2330);border-radius:8px;padding:16px 18px;width:min(860px,94vw);max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.wt-fen h2{margin:0 0 10px;font-size:17px;color:var(--navy,#1f3864)}
.wt-fen .wt-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:8px}
.wt-fen label{display:block;font-size:12px;color:var(--muted,#5d6676);margin-bottom:2px}
.wt-fen input[type=text],.wt-fen select{width:100%;font:inherit;padding:5px 7px;border:1px solid var(--line,#dfe3ea);border-radius:4px;background:var(--champ,#fff);color:var(--ink,#1d2330)}
.wt-fen .wt-ch{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink,#1d2330)}
.wt-fen table{width:100%;border-collapse:collapse;font-size:13px}
.wt-fen th,.wt-fen td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line,#dfe3ea);vertical-align:top}
.wt-fen td.av{color:var(--ko,#b3261e);text-decoration:line-through}
.wt-fen td.ap{color:var(--ok,#2e7d32)}
.wt-fen .wt-act{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.wt-fen button{font:inherit;padding:5px 12px;border:1px solid var(--line,#dfe3ea);border-radius:5px;background:var(--card,#fff);color:var(--ink,#1d2330);cursor:pointer}
.wt-fen button.p{background:var(--navy-fond,#1f3864);border-color:var(--navy-fond,#1f3864);color:#fff}
.wt-fen button:disabled{opacity:.5;cursor:default}
@media print{.wt-poignee,.wt-barre{display:none!important}}`;
    function style() {
      if (typeof document !== "undefined" && !document.getElementById("werb-tables-style"))
        document.head.appendChild(Object.assign(document.createElement("style"), { id: "werb-tables-style", textContent: STYLE }));
    }
    function redimensionner(table, largeurs = {}, surChange = () => {}) {
      if (!table) return;
      style();
      table.querySelectorAll("thead th[data-col]").forEach(th => {
        const col = th.dataset.col, w = largeurs[col];
        th.classList.add("wt-th");
        if (w) { th.style.width = th.style.minWidth = th.style.maxWidth = w + "px"; th.style.overflow = "hidden"; }
        if (th.querySelector(".wt-poignee")) return;
        const h = Object.assign(document.createElement("span"), { className: "wt-poignee", title: "Glisser pour régler la largeur · double-clic : largeur automatique" });
        h.addEventListener("click", e => e.stopPropagation());   // pas de tri sur la poignée
        h.addEventListener("dblclick", e => { e.stopPropagation(); e.preventDefault(); th.style.width = th.style.minWidth = th.style.maxWidth = ""; surChange(col, null); });
        h.addEventListener("pointerdown", e => {
          e.preventDefault(); e.stopPropagation();
          const x0 = e.clientX, w0 = th.getBoundingClientRect().width;
          let w = w0;
          h.classList.add("actif"); document.body.classList.add("wt-glisse"); h.setPointerCapture(e.pointerId);
          const bouge = ev => { w = Math.max(40, Math.round(w0 + ev.clientX - x0)); th.style.width = th.style.minWidth = th.style.maxWidth = w + "px"; th.style.overflow = "hidden"; };
          const fin = () => { h.removeEventListener("pointermove", bouge); h.removeEventListener("pointerup", fin); h.classList.remove("actif"); document.body.classList.remove("wt-glisse");
            if (Math.abs(w - w0) >= 2) surChange(col, w); };
          h.addEventListener("pointermove", bouge); h.addEventListener("pointerup", fin);
        });
        th.appendChild(h);
      });
    }
    // opts : { archivees (nombre de lignes archivées parmi la sélection), lectureSeule }
    function barre(n, { archivees = 0, lectureSeule = false } = {}) {
      if (!n) return "";
      style();
      const d = lectureSeule ? " disabled" : "";
      return `<div class="wt-barre noprint" role="toolbar" aria-label="Actions sur la sélection"><b>${n} ligne(s) sélectionnée(s)</b>`
        + `<button type="button" data-act="selArchiver"${d || (archivees === n ? " disabled" : "")} title="Masquer en gardant : hors publications et contrôles, désarchivable">🗄 Archiver</button>`
        + `<button type="button" data-act="selDesarchiver"${d || (!archivees ? " disabled" : "")}>♻ Désarchiver</button>`
        + `<button type="button" data-act="selSupprimer" class="danger"${d} title="Suppression définitive">🗑 Supprimer</button>`
        + `<button type="button" data-act="selVider">✕ Désélectionner</button></div>`;
    }
    function remplacer({ titre = "Chercher / remplacer", colonnes = [], lignes = [], lire, nomLigne = () => "", surAppliquer = () => {} }) {
      style();
      const v = Object.assign(document.createElement("div"), { className: "wt-voile" });
      v.innerHTML = `<div class="wt-fen" role="dialog" aria-modal="true"><h2>🔁 ${esc(titre)}</h2>
        <div class="wt-g"><div><label>Colonne</label><select data-wt="col"><option value="*">Toutes les colonnes texte</option>${colonnes.map(c => `<option value="${esc(c.id)}">${esc(c.libelle)}</option>`).join("")}</select></div>
        <div><label>Chercher</label><input type="text" data-wt="q" autocomplete="off"></div><div><label>Remplacer par</label><input type="text" data-wt="r" autocomplete="off"></div></div>
        <div class="wt-g"><label class="wt-ch"><input type="checkbox" data-wt="casse"> Respecter la casse</label><label class="wt-ch"><input type="checkbox" data-wt="entier"> Cellule entière seulement</label></div>
        <div data-wt="apercu" class="wt-ap"></div>
        <div class="wt-act"><button type="button" data-wt="non">Annuler</button><button type="button" class="p" data-wt="oui" disabled>Appliquer</button></div></div>`;
      const $w = k => v.querySelector(`[data-wt=${k}]`);
      let changements = [];
      const calculer = () => {
        const q = $w("q").value, r = $w("r").value, casse = $w("casse").checked, entier = $w("entier").checked, c = $w("col").value;
        changements = [];
        if (q) {
          const cols = c === "*" ? colonnes : colonnes.filter(x => x.id === c);
          const motif = q.replace(/[.*+?^$(){}|[\]\\]/g, "\\$&");   // texte cherché pris tel quel, pas comme une expression
          const re = new RegExp(entier ? "^" + motif + "$" : motif, casse ? "g" : "gi");
          lignes.forEach(l => cols.forEach(col => {
            const avant = String(lire(l, col.id) ?? "");
            re.lastIndex = 0;
            if (!re.test(avant)) return;
            const apres = avant.replace(re, () => r).trim();
            if (apres !== avant) changements.push({ ligne: l, col: col.id, libelle: col.libelle, avant, apres });
          }));
        }
        $w("oui").disabled = !changements.length;
        $w("oui").textContent = changements.length ? `Appliquer (${changements.length})` : "Appliquer";
        $w("apercu").innerHTML = !q ? `<p class="muted small">Saisissez le texte à chercher : l'aperçu des cellules qui changent s'affiche ici.</p>`
          : !changements.length ? `<p class="muted small">Aucune cellule ne change.</p>`
          : `<table><thead><tr><th>Ligne</th><th>Colonne</th><th>Avant</th><th>Après</th></tr></thead><tbody>${changements.slice(0, 300).map(x => `<tr><td>${esc(nomLigne(x.ligne))}</td><td>${esc(x.libelle)}</td><td class="av">${esc(x.avant)}</td><td class="ap">${esc(x.apres) || "<i>(vide)</i>"}</td></tr>`).join("")}</tbody></table>${changements.length > 300 ? `<p class="small">… et ${changements.length - 300} autre(s)</p>` : ""}`;
      };
      v.addEventListener("input", calculer);
      v.addEventListener("change", calculer);
      v.addEventListener("click", e => {
        const k = e.target.dataset && e.target.dataset.wt;
        if (k === "non" || e.target === v) v.remove();
        if (k === "oui" && changements.length) { const l = changements; v.remove(); surAppliquer(l.map(({ ligne, col, avant, apres }) => ({ ligne, col, avant, apres }))); }
      });
      v.addEventListener("keydown", e => { if (e.key === "Escape") v.remove(); });
      document.body.appendChild(v);
      calculer();
      $w("q").focus();
      return v;
    }
    return Object.freeze({ redimensionner, barre, remplacer });
  })();
