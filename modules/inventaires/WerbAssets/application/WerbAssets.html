    if (!document.getElementById("werb-logo-style")) {
      document.head.appendChild(Object.assign(document.createElement("style"), { id: "werb-logo-style",
        textContent: ".werb-logo{display:inline-flex;align-items:center;justify-content:center;flex:none;height:42px;padding:2px 6px;background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.15)}.werb-logo img{display:block;height:38px;width:auto}" }));

    racine.querySelectorAll(".werb-logo:not([data-logo])").forEach(el => {
      el.dataset.logo = "1"; el.title = el.title || "Développé par @WerbHat";
      el.appendChild(Object.assign(document.createElement("img"), { src: LOGO, alt: "@WerbHat" }));
    });
  }
  if (typeof document !== "undefined" && document.head) afficherLogo();

   interne, ancre ignorée). Tout le HTML du texte est échappé, sauf les commentaires
   <!-- … --> placés entre deux blocs, qui ne sont pas affichés ; le premier porte la signature du guide (charte §7.4).
   Thème clair / sombre (charte §7.5, 1.2.0) : fonds sur les variables communes (--card, --info-bg…, repli clair), valeurs sombres
   propres au lecteur à l'écran seulement ; titres sous texte blanc sur --navy-fond ; impression en clair. */
const WerbGuides = Object.freeze((() => {
  const VERSION = "1.1.0";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const sansAccent = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

  /* ---------------------------------------------------------------- texte en ligne */
  let dossierCourant = "";                                   // dossier du guide en cours de rendu (liens relatifs)
  // Chemin d'une page .md citée par un lien relatif, à partir du dossier du guide (« ../2-NIST/0-carte.md »)
  function cheminRelatif(url) {
    let u = url.replace(/#.*$/, "");
    try { u = decodeURIComponent(u); } catch { /* adresse mal encodée : prise telle quelle */ }
    const parts = [];
    for (const p of ((dossierCourant ? dossierCourant + "/" : "") + u.replace(/^\.\//, "")).split("/")) {
      if (p === "..") parts.pop(); else if (p && p !== ".") parts.push(p);
    }
    return parts.join("/");
  }
  function enLigne(s, liens = true) {
    const gardes = [];
    const garder = h => `\u0000${gardes.push(h) - 1}\u0000`;
    s = s.replace(/`([^`]+)`/g, (_, c) => garder(`<code>${esc(c)}</code>`));
    s = s.replace(/\[([^\]]+)\]\((?:<([^>]+)>|([^)\s]+))\)/g, (t, lib, url1, url2) => {
      const url = url1 || url2;
      if (/^(https?:|mailto:)/i.test(url)) return garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${enLigne(lib, false)}</a>`);
      if (/^[^:]+\.md(#.*)?$/i.test(url)) return garder(`<a class="wg-int" data-werb-page="${esc(cheminRelatif(url))}">${enLigne(lib, false)}</a>`);
      return t;
    });
    if (liens) s = s.replace(/\bhttps?:\/\/[^\s<>()]+[^\s<>().,;:!?]/g, url => garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`));
    s = esc(s);
    s = s.replace(/\*\*(?=\S)(.+?)\*\*/g, "<strong>$1</strong>").replace(/__(?=\S)(.+?)__(?![\p{L}\d])/gu, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*(?=\S)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>").replace(/(^|[^\p{L}\d_])_(?=\S)([^_]+?)_(?![\p{L}\d_])/gu, "$1<em>$2</em>");
    return s.replace(/\u0000(\d+)\u0000/g, (_, n) => gardes[+n]);
  }

  /* ---------------------------------------------------------------- blocs */
  const RE_LISTE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const cellules = l => l.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  const estSeparateur = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);

  function rendre(md) {
    const lignes = String(md || "").replace(/\r\n?/g, "\n").split("\n");
    const sommaire = [], ancres = new Set();
    let titre = "", signature = "";
    const ancre = t => {
      const base = "g-" + (sansAccent(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "section");
      let a = base, n = 2;
      while (ancres.has(a)) a = `${base}-${n++}`;
      ancres.add(a);
      return a;
    };
    const html = [];
    let i = 0;
    while (i < lignes.length) {
      const l = lignes[i];
      if (!l.trim()) { i++; continue; }
      if (/^\s*<!--/.test(l)) {                                                     // commentaire : non affiché
        const debut = i;
        while (i < lignes.length && !lignes[i].includes("-->")) i++;
        const c = lignes.slice(debut, i + 1).join(" ").replace(/^\s*<!--|-->[\s\S]*$/g, "").trim();
        if (!signature && !html.length) signature = c;
        i++;
        continue;
      }
      let m;
      if ((m = l.match(/^\s*(`{3,}|~{3,})\s*([\w-]*)/))) {                       // bloc de code
        const fin = m[1], corps = [];
        i++;
        while (i < lignes.length && !lignes[i].trim().startsWith(fin)) corps.push(lignes[i++]);
        i++;
        html.push(`<pre class="wg-code"><code>${esc(corps.join("\n"))}</code></pre>`);
        continue;
      }
      if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {                          // titre
        const niv = m[1].length, txt = m[2], a = ancre(txt);
        if (!titre && niv <= 2) titre = txt.replace(/[*_`]/g, "");
        sommaire.push({ niv, texte: txt.replace(/[*_`]/g, ""), ancre: a });
        html.push(`<h${niv} id="${a}" class="wg-h${niv}">${enLigne(txt)}</h${niv}>`);
        i++;
        continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { html.push("<hr>"); i++; continue; } // filet
      if (l.includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1])) { // tableau
        const tete = cellules(l), alig = cellules(lignes[i + 1]).map(c => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : "");
        const st = k => alig[k] ? ` style="text-align:${alig[k]}"` : "";
        i += 2;
        const corps = [];
        while (i < lignes.length && lignes[i].includes("|") && lignes[i].trim()) corps.push(cellules(lignes[i++]));
        html.push(`<div class="wg-table"><table><thead><tr>${tete.map((c, k) => `<th${st(k)}>${enLigne(c)}</th>`).join("")}</tr></thead>`
          + `<tbody>${corps.map(r => `<tr>${tete.map((_, k) => `<td${st(k)}>${enLigne(r[k] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        continue;
      }
      if (/^\s*>/.test(l)) {                                                       // citation
        const corps = [];
        while (i < lignes.length && /^\s*>/.test(lignes[i])) corps.push(lignes[i++].replace(/^\s*>\s?/, ""));
        html.push(`<blockquote>${rendre(corps.join("\n")).html}</blockquote>`);
        continue;
      }
      if (RE_LISTE.test(l)) {                                                      // liste (imbrication par l'indentation)
        const items = [];
        while (i < lignes.length) {
          const x = lignes[i].match(RE_LISTE);
          if (x) { items.push({ ind: x[1].replace(/\t/g, "    ").length, num: /\d/.test(x[2]), txt: x[3] }); i++; continue; }
          if (lignes[i].trim() && /^\s{2,}/.test(lignes[i]) && items.length) { items[items.length - 1].txt += " " + lignes[i].trim(); i++; continue; }
          break;
        }
        html.push(liste(items));
        continue;
      }
      const para = [];                                                             // paragraphe
      while (i < lignes.length && lignes[i].trim() && !/^(#{1,6}\s|\s*>|\s*(`{3,}|~{3,}))/.test(lignes[i]) && !RE_LISTE.test(lignes[i])
        && !(lignes[i].includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1]))) para.push(lignes[i++]);
      html.push(`<p>${para.map((p, k) => enLigne(p.trim()) + (k < para.length - 1 && / {2,}$/.test(p) ? "<br>" : "")).join(" ")}</p>`);
    }
    return { html: html.join("\n"), sommaire, titre, signature };
  }

  function liste(items) {
    let h = "", pile = [];
    const ouvrir = it => { const t = it.num ? "ol" : "ul"; pile.push({ ind: it.ind, t }); h += `<${t}>`; };
    for (const it of items) {
      while (pile.length && it.ind < pile[pile.length - 1].ind) { h += `</li></${pile.pop().t}>`; }
      if (!pile.length || it.ind > pile[pile.length - 1].ind) ouvrir(it);
      else h += "</li>";
      const c = it.txt.match(/^\[([ xX])\]\s+(.*)$/);
      h += c ? `<li class="wg-tache"><input type="checkbox" disabled${c[1] !== " " ? " checked" : ""}> <span class="wg-li">${enLigne(c[2])}</span>`
        : `<li><span class="wg-li">${enLigne(it.txt)}</span>`;
    }
    while (pile.length) h += `</li></${pile.pop().t}>`;
    return h;
  }

  /* ---------------------------------------------------------------- guides du module */
  const EMOJIS = [[/correspondance|tableau crois[ée]/i, "🔀"], [/^(\d+\s*[-_. ]\s*)?carte\b/i, "🧭"], [/^sources?\b/i, "🔗"], [/obligation/i, "⚖️"], [/industriel/i, "🏭"], [/checklist|contr[oô]le|audit/i, "✅"], [/plan|feuille de route|mise en [oœ]uvre|[ée]tape/i, "🗺️"],
    [/cadrage|p[ée]rim[eè]tre/i, "🎯"], [/matrice|atelier/i, "🧮"], [/socle|mesure/i, "🛡️"], [/rapport|synth[eè]se/i, "📑"],
    [/registre/i, "🗂️"], [/mod[eè]le|gabarit/i, "🧩"], [/guide|r[ée]f[ée]rentiel|m[ée]thode/i, "📘"]];
  let cache = null;
  function liste_guides() {
    if (cache) return cache;
    const src = Array.isArray(globalThis.WERB_GUIDES) ? globalThis.WERB_GUIDES : [];
    cache = src.map((g, n) => {
      const chemin = String(g.fichier || `guide-${n + 1}.md`).replace(/\\/g, "/");
      const dossier = chemin.includes("/") ? chemin.slice(0, chemin.lastIndexOf("/")) : "";
      dossierCourant = dossier;
      const r = rendre(g.texte);
      dossierCourant = "";
      const nom = chemin.slice(dossier ? dossier.length + 1 : 0).replace(/\.md$/i, "");
      // Titre : premier titre (# ou ##) du document, avant « — » ; trop long ou absent : nom du fichier sans numéro
      let titre = (r.sommaire.find(s => s.niv <= 2) || { texte: "" }).texte.replace(/[*_`]/g, "").split(/\s+[—–]\s+/)[0].trim();
      if (!titre || titre.length > 60) titre = nom.replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " ");
      titre = titre.charAt(0).toUpperCase() + titre.slice(1);
      const id = "guide:" + (sansAccent((dossier ? dossier + "/" : "") + nom).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || n + 1);
      const mots = String(g.texte || "").split(/\s+/).filter(Boolean).length;
      // Sommaire : les deux plus hauts niveaux de titres, sans le titre du document
      const titres = r.sommaire.slice(1), niveaux = [...new Set(titres.map(s => s.niv))].sort();
      const som = titres.filter(s => niveaux.indexOf(s.niv) > -1 && niveaux.indexOf(s.niv) < 2).map(s => ({ ...s, rang: niveaux.indexOf(s.niv) + 1 }));
      return Object.freeze({ id, fichier: chemin, dossier, titre, signature: r.signature, emoji: (EMOJIS.find(([re]) => re.test(titre) || re.test(nom)) || [, "📄"])[1],
        html: r.html, sommaire: som, minutes: Math.max(1, Math.round(mots / 200)) });
    });
    return cache;
  }
  const trouver = id => liste_guides().find(g => g.id === id) || null;
  const duDossier = dossier => liste_guides().filter(g => dossier === undefined || g.dossier === dossier);
  const racine = () => String(globalThis.WERB_GUIDES_RACINE || "guides");

  // Entrées du menu ❓ Aide : [[idVue, libellé], …] ; idVue commence par « guide: ». dossier : ceux d'un seul dossier ("" = racine)
  const entrees = dossier => duDossier(dossier).map(g => [g.id, `${g.emoji} ${g.titre}`]);

  // Dossiers des guides, dans l'ordre de leurs fichiers : [{ dossier, nom (sans numéro), guides }] ; "" = racine
  function dossiers() {
    const ds = [];
    for (const g of liste_guides()) {
      let d = ds.find(x => x.dossier === g.dossier);
      if (!d) ds.push(d = { dossier: g.dossier, nom: g.dossier.split("/").pop().replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " "), guides: [] });
      d.guides.push(g);
    }
    return ds;
  }

  // Liens relatifs du texte (data-werb-page) : navigation propre au module vers la page citée, ou texte simple si elle manque
  const liensInternes = (html, lien) => html.replace(/<a class="wg-int" data-werb-page="([^"]*)">([\s\S]*?)<\/a>/g, (_, chemin, lib) => {
    const cible = liste_guides().find(g => esc(g.fichier) === chemin);
    return cible ? `<a href="#" class="wg-int" ${lien(cible.id)}>${lib}</a>` : `<span class="wg-absent" title="Page absente : ${chemin}">${lib}</span>`;
  });

  // Cartes des guides, pour la page d'aide ou l'accueil. lien(id) : attributs HTML de navigation propres au module ; dossier : facultatif
  function cartes(lien, dossier) {
    const gs = duDossier(dossier);
    if (!gs.length) return "";
    return `<div class="wg-cartes">${gs.map((g, n) => `<button type="button" class="wg-carte" ${lien(g.id)}><span class="wg-etape">${n + 1}</span>`
      + `<span class="wg-ct"><b>${g.emoji} ${esc(g.titre)}</b><small>${g.sommaire.filter(s => s.rang === 1).length} sections · ≈ ${g.minutes} min de lecture</small></span></button>`).join("")}</div>`;
  }

  // Page de lecture d'un guide (étapes : les guides de son dossier). lien(id) : attributs HTML de navigation propres au module ;
  // retour : HTML d'un bouton facultatif ; mot : nom d'un document dans le bandeau (« Guide », « Page »…)
  function vue(id, { lien, retour = "", mot = "Guide" } = {}) {
    const g = trouver(id);
    if (!g) return `<div class="wg"><p>Guide introuvable.</p>${retour}</div>`;
    const gs = duDossier(g.dossier);
    const n = gs.indexOf(g), prec = gs[n - 1], suiv = gs[n + 1];
    const etapes = gs.map((x, k) => `<button type="button" class="wg-pas${x === g ? " actif" : ""}" ${lien(x.id)} title="${esc(x.titre)}"><span class="wg-etape">${k + 1}</span>${x.emoji} ${esc(x.titre)}</button>`).join("");
    const som = g.sommaire.map(s => `<a class="wg-s${s.rang}" data-werb-ancre="${s.ancre}">${esc(s.texte)}</a>`).join("");
    const pied = `<div class="wg-pied">${prec ? `<button type="button" ${lien(prec.id)}>← ${esc(prec.titre)}</button>` : "<span></span>"}`
      + `${suiv ? `<button type="button" class="primary" ${lien(suiv.id)}>${esc(suiv.titre)} →</button>` : ""}</div>`;
    return `<div class="wg"><div class="wg-tete"><div class="wg-pas-liste">${etapes}</div>${retour}</div>
      <div class="wg-corps"><article class="wg-doc"><div class="wg-meta">${g.emoji} ${esc(mot)} ${n + 1} / ${gs.length} · ≈ ${g.minutes} min de lecture · <span class="wg-fichier">${esc(racine())}/${esc(g.fichier)}</span>${g.signature ? `<span class="wg-sig">${esc(g.signature)}</span>` : ""}</div>${liensInternes(g.html, lien)}${pied}</article>
      ${som ? `<aside class="wg-som"><div class="wg-som-t">📑 Sommaire</div>${som}</aside>` : ""}</div></div>`;
  }

  /* ---------------------------------------------------------------- style et ancres */
  const CSS = `
.wg{--wg-a:var(--navy,#1f3864);--wg-b:var(--navy-2,#2e5090);--wg-l:var(--line,#dfe3ea);--wg-m:var(--muted,#5d6676);--wg-f:#f6f8fc;--wg-fond:var(--card,#fff);--wg-i:var(--info-bg,#e8eef9);--wg-h:var(--navy-fond,var(--navy,#1f3864));--wg-h2:#2e5090;--wg-code:#eef1f6;--wg-cit:#fff8e6;--wg-cit-b:#e0a100;--wg-th-b:#c9d5ea;--wg-pre:#1d2330;--wg-pre-t:#e8ecf3}
@media screen{:root[data-theme=sombre] .wg,:root[data-theme=sombre] .wg-cartes{--wg-f:#1b2533;--wg-h2:#2a4a7a;--wg-code:#243041;--wg-cit:#3a2d0c;--wg-cit-b:#c79a00;--wg-th-b:#2e4a75;--wg-pre:#0b0f14}}
.wg-tete{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.wg-pas-liste{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.wg-pas{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--wg-l);background:var(--wg-fond);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font:inherit;font-size:13px;color:inherit}
.wg-pas:hover{border-color:var(--wg-b)}
.wg-pas.actif{background:var(--wg-h);border-color:var(--wg-h);color:#fff;font-weight:600}

.wg-pas.actif .wg-etape{background:rgba(255,255,255,.22);color:#fff}

   plage d'une feuille de listes), dates au format date Excel, feuilles masquées, propriétés signées. Lecture : valeurs
   des cellules (texte partagé ou en ligne, nombres, booléens), feuille par feuille.

  /* ---------- ZIP ---------- */

        try { data = new Uint8Array(await flux(brut, new CompressionStream("deflate-raw"))); meth = 8; } catch (e) { data = brut; meth = 0; }

    const xf = (police, fond, format = 49) => `<xf numFmtId="${format}" fontId="${police}" fillId="${fond}" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>`;

      + `<fonts count="3"><font><sz val="10"/><name val="Calibri"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><i/><sz val="10"/><color rgb="FF595959"/><name val="Calibri"/></font></fonts>`

      + `<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${bord}</borders>`

  // Liste stricte : Excel refuse une autre valeur ; sinon il avertit seulement. Une plage évite la limite de 255 caractères des valeurs.
  function feuille(f) {

    const listes = (f.listes || []).filter(l => l.plage || (l.valeurs && l.valeurs.length)).map(l => {
      const col = lettre(l.col + 1), formule = l.plage || `"${l.valeurs.map(v => String(v).replace(/[",]/g, " ")).join(",")}"`;

        : `errorStyle="warning" errorTitle="Valeur hors liste" error="Cette valeur n'est pas dans la liste : elle sera signalée à l'import."`;
      return `<dataValidation type="list" ${msg} allowBlank="1" showErrorMessage="1" sqref="${col}2:${col}${LIGNES_LISTES + 1}"><formula1>${X(formule)}</formula1></dataValidation>`;

      + `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
      + `<cols>${Array.from({ length: nc }, (_, j) => `<col min="${j + 1}" max="${j + 1}" width="${(f.largeurs && f.largeurs[j]) || 18}" customWidth="1"/>`).join("")}</cols>`
      + `<sheetData>${donnees}</sheetData>${f.lignes.length > 1 ? `<autoFilter ref="A1:${lettre(nc)}${f.lignes.length}"/>` : ""}`
      + (listes.length ? `<dataValidations count="${listes.length}">${listes.join("")}</dataValidations>` : "") + `</worksheet>`;
  }
  // Classeur à partir de feuilles (voir feuille) ; titre et signature dans les propriétés du fichier
  function classeur(feuilles, { titre = "", signature = "" } = {}) {

    const fichiers = [
      ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>${feuilles.map((f, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],

      ["docProps/core.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${X(titre)}</dc:title><dc:creator>@WerbHat</dc:creator><dc:description>${X(signature)}</dc:description><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0, 19)}Z</dcterms:created></cp:coreProperties>`],

      ["xl/styles.xml", styles()],
      ...feuilles.map((f, i) => [`xl/worksheets/sheet${i + 1}.xml`, feuille(f)]),

    return zip(fichiers);
  }

  /* ---------- Lecture ---------- */
  // Renvoie { noms: [feuilles], lignes(nom) → [[valeur]] } ; lignes[0] = ligne 1, lignes[i][0] = colonne A
  async function lire(fichier) {
    if (fichier.size > TAILLE_MAX) throw new Error("Classeur trop volumineux (20 Mo au plus).");
    const texte = unzip(await fichier.arrayBuffer()), P = new DOMParser();
    const xml = async chemin => { const t = await texte(chemin); return t ? P.parseFromString(t, "application/xml") : null; };
    const balises = (d, t) => [...d.getElementsByTagNameNS("*", t)];
    const wb = await xml("xl/workbook.xml"), rel = await xml("xl/_rels/workbook.xml.rels");
    if (!wb || !rel) throw new Error("Ce fichier n'est pas un classeur Excel valide (.xlsx).");
    const cibles = {};
    balises(rel, "Relationship").forEach(r => { cibles[r.getAttribute("Id")] = r.getAttribute("Target"); });
    const feuilles = {};
    balises(wb, "sheet").forEach(s => {
      const t = cibles[s.getAttributeNS(NS_R, "id") || s.getAttribute("r:id")];
      if (t) feuilles[s.getAttribute("name")] = t.startsWith("/") ? t.slice(1) : "xl/" + t;
    });
    const partages = [], ss = await xml("xl/sharedStrings.xml");
    if (ss) balises(ss, "si").forEach(si => partages.push(balises(si, "t").filter(t => t.parentNode.localName !== "rPh").map(t => t.textContent).join("")));
    async function lignes(nom) {
      const d = feuilles[nom] ? await xml(feuilles[nom]) : null;
      if (!d) return [];
      const out = [];
      balises(d, "c").forEach(c => {
        const m = /^([A-Z]+)(\d+)$/.exec(c.getAttribute("r") || "");
        if (!m) return;
        const t = c.getAttribute("t"), v = balises(c, "v")[0];
        let val = "";
        if (t === "s") val = v ? partages[+v.textContent] ?? "" : "";
        else if (t === "inlineStr") val = balises(c, "t").map(x => x.textContent).join("");
        else if (t === "b") val = v ? v.textContent === "1" : "";
        else if (t === "d") val = v ? v.textContent.slice(0, 10) : "";   // date ISO (rare : LibreOffice, saisie stricte)
        else if (t !== "e" && v) val = t === "str" || isNaN(+v.textContent) ? v.textContent : +v.textContent;
        (out[+m[2] - 1] = out[+m[2] - 1] || [])[numero(m[1]) - 1] = val;
      });
      return out;
    }
    return { noms: Object.keys(feuilles), lignes };
  }

  return Object.freeze({ TYPE, STYLE, classeur, lire, lettre, date, isoDe, zip });
})();

  /* ===================================================== listes de choix du groupe (charte §5.9) */
  // À l'ouverture d'une base, et quand l'espace devient accessible, les valeurs publiées par le groupe (groupe:listes) sont
  // fusionnées avec celles du site par le socle ; la copie gardée dans la base sert hors espace. Valeur du groupe : non
  // modifiable ici ; retirée mais employée : conservée ⚠ ; remplacements proposés (Base › Référentiels).
  const LCLE = WerbSocle.listes.cle;
  // Champs qui emploient une liste : [objet, champ, TAG de la fiche ou du bandeau]
  function champsListe(k) {
    if (k === "typesPort") return S.fiches.flatMap(f => f.ports.map(r => [r, "type", f.tag]));
    if (k === "typesBandeau") return S.bandeaux.map(b => [b, "typePort", b.tag]);

  }
  const emplois = (k, v) => champsListe(k).filter(([o, f]) => LCLE(o[f]) === LCLE(v)).length;
  const duGroupe = (k, v) => WerbSocle.listes.duGroupe(S.listesGroupe[k], v);
  async function listesGroupe({ relire = true } = {}) {
    if (!S) return;
    if (relire) { try { LISTES_GROUPE = await WerbSocle.listes.lireGroupe(); } catch (e) { LISTES_GROUPE = null; } }   // non lisibles : copie de la base
    const r = WerbSocle.listes.appliquer({ definitions: REFS.map(([id]) => ({ id })), locales: S.refs, copies: S.listesGroupe, groupe: LISTES_GROUPE, utilisation: emplois });
    LISTES = r.listes; LISTES_MSG = r.message;
    if (r.change) {
      S.refs = r.locales; S.listesGroupe = r.copies;
      journaliser("Mise à jour", "Listes de choix", "groupe:listes", "", "", r.message || "copie des listes du groupe");

  function inventaireFichier(texte, nom) {
    let j;

    if (!j || j.format !== "WERBSMSI-PUBLICATION" || !j.data) throw new Error("Ce fichier n'est pas une publication WerbSMSI (sites/<SITE>/publications/werbmap.json).");
    const m = j.meta || {};
    if (m.site && LIAISON.site && m.site !== LIAISON.site) throw new Error(`Publication du site ${m.site}, alors que la base est rattachée au site ${LIAISON.site}.`);
    return inventaireDepuis(j.data, { site: str(m.site), source: nom, publieLe: str(m.publieLe) });
  }

  /* ===================================================== fichier */
  function toEnvelope() {
    const data = Object.assign({}, S, { fiches: S.fiches.filter(f => !ficheVide(f) || !actifDe(f.tag)) });
    const env = WerbSocle.enveloppe(data, { utilisateur: user, base: { meta: ENV.creeLe ? { creeLe: ENV.creeLe } : {}, journal: ENV.journal }, groupeId: LIAISON.groupeId, portee: LIAISON.site ? "site" : undefined, site: LIAISON.site });

  async function ouvrir() {

  /* Versions (1.9.0) : chaque enregistrement crée une version (numéro, date, auteur, commentaire obligatoire, nombre de

  const versionCourante = () => (S.versions.length ? S.versions[S.versions.length - 1].v : 0);

    const l = enAttente(), el = [...new Set(l.map(j => j.element).filter(Boolean))];

  }
  async function commentaireVersion(v) {
    let defaut = resumeModifs();

      if (!r) return null;

  }
  async function enregistrer(sous = false) {
    if (!S) return false;

    let annuler = () => {};
    const nomSuggere = `Assets_${(LIAISON.site || S.site.nom || "SITE").replace(/[^\w-]+/g, "_")}${WERB.extension}`;
    for (;;) {
      try {
        const pris = nouvelles(), n = enAttente().length;
        S.versions.push({ v, date: new Date().toISOString(), par: user, commentaire, changements: n });
        journaliser("Enregistrement", "Base", fichier.nom || nomSuggere, "Version", "", `${v} – ${commentaire}`);
        [...pris, ENV.journal[ENV.journal.length - 1]].forEach(j => { j.version = v; });

      if (action === "archiver") sel.filter(b => !b.archive).forEach(b => { S.bandeaux.splice(S.bandeaux.indexOf(b), 1); b.archive = { le: maintenant, par: user }; S.archives.bandeaux.push(b); journaliser("Archivage", "Bandeau", b.tag, "Baie", "", b.baie); });
      if (action === "desarchiver") {
        const refus = [];
        sel.filter(b => b.archive).forEach(b => {
          if (S.bandeaux.some(x => x.tag.toUpperCase() === b.tag.toUpperCase())) { refus.push(b.tag); return; }
          S.archives.bandeaux.splice(S.archives.bandeaux.indexOf(b), 1); delete b.archive; S.bandeaux.push(b); journaliser("Désarchivage", "Bandeau", b.tag);
        });
        n -= refus.length;
        if (refus.length) toast(`TAG repris par un bandeau actif, désarchivage refusé : ${refus.join(", ")}.`, "err");
      }
      if (action === "supprimer") sel.forEach(b => { const l = b.archive ? S.archives.bandeaux : S.bandeaux; l.splice(l.indexOf(b), 1); journaliser("Suppression", "Bandeau", b.tag, "", `${b.raccords.length} port(s)`, ""); });
    } else if (action === "supprimer") {
      const x = cible();
      sel.forEach(r => journaliser("Suppression", objetCible(x), x.tag, T.obj, r[T.cle], ""));
      x[k] = x[k].filter(r => !sel.includes(r));
    }
    ui.coche[k] = new Set(); marquer(); render();
    if (n) toast(`${n} ligne(s) ${{ archiver: "archivée(s) : hors brassage, impression et classeurs", desarchiver: "désarchivée(s)", supprimer: "supprimée(s)" }[action]}.`, "ok");

  function controlesHtml(f) {
    return `<div class="card"><div class="row"><h2 style="margin:0">Procédure de configuration et de sécurisation</h2><span class="spacer"></span>${badgeCtrl(f)}</div>

  // Liste d'une catégorie : onglets par zone, tableau TAG / libellé / emplacement
  function vueCat(cat) {

      ${l.map(x => `<tr class="clic" data-act="ouvrirFiche" data-tag="${esc(x.tag)}"><td><b>${esc(x.tag)}</b>${x.orph && invCharge() ? " " + badge("orpheline", "b-warn") : ""}</td><td>${esc(x.i.libelle)}</td><td>${esc(emplacementDe(x.i))}</td>
        ${cat === "autre" ? `<td>${esc(x.i.type)}</td>` : ""}<td>${esc(x.i.marque)}</td><td>${esc((x.f && x.f.modele) || x.i.modele || "")}</td><td>${badgeAvancement(x.f, cat)}</td>${ctrl ? `<td>${badgeCtrl(x.f)}</td>` : ""}<td class="pos"><input class="pos-u" data-pos="${esc(x.tag)}" value="${esc((x.f && x.f.positionU) || "")}" placeholder="U" aria-label="Position dans la baie (U)"${WerbSocle.verrou.lectureSeule ? " disabled" : ""}></td></tr>`).join("")
      || `<tr><td colspan="10" class="empty">Aucun asset dans cet onglet.</td></tr>`}</tbody></table></div>`;
  }
  CATS.forEach(x => { VUES[x.k] = () => vueCat(x.k); });

  const retourHtml = (libelle, extra = "") => `<div class="row retour noprint"><button data-act="retour">← ${esc(libelle)}</button><span class="spacer"></span>${extra}</div>`;

  // Modèle et version firmware : WerbMap fait foi (MAP-6). Écart entre la fiche et WerbMap signalé ; reprise dans la fiche sur demande.
  const CORRESP = [["modele", "modele", "Modèle"], ["firmware", "version", "Version / firmware"]];
  const ecartsWerbMap = (f, i) => CORRESP.filter(([src, dst]) => i[src] && str(f[dst]).trim() !== i[src]).map(([src, dst, l]) => ({ src, dst, l, fiche: str(f[dst]).trim(), werbmap: i[src] }));
  function ecartWerbMap(f, i) {
    const e = ecartsWerbMap(f, i);

  // Fiche d'un asset
  VUES.fiche = () => {
    const f = ficheDe(ui.sel && ui.sel.tag);

    return retourHtml(`${(CAT[ui.retour] || { l: ui.retour === "inventaire" ? "Inventaire WerbMap" : "Tableau de bord" }).l}${CAT[ui.retour] ? " · " + nomZone(i.zone) : ""}`,

      <div class="row barre noprint"><button data-act="baieAjout">+ Baie</button><button class="danger suppr-baie" data-act="baieSuppr"${cur.inv || WerbSocle.verrou.lectureSeule ? " disabled" : ""}

      <div class="card"><h2>Baie ${esc(cur.tag)} <span class="small muted">${cur.inv ? "(coffret de l'inventaire WerbMap)" : "(saisie dans WerbAssets)"}</span></h2><div class="fiche">

      ${l.map((b, n) => `<tr class="${b.archive ? "archivee" : "clic"}"${b.archive ? ` title="Archivé le ${esc(frDate(b.archive.le))} par ${esc(b.archive.par)}"` : ` data-act="ouvrirBandeau" data-id="${esc(b.id)}"`}>${caseT("bandeaux", n, b)}<td>${esc(b.position)}</td><td><b>${esc(b.tag)}</b></td><td>${esc(b.libelle)}</td><td>${esc(b.nbPorts)}</td><td>${esc(b.typePort)}</td><td>${raccordes(b)} / ${b.raccords.length}</td></tr>`).join("")

      <div class="card"><div class="row" style="margin-bottom:8px"><input placeholder="🔍 Filtrer" id="filtreInv" value="${esc(ui.iq)}" style="max-width:260px"><span class="spacer"></span><span class="small muted">${l.length} actif(s)</span></div>
      <div class="tablewrap"><table class="t liste" data-table="inventaire"><thead><tr>${[["id", "TAG"], ["libelle", "Libellé"], ["type", "Type"], ["famille", "Famille"], ["zone", "Zone"], ["emplacement", "Emplacement"], ["fiche", "Fiche WerbAssets"]].map(([k, x]) => `<th data-col="${k}">${x}</th>`).join("")}</tr></thead><tbody>
      ${l.map(a => { const k = catDe(a.id); return `<tr class="clic" data-act="ouvrirFiche" data-tag="${esc(a.id)}"><td><b>${esc(a.id)}</b></td><td>${esc(a.libelle)}</td><td>${esc(a.type)}</td><td>${esc(famille[a.famille] || a.famille || "")}</td><td>${esc(a.zone ? nomZone(a.zone) : "")}</td><td>${esc(emplacementDe(a))}</td>

  // Remplacements proposés par la fusion (renommage au groupe, autre écriture d'une valeur du groupe) : appliqués sur demande

  VUES.werbsmsi = () => {
    const g = E.groupe, lie = !!LIAISON.site, ok = E.ouvert && lie && LIAISON.groupeId === (g || {}).groupeId;
    return `<h1>Intégration WerbSMSI</h1><p class="sub">WerbAssets s'utilise au niveau d'un site. Il lit les actifs et les zones publiés par WerbMap ; il ne publie rien : la configuration des équipements reste dans la base du site.</p>

      <p>Base : ${lie ? `rattachée au site <b>${esc(LIAISON.site)}</b>` : "non rattachée"} · Espace ouvert : ${E.ouvert ? `<b>${esc(g.organisation)}</b> (dossier ${esc(E.nom)})` : "aucun"}</p>
      ${E.ouvert && lie && !ok ? `<div class="warnbox">Cette base est rattachée à un autre espace de groupe que celui ouvert.</div>` : ""}${SMSI_ERR ? `<div class="warnbox">${esc(SMSI_ERR)}</div>` : ""}

      ${E.ouvert ? `<select id="smsiSite"><option value="">Site…</option>${(g.sites || []).map(s => `<option value="${esc(s.code)}"${s.code === LIAISON.site ? " selected" : ""}>${esc(s.code)} – ${esc(s.nom)}</option>`).join("")}</select><button class="primary" data-act="smsiLink">Rattacher</button>` : ""}
      ${lie ? `<button data-act="smsiUnlink">Détacher</button>` : ""}${ok ? `<button data-act="invEspace">⟳ Actualiser l'inventaire</button>` : ""}</div>
      <p class="small muted">Le dossier SMSI_&lt;GROUPE&gt; est redemandé à chaque session. Rangez la base dans <code>sites/&lt;SITE&gt;/inventaires/</code>.</p></div>
      <div class="card"><h2>Objets lus</h2><table class="t"><tbody>

  async function lireFeuille(wb, d) {
    const nom = wb.noms.find(n => norm(n) === norm(d.nom));
    if (!nom) return null;
    const l = await wb.lignes(nom), cle = norm(d.cols.find(x => x.f === d.cle).l);

    if (h < 0) return { nom, lignes: [], ignorees: [], sansTitre: true };
    const map = {}, ignorees = [];
    l[h].forEach((v, j) => { const n = norm(v); if (!n) return; const col = d.cols.find(x => norm(x.l) === n || norm(x.f) === n); if (col) map[j] = col.f; else ignorees.push(String(v)); });

  // Valeur d'une cellule pour un champ : valeur de la liste si elle n'en diffère que par la casse ou les accents ; null si ignorée

  // Lignes d'un tableau (interfaces, VLAN, ports, raccordements) : fusion par clé, ou remplacement des tableaux cités
  function importTableau(R, L, t, cibleDe, objet) {

    for (const { n, o } of L.lignes) {

      if (!cur || cur.inv || WerbSocle.verrou.lectureSeule) return;
      const bx = S.bandeaux.filter(x => x.baie.toUpperCase() === cur.tag.toUpperCase()), nr = bx.reduce((s, x) => s + x.raccords.length, 0), nc = bx.reduce((s, x) => s + raccordes(x), 0);
      if (!(await confirmer(`Supprimer la baie <b>${esc(cur.tag)}</b>${bx.length ? ` avec ${bx.length} bandeau(x) (${bx.map(x => esc(x.tag)).join(", ")}) et leurs ${nr} port(s), dont ${nc} raccordé(s)` : ""} ? Cette suppression est définitive après enregistrement.`, "Supprimer"))) return;
      bx.forEach(x => { S.bandeaux.splice(S.bandeaux.indexOf(x), 1); journaliser("Suppression", "Bandeau", x.tag, "Baie", cur.tag, `${x.raccords.length} port(s)`); });
      bandeauxBaie(S.archives.bandeaux, cur.tag).forEach(x => { S.archives.bandeaux.splice(S.archives.bandeaux.indexOf(x), 1); journaliser("Suppression", "Bandeau", x.tag, "Baie", cur.tag, "archivé"); });
      if (cur.loc) S.baies.splice(S.baies.indexOf(cur.loc), 1);
      journaliser("Suppression", "Baie", cur.tag, "", "", bx.length ? `${bx.length} bandeau(x)` : ""); marquer(); ui.baie = ""; render();
      toast(`Baie ${cur.tag} supprimée.`, "ok");
    },
    async bandeauAjout() {
      const baie = ui.baie, n = S.bandeaux.filter(b => b.baie.toUpperCase() === baie.toUpperCase()).length + 1;
      const r = await saisir(`Nouveau bandeau dans ${baie}`, [["tag", "TAG du bandeau", `${baie}-BS${String(n).padStart(2, "0")}`], ["typePort", "Type de port", S.refs.typesBandeau[0] || "", S.refs.typesBandeau], ["nbPorts", "Nombre de ports", "24"], ["position", "Position dans la baie (U)", ""]], "Créer");
      if (!r) return;
      if (!r.tag || [...S.bandeaux, ...S.archives.bandeaux].some(b => b.tag.toUpperCase() === r.tag.toUpperCase())) { toast(r.tag ? `Le bandeau ${r.tag} existe déjà.` : "Le TAG du bandeau est obligatoire.", "err"); return; }
      const nb = Math.min(288, Math.max(0, parseInt(r.nbPorts, 10) || 0));
      const b = normBandeau({ tag: r.tag, baie, typePort: r.typePort, nbPorts: nb ? String(nb) : "", position: r.position });
      b.raccords = Array.from({ length: nb }, (_, i) => Object.assign(ligneVide("raccords"), { n: String(i + 1) }));
      S.bandeaux.push(b); journaliser("Ajout", "Bandeau", b.tag, "Baie", "", baie); marquer();
      ui.sel = { t: "bandeau", id: b.id }; vue = "bandeau"; render();
    },
    async bandeauSuppr() {
      const b = cible();
      if (!b || !(await confirmer(`Supprimer le bandeau <b>${esc(b.tag)}</b> et ses ${b.raccords.length} raccordement(s) ?`, "Supprimer"))) return;
      S.bandeaux.splice(S.bandeaux.indexOf(b), 1); journaliser("Suppression", "Bandeau", b.tag); marquer(); ui.baie = b.baie; ui.sel = null; vue = "brassage"; render();
    },
    imprimerFiche() { const f = cible(); imprimer(impressionFiche(f.tag), CAT[catDe(f.tag) || "autre"].obj, f.tag); },
    imprimerBandeau() { const b = cible(); imprimer(impressionBandeau(b), "Bandeau", b.tag); },
    imprimerZone(el) {
      const k = el.dataset.c, z = ui.zone[k], l = assets(k).filter(x => (x.i.zone || SANS) === z).sort((a, b) => parNumero(a.tag, b.tag));
      imprimer(l.map(x => impressionFiche(x.tag)).join(""), CAT[k].l, `${nomZone(z)} (${l.length} fiche(s))`);
    },
    imprimerBaie() {
      const l = S.bandeaux.filter(b => b.baie.toUpperCase() === String(ui.baie).toUpperCase()).sort((a, b) => parNumero(a.position || "999", b.position || "999"));
      imprimer(l.map(impressionBandeau).join(""), "Baie", `${ui.baie} (${l.length} bandeau(x))`);
    },
    xlModele() { telechargerClasseur(false); },
    xlExport() { telechargerClasseur(true); },
    xlImport() {
      const inp = $("#file-input"); inp.value = ""; inp.accept = ".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        try { RAPPORT = await analyser(ui.xcat, f, ui.mode); $("#modal-root").innerHTML = rapportHtml(RAPPORT); }
        catch (e) { toast("Import impossible : " + e.message, "err"); }
      };
      inp.click();
    },
    rapportFermer() { RAPPORT = null; $("#modal-root").innerHTML = ""; },
    rapportAppliquer() {
      const R = RAPPORT;
      if (!R) return;
      S = R.D; ENV.journal.push(...R.jr);
      journaliser("Import Excel", "Classeur " + libXl(R.k), R.fichier, R.mode === "remplacer" ? "Remplacement des tableaux" : "Compléter",
        "", `${R.creees} créé(s), ${R.maj} mis à jour, ${R.lignesAj + R.lignesMaj} ligne(s) de tableau, ${R.rejets.length} rejet(s)`);
      RAPPORT = null; $("#modal-root").innerHTML = ""; indexer(); marquer(); render();
      toast(`Import appliqué : ${R.creees} créé(s), ${R.maj} mis à jour. Enregistrez la base.`, "ok");
    },
    rapportCsv() {
      const R = RAPPORT, cellule = v => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
      const l = [["Type", "Feuille", "Ligne", "TAG", "Motif"], ...R.rejets.map(x => ["Rejet", ...x]), ...R.avert.map(x => ["Avertissement", ...x])];
      WerbSocle.telecharger("﻿" + l.map(x => x.map(cellule).join(";")).join("\r\n"), `Rapport_import_${libXl(R.k).replace(/[^\w-]+/g, "_")}_${AUJ()}.csv`, "text/csv;charset=utf-8");
    },
    async invEspace() {
      try { const r = await inventaireEspace(); SMSI_ERR = ""; toast(msgInventaire(r), "ok"); }
      catch (e) { SMSI_ERR = e.message; toast(e.message, "err"); }
      render();
    },
    invFichier() {
      const inp = $("#file-input"); inp.value = ""; inp.accept = ".json,application/json";
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        try { const r = inventaireFichier(await f.text(), f.name); render(); toast(msgInventaire(r), "ok"); }
        catch (e) { toast(e.message, "err"); }
      };
      inp.click();
    },
    async smsiOpen() {
      SMSI_ERR = "";
      try { await E.choisir(); toast(`Espace « ${E.groupe.organisation} » ouvert.`, "ok"); await listesGroupe(); }
      catch (e) { if (e.name !== "AbortError") SMSI_ERR = e.message; }
      render();
    },
    async smsiLink() {
      const code = $("#smsiSite").value;
      if (!code) { toast("Choisissez un site.", "err"); return; }
      const avant = LIAISON.site || "";
      LIAISON = { site: code, groupeId: E.groupe.groupeId };
      if (!S.site.nom) S.site.nom = ((E.groupe.sites || []).find(s => s.code === code) || {}).nom || "";
      journaliser("Rattachement", "WerbSMSI", E.groupe.organisation, "Site", avant, code); marquer();
      try { await inventaireEspace(); SMSI_ERR = ""; } catch (e) { SMSI_ERR = e.message; }
      render();
    },
    async smsiUnlink() {
      if (!(await confirmer("Détacher la base de son site WerbSMSI ? L'inventaire chargé est conservé.", "Détacher"))) return;
      journaliser("Détachement", "WerbSMSI", "", "Site", LIAISON.site, ""); LIAISON = {}; marquer(); render();
    },
  };

  // Modification d'un champ : valeur, journal (avant / après), base non enregistrée
  function appliquer(el) {
    const d = el.dataset;
    if (d.ref) {   // valeurs propres au site : celles du groupe restent en tête, intactes (charte §5.9)
      const avant = S.refs[d.ref].join(", "), copie = S.listesGroupe[d.ref];
      const site = el.value.split(/\r?\n/).map(x => x.trim()).filter(Boolean), vus = new Set();
      const l = WerbSocle.listes.proteger(copie, [...(copie ? copie.valeurs : []), ...site]).valeurs.filter(v => !vus.has(LCLE(v)) && vus.add(LCLE(v)));
      if (!l.length) { toast("Une liste ne peut pas être vide.", "err"); rerender(); return; }
      S.refs[d.ref] = l;
      const deja = site.filter(v => duGroupe(d.ref, v));
      if (deja.length) toast(`Déjà dans les valeurs du groupe : ${deja.join(", ")}.`, "");
      if (avant !== l.join(", ")) { journaliser("Modification", "Référentiel", d.ref, "", avant, l.join(", ")); marquer(); }
      rerender(); return;
    }
    if (d.bk) {
      let b = S.baies.find(x => x.tag.toUpperCase() === d.baie.toUpperCase());
      const v = el.value.trim();
      if ((b ? b[d.bk] : "") === v) return;
      if (!b) { b = { id: uid(), tag: d.baie, libelle: "", emplacement: "" }; S.baies.push(b); }
      journaliser("Modification", "Baie", b.tag, d.bk === "libelle" ? "Libellé" : "Emplacement", b[d.bk], v); b[d.bk] = v; marquer(); return;
    }
    if (!d.k || !ui.sel) return;
    const x = cible();
    if (!x) return;
    let v = el.value.trim();
    if (el.type === "number" && v !== "") v = String(Math.max(0, Math.round(+v) || 0));
    const avant = lire(x, d.k) ?? "";
    if (String(avant) === v) return;
    if (ui.sel.t === "bandeau" && d.k === "tag" && (!v || [...S.bandeaux, ...S.archives.bandeaux].some(b => b !== x && b.tag.toUpperCase() === v.toUpperCase()))) {
      toast(v ? `Le bandeau ${v} existe déjà.` : "Le TAG du bandeau est obligatoire.", "err"); rerender(); return;
    }
    poser(x, d.k, v);
    journaliser("Modification", objetCible(x), x.tag, libelleChemin(x, d.k), avant, v);
    const m = /^interfaces\.(\d+)\.cidr$/.exec(d.k), r = m ? x.interfaces[+m[1]] : null, mq = r ? masqueCidr(v) : "";
    if (mq && !r.masque) { r.masque = mq; journaliser("Modification", objetCible(x), x.tag, libelleChemin(x, `interfaces.${m[1]}.masque`), "", mq + " (déduit du CIDR)"); }
    marquer();
    if (el.tagName === "SELECT" || mq || ["cat", "nbRj45", "nbSfp", "nbPorts", "tag", "libelle"].includes(d.k)) rerender(); else renderNav();
  }

  document.addEventListener("click", e => {
    const nav = e.target.closest("[data-nav]");
    if (nav && (S || WerbGuides.trouver(nav.dataset.nav) || nav.dataset.nav === "accueil")) { e.preventDefault(); vue = nav.dataset.nav; ui.sel = null; render(); $("#main").scrollTop = 0; return; }
    if (e.target.closest("td.sel, th.sel, td.pos")) return;   // case de sélection, position (U) : pas d'ouverture de la ligne
    const a = e.target.closest("[data-act]");
    if (a && ACTIONS[a.dataset.act] && !a.disabled) ACTIONS[a.dataset.act](a, e);
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (el.name === "xmode") { ui.mode = el.value; return; }
    if (el.dataset.coche) { const k = el.dataset.coche, s = ui.coche[k] = ui.coche[k] || new Set(), r = lignesT(k)[+el.dataset.i]; if (r) s[el.checked ? "add" : "delete"](r); render(); return; }
    if (el.dataset.cochetout) { const k = el.dataset.cochetout; ui.coche[k] = new Set(el.checked ? lignesT(k) : []); render(); return; }
    if (el.dataset.voirarch) { ui.arch = el.checked; ui.coche.bandeaux = new Set(); render(); return; }
    if (el.id === "filtreVersion") { ui.jv = el.value; render(); return; }
    if (el.id === "smsiSite" || el.id === "nbItf" || el.dataset.q !== undefined || el.dataset.s !== undefined || el.dataset.vl !== undefined || el.dataset.vltout !== undefined) return;
    if (el.dataset.pos !== undefined) { positionListe(el); return; }
    if (S) appliquer(el);
  });
  document.addEventListener("input", e => {
    const el = e.target, champFiltre = el.id === "filtreJournal" ? "jq" : el.id === "filtreInv" ? "iq" : null;
    if (!champFiltre && el.dataset.q === undefined) return;
    if (champFiltre) ui[champFiltre] = el.value; else ui.q[el.dataset.q] = el.value;
    const pos = el.selectionStart; render();
    const f = champFiltre ? $("#" + el.id) : document.querySelector(`[data-q="${CSS.escape(el.dataset.q)}"]`);
    if (f) { f.focus(); f.setSelectionRange(pos, pos); }
  });
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); const a = document.activeElement; if (S && a && a.matches && a.matches("[data-k],[data-bk]")) appliquer(a); enregistrer(false); }
    if (e.key === "Enter" && e.target.id === "nomUtil") ACTIONS.entrer();
  });
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  render();
})();
</script>
</body>
