   interne, ancre ignorée). Tout le HTML du texte est échappé, sauf les commentaires
   <!-- … --> placés entre deux blocs, qui ne sont pas affichés ; le premier porte la signature du guide (charte §7.4).
   Thème clair / sombre (charte §7.5, 1.2.0) : fonds sur les variables communes (--card, --info-bg…, repli clair), valeurs sombres
   propres au lecteur à l'écran seulement ; titres sous texte blanc sur --navy-fond ; impression en clair. */
const WerbGuides = Object.freeze((() => {
  const VERSION = "1.1.0";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const sansAccent = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

  /* ---------------------------------------------------------------- texte en ligne */
  let dossierCourant = "";                                   // dossier du guide en cours de rendu (liens relatifs)
  // Chemin d'une page .md citée par un lien relatif, à partir du dossier du guide (« ../2-NIST/0-carte.md »)
  function cheminRelatif(url) {
    let u = url.replace(/#.*$/, "");
    try { u = decodeURIComponent(u); } catch { /* adresse mal encodée : prise telle quelle */ }
    const parts = [];
    for (const p of ((dossierCourant ? dossierCourant + "/" : "") + u.replace(/^\.\//, "")).split("/")) {
      if (p === "..") parts.pop(); else if (p && p !== ".") parts.push(p);
    }
    return parts.join("/");
  }
  function enLigne(s, liens = true) {
    const gardes = [];
    const garder = h => `\u0000${gardes.push(h) - 1}\u0000`;
    s = s.replace(/`([^`]+)`/g, (_, c) => garder(`<code>${esc(c)}</code>`));
    s = s.replace(/\[([^\]]+)\]\((?:<([^>]+)>|([^)\s]+))\)/g, (t, lib, url1, url2) => {
      const url = url1 || url2;
      if (/^(https?:|mailto:)/i.test(url)) return garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${enLigne(lib, false)}</a>`);
      if (/^[^:]+\.md(#.*)?$/i.test(url)) return garder(`<a class="wg-int" data-werb-page="${esc(cheminRelatif(url))}">${enLigne(lib, false)}</a>`);
      return t;
    });
    if (liens) s = s.replace(/\bhttps?:\/\/[^\s<>()]+[^\s<>().,;:!?]/g, url => garder(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`));
    s = esc(s);
    s = s.replace(/\*\*(?=\S)(.+?)\*\*/g, "<strong>$1</strong>").replace(/__(?=\S)(.+?)__(?![\p{L}\d])/gu, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*(?=\S)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>").replace(/(^|[^\p{L}\d_])_(?=\S)([^_]+?)_(?![\p{L}\d_])/gu, "$1<em>$2</em>");
    return s.replace(/\u0000(\d+)\u0000/g, (_, n) => gardes[+n]);
  }

  /* ---------------------------------------------------------------- blocs */
  const RE_LISTE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const cellules = l => l.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  const estSeparateur = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);

  function rendre(md) {
    const lignes = String(md || "").replace(/\r\n?/g, "\n").split("\n");
    const sommaire = [], ancres = new Set();
    let titre = "", signature = "";
    const ancre = t => {
      const base = "g-" + (sansAccent(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "section");
      let a = base, n = 2;
      while (ancres.has(a)) a = `${base}-${n++}`;
      ancres.add(a);
      return a;
    };
    const html = [];
    let i = 0;
    while (i < lignes.length) {
      const l = lignes[i];
      if (!l.trim()) { i++; continue; }
      if (/^\s*<!--/.test(l)) {                                                     // commentaire : non affiché
        const debut = i;
        while (i < lignes.length && !lignes[i].includes("-->")) i++;
        const c = lignes.slice(debut, i + 1).join(" ").replace(/^\s*<!--|-->[\s\S]*$/g, "").trim();
        if (!signature && !html.length) signature = c;
        i++;
        continue;
      }
      let m;
      if ((m = l.match(/^\s*(`{3,}|~{3,})\s*([\w-]*)/))) {                       // bloc de code
        const fin = m[1], corps = [];
        i++;
        while (i < lignes.length && !lignes[i].trim().startsWith(fin)) corps.push(lignes[i++]);
        i++;
        html.push(`<pre class="wg-code"><code>${esc(corps.join("\n"))}</code></pre>`);
        continue;
      }
      if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {                          // titre
        const niv = m[1].length, txt = m[2], a = ancre(txt);
        if (!titre && niv <= 2) titre = txt.replace(/[*_`]/g, "");
        sommaire.push({ niv, texte: txt.replace(/[*_`]/g, ""), ancre: a });
        html.push(`<h${niv} id="${a}" class="wg-h${niv}">${enLigne(txt)}</h${niv}>`);
        i++;
        continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { html.push("<hr>"); i++; continue; } // filet
      if (l.includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1])) { // tableau
        const tete = cellules(l), alig = cellules(lignes[i + 1]).map(c => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : "");
        const st = k => alig[k] ? ` style="text-align:${alig[k]}"` : "";
        i += 2;
        const corps = [];
        while (i < lignes.length && lignes[i].includes("|") && lignes[i].trim()) corps.push(cellules(lignes[i++]));
        html.push(`<div class="wg-table"><table><thead><tr>${tete.map((c, k) => `<th${st(k)}>${enLigne(c)}</th>`).join("")}</tr></thead>`
          + `<tbody>${corps.map(r => `<tr>${tete.map((_, k) => `<td${st(k)}>${enLigne(r[k] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        continue;
      }
      if (/^\s*>/.test(l)) {                                                       // citation
        const corps = [];
        while (i < lignes.length && /^\s*>/.test(lignes[i])) corps.push(lignes[i++].replace(/^\s*>\s?/, ""));
        html.push(`<blockquote>${rendre(corps.join("\n")).html}</blockquote>`);
        continue;
      }
      if (RE_LISTE.test(l)) {                                                      // liste (imbrication par l'indentation)
        const items = [];
        while (i < lignes.length) {
          const x = lignes[i].match(RE_LISTE);
          if (x) { items.push({ ind: x[1].replace(/\t/g, "    ").length, num: /\d/.test(x[2]), txt: x[3] }); i++; continue; }
          if (lignes[i].trim() && /^\s{2,}/.test(lignes[i]) && items.length) { items[items.length - 1].txt += " " + lignes[i].trim(); i++; continue; }
          break;
        }
        html.push(liste(items));
        continue;
      }
      const para = [];                                                             // paragraphe
      while (i < lignes.length && lignes[i].trim() && !/^(#{1,6}\s|\s*>|\s*(`{3,}|~{3,}))/.test(lignes[i]) && !RE_LISTE.test(lignes[i])
        && !(lignes[i].includes("|") && i + 1 < lignes.length && estSeparateur(lignes[i + 1]))) para.push(lignes[i++]);
      html.push(`<p>${para.map((p, k) => enLigne(p.trim()) + (k < para.length - 1 && / {2,}$/.test(p) ? "<br>" : "")).join(" ")}</p>`);
    }
    return { html: html.join("\n"), sommaire, titre, signature };
  }

  function liste(items) {
    let h = "", pile = [];
    const ouvrir = it => { const t = it.num ? "ol" : "ul"; pile.push({ ind: it.ind, t }); h += `<${t}>`; };
    for (const it of items) {
      while (pile.length && it.ind < pile[pile.length - 1].ind) { h += `</li></${pile.pop().t}>`; }
      if (!pile.length || it.ind > pile[pile.length - 1].ind) ouvrir(it);
      else h += "</li>";
      const c = it.txt.match(/^\[([ xX])\]\s+(.*)$/);
      h += c ? `<li class="wg-tache"><input type="checkbox" disabled${c[1] !== " " ? " checked" : ""}> <span class="wg-li">${enLigne(c[2])}</span>`
        : `<li><span class="wg-li">${enLigne(it.txt)}</span>`;
    }
    while (pile.length) h += `</li></${pile.pop().t}>`;
    return h;
  }

  /* ---------------------------------------------------------------- guides du module */
  const EMOJIS = [[/correspondance|tableau crois[ée]/i, "🔀"], [/^(\d+\s*[-_. ]\s*)?carte\b/i, "🧭"], [/^sources?\b/i, "🔗"], [/obligation/i, "⚖️"], [/industriel/i, "🏭"], [/checklist|contr[oô]le|audit/i, "✅"], [/plan|feuille de route|mise en [oœ]uvre|[ée]tape/i, "🗺️"],
    [/cadrage|p[ée]rim[eè]tre/i, "🎯"], [/matrice|atelier/i, "🧮"], [/socle|mesure/i, "🛡️"], [/rapport|synth[eè]se/i, "📑"],
    [/registre/i, "🗂️"], [/mod[eè]le|gabarit/i, "🧩"], [/guide|r[ée]f[ée]rentiel|m[ée]thode/i, "📘"]];
  let cache = null;
  function liste_guides() {
    if (cache) return cache;
    const src = Array.isArray(globalThis.WERB_GUIDES) ? globalThis.WERB_GUIDES : [];
    cache = src.map((g, n) => {
      const chemin = String(g.fichier || `guide-${n + 1}.md`).replace(/\\/g, "/");
      const dossier = chemin.includes("/") ? chemin.slice(0, chemin.lastIndexOf("/")) : "";
      dossierCourant = dossier;
      const r = rendre(g.texte);
      dossierCourant = "";
      const nom = chemin.slice(dossier ? dossier.length + 1 : 0).replace(/\.md$/i, "");
      // Titre : premier titre (# ou ##) du document, avant « — » ; trop long ou absent : nom du fichier sans numéro
      let titre = (r.sommaire.find(s => s.niv <= 2) || { texte: "" }).texte.replace(/[*_`]/g, "").split(/\s+[—–]\s+/)[0].trim();
      if (!titre || titre.length > 60) titre = nom.replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " ");
      titre = titre.charAt(0).toUpperCase() + titre.slice(1);
      const id = "guide:" + (sansAccent((dossier ? dossier + "/" : "") + nom).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || n + 1);
      const mots = String(g.texte || "").split(/\s+/).filter(Boolean).length;
      // Sommaire : les deux plus hauts niveaux de titres, sans le titre du document
      const titres = r.sommaire.slice(1), niveaux = [...new Set(titres.map(s => s.niv))].sort();
      const som = titres.filter(s => niveaux.indexOf(s.niv) > -1 && niveaux.indexOf(s.niv) < 2).map(s => ({ ...s, rang: niveaux.indexOf(s.niv) + 1 }));
      return Object.freeze({ id, fichier: chemin, dossier, titre, signature: r.signature, emoji: (EMOJIS.find(([re]) => re.test(titre) || re.test(nom)) || [, "📄"])[1],
        html: r.html, sommaire: som, minutes: Math.max(1, Math.round(mots / 200)) });
    });
    return cache;
  }
  const trouver = id => liste_guides().find(g => g.id === id) || null;
  const duDossier = dossier => liste_guides().filter(g => dossier === undefined || g.dossier === dossier);
  const racine = () => String(globalThis.WERB_GUIDES_RACINE || "guides");

  // Entrées du menu ❓ Aide : [[idVue, libellé], …] ; idVue commence par « guide: ». dossier : ceux d'un seul dossier ("" = racine)
  const entrees = dossier => duDossier(dossier).map(g => [g.id, `${g.emoji} ${g.titre}`]);

  // Dossiers des guides, dans l'ordre de leurs fichiers : [{ dossier, nom (sans numéro), guides }] ; "" = racine
  function dossiers() {
    const ds = [];
    for (const g of liste_guides()) {
      let d = ds.find(x => x.dossier === g.dossier);
      if (!d) ds.push(d = { dossier: g.dossier, nom: g.dossier.split("/").pop().replace(/^\d+\s*[-_. ]\s*/, "").replace(/_/g, " "), guides: [] });
      d.guides.push(g);
    }
    return ds;
  }

  // Liens relatifs du texte (data-werb-page) : navigation propre au module vers la page citée, ou texte simple si elle manque
  const liensInternes = (html, lien) => html.replace(/<a class="wg-int" data-werb-page="([^"]*)">([\s\S]*?)<\/a>/g, (_, chemin, lib) => {
    const cible = liste_guides().find(g => esc(g.fichier) === chemin);
    return cible ? `<a href="#" class="wg-int" ${lien(cible.id)}>${lib}</a>` : `<span class="wg-absent" title="Page absente : ${chemin}">${lib}</span>`;
  });

  // Cartes des guides, pour la page d'aide ou l'accueil. lien(id) : attributs HTML de navigation propres au module ; dossier : facultatif
  function cartes(lien, dossier) {
    const gs = duDossier(dossier);
    if (!gs.length) return "";
    return `<div class="wg-cartes">${gs.map((g, n) => `<button type="button" class="wg-carte" ${lien(g.id)}><span class="wg-etape">${n + 1}</span>`
      + `<span class="wg-ct"><b>${g.emoji} ${esc(g.titre)}</b><small>${g.sommaire.filter(s => s.rang === 1).length} sections · ≈ ${g.minutes} min de lecture</small></span></button>`).join("")}</div>`;
  }

  // Page de lecture d'un guide (étapes : les guides de son dossier). lien(id) : attributs HTML de navigation propres au module ;
  // retour : HTML d'un bouton facultatif ; mot : nom d'un document dans le bandeau (« Guide », « Page »…)
  function vue(id, { lien, retour = "", mot = "Guide" } = {}) {
    const g = trouver(id);
    if (!g) return `<div class="wg"><p>Guide introuvable.</p>${retour}</div>`;
    const gs = duDossier(g.dossier);
    const n = gs.indexOf(g), prec = gs[n - 1], suiv = gs[n + 1];
    const etapes = gs.map((x, k) => `<button type="button" class="wg-pas${x === g ? " actif" : ""}" ${lien(x.id)} title="${esc(x.titre)}"><span class="wg-etape">${k + 1}</span>${x.emoji} ${esc(x.titre)}</button>`).join("");
    const som = g.sommaire.map(s => `<a class="wg-s${s.rang}" data-werb-ancre="${s.ancre}">${esc(s.texte)}</a>`).join("");
    const pied = `<div class="wg-pied">${prec ? `<button type="button" ${lien(prec.id)}>← ${esc(prec.titre)}</button>` : "<span></span>"}`
      + `${suiv ? `<button type="button" class="primary" ${lien(suiv.id)}>${esc(suiv.titre)} →</button>` : ""}</div>`;
    return `<div class="wg"><div class="wg-tete"><div class="wg-pas-liste">${etapes}</div>${retour}</div>
      <div class="wg-corps"><article class="wg-doc"><div class="wg-meta">${g.emoji} ${esc(mot)} ${n + 1} / ${gs.length} · ≈ ${g.minutes} min de lecture · <span class="wg-fichier">${esc(racine())}/${esc(g.fichier)}</span>${g.signature ? `<span class="wg-sig">${esc(g.signature)}</span>` : ""}</div>${liensInternes(g.html, lien)}${pied}</article>
      ${som ? `<aside class="wg-som"><div class="wg-som-t">📑 Sommaire</div>${som}</aside>` : ""}</div></div>`;
  }

  /* ---------------------------------------------------------------- style et ancres */
  const CSS = `
.wg{--wg-a:var(--navy,#1f3864);--wg-b:var(--navy-2,#2e5090);--wg-l:var(--line,#dfe3ea);--wg-m:var(--muted,#5d6676);--wg-f:#f6f8fc;--wg-fond:var(--card,#fff);--wg-i:var(--info-bg,#e8eef9);--wg-h:var(--navy-fond,var(--navy,#1f3864));--wg-h2:#2e5090;--wg-code:#eef1f6;--wg-cit:#fff8e6;--wg-cit-b:#e0a100;--wg-th-b:#c9d5ea;--wg-pre:#1d2330;--wg-pre-t:#e8ecf3}
@media screen{:root[data-theme=sombre] .wg,:root[data-theme=sombre] .wg-cartes{--wg-f:#1b2533;--wg-h2:#2a4a7a;--wg-code:#243041;--wg-cit:#3a2d0c;--wg-cit-b:#c79a00;--wg-th-b:#2e4a75;--wg-pre:#0b0f14}}
.wg-tete{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.wg-pas-liste{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.wg-pas{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--wg-l);background:var(--wg-fond);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font:inherit;font-size:13px;color:inherit}
.wg-pas:hover{border-color:var(--wg-b)}
.wg-pas.actif{background:var(--wg-h);border-color:var(--wg-h);color:#fff;font-weight:600}

.wg-pas.actif .wg-etape{background:rgba(255,255,255,.22);color:#fff}

  /* ---------- Lecture ---------- */
  // Renvoie { noms: [feuilles], lignes(nom) → [[valeur]] } ; lignes[0] = ligne 1, lignes[i][0] = colonne A
  async function lire(fichier) {
    if (fichier.size > TAILLE_MAX) throw new Error("Classeur trop volumineux (20 Mo au plus).");
    const texte = unzip(await fichier.arrayBuffer()), P = new DOMParser();
    const xml = async chemin => { const t = await texte(chemin); return t ? P.parseFromString(t, "application/xml") : null; };
    const balises = (d, t) => [...d.getElementsByTagNameNS("*", t)];
    const wb = await xml("xl/workbook.xml"), rel = await xml("xl/_rels/workbook.xml.rels");
    if (!wb || !rel) throw new Error("Ce fichier n'est pas un classeur Excel valide (.xlsx).");
    const cibles = {};
    balises(rel, "Relationship").forEach(r => { cibles[r.getAttribute("Id")] = r.getAttribute("Target"); });
    const feuilles = {};
    balises(wb, "sheet").forEach(s => {
      const t = cibles[s.getAttributeNS(NS_R, "id") || s.getAttribute("r:id")];
      if (t) feuilles[s.getAttribute("name")] = t.startsWith("/") ? t.slice(1) : "xl/" + t;
    });
    const partages = [], ss = await xml("xl/sharedStrings.xml");
    if (ss) balises(ss, "si").forEach(si => partages.push(balises(si, "t").filter(t => t.parentNode.localName !== "rPh").map(t => t.textContent).join("")));
    async function lignes(nom) {
      const d = feuilles[nom] ? await xml(feuilles[nom]) : null;
      if (!d) return [];
      const out = [];
      balises(d, "c").forEach(c => {
        const m = /^([A-Z]+)(\d+)$/.exec(c.getAttribute("r") || "");
        if (!m) return;
        const t = c.getAttribute("t"), v = balises(c, "v")[0];
        let val = "";
        if (t === "s") val = v ? partages[+v.textContent] ?? "" : "";
        else if (t === "inlineStr") val = balises(c, "t").map(x => x.textContent).join("");
        else if (t === "b") val = v ? v.textContent === "1" : "";
        else if (t === "d") val = v ? v.textContent.slice(0, 10) : "";   // date ISO (rare : LibreOffice, saisie stricte)
        else if (t !== "e" && v) val = t === "str" || isNaN(+v.textContent) ? v.textContent : +v.textContent;
        (out[+m[2] - 1] = out[+m[2] - 1] || [])[numero(m[1]) - 1] = val;
      });
      return out;
    }
    return { noms: Object.keys(feuilles), lignes };
  }

  return Object.freeze({ TYPE, STYLE, classeur, lire, lettre, date, isoDe, zip });
})();

  /* ===================================================== modèle */

  const TEXTES = { T: ["nom", "finalite", "interet", "justifSensibles", "destinataires", "pays", "garantie", "conservation", "mesures", "responsable", "commentaire"],
    V: ["titre", "description", "personnesNb", "cnilRef", "retard", "motifNonInfo", "mesures"], D: ["demandeur", "motifProlongation", "reponse"], ST: ["nom", "presta", "service", "pays", "garantie", "delaiH", "commentaire"] };

  function normObj(t, x) {

    LISTES[t].forEach(k => { o[k] = chaines(x[k]); });

  const NORM_RECUS = {

  const vide = () => ({ site: { nom: "" }, organisme: { responsable: "", dpo: "", referent: "", contact: "" }, traitements: [], violations: [], demandes: [], sousTraitants: [],
    archives: { traitements: [] }, refs: { personnes: PERSONNES_DEF.slice(), donnees: DONNEES_DEF.slice() }, listesGroupe: {}, recus: {}, largeurs: {} });
  function normaliser(d) {

    const lg = d.listesGroupe && typeof d.listesGroupe === "object" ? d.listesGroupe : {};

  function alertes() {

  VUES.tdb = () => {
    const act = S.traitements.filter(t => t.statut !== "arrete"), al = alertes(), dO = S.demandes.filter(ouverteD);

      <div class="kpis">${kpi(act.length, "Traitements en service ou en projet", false, "traitements")}${kpi(act.filter(t => pointsT(t).length).length, "Traitements à compléter", act.some(t => pointsT(t).length), "traitements")}
        ${kpi(act.filter(aipdAFaire).length, "AIPD à faire", act.some(aipdAFaire), "traitements")}
        ${kpi(vNot.length, "Violations à notifier (72 h)", vNot.length > 0, "violations")}${kpi(`${dO.length}${dRet.length ? ` (${dRet.length} en retard)` : ""}`, "Demandes en cours", dRet.length > 0, "demandes")}
        ${kpi(S.sousTraitants.filter(s => s.contrat !== "signe").length, "Sous-traitants sans clause signée", S.sousTraitants.some(s => s.contrat !== "signe"), "soustraitants")}</div>
      ${vNot.length ? `<div class="card" data-urgent><h2>⏱ Violations à notifier à la CNIL</h2><table class="t"><tbody>${vNot.map(v => `<tr><td class="mono"><a href="#" data-nav="V:${esc(v.id)}">${esc(v.id)}</a></td><td>${esc(v.titre)}</td><td>découverte le ${esc(frDateH(v.decouverteLe))}</td><td>${badgeV(v)}</td></tr>`).join("")}</tbody></table></div>` : ""}
      <div class="card"><h2>Points d'attention (${al.length})</h2>${al.length ? `<ul>${al.slice(0, 50).map(([m, nav]) => `<li><a href="#" data-nav="${esc(nav)}">${esc(m)}</a></li>`).join("")}</ul>${al.length > 50 ? `<p class="small muted">… et ${al.length - 50} autre(s).</p>` : ""}` : `<p class="muted">Rien à signaler.</p>`}</div>`;
  };

  /* ---------------- registre des traitements */
  const filtresT = l => { const q = norm(ui.q); return l.filter(t => (!ui.fb || t.base === ui.fb) && (!ui.fs || t.statut === ui.fs) && (!q || norm([t.id, t.nom, t.finalite, t.responsable, ...t.personnes, ...t.donnees].join(" ")).includes(q))); };
  const lignesT = () => filtresT([...S.traitements, ...(ui.arch ? S.archives.traitements : [])]).sort((a, b) => a.id.localeCompare(b.id, "fr", { numeric: true }));
  const cochees = () => { const s = ui.coche.traitements || new Set(); return lignesT().filter(r => s.has(r)); };
  const COLS_REMPL = [["nom", "Traitement"], ["finalite", "Finalité"], ["destinataires", "Destinataires"], ["conservation", "Durée de conservation"], ["mesures", "Mesures de sécurité"], ["responsable", "Responsable opérationnel"]];
  const aipdCell = t => aipdRequise(t) ? (t.aipd === "faite" ? badge("AIPD faite", "b-ok") : t.aipd === "nonrequise" ? badge("non requise", "b-muted") : badge("AIPD à faire", "b-ko")) : `<span class="muted small">non requise</span>`;
  VUES.traitements = () => {
    if (ui.sel && ui.sel.t === "T") { const t = obj("T", ui.sel.id); if (t) return ficheT(t); ui.sel = null; }
    const l = lignesT(), sel = cochees(), nArch = S.archives.traitements.length, larg = Object.keys(S.largeurs.traitements || {}).length;
    return `<h1>Registre des traitements</h1><p class="sub">Une fiche par traitement (une finalité principale) : c'est la pièce que la CNIL demande en premier (article 30).</p>

      <div class="row noprint" style="margin:10px 0"><button class="primary" data-act="ajout" data-t="T">➕ Traitement</button><span class="spacer"></span>
        <input id="filtreT" type="search" placeholder="Rechercher" value="${esc(ui.q)}" style="max-width:200px">
        <select id="filtreBase">${opt(BASES, ui.fb, "Toutes les bases légales")}</select><select id="filtreStatut">${opt(STATUTS_T.map(s => [s[0], s[1]]), ui.fs, "Tous les états")}</select></div>
      <div class="row noprint outils-t"><button class="small" data-act="remplacer" title="Remplacer un texte dans une colonne, avec aperçu avant d'appliquer">🔁 Chercher / remplacer</button>
        ${nArch ? `<label class="chk-in"><input type="checkbox" id="voirArch"${ui.arch ? " checked" : ""}> Afficher les archivés (${nArch})</label>` : ""}
        ${larg ? `<button class="small" data-act="largeursDefaut">↔ Largeurs par défaut</button>` : ""}<span class="small muted">Glisser le bord d'un en-tête pour régler la largeur d'une colonne.</span></div>
      ${WerbSocle.tables.barre(sel.length, { archivees: sel.filter(r => r.archive).length, lectureSeule: WerbSocle.verrou.lectureSeule })}
      <div class="card"><div class="tablewrap"><table class="t" data-table="traitements"><thead><tr><th class="c sel"><input type="checkbox" data-cochetout="traitements"${l.length && l.every(r => (ui.coche.traitements || new Set()).has(r)) ? " checked" : ""} aria-label="Tout sélectionner"></th>

        <tbody>${l.map((t, n) => { const p = pointsT(t); return `<tr data-trt="${esc(t.id)}"${t.archive ? ` class="archivee" title="Archivé le ${esc(frDate(t.archive.le))} par ${esc(t.archive.par)}"` : ""}>
          <td class="c sel"><input type="checkbox" data-coche="traitements" data-i="${n}"${(ui.coche.traitements || new Set()).has(t) ? " checked" : ""} aria-label="Sélectionner la ligne"></td>

          <td>${esc(lib(BASES, t.base)) || `<span class="muted">—</span>`}</td><td class="small">${esc(t.personnes.join(", "))}</td><td class="small">${esc(t.conservation)}</td><td>${aipdCell(t)}</td>
          <td class="small mono">${esc([...t.sis, ...t.actifs].join(", ")) || `<span class="muted">—</span>`}</td><td>${badgeDe(STATUTS_T, t.statut)}${p.length ? " " + badge(`${p.length} point(s)`, "b-warn") : ""}</td></tr>`; }).join("") || `<tr><td colspan="9" class="empty">Aucun traitement.</td></tr>`}</tbody></table></div></div>`;
  };
  // Éléments de fiche
  const cases = (k, vals, sel, dis) => vals.map(v => { const [val, l] = Array.isArray(v) ? v : [v, v]; return `<label class="chk-in"><input type="checkbox" data-m="${k}" value="${esc(val)}"${sel.includes(val) ? " checked" : ""}${dis}> ${esc(l)}</label>`; }).join("");
  const champ = (o, k, l, type = "text", dis = "") => `<div><label class="f">${esc(l)}</label><input data-f="${k}" type="${type}" value="${esc(o[k])}"${dis}></div>`;
  const zoneLg = (o, k, l, dis = "") => `<div class="lg"><label class="f">${esc(l)}</label><textarea data-f="${k}" rows="2"${dis}>${esc(o[k])}</textarea></div>`;
  const choix = (o, k, l, vals, dis = "", vide) => `<div><label class="f">${esc(l)}</label><select data-f="${k}"${dis}>${opt(vals, o[k], vide)}</select></div>`;
  const bool = (o, k, l, dis = "") => `<label class="chk-in"><input type="checkbox" data-b="${k}"${o[k] ? " checked" : ""}${dis}> ${esc(l)}</label>`;
  const enTete = (titre, pts, actions = "") => `<div class="row noprint" style="margin-bottom:8px"><button data-act="fermerFiche">← ${esc(titre)}</button><span class="spacer"></span>${actions}</div>${pts.length ? `<div class="warnbox">${pts.map(esc).join(" · ")}</div>` : ""}`;
  function ficheT(t) {
    const ro = !!t.archive || WerbSocle.verrou.lectureSeule, dis = ro ? " disabled" : "", nc = criteresDe(t).size;

      <div class="card"><h2>Finalité et base légale</h2><div class="fiche">${champ(t, "nom", "Nom du traitement", "text", dis)}${choix(t, "statut", "État", STATUTS_T.map(s => [s[0], s[1]]), dis)}${champ(t, "responsable", "Responsable opérationnel (fonction)", "text", dis)}

        ${t.base === "interet" ? zoneLg(t, "interet", "Intérêt légitime poursuivi et mise en balance avec les droits des personnes", dis) : ""}</div></div>
      <div class="card"><h2>Personnes et données</h2><label class="f">Catégories de personnes</label><div class="chk-grille">${cases("personnes", S.refs.personnes, t.personnes, dis)}</div>
        <label class="f">Catégories de données</label><div class="chk-grille">${cases("donnees", S.refs.donnees, t.donnees, dis)}</div>
        <label class="f">Données sensibles (article 9) ou d'infraction (article 10)</label><div class="chk-grille">${cases("sensibles", SENSIBLES, t.sensibles, dis)}</div>
        ${t.sensibles.length ? `<div class="fiche">${zoneLg(t, "justifSensibles", "Exception de l'article 9 qui permet le traitement (ex. obligations en droit du travail, médecine du travail)", dis)}</div>` : ""}</div>
      <div class="card"><h2>Destinataires, sous-traitants, transferts</h2><div class="fiche">${zoneLg(t, "destinataires", "Destinataires internes et externes", dis)}</div>
        <label class="f">Sous-traitants</label><div class="chk-grille">${S.sousTraitants.map(s => `<label class="chk-in"><input type="checkbox" data-m="sousTraitants" value="${esc(s.id)}"${t.sousTraitants.includes(s.id) ? " checked" : ""}${dis}> ${esc(s.nom)} ${badgeDe(CONTRATS, s.contrat)}</label>`).join("") || `<span class="muted small">Aucun sous-traitant : ajoutez-les dans <a href="#" data-nav="soustraitants">Sous-traitants</a>.</span>`}</div>
        <div class="row" style="margin-top:8px">${bool(t, "horsUE", "Transfert ou accès depuis un pays hors de l'Union", dis)}</div>
        ${t.horsUE ? `<div class="fiche">${champ(t, "pays", "Pays", "text", dis)}${champ(t, "garantie", "Garantie (adéquation, clauses contractuelles types, BCR)", "text", dis)}</div>` : ""}</div>
      <div class="card"><h2>Conservation et sécurité</h2><div class="fiche">${zoneLg(t, "conservation", "Durée de conservation (base active, archivage, suppression)", dis)}${zoneLg(t, "mesures", "Mesures de sécurité (article 32)", dis)}</div></div>
      <div class="card" data-localisation><h2>Où sont les données (WerbMap)</h2>
        ${recu("si") || recu("actifs") ? `<p class="small muted">SI et actifs publiés par WerbMap, reçus le ${esc(frDate((recu("si") || recu("actifs")).majLe))}.</p>
          <label class="f">Systèmes d'information</label><div class="chk-grille">${cases("sis", items("si").map(x => [x.id, `${x.id} — ${x.nom}`]), t.sis, dis) || `<span class="muted small">Aucun SI publié.</span>`}</div>
          <label class="f">Actifs</label><input id="filtreActifs" type="search" placeholder="Filtrer les actifs (TAG, libellé, type, zone)" value="${esc(ui.fa)}" style="max-width:340px;margin-bottom:6px">
          <div class="chk-grille">${cases("actifs", acts.map(x => [x.id, `${x.id} — ${x.libelle || x.type}`]), t.actifs, dis) || `<span class="muted small">Aucun actif ${recu("actifs") ? "ne correspond" : "publié"}.</span>`}</div>`
        : `<p class="small muted">Ouvrez l'espace et rattachez la base au site : les SI et actifs publiés par WerbMap pourront être liés au traitement.${[...t.sis, ...t.actifs].length ? ` Liens enregistrés : <span class="mono">${esc([...t.sis, ...t.actifs].join(", "))}</span>.` : ""}</p>`}</div>
      <div class="card" data-aipd><h2>Analyse d'impact (AIPD)</h2><p class="small muted">Critères du CEPD : deux critères réunis imposent en principe une AIPD (les données sensibles comptent pour un critère). ${nc} critère(s)${aipdRequise(t) ? ` : <b>AIPD requise</b>` : " : AIPD non requise d'après les critères"}.</p>
        <div class="chk-grille">${cases("criteres", CRITERES, t.criteres, dis)}</div>
        <div class="fiche">${choix(t, "aipd", "État de l'AIPD", AIPD, dis)}${champ(t, "aipdLe", "Date de l'AIPD", "date", dis)}</div></div>
      <div class="card"><h2>Commentaire</h2><textarea data-f="commentaire" rows="2"${dis}>${esc(t.commentaire)}</textarea></div>`;
  }

  /* ---------------- violations */
  VUES.violations = () => {
    if (ui.sel && ui.sel.t === "V") { const v = obj("V", ui.sel.id); if (v) return ficheV(v); ui.sel = null; }
    const l = S.violations.slice().sort((a, b) => (b.decouverteLe || "").localeCompare(a.decouverteLe || ""));
    return `<h1>Violations de données</h1><p class="sub">Toute violation est inscrite ici, même non notifiée (article 33.5). Notification à la CNIL dans les 72 h suivant la découverte s'il existe un risque pour les personnes ; information des personnes si le risque est élevé.</p>
      <div class="row noprint" style="margin:10px 0"><button class="primary" data-act="ajout" data-t="V">➕ Violation</button></div>
      <div class="card"><div class="tablewrap"><table class="t"><thead><tr><th>ID</th><th>Violation</th><th>Découverte</th><th>Nature</th><th>Risque</th><th>État</th></tr></thead><tbody>
      ${l.map(v => `<tr data-vio="${esc(v.id)}"><td class="mono"><a href="#" data-nav="V:${esc(v.id)}">${esc(v.id)}</a></td><td><b>${esc(v.titre)}</b>${v.nis2 ? " " + badge("incident NIS2", "b-info") : ""}</td><td class="small">${esc(frDateH(v.decouverteLe))}</td>
        <td class="small">${esc(v.natures.map(n => lib(NATURES, n).split(" (")[0]).join(", "))}</td><td>${esc(lib(RISQUES, v.risque))}</td><td>${badgeV(v)}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">Aucune violation enregistrée.</td></tr>`}</tbody></table></div></div>`;

      <h1>${esc(v.id)} — ${esc(v.titre || "Sans titre")} ${badgeV(v)}</h1><p class="sub" data-echeance>${e ? `Échéance de notification à la CNIL : <b>${esc(frDateH(e))}</b> (72 h après la découverte)` : "Saisissez la date et l'heure de découverte : le délai de 72 h en part."}</p>
      <div class="card"><h2>Faits</h2><div class="fiche">${champ(v, "titre", "Titre", "text", dis)}${champ(v, "decouverteLe", "Découverte le (date et heure)", "datetime-local", dis)}${champ(v, "personnesNb", "Personnes concernées (nombre ou estimation)", "text", dis)}
        ${zoneLg(v, "description", "Description (circonstances, données touchées, cause)", dis)}</div>
        <label class="f">Nature de l'atteinte</label><div class="chk-grille">${cases("natures", NATURES, v.natures, dis)}</div>
        <label class="f">Traitements concernés</label><div class="chk-grille">${cases("traitements", S.traitements.map(t => [t.id, `${t.id} ${t.nom}`]), v.traitements, dis) || `<span class="muted small">Aucun traitement au registre.</span>`}</div>
        <div class="row" style="margin-top:8px">${bool(v, "nis2", "C'est aussi un incident NIS2 (signalement à l'ANSSI : 24 h, 72 h, un mois)", dis)}</div></div>
      <div class="card" data-notification><h2>Risque et notification</h2><div class="fiche">${choix(v, "risque", "Risque pour les droits et libertés des personnes", RISQUES, dis)}</div>
        ${v.risque && v.risque !== "aucun" ? `<div class="row" style="margin-top:8px">${bool(v, "cnil", "Notifiée à la CNIL", dis)}</div>
          ${v.cnil ? `<div class="fiche">${champ(v, "cnilLe", "Notifiée le (date et heure)", "datetime-local", dis)}${champ(v, "cnilRef", "Référence de la notification", "text", dis)}${horsDelai(v) ? zoneLg(v, "retard", "Motif du retard (au-delà de 72 h)", dis) : ""}</div>` : ""}`

        ${v.risque === "eleve" ? `<div class="row" style="margin-top:8px">${bool(v, "informees", "Personnes informées", dis)}</div><div class="fiche">${v.informees ? champ(v, "informeesLe", "Informées le", "date", dis) : zoneLg(v, "motifNonInfo", "Si les personnes ne sont pas informées : exception (données chiffrées, mesures qui suppriment le risque, communication publique)", dis)}</div>` : ""}</div>
      <div class="card"><h2>Mesures et clôture</h2><div class="fiche">${zoneLg(v, "mesures", "Mesures prises (confinement, correction, prévention)", dis)}</div>

  /* ---------------- demandes d'exercice des droits */
  VUES.demandes = () => {
    if (ui.sel && ui.sel.t === "D") { const d = obj("D", ui.sel.id); if (d) return ficheD(d); ui.sel = null; }
    const l = S.demandes.slice().sort((a, b) => (b.recueLe || "").localeCompare(a.recueLe || ""));
    return `<h1>Demandes d'exercice des droits</h1><p class="sub">Accès, rectification, effacement, limitation, portabilité, opposition. Réponse sous un mois, prolongeable de deux mois si la demande est complexe (à motiver dans le premier mois).</p>
      <div class="row noprint" style="margin:10px 0"><button class="primary" data-act="ajout" data-t="D">➕ Demande</button></div>
      <div class="card"><div class="tablewrap"><table class="t"><thead><tr><th>ID</th><th>Droit</th><th>Demandeur</th><th>Reçue le</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>
      ${l.map(d => `<tr data-drt="${esc(d.id)}"><td class="mono"><a href="#" data-nav="D:${esc(d.id)}">${esc(d.id)}</a></td><td>${esc(lib(DROITS, d.droit))}</td><td>${esc(d.demandeur)}</td>
        <td>${esc(frDate(d.recueLe))}</td><td>${esc(frDate(echeanceD(d)))}${d.prolongee ? " " + badge("prolongée", "b-info") : ""}${retardD(d) ? " " + badge("en retard", "b-ko") : ""}</td><td>${badgeDe(STATUTS_D, d.statut)}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">Aucune demande enregistrée.</td></tr>`}</tbody></table></div></div>`;
  };
  function ficheD(d) {
    const ro = WerbSocle.verrou.lectureSeule, dis = ro ? " disabled" : "";

        [v => v.traitements.map(nomT), "Traitements", 30], ["personnesNb", "Personnes", 12], [v => lib(RISQUES, v.risque), "Risque", 20], ["cnil", "Notifiée CNIL", 10], [v => frDateH(v.cnilLe), "Notifiée le", 16], ["cnilRef", "Référence", 14],
        ["retard", "Motif du retard", 24], ["informees", "Personnes informées", 10], ["motifNonInfo", "Exception à l'information", 24], ["nis2", "Incident NIS2", 10], ["mesures", "Mesures", 34], [v => etatV(v)[1], "État", 22]], S.violations),
      feuilleXl("Demandes", [["id", "ID", 9], ["recueLe", "Reçue le", 12], [d => lib(DROITS, d.droit), "Droit", 14], ["demandeur", "Demandeur", 24], [d => d.traitements.map(nomT), "Traitements", 30], ["identite", "Identité vérifiée", 10],
        ["prolongee", "Prolongée", 10], ["motifProlongation", "Motif", 24], [d => echeanceD(d), "Échéance", 12], [d => lib(STATUTS_D, d.statut), "Statut", 14], ["reponduLe", "Répondu le", 12], ["reponse", "Réponse", 40]], S.demandes),
      feuilleXl("Sous-traitants", [["id", "ID", 9], ["nom", "Sous-traitant", 28], ["service", "Service", 28], ["presta", "WerbPresta", 10], [s => lib(CONTRATS, s.contrat), "Clause article 28", 22], ["contratLe", "Signée le", 12],
        ["horsUE", "Hors UE", 8], ["pays", "Pays", 14], ["garantie", "Garantie", 24], ["delaiH", "Délai de notification (h)", 12], [s => S.traitements.filter(t => t.sousTraitants.includes(s.id)).map(t => t.id), "Traitements", 22]], S.sousTraitants),
      feuilleXl("Archivés", [["id", "ID", 9], ["nom", "Traitement", 32], [t => t.archive.le.slice(0, 10), "Archivé le", 14], [t => t.archive.par, "Par", 20]], S.archives.traitements),
    ];
    const og = S.organisme;
    const tete = { nom: "Informations", largeurs: [32, 70], lignes: [[T1("Rubrique"), T1("Valeur")], ["Site", LIAISON.site || ""], ["Responsable de traitement", og.responsable], ["DPO", og.dpo], ["Référent du site", og.referent],
      ["Contact pour les droits", og.contact], ["Base", fichier.nom || "(non enregistrée)"], ["Produit", WERB.ligne], ["Date de l'export", WerbXlsx.date(jour)], ["Exporté par", user],
      ["Classification", "Diffusion restreinte (conformité RGPD du site)"], [], [T1("Feuille"), T1("Lignes")], ...feuilles.map(f => [f.nom, String(f.lignes.length - 1)])] };
    try {
      const blob = await WerbXlsx.classeur([tete, ...feuilles], { titre: `${WERB.produit} – ${nom}`, signature: WERB.ligne });
      WerbSocle.telecharger(blob, `${String(nom).replace(/[^\w-]+/g, "_")}_${WERB.produit}_${jour}.xlsx`, WerbXlsx.TYPE);
      journaliser("Export", "Base", nom, "", "", "Excel (toute la base)"); marquer();
    } catch (e) { toast("Export Excel impossible : " + e.message, "err"); }
  }

  /* ===================================================== actions */
  const ouvrirFiche = (t, id) => { ui.sel = { t, id }; vue = VUE_DE[t]; ui.fa = ""; render(); $("#main").scrollTop = 0; };
  const courant = () => ui.sel ? obj(ui.sel.t, ui.sel.id) : null;
  function selAppliquer(action) {
    const sel = cochees(), maintenant = new Date().toISOString();
    let n = 0;
    sel.forEach(t => {
      if (action === "archiver" && !t.archive) { S.traitements.splice(S.traitements.indexOf(t), 1); t.archive = { le: maintenant, par: user }; S.archives.traitements.push(t); journaliser("Archivage", "Traitement", t.id, "", "", t.nom); n++; }
      if (action === "desarchiver" && t.archive) { S.archives.traitements.splice(S.archives.traitements.indexOf(t), 1); delete t.archive; S.traitements.push(t); journaliser("Désarchivage", "Traitement", t.id); n++; }
      if (action === "supprimer") { const l = t.archive ? S.archives.traitements : S.traitements; l.splice(l.indexOf(t), 1); journaliser("Suppression", "Traitement", t.id, "", t.nom, ""); n++; }
    });
    ui.coche.traitements = new Set(); marquer(); render();
    if (n) toast(`${n} traitement(s) ${{ archiver: "archivé(s) : hors registre et alertes", desarchiver: "désarchivé(s)", supprimer: "supprimé(s)" }[action]}.`, "ok");
  }
  const OBJETS = { T: "Traitement", V: "Violation", D: "Demande", ST: "Sous-traitant" };
  const ACTIONS = {
    entrer() { const v = $("#nomUtil").value.trim(); if (!v) { toast("Saisissez votre nom.", "err"); return; } user = v; WerbSocle.verrou.identifier(v); render(); },
    nouveau() { S = vide(); LIAISON = {}; ENV = { creeLe: "", journal: [] }; fichier = { poignee: null, nom: "", modifie: null }; journaliser("Création", "Base"); vue = "werbsmsi"; dirty = true; render(); },
    async exemple() {
      if (dirty && !(await confirmer("Des modifications ne sont pas enregistrées. Ouvrir la base d'exemple quand même ?", "Ouvrir"))) return;
      if (!window.WERB_EXEMPLE) { toast("Aucune base d'exemple dans cette version.", "err"); return; }
      try { charger(window.WERB_EXEMPLE.texte, {}); toast("Base d'exemple ouverte : « Enregistrer » demandera où la ranger.", "ok"); }
      catch (e) { toast("Base d'exemple illisible : " + e.message, "err"); }
    },
    async ouvrirLienPortail() {
      const d = WerbSocle.lien.lire(); if (!d) return;
      if (dirty && !(await confirmer("Des modifications ne sont pas enregistrées. Ouvrir la base demandée quand même ?", "Ouvrir"))) return;
      try { const f = await WerbSocle.lien.ouvrir(d); charger(f.texte, f); WerbSocle.lien.effacer(); toast(`Base ${f.nom} ouverte depuis l'espace.`, "ok"); await apresEspace(); }
      catch (e) { if (e.name !== "AbortError") toast(e.message, "err"); }
      render();
    },
    ouvrir, enregistrer: () => enregistrer(false), enregistrerSous: () => enregistrer(true), fermer, exportExcel: exportBase,
    ajout(el) {
      const t = el.dataset.t, o = normObj(t, { id: prochainId(t) });
      if (t === "T") Object.assign(o, { nom: "Nouveau traitement", majLe: auj() });
      if (t === "V") Object.assign(o, { titre: "Nouvelle violation", decouverteLe: maintenantLocal() });
      if (t === "D") o.recueLe = auj();
      if (t === "ST") o.nom = "Nouveau sous-traitant";
      COLL[t]().push(o); journaliser("Ajout", OBJETS[t], o.id); marquer(); ouvrirFiche(t, o.id);
    },
    fermerFiche() { ui.sel = null; render(); },
    async archiver(el) {
      const t = obj("T", el.dataset.id); if (!t || t.archive) return;
      if (!(await confirmer(`Archiver <b>${esc(t.id)} ${esc(t.nom)}</b> ? Il sort du registre et des alertes ; son identifiant n'est jamais réattribué. Préférez l'état « Arrêté » pour un traitement qui a existé récemment.`, "Archiver"))) return;
      S.traitements.splice(S.traitements.indexOf(t), 1); t.archive = { le: new Date().toISOString(), par: user }; S.archives.traitements.push(t);
      journaliser("Archivage", "Traitement", t.id, "", "", t.nom); ui.sel = null; marquer(); render();
    },
    async supprST(el) {
      const s = obj("ST", el.dataset.id); if (!s) return;
      if (!(await confirmer(`Supprimer le sous-traitant <b>${esc(s.nom)}</b> ? Il est retiré des traitements qui le citent.`, "Supprimer"))) return;
      S.sousTraitants = S.sousTraitants.filter(x => x !== s); tous("T").forEach(t => { t.sousTraitants = t.sousTraitants.filter(x => x !== s.id); });
      journaliser("Suppression", "Sous-traitant", s.id, "", s.nom, ""); ui.sel = null; marquer(); render();
    },
    reprendrePresta(el) {
      const p = items("prestataires").find(x => x.id === el.dataset.id); if (!p) return;
      const o = normObj("ST", { id: prochainId("ST"), nom: p.nom, presta: p.id, service: p.type, contrat: "absent" });
      S.sousTraitants.push(o); journaliser("Ajout", "Sous-traitant", o.id, "WerbPresta", "", `${p.id} ${p.nom}`); marquer(); ouvrirFiche("ST", o.id);
      toast(`${p.nom} repris comme sous-traitant : vérifiez la clause de l'article 28.`, "ok");
    },
    ajoutRef(el) {
      const id = el.dataset.ref, v = $("#" + el.dataset.champ).value.trim(); if (!v) return;
      if (S.refs[id].some(x => LCLE(x) === LCLE(v))) { toast("Cette valeur existe déjà.", "err"); return; }
      S.refs[id].push(v); journaliser("Ajout", "Référentiel", id, "", "", v); marquer(); render();
    },
    supprRef(el) {
      const id = el.dataset.ref, i = +el.dataset.i, v = S.refs[id][i];
      if (duGroupe(id, v) || emplois(id, v)) return;
      S.refs[id].splice(i, 1); journaliser("Suppression", "Référentiel", id, "", v, ""); marquer(); render();
    },
    selArchiver() { selAppliquer("archiver"); },
    selDesarchiver() { selAppliquer("desarchiver"); },
    async selSupprimer() { const n = cochees().length; if (n && await confirmer(`Supprimer définitivement ${n} traitement(s) du registre ?`, "Supprimer")) selAppliquer("supprimer"); },
    selVider() { ui.coche.traitements = new Set(); render(); },
    remplacer() {
      WerbSocle.tables.remplacer({ titre: "Chercher / remplacer · Registre des traitements", colonnes: COLS_REMPL.map(([id, libelle]) => ({ id, libelle })), lignes: lignesT().filter(r => !r.archive),
        lire: (r, f) => r[f], nomLigne: r => `${r.id} ${r.nom}`,
        surAppliquer: l => { l.forEach(ch => { ch.ligne[ch.col] = ch.apres; journaliser("Modification", "Traitement", ch.ligne.id, ch.col, ch.avant, ch.apres); }); marquer(); render(); toast(`${l.length} cellule(s) remplacée(s).`, "ok"); } });
    },
    largeursDefaut() { delete S.largeurs.traitements; journaliser("Modification", "Présentation", "Registre des traitements", "Largeurs", "", "automatiques"); marquer(); render(); },
    async recevoir() { const ch = await recevoir(); render(); toast(ch ? "Données reçues mises à jour : enregistrez la base." : SMSI.err ? "Lecture impossible : " + SMSI.err : "Données reçues déjà à jour.", ch ? "ok" : SMSI.err ? "err" : ""); },
    async smsiOpen() { SMSI.err = ""; try { await E.choisir(); toast(`Espace « ${E.groupe.organisation} » ouvert.`, "ok"); await apresEspace(); } catch (e) { if (e.name !== "AbortError") SMSI.err = e.message; } render(); },
    async smsiLink() {
      const v = $("#smsiCible").value; if (!v) { toast("Choisissez un site.", "err"); return; }
      const avant = LIAISON.site || "";
      LIAISON = { site: v, groupeId: E.groupe.groupeId }; if (!S.site.nom) S.site.nom = ((E.groupe.sites || []).find(s => s.code === v) || {}).nom || "";
      if (!S.organisme.responsable) S.organisme.responsable = E.groupe.organisation || "";
      journaliser("Rattachement", "WerbSMSI", E.groupe.organisation, "Site", avant, v); marquer(); await apresEspace();
    },
    async smsiUnlink() { if (!(await confirmer("Détacher la base de son site ?", "Détacher"))) return; journaliser("Détachement", "WerbSMSI", "", "Site", LIAISON.site, ""); LIAISON = {}; marquer(); render(); },
  };

  // Modification d'un champ : les textes ne redessinent pas la page (le clic suivant n'est pas perdu)
  function appliquer(el) {
    const d = el.dataset;
    if (d.org) { const k = d.org, av = S.organisme[k], v = el.value.trim(); if (av === v) return; S.organisme[k] = v; journaliser("Modification", "Organisme", "", k, av, v); marquer(); return; }
    if (d.ref) {
      const id = d.ref, i = +d.i, v = S.refs[id][i], nv = el.value.trim();
      if (!nv || duGroupe(id, v) || v === nv) { render(); return; }
      if (S.refs[id].some((x, j) => j !== i && LCLE(x) === LCLE(nv))) { toast("Cette valeur existe déjà.", "err"); render(); return; }
      tous("T").forEach(t => { t[id] = t[id].map(x => x === v ? nv : x); });
      S.refs[id][i] = nv; journaliser("Modification", "Référentiel", id, "", v, nv); marquer(); render(); return;
    }
    const o = courant(); if (!o || o.archive || WerbSocle.verrou.lectureSeule) return;
    const t = ui.sel.t, nom = OBJETS[t];
    if (d.m !== undefined) {
      const k = d.m, c = el.value; o[k] = el.checked ? [...new Set([...o[k], c])] : o[k].filter(x => x !== c);
      if (t === "T") o.majLe = auj();
      journaliser("Modification", nom, o.id, k, el.checked ? "" : c, el.checked ? c : ""); marquer(); render(); return;
    }
    if (d.b !== undefined) {
      const k = d.b, av = o[k]; o[k] = el.checked;
      if (t === "V" && k === "cnil" && el.checked && !o.cnilLe) o.cnilLe = maintenantLocal();
      if (t === "V" && k === "close" && el.checked && !o.closeLe) o.closeLe = auj();
      if (t === "V" && k === "informees" && el.checked && !o.informeesLe) o.informeesLe = auj();
      if (t === "T") o.majLe = auj();
      journaliser("Modification", nom, o.id, k, av ? "oui" : "non", el.checked ? "oui" : "non"); marquer(); render(); return;
    }
    if (d.f !== undefined) {
      const k = d.f, av = o[k], v = el.value.trim();
      if (av === v) return;
      if (k === "nom" && !v) { toast("Le nom est obligatoire.", "err"); render(); return; }
      o[k] = v;
      if (t === "D" && k === "statut" && ["repondue", "refusee"].includes(v) && !o.reponduLe) o.reponduLe = auj();
      if (t === "T") o.majLe = auj();
      journaliser("Modification", nom, o.id, k, av, v); marquer();
      if (el.tagName === "SELECT" || ["date", "datetime-local", "number"].includes(el.type)) render();
    }
  }

  document.addEventListener("click", e => {
    const nav = e.target.closest("[data-nav]");
    if (nav && !nav.closest("#sidebar")) {
      e.preventDefault();
      const n = nav.dataset.nav, m = n.match(/^(T|V|D|ST):(.+)$/);
      if (m) { ouvrirFiche(m[1], m[2]); return; }
      vue = n; ui.sel = null; render(); $("#main").scrollTop = 0; return;
    }
    if (e.target.closest("td.sel, th.sel")) return;
    const a = e.target.closest("[data-act]");
    if (a && ACTIONS[a.dataset.act] && !a.disabled) { e.preventDefault(); ACTIONS[a.dataset.act](a, e); }
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (!S) return;
    if (el.dataset.coche) { const s = ui.coche.traitements = ui.coche.traitements || new Set(), r = lignesT()[+el.dataset.i]; if (r) s[el.checked ? "add" : "delete"](r); render(); return; }
    if (el.dataset.cochetout) { ui.coche.traitements = new Set(el.checked ? lignesT() : []); render(); return; }
    if (el.id === "voirArch") { ui.arch = el.checked; ui.coche = {}; render(); return; }
    if (["filtreBase", "filtreStatut"].includes(el.id)) { ui[el.id === "filtreBase" ? "fb" : "fs"] = el.value; ui.coche = {}; render(); return; }
    if (["smsiCible", "filtreJournal", "filtreT", "filtreActifs", "nvPers", "nvDon"].includes(el.id)) return;
    appliquer(el);
  });
  document.addEventListener("input", e => {
    const id = e.target.id;
    if (!["filtreJournal", "filtreT", "filtreActifs"].includes(id)) return;
    ui[{ filtreJournal: "jq", filtreT: "q", filtreActifs: "fa" }[id]] = e.target.value;
    const pos = e.target.selectionStart; render(); const f = $("#" + id); if (f) { f.focus(); f.setSelectionRange(pos, pos); }
  });
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); const a = document.activeElement; if (S && a && a.closest && a.closest("#main") && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName) && !a.id) appliquer(a); enregistrer(false); }
    if (e.key === "Enter" && e.target.id === "nomUtil") ACTIONS.entrer();
  });
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  render();
})();
</script>
</body>
</html>
