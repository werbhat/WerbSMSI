<style>/*! WerbCyberArcade – Développé par @WerbHat */
/* Variables communes (charte §7.5) : valeurs claires ici, valeurs sombres des variables communes fournies par le socle ;
   variables propres au module ci-dessous. L'écran de jeu (« borne d'arcade ») reste sombre dans les deux thèmes ; il s'imprime en clair. */
:root { --navy: #1f3864; --navy-2: #2e5090; --navy-fond: #1f3864; --ink: #1d2330; --muted: #5d6676; --line: #dfe3ea; --bg: #f3f5f9; --card: #fff;
  --ok: #2e7d32; --ok-bg: #e3f3e5; --warn: #9a6a00; --warn-bg: #fff4d6; --ko: #b3261e; --ko-bg: #fde7e5; --info-bg: #e8eef9; --th: #fafbfc; --champ: #fff;
  --bandeau-saisie: rgba(255,255,255,.12); --bandeau-saisie-b: rgba(255,255,255,.35);
  --opt-act: #efe9fd; --opt-act-b: #6f42c1;
  /* borne d'arcade : identique en clair et en sombre */
  --ar-fond: #0b1026; --ar-fond-2: #141a3a; --ar-texte: #e8ecff; --ar-doux: #9aa4d6; --ar-cyan: #33e1ff; --ar-rose: #ff3ea5; --ar-jaune: #ffd23f; --ar-vert: #3ddc84; --ar-rouge: #ff5d5d; --ar-orange: #ffa53d; }
@media screen {
  :root[data-theme=sombre] { --opt-act: #2b2350; --opt-act-b: #a585ff; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
#app { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
#topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--navy-fond); color: #fff; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand small { display: block; opacity: .85; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
/* Bandeau commun (charte §7.6) : 🖨 PDF, texte blanc sur le bandeau */
.tb-actions { display: flex; gap: 6px; }
.tb-actions button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--bandeau-saisie-b); background: transparent; color: #fff; cursor: pointer; }
.tb-actions button:hover { background: var(--bandeau-saisie); }
#sidebar { background: var(--card); border-right: 1px solid var(--line); overflow-y: auto; }   /* menu : WerbSocle.menu */
.sig { margin: 18px 8px 8px; font-size: 11px; color: var(--muted); }
#main { padding: 18px 22px 40px; overflow: auto; }
h1 { margin: 0 0 4px; font-size: 22px; color: var(--navy); }
h2 { font-size: 16px; color: var(--navy); margin: 0 0 8px; }
h3 { font-size: 14px; margin: 8px 0 6px; }
.sub { margin: 0 0 16px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.card ul, .card ol { margin: 6px 0; padding-left: 22px; }
.card li { margin: 4px 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.num { text-align: right; }
a { color: var(--navy-2); }
kbd { font: 11px Consolas, monospace; padding: 1px 5px; border: 1px solid currentColor; border-radius: 4px; opacity: .8; }
button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--card); color: var(--ink); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--navy-2); }
button:disabled { cursor: default; opacity: .55; }
table.t { width: 100%; border-collapse: collapse; }
table.t th, table.t td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t th.num, table.t td.num { text-align: right; }

/* ---------------------------------------------------------------- boutons du jeu */
.wca-btn { font-weight: 700; padding: 8px 16px; border-radius: 8px; border: 2px solid var(--ar-rose); background: var(--ar-rose); color: #fff; letter-spacing: .02em; }
.wca-btn:hover:not(:disabled) { filter: brightness(1.1); border-color: var(--ar-rose); }
.wca-btn.sec { background: transparent; color: var(--ar-cyan); border-color: var(--ar-cyan); }
.card .wca-btn.sec, .verdict .wca-btn.sec { color: var(--navy-2); border-color: var(--navy-2); }
.wca-btn.petit { padding: 4px 10px; font-size: 13px; }
.wca-btn kbd { margin-left: 6px; }

/* ---------------------------------------------------------------- borne d'arcade */
.wca-ecran { position: relative; background: radial-gradient(ellipse at top, var(--ar-fond-2), var(--ar-fond) 70%); color: var(--ar-texte);
  border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; border: 2px solid #2a3170; box-shadow: 0 0 0 4px #070a1a inset, 0 6px 24px rgba(10, 14, 40, .35); overflow: hidden; }
.wca-ecran::after { content: ""; position: absolute; inset: 0; pointer-events: none;   /* lignes de balayage d'écran cathodique */
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
.wca-titre { text-align: center; padding: 26px 22px 22px; }
.wca-logo { color: var(--ar-cyan); letter-spacing: .6em; font-size: 18px; opacity: .9; }
.wca-h1 { margin: 6px 0 4px; font: 800 44px/1.05 Consolas, "Courier New", monospace; letter-spacing: .04em; color: #fff;
  text-shadow: 0 0 8px var(--ar-cyan), 0 0 22px rgba(51, 225, 255, .45); }
.wca-h1 span { color: var(--ar-rose); text-shadow: 0 0 8px var(--ar-rose), 0 0 22px rgba(255, 62, 165, .5); }
.wca-slogan { margin: 6px 0 2px; font-size: 16px; color: var(--ar-texte); }
.wca-clignote { margin: 8px 0 4px; font: 700 13px Consolas, monospace; letter-spacing: .25em; color: var(--ar-jaune); animation: wca-clignote 1.2s steps(2, start) infinite; }
@keyframes wca-clignote { to { visibility: hidden; } }
.wca-reprendre { margin-top: 10px; position: relative; z-index: 1; }

/* accueil : réglages */
.wca-reglages h2 { margin-top: 6px; }
.wca-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.wca-opt { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 8px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); text-align: center; }
.wca-opt-i { font-size: 30px; line-height: 1.1; }
.wca-opt b { font-size: 15px; }
.wca-opt small { color: var(--muted); font-size: 12px; }
.wca-opt.act, .wca-mode.act, .wca-nb.act { border-color: var(--opt-act-b); background: var(--opt-act); box-shadow: 0 0 0 2px var(--opt-act-b) inset; }
.wca-modes, .wca-nbs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.wca-mode { padding: 8px 14px; border: 2px solid var(--line); border-radius: 10px; }
.wca-mode small { color: var(--muted); }
.wca-nb { min-width: 64px; padding: 6px 14px; border: 2px solid var(--line); border-radius: 10px; font-weight: 700; }
.wca-lancer { margin-top: 6px; align-items: flex-end; }
.wca-joueur { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.wca-joueur input { width: 280px; max-width: 70vw; font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--champ); color: var(--ink); }
.wca-jouer { font-size: 18px; padding: 10px 30px; }
.wca-regles-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-bottom: 8px; }
.wca-regles-g div { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: var(--info-bg); border-radius: 8px; }

/* jeu : tableau de bord */
.hud { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font: 600 14px Consolas, "Courier New", monospace; color: var(--ar-doux); }
.hud b { color: #fff; }
.hud-score b { color: var(--ar-jaune); font-size: 18px; }
.hud-combo.chaud { color: var(--ar-orange); text-shadow: 0 0 8px rgba(255, 165, 61, .6); }
.hud-vies { margin-left: auto; letter-spacing: 2px; }
.hud-mode { margin-left: auto; }
.chrono { position: relative; height: 10px; margin: 22px 0 14px; border-radius: 6px; background: rgba(255,255,255,.08); }
.chrono.vide { background: transparent; height: 4px; margin: 10px 0; }
.chrono span { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: linear-gradient(90deg, var(--ar-cyan), var(--ar-vert)); transition: width .1s linear; }
.chrono span.urgent { background: linear-gradient(90deg, var(--ar-rouge), var(--ar-orange)); }
.chrono b { position: absolute; right: 0; top: -20px; font: 700 13px Consolas, monospace; color: var(--ar-doux); }
.wca-carte { position: relative; z-index: 1; }
.wca-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); color: var(--ar-doux); }
.tag.type { color: var(--ar-cyan); border-color: var(--ar-cyan); }
.wca-q { font-size: 20px; line-height: 1.35; font-weight: 600; margin: 4px 0 16px; color: #fff; }
.wca-choix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.wca-choix-vf { grid-template-columns: repeat(2, minmax(0, 220px)); }
.wca-rep { display: flex; align-items: flex-start; gap: 10px; text-align: left; padding: 12px 14px; border-radius: 10px; border: 2px solid #3a4390;
  background: rgba(255,255,255,.04); color: var(--ar-texte); font-size: 15px; transition: transform .08s, border-color .15s; }
.wca-rep:hover:not(:disabled) { border-color: var(--ar-cyan); transform: translateY(-1px); box-shadow: 0 0 12px rgba(51, 225, 255, .25); }
.wca-rep kbd { color: var(--ar-cyan); flex: none; margin-top: 2px; }
.wca-vf { justify-content: center; font-size: 18px; font-weight: 700; }
.wca-rep.bon { border-color: var(--ar-vert); background: rgba(61, 220, 132, .16); opacity: 1; }
.wca-rep.faux { border-color: var(--ar-rouge); background: rgba(255, 93, 93, .16); opacity: 1; }
.wca-rep.eteint { opacity: .4; }
.wca-actions { margin-top: 14px; color: var(--ar-doux); }
.wca-actions .wca-compte b { color: #fff; }

/* « Repère le piège » : scènes */
.scene { max-width: 680px; border-radius: 12px; overflow: hidden; background: #f7f8fc; color: #1d2330; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
.sms { max-width: 430px; background: #eef1f7; border-radius: 22px; padding: 12px 14px 16px; }
.sms-tete { font-size: 13px; color: #5d6676; text-align: center; margin-bottom: 8px; }
.sms-bulle { background: #fff; border-radius: 16px 16px 16px 4px; padding: 10px 12px; line-height: 1.9; }
.courriel-tete { padding: 9px 12px; background: #e8ecf5; border-bottom: 1px solid #d3d9e6; font-size: 13px; }
.courriel-corps { padding: 12px 14px 16px; line-height: 1.9; }
.site-barre { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: #dfe3ec; }
.site-pts { color: #ff5f57; letter-spacing: 2px; font-size: 10px; }
.site-url { flex: 1; background: #fff; border-radius: 14px; padding: 2px 10px; font: 13px Consolas, monospace; }
.site-corps { padding: 14px 16px 18px; line-height: 2; }
.seg { display: inline; font: inherit; color: inherit; background: transparent; padding: 1px 3px; margin: 0 1px; border: 0; border-radius: 4px;
  box-shadow: inset 0 -2px 0 rgba(31, 56, 100, .18); cursor: pointer; }
.seg:hover:not(:disabled) { background: #fff1a8; }
.seg.marque { background: #ffd23f; box-shadow: inset 0 0 0 2px #c79a00; }
.seg.trouve { background: #c8f2d8; box-shadow: inset 0 0 0 2px #2e7d32; opacity: 1; }
.seg.manque { background: #ffe3bf; box-shadow: inset 0 0 0 2px #d97a00; opacity: 1; }
.seg.faux { background: #ffd6d6; box-shadow: inset 0 0 0 2px #b3261e; text-decoration: line-through; opacity: 1; }
.seg:disabled:not(.trouve):not(.manque):not(.faux) { box-shadow: none; opacity: 1; }
.seg-fixe { font-weight: 600; }
.courriel-tete .seg, .sms-tete .seg, .site-url .seg { font-weight: 600; }

/* « Bon réflexe » : étapes */
.wca-ordre { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.wca-ordre h3 { color: var(--ar-doux); font-weight: 600; margin-top: 0; }
.wca-etape { display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; border: 2px dashed #4a55a8;
  background: rgba(255,255,255,.04); color: var(--ar-texte); }
.wca-etape:hover { border-color: var(--ar-cyan); }
.wca-etape.placee { border-style: solid; border-color: var(--ar-cyan); background: rgba(51, 225, 255, .1); margin: 0; }
.wca-place { margin: 0; padding-left: 24px; color: var(--ar-cyan); font-weight: 700; }
.wca-place li { margin-bottom: 8px; }
.wca-place li.vide { color: var(--ar-doux); font-weight: 400; padding: 9px 0; border-bottom: 1px dashed #3a4390; }
.wca-ordre-sol { margin: 0; padding-left: 24px; }
.wca-ordre-sol li { margin-bottom: 6px; padding: 6px 10px; border-radius: 8px; }
.wca-ordre-sol li.bon { background: rgba(61, 220, 132, .14); }
.wca-ordre-sol li.faux { background: rgba(255, 93, 93, .14); }
.wca-ordre-sol small { color: var(--ar-doux); }

/* verdict après chaque réponse */
.verdict { border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; border: 2px solid var(--line); background: var(--card); outline: none; }
.verdict.ok { border-color: var(--ok); background: var(--ok-bg); }
.verdict.partiel { border-color: var(--warn); background: var(--warn-bg); }
.verdict.ko { border-color: var(--ko); background: var(--ko-bg); }
.verdict-t { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 20px; font-weight: 800; }
.verdict-pts { margin-left: auto; font: 700 18px Consolas, monospace; }
.verdict-pts .mult { font-size: 14px; padding: 1px 8px; border-radius: 999px; background: var(--ar-orange); color: #1d2330; }
.verdict-vie { font-weight: 700; color: var(--ko); margin: 6px 0; }
.verdict-expl { font-size: 15px; margin: 8px 0; }
.verdict-src { font-size: 12px; color: var(--muted); margin: 4px 0 10px; }
.wca-indices { margin: 6px 0; padding-left: 20px; }
.wca-indices li { margin: 3px 0; }

/* effets (désactivés si l'utilisateur limite les animations) */
.wca-jeu.brille { animation: wca-brille .6s ease-out; }
.wca-jeu.secoue { animation: wca-secoue .35s linear; }
@keyframes wca-brille { 0% { box-shadow: 0 0 0 4px #070a1a inset, 0 0 0 rgba(61,220,132,0); } 40% { box-shadow: 0 0 0 4px #070a1a inset, 0 0 32px rgba(61,220,132,.75); } 100% { box-shadow: 0 0 0 4px #070a1a inset, 0 6px 24px rgba(10,14,40,.35); } }
@keyframes wca-secoue { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { .wca-jeu.brille, .wca-jeu.secoue, .wca-clignote, .wca-rep { animation: none; transition: none; } }

/* fin de partie */
.wca-fin { text-align: center; }
.wca-rang { display: inline-flex; align-items: center; gap: 16px; margin: 6px 0; }
.wca-rang-e { font-size: 64px; line-height: 1; }
.wca-rang-t { font: 800 34px Consolas, "Courier New", monospace; color: var(--ar-jaune); text-shadow: 0 0 12px rgba(255, 210, 63, .5); text-align: left; }
.wca-etoiles { font-size: 26px; color: var(--ar-jaune); letter-spacing: 4px; text-align: left; }
.wca-rang-m { font-size: 16px; margin: 4px 0 14px; }
.wca-tuiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 auto 10px; max-width: 900px; }
.wca-tuiles div { display: flex; flex-direction: column; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.06); border: 1px solid #2a3170; }
.wca-tuiles b { font: 800 24px Consolas, monospace; color: var(--ar-cyan); }
.wca-tuiles span { font-size: 12px; color: var(--ar-doux); }
.wca-fin-ctx { color: var(--ar-doux); }
.wca-fin-b { justify-content: center; margin-top: 8px; position: relative; z-index: 1; }
.wca-bilan td { padding: 5px 6px; }
.wca-barre-c { width: 55%; }
.wca-barre { display: block; height: 12px; border-radius: 6px; background: var(--info-bg); overflow: hidden; }
.wca-barre span { display: block; height: 100%; border-radius: 6px; }
.wca-barre .ok { background: var(--ok); } .wca-barre .moyen { background: #d9a400; } .wca-barre .ko { background: var(--ko); }
.wca-revoir { border-left: 4px solid var(--warn); padding: 2px 12px; margin-bottom: 10px; }
.wca-revoir h3 { margin-top: 4px; }
.wca-rates summary { cursor: pointer; }
.wca-rates li { margin-bottom: 10px; }
.wca-rates li p { margin: 2px 0; }
tr.wca-top td { font-weight: 700; }

/* bons réflexes */
.wca-themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.wca-theme { display: flex; flex-direction: column; margin: 0; }
.wca-theme ul { flex: 1; }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; }
  .wca-opts, .wca-choix, .wca-ordre, .wca-tuiles { grid-template-columns: 1fr; }
  .wca-h1 { font-size: 32px; }
}

/* impression (🖨 PDF) : sans menu ni bandeau, borne d'arcade en clair */
@media print {
  #app { display: block; height: auto; }
  #topbar, #sidebar, .wca-fin-b, .wca-reprendre, .wca-clignote { display: none !important; }
  #main { overflow: visible; padding: 0; }
  .wca-ecran { background: #fff !important; color: #1d2330; border: 1px solid #bbb; box-shadow: none; }
  .wca-ecran::after { display: none; }
  .wca-h1, .wca-h1 span, .wca-rang-t, .wca-tuiles b, .wca-q, .hud b { color: #1f3864 !important; text-shadow: none !important; }
  .wca-tuiles div { background: #f3f5f9; border-color: #ccc; }
  .wca-tuiles span, .wca-fin-ctx, .hud { color: #444 !important; }
  .card { break-inside: avoid; }
}

/* Défi entre collègues (1.1.0) : nom du joueur, code défi, fiche de score à partager */
.wca-joueur-fin { position: relative; z-index: 1; margin: 4px 0 6px; font-size: 22px; color: var(--ar-texte); }
.wca-joueur-fin b { font: 800 30px Consolas, "Courier New", monospace; color: #fff; text-shadow: 0 0 10px rgba(51, 225, 255, .55); }
.wca-joueur-fin.vide { font-size: 14px; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.wca-joueur-fin input { font: inherit; padding: 5px 9px; border-radius: 6px; border: 2px solid var(--ar-cyan); background: #0f1533; color: #fff; width: 220px; }
.wca-releve, .hud-defi { color: var(--ar-vert); }
.wca-releve { position: relative; z-index: 1; margin: 0 0 4px; font-weight: 600; }
.wca-relever input { font: 600 15px Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; padding: 7px 10px; width: 260px; border: 1px solid var(--line); border-radius: 6px; background: var(--champ); color: var(--ink); }
.wca-erreur { color: var(--ko); font-weight: 600; }
.wca-partage { border: 2px solid var(--opt-act-b); }
.wca-partage-g { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 18px; align-items: start; }
.wca-fiche { width: 100%; border-radius: 10px; box-shadow: 0 4px 16px rgba(10, 14, 40, .35); }
.wca-code-defi { font-size: 16px; }
.wca-code-defi b { font: 800 20px Consolas, monospace; color: var(--ok); letter-spacing: .04em; }
.wca-partage-b { margin: 10px 0; }
a.wca-btn { text-decoration: none; display: inline-block; }
.wca-partage-ok { font-weight: 600; color: var(--ok); }

<script>window.WERB_GUIDES = [{ fichier: "1-Animer_une_session.md", texte: "<!-- WerbCyberArcade – Développé par @WerbHat -->\n# Animer une session WerbCyberArcade\n\nWerbCyberArcade est un jeu de quiz pour prendre les bons réflexes de cybersécurité, **à la maison comme au travail**. Il se joue seul, en binôme ou en équipes, sur un poste ou projeté en salle. Il fonctionne hors ligne et n'enregistre rien : ni réponse, ni score, ni nom de joueur ne quittent la page.\n\n## D'où viennent les questions\n\nLes défis sont rédigés pour le jeu à partir de deux guides publics, reformulés et jamais recopiés :\n\n| Terrain | Guide | Ce qu'il couvre |\n|---|---|---|\n| 🏠 À la maison | *Cyber guide famille* de Cybermalveillance.gouv.fr (10 bonnes pratiques) | Mots de passe, sauvegardes, mises à jour, antivirus, achats en ligne, messages suspects, réseaux sociaux, Wi-Fi publics, objets connectés, cyberharcèlement |\n| 🏢 Au travail | *Guide d'hygiène informatique* de l'ANSSI (42 mesures) | Les mesures qui concernent chaque collaborateur : poste de travail, messagerie, clés USB, déplacements, réaction à un incident, comptes et données |\n\nAprès chaque réponse, le jeu affiche l'explication et la source exacte (numéro de la bonne pratique ou de la mesure). La page **📚 Sources** du menu donne les références complètes et les liens vers les guides.\n\n## Les quatre types de défis\n\n- **🧠 Quiz** : une seule bonne réponse parmi quatre. Les réponses sont mélangées à chaque partie.\n- **⚖️ Vrai ou faux** : une affirmation à juger vite.\n- **🎣 Repère le piège** : un faux SMS, un faux courriel ou un faux site. Le joueur touche tous les éléments suspects (expéditeur, lien, urgence, demande de mot de passe…), puis valide. Une fausse alerte coûte des points.\n- **🧩 Bon réflexe** : remettre dans l'ordre les étapes d'une bonne réaction, par exemple face à un poste attaqué.\n\n## Les deux modes\n\n- **🕹️ Arcade** : chrono, trois vies, combos. Une bonne réponse vaut 100 points plus un bonus de temps, multipliés par le combo (jusqu'à ×4). Une erreur coûte une vie ; la partie s'arrête à la troisième. Idéal pour une session en équipes.\n- **📖 Entraînement** : sans chrono ni vies, pour lire les explications à son rythme.\n\nOn choisit aussi le terrain (maison, travail ou les deux) et le nombre de défis (10, 20 ou tous). Une partie de 10 défis comprend toujours au moins un « Repère le piège » et un « Bon réflexe » ; deux de chaque à partir de 20.\n\n## Déroulé conseillé d'une session de 30 minutes\n\n1. **Introduction (5 min)** : pourquoi la cybersécurité concerne tout le monde, au bureau comme à la maison. Les mêmes réflexes protègent les deux.\n2. **Partie en équipes (15 min)** : projeter le jeu, mode Arcade, 10 ou 20 défis, terrain « Les deux ». Saisir le nom de l'équipe avant de jouer. Faire voter les équipes, puis lire l'explication à voix haute.\n3. **Débriefing (10 min)** : afficher le bilan de fin de partie. Les thèmes en rouge et la liste « Les défis manqués » nourrissent la discussion. La page **🛡️ Bons réflexes** sert de support de synthèse.\n\nPour un tournoi, faites jouer chaque équipe à tour de rôle : la page **🏆 Meilleurs scores** classe les parties de la session. Elle s'efface à la fermeture de l'onglet.\n\n## Lancer un défi entre collègues\n\nChaque partie a un **code défi**, affiché au bilan (par exemple `WCA-200-K3Q9ZP`). Saisi dans **🎯 Relever un défi** sur l'accueil, il redonne **exactement les mêmes défis**, dans le même ordre et avec les mêmes règles : la comparaison des scores est équitable.\n\nAu bilan, l'encart **📣 Défier mes collègues** propose :\n\n- **📧 Envoyer par courriel** : la messagerie du poste s'ouvre avec un message prêt (score, rang, code défi, marche à suivre). Ajoutez vos collègues en destinataires, puis envoyez.\n- **🖼 Télécharger la fiche** : une image de la fiche de score (nom, rang, score, code défi), à joindre au courriel ou à publier sur l'intranet.\n- **📋 Copier le message** : pour Teams ou une messagerie en ligne.\n\nLe nom du joueur figure en tête du bilan et sur la fiche ; s'il n'a pas été saisi avant la partie, un champ permet de l'ajouter. Rien n'est envoyé sans vous, et rien n'est enregistré.\n\nIdée d'animation : un **défi de la semaine**. L'animateur joue une partie, envoie le code à toute l'équipe ; chacun relève le défi et répond avec sa fiche de score. Un même code n'est garanti que pour une même version du jeu.\n\n## Après la session\n\n- **🖨 PDF** (bandeau) imprime la page affichée : le bilan d'une partie, ou la fiche des bons réflexes à distribuer.\n- Depuis **🛡️ Bons réflexes**, le bouton **S'entraîner** lance une partie sur un seul thème, sans chrono : utile pour revoir un point faible.\n- Pour un suivi des formations dans WerbSMSI, enregistrez la session dans **WerbAcademie** (date, public, thème).\n\n## Au clavier\n\n| Touche | Effet |\n|---|---|\n| `1` à `4` | Choisir une réponse de quiz |\n| `V` / `F` | Vrai / Faux |\n| `Entrée` | Valider un « Repère le piège » ou un « Bon réflexe », puis passer au défi suivant |\n\n## Créer les défis de votre entreprise (équipe SMSI)\n\nLes 66 défis du jeu viennent des guides publics. Pour parler **de chez vous** — qui appeler, où signaler, la charte informatique, un piège déjà reçu — l'équipe SMSI du groupe crée ses propres défis, **sans rien installer ni reconstruire** :\n\n1. Ouvrir WerbCyberArcade depuis la **puce « groupe »** du module dans le portail (l'espace est alors transmis), puis **⚙️ Administration › Défis de l'entreprise**.\n2. **✨ Nouvelle base** la première fois, puis **💾 Enregistrer** dans `groupe/continuite/` de l'espace ; les fois suivantes, **📂 Ouvrir la base demandée par le portail**. La base a le verrou commun : un collègue qui l'ouvre en même temps la voit en lecture seule.\n3. **➕ Nouveau** : choisir le type (quiz, vrai ou faux, repère le piège, bon réflexe), remplir le formulaire — énoncé, réponses (la bonne d'abord), scène et indices, ou étapes dans l'ordre —, l'explication et une **source interne** (charte, procédure). **✔ Appliquer** ; un défi incomplet est signalé ⚠ avec les points à corriger.\n4. **▶ Essayer** : le défi tel que les joueurs le verront, sans compter dans les scores.\n5. **📤 Publier** : les défis prêts partent dans `publications/werbcyberarcade.json` (version 1, 2, 3…). La base est enregistrée aussitôt avec le numéro de version.\n\nLes joueurs qui ouvrent le jeu depuis le portail reçoivent les défis sans rien faire ; sinon, l'encart **🏢 Défis de l'entreprise** de l'accueil propose **📂 Charger les défis de l'entreprise** (choisir le dossier de l'espace). Une case permet de les mêler ou non aux défis du jeu ; ils ont leur thème, **🏢 Règles de l'entreprise**, dans les bons réflexes.\n\nÀ retenir :\n\n- **Rien de confidentiel** : la publication est lisible par tous les sites. Ni adresse IP, ni mot de passe, ni nom de serveur, ni vulnérabilité réelle ; des scènes « piège » fictives.\n- **Code défi** : une partie qui contient les défis de l'entreprise a un code en `-E<version>`. Après une nouvelle publication, les anciens codes ne peuvent plus être relevés avec les défis de l'entreprise : prévenez les joueurs d'un défi en cours.\n\n## Ajouter ou modifier des défis du jeu de base\n\nLes défis sont rangés dans `sources/src/questions.js`, dans le dépôt du module. Chacun porte un identifiant unique, un terrain (`maison` ou `travail`), un thème, un type et sa source (`[\"famille\", n]` ou `[\"hygiene\", n]`). Pour un quiz, la bonne réponse est la première de la liste : le jeu mélange l'ordre à l'affichage. Reconstruire ensuite le module, puis le publier (`werb_charte.py construire`, `empreinte`, `audit`, `publier`).\n\nLes scènes « Repère le piège » sont fictives : numéros, adresses, noms de personnes et de sites sont inventés. Gardez cette règle pour toute nouvelle scène.\n" }];

/*! WerbCyberArcade – Développé par @WerbHat */
/* Identité du module : source unique utilisée par l'interface et la page À propos.

})());

/*! WerbSMSI socle 1.12.0 – Développé par @WerbHat */

const WerbSocle = Object.freeze((() => {
  const VERSION = "1.12.0";
  const FAMILLE = "WERBSMSI";
  const TAILLE_MAX = 20 * 1024 * 1024;
  const prefixe = () => `werb.${WERB.id}.`;

  /* ---------- Stockage navigateur : purge limitée au module (charte §1) ---------- */

  // N'efface que les clés et bases préfixées « werb.<id>. » : les autres modules partagent le même stockage en file://.
  async function purger() {
    const p = prefixe();
    for (const st of [globalThis.localStorage, globalThis.sessionStorage]) {
      try {
        for (let i = st.length - 1; i >= 0; i--) { const k = st.key(i); if (k && k.startsWith(p)) st.removeItem(k); }
      } catch (e) { /* stockage indisponible */ }
    }
    try {
      if (indexedDB && indexedDB.databases) {
        for (const db of await indexedDB.databases()) if (db.name && db.name.startsWith(p)) indexedDB.deleteDatabase(db.name);
      }
    } catch (e) { /* indisponible */ }
  }

  // Préférence d'affichage seulement (jamais de donnée métier), effacée à la fermeture de l'onglet.
  const preference = {
    lire(cle, defaut) { try { const v = sessionStorage.getItem(prefixe() + cle); return v === null ? defaut : JSON.parse(v); } catch (e) { return defaut; } },
    ecrire(cle, valeur) { try { sessionStorage.setItem(prefixe() + cle, JSON.stringify(valeur)); } catch (e) { /* indisponible */ } },
  };

  function activerPurgeAutomatique() {
    purger();
    addEventListener("pagehide", () => { purger(); });
  }

  /* ---------- Échappement ---------- */

  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = v => (v === null || v === undefined) ? "" : String(v).replace(/[&<>"']/g, c => ESC[c]);

  /* ---------- Enveloppe des données (charte §5.1) ---------- */

  const maintenant = () => new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
  const CODE_SITE = /^[A-Z0-9][A-Z0-9_-]{0,30}$/;

  // Référence à un objet d'un site depuis une base du groupe : « LYON:Z-PROC » (charte §5.4).
  const qualifier = (site, id) => `${site}:${id}`;
  function decomposer(ref) {
    const i = String(ref).indexOf(":");
    return i > 0 && CODE_SITE.test(ref.slice(0, i)) ? { site: ref.slice(0, i), id: ref.slice(i + 1) } : { site: null, id: String(ref) };
  }

  // portee : "groupe" ou "site" (charte §5.2). site : code du site, obligatoire si portee = "site".
  function enveloppe(data, { utilisateur = "", base = null, groupeId, portee, site } = {}) {
    const meta = Object.assign({}, base && base.meta, {
      produit: WERB.produit, appVersion: WERB.version, auteur: WERB.auteur, generateur: WERB.ligne,
      modifieLe: maintenant(), modifiePar: utilisateur,
    });
    if (!meta.creeLe) meta.creeLe = maintenant().slice(0, 10);
    if (groupeId !== undefined) meta.groupeId = groupeId;
    if (portee !== undefined) meta.portee = portee;
    if (site !== undefined) meta.site = site;
    if (meta.portee && !WERB.portees.includes(meta.portee)) throw new Error(`${WERB.produit} ne s'utilise pas au niveau « ${meta.portee} ».`);
    if (meta.portee === "site" && !CODE_SITE.test(meta.site || "")) throw new Error("Code de site absent ou invalide.");
    if (meta.portee === "groupe") delete meta.site;
    return {
      format: WERB.format, schema: WERB.schema, famille: FAMILLE, meta,
      verrou: base && base.verrou !== undefined ? base.verrou : verrou.valeur(),   // celui de la session qui a la main (§5.7)
      journal: base && Array.isArray(base.journal) ? base.journal : [],
      data,
    };
  }

  // Lit un texte JSON et contrôle l'enveloppe. Renvoie { format, schema, meta, verrou, journal, data, ancien }.
  // « ancien » vaut true pour un format historique (formatsLus) : le module convertit lui-même.
  function lireEnveloppe(texte) {
    if (typeof texte !== "string" || texte.length > TAILLE_MAX) throw new Error("Fichier vide ou trop volumineux.");
    let j;
    try { j = JSON.parse(texte); } catch (e) { throw new Error("Le fichier n'est pas un JSON valide."); }
    if (!j || typeof j !== "object" || Array.isArray(j)) throw new Error("Structure de fichier inattendue.");
    const fmt = j.format;
    if (fmt === WERB.format) {

      if (j.schema > WERB.schema) throw new Error(`Fichier créé par une version plus récente de ${WERB.produit} (schéma ${j.schema}).`);

    }
    if (WERB.formatsLus.includes(fmt) || (fmt === undefined && WERB.formatsLus.includes(""))) {
      return { format: fmt, schema: j.schema, meta: j.meta || {}, verrou: null, journal: [], data: j, ancien: true };

  async function sha256(entree) {
    const buf = typeof entree === "string" ? new TextEncoder().encode(entree) : entree instanceof Blob ? await entree.arrayBuffer() : entree;

  async function ouvrir({ verrou: prendreVerrou = true } = {}) {
    if (accesDirect) {
