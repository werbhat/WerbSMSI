/* Défis de l'entreprise (1.2.0) : format, contrôle et nettoyage d'un défi créé par l'équipe SMSI du groupe.
   Le même code sert à l'éditeur (⚙️ Défis de l'entreprise) et au chargement de la publication groupe:defisCyber par les joueurs :
   une publication est une donnée, jamais du code ; tout est contrôlé, borné et affiché échappé.
   Défi : { id, type (qcm | vf | piege | ordre), lieu (maison | travail), theme, q, expl, source,
            choix [4] (qcm, bonne réponse en premier), vrai (vf), forme, entete, indiceEntete, segments [{ t, s, pq }] (piege),
            etapes [3 à 6, dans le bon ordre] (ordre) }. */
"use strict";
window.WCA_ENT = (() => {
  const TYPES = ["qcm", "vf", "piege", "ordre"], LIEUX = ["maison", "travail"], FORMES = ["sms", "courriel", "site"];
  const MAX = { q: 300, expl: 600, source: 200, choix: 160, entete: 160, seg: 200, pq: 240, etape: 200, defis: 300, titre: 120 };
  const txt = (v, n) => (typeof v === "string" ? v : v === undefined || v === null ? "" : String(v))
    .replace(/[\u0000-\u0008\u000b-\u001f\u007f]/g, "").replace(/\s+/g, " ").trim().slice(0, n);
  const RE_ID = /^[A-Za-z0-9_-]{1,12}$/;

  // Défi vide d'un type donné, pour l'éditeur
  function vide(type, id) {
    const d = { id, type, lieu: "travail", theme: "entreprise", q: "", expl: "", source: "" };
    if (type === "qcm") d.choix = ["", "", "", ""];
    if (type === "vf") d.vrai = true;
    if (type === "piege") Object.assign(d, { forme: "courriel", entete: "", indiceEntete: "", segments: [{ t: "", s: false, pq: "" }, { t: "", s: true, pq: "" }] });
    if (type === "ordre") d.etapes = ["", "", ""];
    return d;
  }

  // Copie nettoyée (types, longueurs) ; les champs inconnus sont abandonnés
  function normaliser(d, themes) {
    if (!d || typeof d !== "object") return null;
    const type = TYPES.includes(d.type) ? d.type : null;
    if (!type) return null;
    const n = { id: RE_ID.test(String(d.id || "")) ? String(d.id) : "", type,
      lieu: LIEUX.includes(d.lieu) ? d.lieu : "travail",
      theme: themes && themes[d.theme] ? d.theme : "entreprise",
      q: txt(d.q, MAX.q), expl: txt(d.expl, MAX.expl), source: txt(d.source, MAX.source) };
    if (type === "qcm") n.choix = [0, 1, 2, 3].map(k => txt((d.choix || [])[k], MAX.choix));
    if (type === "vf") n.vrai = d.vrai !== false;
    if (type === "piege") {
      n.forme = FORMES.includes(d.forme) ? d.forme : "courriel";
      n.entete = txt(d.entete, MAX.entete);
      n.indiceEntete = txt(d.indiceEntete, MAX.pq);
      n.segments = (Array.isArray(d.segments) ? d.segments : []).slice(0, 12)
        .map(s => ({ t: txt(s && s.t, MAX.seg), s: !!(s && s.s), pq: txt(s && s.pq, MAX.pq) }));
    }
    if (type === "ordre") n.etapes = (Array.isArray(d.etapes) ? d.etapes : []).slice(0, 6).map(e => txt(e, MAX.etape));
    return n;
  }

  // Problèmes qui empêchent de jouer ou de publier le défi (liste vide : défi prêt)
  function verifier(d) {
    const p = [];
    if (!d) return ["défi illisible"];
    if (!RE_ID.test(d.id || "")) p.push("identifiant manquant");
    if (!d.q) p.push("énoncé vide");
    if (!d.expl) p.push("explication vide");
    if (d.type === "qcm") {
      if (d.choix.some(c => !c)) p.push("quatre réponses à remplir");
      else if (new Set(d.choix.map(c => c.toLowerCase())).size < 4) p.push("réponses en double");
    }
    if (d.type === "piege") {
      const pleins = d.segments.filter(s => s.t);
      if (!d.entete) p.push("expéditeur ou adresse vide");
      if (pleins.length < 2) p.push("au moins deux morceaux de texte");
      if (!pleins.some(s => s.s) && !d.indiceEntete) p.push("au moins un indice suspect");
      if (!pleins.some(s => !s.s)) p.push("au moins un morceau anodin (leurre)");
      if (pleins.some(s => s.s && !s.pq)) p.push("chaque indice explique pourquoi il est suspect");
    }
    if (d.type === "ordre") {
      const pleines = d.etapes.filter(Boolean);
      if (pleines.length < 3) p.push("au moins trois étapes");
      if (pleines.length !== d.etapes.length) p.push("étape vide");
      if (new Set(pleines.map(e => e.toLowerCase())).size < pleines.length) p.push("étapes en double");
    }
    return p;
  }

  // Défi prêt pour le jeu : segments et étapes vides retirés, identifiant préfixé (pas de collision avec les défis du jeu)
  function versJeu(d) {
    const q = { ...d, id: `ENT-${d.id}`, src: ["entreprise", d.source], entreprise: true };
    if (q.type === "piege") q.segments = d.segments.filter(s => s.t);
    if (q.type === "ordre") q.etapes = d.etapes.filter(Boolean);
    delete q.source;
    return q;
  }

    const total = TEMPS[courante().q.type] * 1000;
    return `<div class="hud">
        <span class="hud-q">Défi <b>${partie.i + 1}</b> / ${n}</span>
        <span class="hud-score">⭐ <b id="hud-score">${nombre(partie.score)}</b></span>
        <span class="hud-combo${partie.combo >= 2 ? " chaud" : ""}">🔥 combo ×${Math.max(1, Math.min(COMBO_MAX, partie.combo))}</span>
        ${vies}
        ${R.joueur ? `<span class="hud-joueur">👤 ${esc(R.joueur)}</span>` : ""}
        ${partie.releve ? `<span class="hud-defi" title="Mêmes défis que le collègue qui vous a lancé ce code">🎯 ${esc(partie.code)}</span>` : ""}
      </div>
      ${arcade() && partie.phase === "question" ? `<div class="chrono" role="timer" aria-label="Temps restant"><span id="chrono-barre" style="width:${Math.max(0, 100 * partie.reste / total)}%"></span><b id="chrono-sec">${Math.ceil(partie.reste / 1000)}</b></div>` : `<div class="chrono vide"></div>`}`;
  }

  function corpsQuestion(p) {
    const q = p.q, R = partie.retour, fini = partie.phase === "retour";
    if (q.type === "qcm") {
      return `<div class="wca-choix">${p.options.map((o, k) => {
        const cl = fini ? (o.bon ? " bon" : R && R.k === k ? " faux" : " eteint") : "";
        return `<button type="button" class="wca-rep${cl}" data-rep="${k}"${fini ? " disabled" : ""}><kbd>${k + 1}</kbd><span>${esc(o.t)}</span></button>`;
      }).join("")}</div>`;
    }
    if (q.type === "vf") {
      const b = (v, l, k) => { const cl = fini ? (v === q.vrai ? " bon" : R && R.v === v ? " faux" : " eteint") : "";
        return `<button type="button" class="wca-rep wca-vf${cl}" data-vf="${v}"${fini ? " disabled" : ""}><kbd>${k}</kbd><span>${l}</span></button>`; };
      return `<div class="wca-choix wca-choix-vf">${b(true, "✔ Vrai", "V")}${b(false, "✘ Faux", "F")}</div>`;
    }
    if (q.type === "piege") {
      const etat = k => {
        const estIndice = k === "E" ? !!q.indiceEntete : q.segments[k].s, marque = partie.sel.has(k);
        if (!fini) return marque ? " marque" : "";
        return estIndice ? (marque ? " trouve" : " manque") : (marque ? " faux" : "");
      };
      const seg = (k, t) => `<button type="button" class="seg${etat(k)}" data-seg="${k}"${fini ? " disabled" : ""} aria-pressed="${partie.sel.has(k)}">${esc(t)}</button>`;
      const entete = q.indiceEntete ? seg("E", q.entete) : `<span class="seg-fixe">${esc(q.entete)}</span>`;
      const corps = q.segments.map((s, k) => seg(k, s.t)).join(" ");
      const scene = {
        sms: `<div class="scene sms"><div class="sms-tete">💬 ${entete}</div><div class="sms-bulle">${corps}</div></div>`,
        courriel: `<div class="scene courriel"><div class="courriel-tete">✉️ ${entete}</div><div class="courriel-corps">${corps}</div></div>`,
        site: `<div class="scene site"><div class="site-barre"><span class="site-pts">● ● ●</span><span class="site-url">🔒 ${entete}</span></div><div class="site-corps">${corps}</div></div>`,
      }[q.forme];
      const actions = fini ? "" : `<div class="row wca-actions"><span class="wca-compte">Indices marqués : <b>${partie.sel.size}</b> · à trouver : <b>${indices(q)}</b></span><span class="spacer"></span><button type="button" class="wca-btn" data-valider>✔ Valider</button></div>`;
      return scene + actions;
    }
    if (q.type === "ordre") {
      if (fini) {
        return `<ol class="wca-ordre-sol">${q.etapes.map((e, k) => { const ok = partie.ordre[k] === k;
          return `<li class="${ok ? "bon" : "faux"}">${esc(e)}${ok ? " ✓" : ` <small>— vous aviez placé ici : « ${esc(q.etapes[partie.ordre[k]] ?? "rien")} »</small>`}</li>`; }).join("")}</ol>`;
      }
      const libres = p.melange.filter(k => !partie.ordre.includes(k));
      return `<div class="wca-ordre">
          <div><h3>Étapes à placer</h3>${libres.map(k => `<button type="button" class="wca-etape" data-etape="${k}">${esc(q.etapes[k])}</button>`).join("") || `<p class="small">Toutes les étapes sont placées : validez !</p>`}</div>
          <div><h3>Votre ordre</h3><ol class="wca-place">${q.etapes.map((_, n) => partie.ordre[n] !== undefined
            ? `<li><button type="button" class="wca-etape placee" data-retirer="${n}" title="Retirer cette étape et les suivantes">${esc(q.etapes[partie.ordre[n]])}</button></li>`
            : `<li class="vide">…</li>`).join("")}</ol></div>
        </div>
        <div class="row wca-actions"><button type="button" class="wca-btn sec petit" data-ordre-raz${partie.ordre.length ? "" : " disabled"}>↺ Recommencer</button><span class="spacer"></span><button type="button" class="wca-btn" data-valider${partie.ordre.length === q.etapes.length ? "" : " disabled"}>✔ Valider</button></div>`;
    }
    return "";
  }

  function panneauRetour(p) {
    const q = p.q, R = partie.retour;
    const titre = R.expire ? "⏱ Temps écoulé !" : R.ok ? ["✅ Bien joué !", "✅ Exact !", "✅ Bravo !", "✅ Parfait !"][partie.i % 4] : R.ratio >= 0.5 ? "🟠 Presque !" : "❌ Raté…";
    const cl = R.ok ? "ok" : R.ratio >= 0.5 ? "partiel" : "ko";
    const pts = R.points ? `+${nombre(R.points)} pts${R.mult > 1 ? ` <span class="mult">combo ×${R.mult}</span>` : ""}` : "0 pt";
    let detail = "";
    if (q.type === "piege" && !R.expire) detail = `<p class="small">Indices trouvés : <b>${R.trouves} / ${R.total}</b>${R.fautes ? ` · fausses alertes : <b>${R.fautes}</b>` : ""}</p>`;
    if (q.type === "piege") detail += `<ul class="wca-indices">${q.indiceEntete ? `<li><b>${esc(q.entete)}</b> — ${esc(q.indiceEntete)}</li>` : ""}${q.segments.filter(s => s.s).map(s => `<li><b>${esc(s.t)}</b> — ${esc(s.pq)}</li>`).join("")}</ul>`;
    if (q.type === "ordre" && !R.expire) detail = `<p class="small">Étapes bien placées : <b>${R.justes} / ${q.etapes.length}</b></p>`;
    if (q.type === "vf") detail = `<p class="small">Réponse : <b>${q.vrai ? "Vrai" : "Faux"}</b></p>`;
    const derniere = partie.i + 1 >= partie.liste.length || partie.vies <= 0;
    return `<div class="verdict ${cl}" tabindex="-1" role="status" aria-live="polite">
        <div class="verdict-t"><span>${titre}</span><span class="verdict-pts">${pts}</span></div>
        ${R.perdue ? `<p class="verdict-vie">💔 Une vie de moins${partie.vies <= 0 ? " — plus de vie : fin de la partie" : ""}</p>` : ""}
        ${detail}
        <p class="verdict-expl">💡 ${esc(q.expl)}</p>
        <p class="verdict-src">📚 ${esc(source(q.src))}</p>
        <div class="row"><span class="spacer"></span><button type="button" class="wca-btn" data-suivante>${derniere ? "🏁 Voir le bilan" : "Défi suivant ➜"} <kbd>Entrée</kbd></button></div>
      </div>`;
  }

  function carteJeu(p) {
    const q = p.q, [ti, tl] = TYPES[q.type], [li, ll] = LIEUX[q.lieu], th = THEMES[q.theme];
    return `<div class="wca-tags"><span class="tag type">${ti} ${esc(tl)}</span><span class="tag lieu">${li} ${esc(ll)}</span><span class="tag theme">${esc(th.i)} ${esc(th.l)}</span></div>
      <p class="wca-q">${esc(q.q)}</p>${corpsQuestion(p)}`;
  }

  VUES.jeu = () => {
    if (!partie) return `<div class="card"><h2>Aucune partie en cours</h2><p>Choisissez un terrain et un mode, puis lancez la partie.</p><button type="button" class="wca-btn" data-nav="accueil">🎮 Nouvelle partie</button></div>`;
    if (partie.phase === "fin") return VUES.fin();
    const effet = partie.phase === "retour" ? (partie.retour.ok ? " brille" : " secoue") : "";
    return `<div class="wca-ecran wca-jeu${effet}">${hud()}<div class="wca-carte">${carteJeu(courante())}</div></div>
      ${partie.phase === "retour" ? panneauRetour(courante()) : ""}`;
  };

  /* --------------------------------------------- fin de partie */
  /* --------------------------------------------- résumé d'une partie terminée : bilan, fiche de score et message du défi */
  function resume(P) {
    const n = P.res.length, bons = P.res.filter(r => r.ok).length, R = P.reglages;
    const [, emoji, titre, msg] = RANGS.find(([m]) => P.reussite >= m);
    const etoiles = P.reussite >= 80 ? 3 : P.reussite >= 60 ? 2 : P.reussite >= 40 ? 1 : 0;
    const duree = Math.max(1, Math.round((P.fin - P.debut) / 1000));
    const partieTexte = `${LIEUX[R.lieu][1]} · ${MODES[R.mode][1]} · ${P.liste.length} défis${R.theme ? ` · thème ${THEMES[R.theme].l}` : ""}${P.ent ? ` · avec les défis de ${nomEntreprise()}` : ""}`;
    return { n, bons, emoji, titre, msg, etoiles, duree, joueur: R.joueur || "", partieTexte,
      combo: Math.max(1, Math.min(COMBO_MAX, P.meilleurCombo)), date: new Date(P.fin).toLocaleDateString("fr-FR") };
  }

  function messageDefi(P) {
    const s = resume(P), nom = s.joueur || "Un collègue";
    const sujet = `🎮 WerbCyberArcade : ${nom} vous défie — ${nombre(P.score)} points, ${s.titre}`;
    const corps = [
      "Bonjour,", "",
      `Je viens de jouer à WerbCyberArcade, le jeu de sensibilisation à la cybersécurité, à la maison comme au travail.`, "",
      `👤 Joueur : ${nom}`,
      `${s.emoji} Rang : ${s.titre} ${"★".repeat(s.etoiles)}${"☆".repeat(3 - s.etoiles)}`,
      `⭐ Score : ${nombre(P.score)} points`,
      `✅ Réussite : ${s.bons} / ${s.n} défis (${P.reussite} %)`,
      `🔥 Meilleur combo : ×${s.combo}`,
      `🎮 Partie : ${s.partieTexte}`, "",
      "🎯 Relevez le défi, avec exactement les mêmes questions :",
      "1. Ouvrez WerbCyberArcade depuis le portail WerbSMSI (étape « Faire vivre le SMSI »).",
      `2. Dans « Relever un défi », saisissez le code : ${P.code}`,
      "3. Essayez de battre mon score, puis lancez le défi à votre tour !", "",
      "Bonne chance !",
    ].join("\n");
    return { sujet, corps };
  }

  // Fiche de score : image 1200 × 630 (format des aperçus de messagerie), dessinée dans un canevas, sans ressource externe
  function ficheScore(P) {
    const s = resume(P), W = 1200, H = 630;
    const c = Object.assign(document.createElement("canvas"), { width: W, height: H }), x = c.getContext("2d");
    const POLICE = "Consolas, 'Courier New', monospace", EMOJI = "'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif";
    const g = x.createRadialGradient(W / 2, 0, 80, W / 2, 0, W);
    g.addColorStop(0, "#1d2552"); g.addColorStop(1, "#0b1026");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = "rgba(255,255,255,0.03)"; for (let y = 0; y < H; y += 4) x.fillRect(0, y, W, 1);      // lignes de balayage
    x.strokeStyle = "#33e1ff"; x.lineWidth = 4; x.strokeRect(14, 14, W - 28, H - 28);
    x.strokeStyle = "rgba(255,62,165,0.55)"; x.lineWidth = 2; x.strokeRect(24, 24, W - 48, H - 48);
    const texte = (t, X, Y, { taille = 24, couleur = "#e8ecff", gras = false, align = "left", police = POLICE, lueur = "", max = 0 } = {}) => {
      let f = taille;
      x.font = `${gras ? "800 " : ""}${f}px ${police}`;
      while (max && x.measureText(t).width > max && f > 14) { f -= 2; x.font = `${gras ? "800 " : ""}${f}px ${police}`; }
      x.textAlign = align; x.fillStyle = couleur; x.shadowColor = lueur || "transparent"; x.shadowBlur = lueur ? 18 : 0;
      x.fillText(t, X, Y); x.shadowBlur = 0;
    };
    // titre
    x.font = `800 46px ${POLICE}`;
    const l1 = x.measureText("Werb").width, l2 = x.measureText("Cyber").width, l3 = x.measureText("Arcade").width, x0 = (W - l1 - l2 - l3) / 2;
    texte("Werb", x0, 92, { taille: 46, gras: true, couleur: "#ffffff", lueur: "#33e1ff" });
    texte("Cyber", x0 + l1, 92, { taille: 46, gras: true, couleur: "#ff3ea5", lueur: "#ff3ea5" });
    texte("Arcade", x0 + l1 + l2, 92, { taille: 46, gras: true, couleur: "#ffffff", lueur: "#33e1ff" });
    texte("— FICHE DE SCORE —", W / 2, 128, { taille: 18, gras: true, couleur: "#ffd23f", align: "center" });
    // joueur et rang
    texte(s.emoji, 150, 268, { taille: 110, police: EMOJI, align: "center" });
    texte(s.joueur || "Joueur anonyme", 250, 210, { taille: 44, gras: true, couleur: "#ffffff", max: 880 });
    texte(s.titre, 250, 262, { taille: 36, gras: true, couleur: "#ffd23f", lueur: "rgba(255,210,63,0.6)" });
    texte("★".repeat(s.etoiles) + "☆".repeat(3 - s.etoiles), 250, 302, { taille: 32, couleur: "#ffd23f" });
    // tuiles
    const tuiles = [[nombre(P.score), "points"], [`${s.bons} / ${s.n}`, `défis réussis · ${P.reussite} %`], [`×${s.combo}`, "meilleur combo"]];
    tuiles.forEach(([v, l], k) => {
      const X = 60 + k * 365, Y = 340;
      x.fillStyle = "rgba(255,255,255,0.06)"; x.fillRect(X, Y, 345, 110);
      x.strokeStyle = "#2a3170"; x.lineWidth = 2; x.strokeRect(X, Y, 345, 110);
      texte(v, X + 172, Y + 62, { taille: 40, gras: true, couleur: "#33e1ff", align: "center", max: 320 });
      texte(l, X + 172, Y + 94, { taille: 18, couleur: "#9aa4d6", align: "center", police: "'Segoe UI', sans-serif", max: 320 });
    });
    // défi
    texte(`${s.partieTexte} · ${s.date}`, W / 2, 492, { taille: 19, couleur: "#9aa4d6", align: "center", police: "'Segoe UI', sans-serif", max: 1060 });
    texte(`🎯 Code défi : ${P.code}`, W / 2, 540, { taille: 30, gras: true, couleur: "#3ddc84", align: "center", lueur: "rgba(61,220,132,0.5)", max: 1060 });
    texte("Saurez-vous faire mieux ? Mêmes questions avec ce code, dans WerbCyberArcade (portail WerbSMSI).", W / 2, 576, { taille: 18, couleur: "#e8ecff", align: "center", police: "'Segoe UI', sans-serif", max: 1080 });
    texte(WERB.ligne, W - 40, H - 34, { taille: 13, couleur: "#6b75b0", align: "right", police: "'Segoe UI', sans-serif" });
    return c;
  }
  const nomFichierFiche = P => `WerbCyberArcade_score_${(P.reglages.joueur || "joueur").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") || "joueur"}_${new Date(P.fin).toISOString().slice(0, 10)}.png`;
  let messagePartage = "";                                            // retour des boutons de partage (copie, image)

  VUES.fin = () => {
    if (!partie || partie.phase !== "fin") return VUES.jeu();
    const P = partie;
    const { n, bons, emoji, titre, msg, etoiles, duree, joueur } = resume(P);
    const { sujet, corps } = messageDefi(P);
    const mailto = `mailto:?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}`;
    let apercu = "";
    try { if (!P.essai) apercu = ficheScore(P).toDataURL("image/png"); } catch { /* canevas indisponible : pas d'aperçu */ }
    const parTheme = Object.entries(P.res.reduce((m, r) => { (m[r.theme] = m[r.theme] || []).push(r); return m; }, {}))
      .map(([t, rs]) => ({ t, n: rs.length, pct: Math.round(100 * rs.reduce((s, r) => s + (r.ok ? 1 : r.ratio), 0) / rs.length) }))
      .sort((a, b) => a.pct - b.pct);
    const aRevoir = parTheme.filter(x => x.pct < 70);
    const rates = P.res.filter(r => !r.ok).map(r => P.liste.find(p => p.q.id === r.id).q);
    const bonne = q => q.type === "qcm" ? q.choix[0] : q.type === "vf" ? (q.vrai ? "Vrai" : "Faux") : q.type === "ordre" ? q.etapes.join(" → ")
      : "Indices : " + [q.indiceEntete ? `« ${q.entete} »` : "", ...q.segments.filter(s => s.s).map(s => `« ${s.t} »`)].filter(Boolean).join(", ");
    const R = P.reglages, abandon = n < P.liste.length;
    return `<div class="wca-ecran wca-fin">
        <p class="wca-clignote" aria-hidden="true">— PARTIE TERMINÉE —</p>
        ${joueur ? `<div class="wca-joueur-fin">👤 <b>${esc(joueur)}</b></div>`
          : `<div class="wca-joueur-fin vide"><label for="wca-nom-fin">👤 Votre nom ou celui de l'équipe, pour la fiche de score :</label> <input type="text" id="wca-nom-fin" maxlength="30" placeholder="Ex. : Camille" autocomplete="off"> <button type="button" class="wca-btn petit" data-nom-fin>✔ Valider</button></div>`}
        ${P.releve ? `<p class="wca-releve">🎯 Défi relevé : code <b>${esc(P.code)}</b></p>` : ""}
        <div class="wca-rang"><span class="wca-rang-e">${emoji}</span><div><div class="wca-rang-t">${esc(titre)}</div><div class="wca-etoiles" aria-label="${etoiles} étoile(s) sur 3">${"★".repeat(etoiles)}${"☆".repeat(3 - etoiles)}</div></div></div>
        <p class="wca-rang-m">${esc(msg)}</p>
        <div class="wca-tuiles">
          <div><b>${nombre(P.score)}</b><span>points</span></div>
          <div><b>${bons} / ${n}</b><span>défis réussis · ${P.reussite} %</span></div>
          <div><b>×${resume(P).combo}</b><span>meilleur combo (${P.meilleurCombo} d'affilée)</span></div>
          <div><b>${duree >= 60 ? `${Math.floor(duree / 60)} min ${duree % 60} s` : `${duree} s`}</b><span>durée</span></div>
        </div>
        <p class="small wca-fin-ctx">${LIEUX[R.lieu][0]} ${esc(LIEUX[R.lieu][1])} · ${MODES[R.mode][0]} ${esc(MODES[R.mode][1])}${R.theme ? ` · thème ${esc(THEMES[R.theme].l)}` : ""}${abandon ? ` · partie arrêtée au défi ${n} sur ${P.liste.length} (plus de vie)` : ""}</p>
        ${P.essai ? `<div class="row wca-fin-b"><button type="button" class="wca-btn" data-nav="admin">⚙️ Retour à l'éditeur des défis</button></div>`
          : `<div class="row wca-fin-b"><button type="button" class="wca-btn" data-rejouer>🔁 Rejouer</button><button type="button" class="wca-btn sec" data-nav="accueil">⚙️ Changer de partie</button><button type="button" class="wca-btn sec" data-nav="reflexes:${R.lieu === "travail" ? "travail" : "maison"}">🛡️ Les bons réflexes</button></div>`}
      </div>
      ${P.essai ? "" : `<div class="card wca-partage"><h2>📣 Défier mes collègues</h2>
        <div class="wca-partage-g">
          ${apercu ? `<img class="wca-fiche" src="${apercu}" alt="Fiche de score de ${esc(joueur || "joueur anonyme")} : ${esc(titre)}, ${nombre(P.score)} points, code défi ${esc(P.code)}">` : ""}
          <div>
            <p>Lancez le défi : vos collègues jouent <b>exactement les mêmes questions</b> grâce au code défi, et tentent de battre votre score.</p>
            <p class="wca-code-defi">🎯 Code défi : <b id="wca-code-partie">${esc(P.code)}</b></p>
            <div class="row wca-partage-b">
              <a class="wca-btn" id="wca-courriel" href="${esc(mailto)}">📧 Envoyer par courriel</a>
              <button type="button" class="wca-btn sec" data-fiche>🖼 Télécharger la fiche (image)</button>
              <button type="button" class="wca-btn sec" data-copier>📋 Copier le message</button>
            </div>
            <p class="small muted">Le courriel s'ouvre dans votre messagerie, prêt à envoyer : choisissez vos destinataires, et joignez l'image si vous le souhaitez. « Copier le message » sert pour Teams ou une messagerie en ligne. Rien n'est envoyé sans vous.</p>
            ${messagePartage ? `<p class="wca-partage-ok" role="status">${esc(messagePartage)}</p>` : ""}
          </div>
        </div>
      </div>`}
      <div class="card"><h2>📊 Bilan par thème</h2>
        <table class="t wca-bilan"><tbody>${parTheme.map(x => `<tr><td>${esc(THEMES[x.t].i)} ${esc(THEMES[x.t].l)}</td><td class="wca-barre-c"><span class="wca-barre"><span style="width:${x.pct}%" class="${x.pct >= 70 ? "ok" : x.pct >= 40 ? "moyen" : "ko"}"></span></span></td><td class="num">${x.pct} %</td><td class="muted small">${x.n} défi${x.n > 1 ? "s" : ""}</td></tr>`).join("")}</tbody></table></div>
      ${aRevoir.length ? `<div class="card"><h2>🎯 Les bons réflexes à revoir</h2>${aRevoir.map(x => { const t = THEMES[x.t]; return `<div class="wca-revoir"><h3>${esc(t.i)} ${esc(t.l)}</h3><ul>${t.reflexes.map(r => `<li>${esc(r)}</li>`).join("")}</ul><p class="small muted">📚 ${esc(sourceTheme(x.t))}</p></div>`; }).join("")}</div>` : ""}
      ${rates.length ? `<details class="card wca-rates"><summary><b>Les ${rates.length} défi${rates.length > 1 ? "s" : ""} manqué${rates.length > 1 ? "s" : ""}, avec la bonne réponse</b></summary><ol>${rates.map(q => `<li><p>${esc(q.q)}</p><p class="small"><b>✔ ${esc(bonne(q))}</b></p><p class="small muted">${esc(q.expl)}</p></li>`).join("")}</ol></details>` : ""}`;
  };

  VUES.scores = () => {
    const tri = [...scores].sort((a, b) => b.score - a.score).slice(0, 20);
    return `<h1>🏆 Meilleurs scores</h1><p class="sub">Les parties terminées dans cet onglet. Rien n'est enregistré : la liste s'efface à la fermeture de la page.</p>
      ${tri.length ? `<div class="card"><table class="t"><thead><tr><th>#</th><th>Joueur ou équipe</th><th>Terrain</th><th>Mode</th><th class="num">Score</th><th class="num">Réussite</th><th>Code défi</th><th>Heure</th></tr></thead><tbody>
        ${tri.map((s, k) => `<tr${k === 0 ? ' class="wca-top"' : ""}><td>${["🥇", "🥈", "🥉"][k] || k + 1}</td><td>${esc(s.joueur)}</td><td>${LIEUX[s.lieu][0]} ${esc(LIEUX[s.lieu][1])}${s.theme ? ` · ${esc(THEMES[s.theme].l)}` : ""}</td><td>${esc(MODES[s.mode][1])}</td><td class="num"><b>${nombre(s.score)}</b></td><td class="num">${s.reussite} %</td><td><code>${esc(s.code)}</code>${s.releve ? " 🎯" : ""}</td><td>${esc(s.quand)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="card"><p>Aucune partie terminée pour l'instant.</p><button type="button" class="wca-btn" data-nav="accueil">🎮 Jouer</button></div>`}`;
  };

  function vueReflexes(lieu) {
    const [li, ll] = LIEUX[lieu];
    const themes = Object.entries(THEMES).filter(([k, t]) => t.lieu === lieu && tous().some(q => q.theme === k));   // thème sans défi (entreprise non chargée) masqué
    return `<h1>🛡️ Les bons réflexes — ${li} ${esc(ll)}</h1>
      <p class="sub">${lieu === "maison" ? "D'après le Cyber guide famille de Cybermalveillance.gouv.fr (10 bonnes pratiques)." : "D'après le Guide d'hygiène informatique de l'ANSSI : les mesures qui concernent chaque collaborateur."} « S'entraîner » lance une partie sur ce seul thème, sans chrono.</p>
      <div class="wca-themes">${themes.map(([k, t]) => { const n = tous().filter(q => q.theme === k).length; return `<div class="card wca-theme">
        <h2>${esc(t.i)} ${esc(t.l)}</h2><ul>${t.reflexes.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        <p class="small muted">📚 ${esc(sourceTheme(k))}</p>
        <div class="row"><span class="small muted">${n} défi${n > 1 ? "s" : ""}</span><span class="spacer"></span><button type="button" class="wca-btn petit" data-entrainer="${k}">📖 S'entraîner</button></div></div>`; }).join("")}</div>`;
  }

  VUES.sources = () => `<h1>📚 Sources</h1>
    <p class="sub">Les ${QUESTIONS.length} défis sont rédigés pour WerbCyberArcade à partir de deux guides publics : reformulés, jamais recopiés. Chaque explication cite la bonne pratique ou la mesure dont elle vient.</p>
    ${Object.entries(SOURCES).map(([k, s]) => { const qs = QUESTIONS.filter(q => q.src[0] === k); const parties = [...new Set(qs.map(q => q.src[1]))].sort((a, b) => a - b);
      return `<div class="card"><h2>${esc(s.court)}</h2><p><b>${esc(s.titre)}</b><br>${esc(s.editeur)} · ${esc(s.edition)}<br><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a></p>
        <p class="small">${qs.length} défis · ${esc(s.mot)}s utilisées :</p><ul class="small">${parties.map(n => `<li>${n} — ${esc(s.parties[n] || "")} (${qs.filter(q => q.src[1] === n).length})</li>`).join("")}</ul></div>`; }).join("")}
    ${ENT.defis.length ? `<div class="card"><h2>🏢 Défis de ${esc(nomEntreprise())}</h2><p>${ENT.defis.length} défi(s) publié(s) par l'équipe SMSI du groupe (version ${ENT.version}${ENT.majLe ? `, ${esc(ENT.majLe)}` : ""}). Leurs sources sont internes à l'entreprise (charte informatique, procédures) et citées sous chaque explication.</p></div>` : ""}
    <div class="card"><h2>⚖️ Droits</h2><p>Les guides restent la propriété de leurs éditeurs ; ils se consultent et se téléchargent gratuitement aux adresses ci-dessus. Les liens s'ouvrent dans un nouvel onglet, à votre initiative : c'est la seule sortie vers Internet du module. Les scènes « Repère le piège » sont fictives : numéros, adresses, noms et sites sont inventés.</p></div>`;

  VUES.apropos = () => `<h1>À propos</h1><p class="sub">${esc(WERB.description)}</p><div class="card"><table class="t"><tbody>
    <tr><td class="muted" style="width:220px">Produit</td><td><b>${esc(WERB.produit)}</b> v${esc(WERB.version)} (build ${esc(window.BUILD_DATE)})</td></tr>
    <tr><td class="muted">Auteur</td><td>${esc(WERB.signature)}</td></tr>
    <tr><td class="muted">Type</td><td>Jeu : rien n'est enregistré pour les joueurs (les scores s'effacent à la fermeture). Une base au niveau du groupe, tenue par l'équipe SMSI, contient les défis de l'entreprise, publiés dans l'espace (<code>groupe:defisCyber</code>)</td></tr>
    <tr><td class="muted">Contenu</td><td>${QUESTIONS.length} défis : ${Object.entries(TYPES).map(([k, [i, l]]) => `${i} ${esc(l)} (${QUESTIONS.filter(q => q.type === k).length})`).join(" · ")} — ${Object.keys(THEMES).length} thèmes</td></tr>
    <tr><td class="muted">Environnement WerbSMSI</td><td>Rubrique « continuité », niveau groupe · charte ${esc(WERB.charte)} · socle ${esc(WerbSocle.VERSION)} · lecteur ${esc(WerbGuides.VERSION)}</td></tr>
    <tr><td class="muted">Mention complète</td><td>${esc(WERB.ligne)}</td></tr>
    </tbody></table></div>`;

  /* ===================================================== défis de l'entreprise : chargement pour les joueurs (1.2.0)
     Le jeu lit la publication groupe:defisCyber de l'espace (publications/ à la racine, lisible par tous les sites). Espace : déjà ouvert
     dans la page, raccourci du portail (lien d'une puce de base : sans fenêtre au chargement, avec autorisation d'Edge sur clic), sinon
     sélecteur de dossier sur clic. Rien n'est conservé : à la prochaine ouverture, les défis sont relus. */
  const LIEN = WerbSocle.lien.lire();                                 // capturé au chargement : la navigation remplace ensuite l'adresse
  const baseDemandee = LIEN && LIEN.fichier.endsWith(WERB.extension) ? LIEN : null;

  async function chargerEntreprise({ silencieux = false } = {}) {
    try {
      if (!WerbSocle.espace.ouvert) {
        const ok = LIEN ? await WerbSocle.espace.depuisRaccourci(LIEN.groupeId, { demander: !silencieux }) : false;
        if (!ok) { if (silencieux) return; await WerbSocle.espace.choisir(); }
      }
      const g = WerbSocle.espace.groupe || {};
      const pub = await WerbSocle.espace.publications("groupe");
      const fichier = pub.fichiers.find(f => f.module === WERB.id);
      const lu = WCA_ENT.lirePublication(pub.objets.defisCyber, THEMES);
      Object.assign(ENT, { charge: true, organisation: String(g.organisation || g.sigle || ""), erreur: "",
        defis: lu ? lu.defis : [], version: lu ? lu.version : 0, titre: lu ? lu.titre : "", majLe: lu ? lu.majLe : "", ignores: lu ? lu.ignores : 0,
        publiePar: fichier ? String(fichier.publiePar || "") : "" });
    } catch (e) { if (!(e && e.name === "AbortError")) ENT.erreur = e.message || String(e); }
    render();
  }

  /* ===================================================== ⚙️ défis de l'entreprise : éditeur de l'équipe SMSI (base du groupe)
     Base : enveloppe commune (format WERBCYBERARCADE), rangée dans groupe/continuite/ de l'espace ; data = { titre, defis, versionPubliee,
     publieLe } ; verrou du socle (§5.7), journal des ajouts, modifications, suppressions et publications. Publier écrit
     publications/werbcyberarcade.json (objet unique groupe:defisCyber, version incrémentée) : seuls les défis complets sont publiables. */
  const ADM = { base: null, data: null, journal: [], poignee: null, modifie: null, nom: "", lecture: false, nonEnr: false,
    edition: null, editionId: "", problemes: [], supprimer: "", message: "", erreur: "", utilisateur: WerbSocle.lien.utilisateur() };
  const qui = () => ADM.utilisateur || WerbSocle.verrou.utilisateur || "";
  const instant = () => new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
  const noter = (action, element, apres = "") => ADM.journal.push({ date: instant(), par: qui(), action, objet: "Défi", element, apres });

  function chargerBase(env, f, nom) {
    const d = env.data || {};
    const defis = (Array.isArray(d.defis) ? d.defis : []).map(x => WCA_ENT.normaliser(x, THEMES)).filter(Boolean);
    defis.forEach(x => { if (!x.id || defis.filter(y => y.id === x.id).length > 1) x.id = WCA_ENT.prochainId(defis); });
    Object.assign(ADM, { base: env, journal: Array.isArray(env.journal) ? env.journal : [],
      data: { titre: String(d.titre || "").slice(0, WCA_ENT.MAX.titre), defis, versionPubliee: Number.isInteger(d.versionPubliee) ? d.versionPubliee : 0, publieLe: String(d.publieLe || "") },
      poignee: f ? f.poignee : null, modifie: f ? f.modifie : null, nom: nom || (f ? f.nom : ""), lecture: !!(f && f.lecture),
      nonEnr: false, edition: null, editionId: "", problemes: [], supprimer: "" });
  }
  const abandonner = () => !ADM.nonEnr || confirm("Des modifications ne sont pas enregistrées. Les abandonner ?");

  async function enregistrerBase() {
    if (!ADM.data) return;
    if (ADM.lecture) throw new Error("Base ouverte en lecture seule : un collègue a la main. Rouvrez-la et prenez la main pour enregistrer.");
    const g = WerbSocle.espace.ouvert ? WerbSocle.espace.groupe : null;
    const obj = WerbSocle.enveloppe(ADM.data, { utilisateur: qui(), base: ADM.base, portee: "groupe", ...(g ? { groupeId: g.groupeId } : {}) });
    obj.journal = ADM.journal;
    const r = await WerbSocle.enregistrer(obj, { poignee: ADM.poignee, modifie: ADM.modifie, nomSuggere: `Defis_entreprise${WERB.extension}` });
    Object.assign(ADM, { base: obj, poignee: r.poignee, modifie: r.modifie, nonEnr: false, nom: r.poignee ? r.poignee.name : ADM.nom });
    ADM.message = "💾 Base enregistrée.";
  }

  async function publierDefis() {
    if (!ADM.data) return;
    if (ADM.lecture) throw new Error("Base ouverte en lecture seule : un collègue a la main.");
    if (ADM.edition) throw new Error("Terminez d'abord le défi en cours de modification (Appliquer ou Annuler).");
    const defis = ADM.data.defis;
    if (!defis.length) throw new Error("Aucun défi à publier.");
    const ko = defis.filter(d => WCA_ENT.verifier(d).length);
    if (ko.length) throw new Error(`Défi(s) incomplet(s) : ${ko.map(d => d.id).join(", ")}. Complétez-les (⚠ dans la liste) avant de publier.`);
    if (!WerbSocle.espace.ouvert && !(baseDemandee && await WerbSocle.espace.depuisRaccourci(baseDemandee.groupeId))) await WerbSocle.espace.choisir();
    const version = (ADM.data.versionPubliee || 0) + 1;
    await WerbSocle.espace.publier({ niveau: "groupe", utilisateur: qui(),
      objets: { defisCyber: { id: "defisCyber", titre: ADM.data.titre, version, defis: defis.map(d => ({ ...d })) } } });
    Object.assign(ADM.data, { versionPubliee: version, publieLe: new Date().toISOString().slice(0, 10) });
    noter("Publication", `version ${version}`, `${defis.length} défi(s)`);
    ADM.nonEnr = true;
    ADM.message = `📤 Version ${version} publiée : ${defis.length} défi(s) dans publications/${WERB.id}.json. Les joueurs la reçoivent en ouvrant le jeu avec l'espace.`;
    if (ADM.poignee) { await enregistrerBase(); ADM.message = `📤 Version ${version} publiée (${defis.length} défi(s)) et base enregistrée.`; }
    else ADM.message += " Enregistrez la base pour garder le numéro de version.";
    await chargerEntreprise({ silencieux: true });                   // le jeu de cette page reprend aussitôt la publication
  }

  async function admAction(fn) {
    ADM.erreur = ""; ADM.message = "";
    try { await fn(); } catch (e) { if (!(e && e.name === "AbortError")) ADM.erreur = e.message || String(e); }
    render();
  }
  const ADMIN = {
    nouvelle: () => admAction(async () => { if (!abandonner()) return; if (ADM.poignee) await WerbSocle.verrou.liberer(); chargerBase({ data: {}, journal: [] }, null, "Nouvelle base (non enregistrée)"); ADM.nonEnr = true; }),
    ouvrir: () => admAction(async () => { if (!abandonner()) return; const f = await WerbSocle.ouvrir(); chargerBase(WerbSocle.lireEnveloppe(f.texte), f); }),
    ouvrirLien: () => admAction(async () => { if (!abandonner()) return; const f = await WerbSocle.lien.ouvrir(baseDemandee); chargerBase(WerbSocle.lireEnveloppe(f.texte), f); await chargerEntreprise({ silencieux: true }); }),
    exemple: () => admAction(async () => { if (!abandonner()) return; chargerBase(WerbSocle.lireEnveloppe(window.WERB_EXEMPLE.texte), null, `Base d'exemple (${window.WERB_EXEMPLE.nom})`); }),
    enregistrer: () => admAction(enregistrerBase),
    publier: () => admAction(publierDefis),
    fermer: () => admAction(async () => { if (!abandonner()) return; if (ADM.poignee) await WerbSocle.verrou.liberer(); Object.assign(ADM, { base: null, data: null, poignee: null, nom: "", nonEnr: false, edition: null }); }),
  };

  // Édition d'un défi : copie de travail (ADM.edition), appliquée à la base sur « Appliquer »
  const editer = (d, id) => Object.assign(ADM, { edition: JSON.parse(JSON.stringify(d)), editionId: id, problemes: [], supprimer: "" });
  function appliquer() {
    const n = WCA_ENT.normaliser(ADM.edition, THEMES);
    if (!n) return;
    ADM.problemes = WCA_ENT.verifier(n);
    const k = ADM.data.defis.findIndex(d => d.id === ADM.editionId);
    if (k >= 0) ADM.data.defis[k] = n; else ADM.data.defis.push(n);
    noter(k >= 0 ? "Modification" : "Ajout", n.id, n.q);
    ADM.nonEnr = true;
    ADM.message = ADM.problemes.length ? `⚠ Défi ${n.id} gardé dans la base, mais incomplet : il ne sera pas publié tant qu'il reste des points à corriger.` : `✔ Défi ${n.id} prêt.`;
    if (!ADM.problemes.length) ADM.edition = null; else { ADM.editionId = n.id; ADM.edition = JSON.parse(JSON.stringify(n)); }
  }
  function essayer(d) {
    const n = WCA_ENT.normaliser(d, THEMES), p = WCA_ENT.verifier(n);
    if (p.length) { ADM.erreur = `Défi incomplet, impossible de l'essayer : ${p.join(", ")}.`; return render(); }
    const avant = { ...reglages };
    Object.assign(reglages, { mode: "entrainement", theme: "", lieu: n.lieu });
    nouvellePartie(undefined, false, [WCA_ENT.versJeu(n)]);
    Object.assign(reglages, avant);
  }

  function formEditeur() {
    const e = ADM.edition, [ti, tl] = TYPES[e.type], M = WCA_ENT.MAX;
    const sel = (champ, opts, cur) => `<select data-ed="${champ}">${opts.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    const champ = (nom, val, { max, place = "", zone = false } = {}) => zone
      ? `<textarea data-ed="${nom}" maxlength="${max}" rows="2" placeholder="${esc(place)}">${esc(val)}</textarea>`
      : `<input type="text" data-ed="${nom}" maxlength="${max}" value="${esc(val)}" placeholder="${esc(place)}">`;
    let propre = "";
    if (e.type === "qcm") propre = `<fieldset><legend>Réponses (la bonne d'abord : le jeu les mélange)</legend>${e.choix.map((c, k) =>
      `<label class="wca-ed-l">${k ? `✘ Mauvaise réponse ${k}` : "✔ Bonne réponse"}<input type="text" data-ed-choix="${k}" maxlength="${M.choix}" value="${esc(c)}"></label>`).join("")}</fieldset>`;
    if (e.type === "vf") propre = `<fieldset><legend>Réponse attendue</legend><label class="wca-case"><input type="radio" name="ed-vrai" data-ed-vrai="true"${e.vrai ? " checked" : ""}> Vrai</label> <label class="wca-case"><input type="radio" name="ed-vrai" data-ed-vrai="false"${!e.vrai ? " checked" : ""}> Faux</label></fieldset>`;
    if (e.type === "piege") {
      const libEntete = { sms: "Numéro de l'expéditeur", courriel: "Expéditeur (De : …)", site: "Adresse du site" }[e.forme];
      propre = `<fieldset><legend>Scène à analyser (fictive : numéros, adresses et noms inventés)</legend>
        <div class="wca-ed-g"><label class="wca-ed-l">Forme${sel("forme", [["sms", "💬 SMS"], ["courriel", "✉️ Courriel"], ["site", "🌐 Site web"]], e.forme)}</label>
        <label class="wca-ed-l">${esc(libEntete)}${champ("entete", e.entete, { max: M.entete })}</label></div>
        <label class="wca-ed-l">Si l'en-tête est suspect, pourquoi ? <small class="muted">(laisser vide s'il ne l'est pas)</small>${champ("indiceEntete", e.indiceEntete, { max: M.pq })}</label>
        <div class="wca-ed-scroll"><table class="t wca-ed-segs"><thead><tr><th>Morceau du message, dans l'ordre</th><th>Indice ?</th><th>Pourquoi c'est suspect</th><th></th></tr></thead><tbody>
        ${e.segments.map((s, k) => `<tr><td><input type="text" data-ed-seg="${k}" data-ed-segc="t" maxlength="${M.seg}" value="${esc(s.t)}" aria-label="Morceau ${k + 1}"></td>
          <td class="wca-ed-c"><input type="checkbox" data-ed-seg="${k}" data-ed-segc="s"${s.s ? " checked" : ""} aria-label="Morceau ${k + 1} : indice suspect"></td>
          <td><input type="text" data-ed-seg="${k}" data-ed-segc="pq" maxlength="${M.pq}" value="${esc(s.pq)}"${s.s ? "" : ' placeholder="(leurre : rien à expliquer)"'} aria-label="Morceau ${k + 1} : pourquoi"></td>
          <td><button type="button" class="petit" data-ed-del-seg="${k}" title="Retirer ce morceau"${e.segments.length <= 2 ? " disabled" : ""}>✕</button></td></tr>`).join("")}
        </tbody></table></div>
        <button type="button" class="petit" data-ed-add="seg"${e.segments.length >= 12 ? " disabled" : ""}>➕ Ajouter un morceau</button></fieldset>`;
    }
    if (e.type === "ordre") propre = `<fieldset><legend>Étapes, dans le bon ordre (le jeu les mélange)</legend><ol class="wca-ed-etapes">
      ${e.etapes.map((s, k) => `<li><input type="text" data-ed-etape="${k}" maxlength="${M.etape}" value="${esc(s)}" aria-label="Étape ${k + 1}">
        <button type="button" class="petit" data-ed-haut="${k}" title="Monter"${k ? "" : " disabled"}>↑</button>
        <button type="button" class="petit" data-ed-del-etape="${k}" title="Retirer"${e.etapes.length <= 3 ? " disabled" : ""}>✕</button></li>`).join("")}</ol>
      <button type="button" class="petit" data-ed-add="etape"${e.etapes.length >= 6 ? " disabled" : ""}>➕ Ajouter une étape</button></fieldset>`;
    const libQ = { vf: "Affirmation à juger", piege: "Consigne (ex. : Ce courriel arrive… Touchez les indices suspects.)", ordre: "Situation (ex. : … Remettez les étapes dans l'ordre.)", qcm: "Question" }[e.type];
    return `<div class="card wca-editeur" id="wca-editeur"><h2>${ti} ${ADM.editionId ? `Modifier le défi ${esc(e.id)}` : `Nouveau défi ${esc(e.id)}`} · ${esc(tl)}</h2>
      <div class="wca-ed-g">
        <label class="wca-ed-l">Terrain${sel("lieu", [["travail", "🏢 Au travail"], ["maison", "🏠 À la maison"]], e.lieu)}</label>
        <label class="wca-ed-l">Thème${sel("theme", Object.entries(THEMES).map(([k, t]) => [k, `${t.i} ${t.l}`]), e.theme)}</label>
      </div>
      <label class="wca-ed-l">${esc(libQ)}${champ("q", e.q, { max: M.q, zone: true })}</label>
      ${propre}
      <label class="wca-ed-l">Explication affichée après la réponse${champ("expl", e.expl, { max: M.expl, zone: true, place: "Le bon réflexe, et pourquoi." })}</label>
      <label class="wca-ed-l">Source <small class="muted">(texte interne, ex. : Charte informatique, article 4)</small>${champ("source", e.source, { max: M.source })}</label>
      ${ADM.problemes.length ? `<ul class="wca-erreur">${ADM.problemes.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
      <div class="row"><button type="button" class="wca-btn" data-ed-appliquer>✔ Appliquer</button><button type="button" class="wca-btn sec" data-ed-essayer>▶ Essayer</button><span class="spacer"></span><button type="button" data-ed-annuler>Annuler</button></div>
    </div>`;
  }

  VUES.admin = () => {
    const intro = `<h1>⚙️ Défis de l'entreprise</h1>
      <p class="sub">Pour l'équipe SMSI du groupe : créez vos propres défis (règles internes, contacts, procédures, pièges vus dans l'entreprise), puis publiez-les dans l'espace WerbSMSI. Les joueurs qui ouvrent le jeu avec l'espace les reçoivent, mêlés aux défis du jeu, sans rien installer ni reconstruire.</p>
      ${ADM.erreur ? `<div class="card wca-alerte" role="alert">⚠ ${esc(ADM.erreur)}</div>` : ""}${ADM.message ? `<div class="card wca-info" role="status">${esc(ADM.message)}</div>` : ""}`;
    const nom = qui() ? "" : `<p class="small">Votre nom, pour le verrou de la base et le journal : <input type="text" id="wca-adm-nom" maxlength="60" placeholder="Prénom NOM" autocomplete="off"></p>`;
    if (!ADM.data) return intro + `<div class="card"><h2>Base des défis</h2>
        <p>Une seule base pour le groupe, rangée dans le dossier réservé à l'équipe SMSI : <code>groupe/continuite/</code> de l'espace.</p>${nom}
        <div class="row">${baseDemandee ? `<button type="button" class="wca-btn" data-adm="ouvrirLien">📂 Ouvrir la base demandée par le portail</button>` : ""}
          <button type="button" class="wca-btn${baseDemandee ? " sec" : ""}" data-adm="ouvrir">📂 Ouvrir une base</button>
          <button type="button" class="wca-btn sec" data-adm="nouvelle">✨ Nouvelle base</button>
          ${window.WERB_EXEMPLE ? `<button type="button" class="wca-btn sec" data-adm="exemple">🧪 Base d'exemple</button>` : ""}</div>
        ${baseDemandee ? `<p class="small muted">${esc(WerbSocle.lien.consigne(baseDemandee))}</p>` : ""}</div>`;
    const D = ADM.data, prets = D.defis.filter(d => !WCA_ENT.verifier(d).length).length;
    const ligne = d => {
      const p = WCA_ENT.verifier(d), [ti, tl] = TYPES[d.type], th = THEMES[d.theme], [li] = LIEUX[d.lieu];
      return `<tr${ADM.edition && ADM.editionId === d.id ? ' class="wca-ed-sel"' : ""}><td><code>${esc(d.id)}</code></td><td title="${esc(tl)}">${ti}</td><td>${li} ${esc(th.i)} ${esc(th.l)}</td>
        <td>${esc(d.q || "(énoncé vide)")}</td><td>${p.length ? `<span class="wca-ko" title="${esc(p.join(" ; "))}">⚠ ${p.length} point${p.length > 1 ? "s" : ""}</span>` : `<span class="wca-ok">✔ prêt</span>`}</td>
        <td class="wca-ed-act">${ADM.supprimer === d.id ? `Supprimer ? <button type="button" class="petit" data-adm-suppr-ok="${esc(d.id)}">Oui</button> <button type="button" class="petit" data-adm-suppr-non>Non</button>`
          : `<button type="button" class="petit" data-adm-modifier="${esc(d.id)}" title="Modifier"${ADM.lecture ? " disabled" : ""}>✏️</button><button type="button" class="petit" data-adm-essayer="${esc(d.id)}" title="Essayer">▶</button><button type="button" class="petit" data-adm-dupliquer="${esc(d.id)}" title="Dupliquer"${ADM.lecture ? " disabled" : ""}>⧉</button><button type="button" class="petit" data-adm-supprimer="${esc(d.id)}" title="Supprimer"${ADM.lecture ? " disabled" : ""}>🗑</button>`}</td></tr>`;
    };
    return intro + `<div class="card wca-adm-base">
        <div class="row"><h2 style="margin:0">📁 ${esc(ADM.nom || "Base des défis")}</h2>${ADM.lecture ? `<span class="wca-ko">lecture seule</span>` : ""}${ADM.nonEnr ? `<span class="wca-ko">● modifications non enregistrées</span>` : ""}<span class="spacer"></span>
          <button type="button" class="wca-btn" data-adm="enregistrer"${ADM.lecture ? " disabled" : ""}>💾 Enregistrer</button>
          <button type="button" class="wca-btn" data-adm="publier"${ADM.lecture || !D.defis.length ? " disabled" : ""}>📤 Publier</button>
          <button type="button" data-adm="fermer">⏏ Fermer</button></div>
        ${nom}
        <label class="wca-ed-l">Titre de la campagne <small class="muted">(facultatif, affiché aux joueurs)</small><input type="text" id="wca-adm-titre" maxlength="${WCA_ENT.MAX.titre}" value="${esc(D.titre)}" placeholder="Ex. : Les réflexes cyber de la maison Exemple"></label>
        <p class="small">${D.defis.length} défi(s), dont ${prets} prêt(s) à publier · ${D.versionPubliee ? `dernière publication : version ${D.versionPubliee}${D.publieLe ? ` du ${esc(D.publieLe)}` : ""}` : "jamais publiée"}.
          Publier remplace la version précédente : un code défi pris avec l'ancienne version des défis de l'entreprise ne pourra plus être relevé.</p>
      </div>
      ${ADM.edition ? formEditeur() : ""}
      <div class="card"><div class="row"><h2 style="margin:0">Les défis</h2><span class="spacer"></span><span class="small">➕ Nouveau :</span>
          ${Object.entries(TYPES).map(([k, [i, l]]) => `<button type="button" class="petit" data-adm-nouveau="${k}"${ADM.lecture ? " disabled" : ""}>${i} ${esc(l)}</button>`).join("")}</div>
        ${D.defis.length ? `<div class="wca-ed-scroll"><table class="t wca-adm-liste"><thead><tr><th>Id</th><th>Type</th><th>Terrain et thème</th><th>Énoncé</th><th>État</th><th></th></tr></thead><tbody>${D.defis.map(ligne).join("")}</tbody></table></div>`
          : `<p class="muted">Aucun défi pour l'instant : choisissez un type ci-dessus.</p>`}
      </div>
      <div class="card"><h2>💡 Bonnes pratiques</h2><ul class="small">
        <li>Des défis courts, sur ce qui est propre à l'entreprise : qui appeler, où signaler, la charte informatique, les pièges déjà vus chez vous.</li>
        <li>Une explication qui donne le bon réflexe, et une source interne (charte, procédure) que les joueurs peuvent retrouver.</li>
        <li>Rien de confidentiel : la publication est lisible par tous les sites. Ni adresse IP, ni mot de passe, ni nom de serveur, ni vulnérabilité réelle ; des scènes « piège » fictives.</li>
        <li>« ▶ Essayer » lance le défi tel que les joueurs le verront, sans compter dans les scores.</li></ul></div>`;
  };

  /* --------------------------------------------- interactions de l'éditeur */
  const versEditeur = () => { const f = document.getElementById("wca-editeur"); if (f) f.scrollIntoView({ block: "start" }); };
  document.addEventListener("click", e => {
    const t = e.target;
    const a = t.closest("[data-adm]"); if (a && !a.disabled && ADMIN[a.dataset.adm]) return ADMIN[a.dataset.adm]();
    if (!ADM.data) return;
    const nv = t.closest("[data-adm-nouveau]");
    if (nv) { editer(WCA_ENT.vide(nv.dataset.admNouveau, WCA_ENT.prochainId(ADM.data.defis)), ""); render(); return versEditeur(); }
    const md = t.closest("[data-adm-modifier]");
    if (md) { editer(ADM.data.defis.find(d => d.id === md.dataset.admModifier), md.dataset.admModifier); render(); return versEditeur(); }
    const es = t.closest("[data-adm-essayer]"); if (es) return essayer(ADM.data.defis.find(d => d.id === es.dataset.admEssayer));
    const du = t.closest("[data-adm-dupliquer]");
    if (du) {
      const k = ADM.data.defis.findIndex(d => d.id === du.dataset.admDupliquer), c = { ...JSON.parse(JSON.stringify(ADM.data.defis[k])), id: WCA_ENT.prochainId(ADM.data.defis) };
      ADM.data.defis.splice(k + 1, 0, c); noter("Ajout", c.id, `copie de ${du.dataset.admDupliquer}`); ADM.nonEnr = true; return render();
    }
    const su = t.closest("[data-adm-supprimer]"); if (su) { ADM.supprimer = su.dataset.admSupprimer; return render(); }
    if (t.closest("[data-adm-suppr-non]")) { ADM.supprimer = ""; return render(); }
    const ok = t.closest("[data-adm-suppr-ok]");
    if (ok) {
      const id = ok.dataset.admSupprOk;
      ADM.data.defis = ADM.data.defis.filter(d => d.id !== id); noter("Suppression", id); ADM.supprimer = ""; ADM.nonEnr = true;
      if (ADM.editionId === id) ADM.edition = null;
      return render();
    }
    if (!ADM.edition) return;
    const E = ADM.edition;
    if (t.closest("[data-ed-appliquer]")) { appliquer(); render(); return ADM.edition ? versEditeur() : undefined; }
    if (t.closest("[data-ed-annuler]")) { ADM.edition = null; ADM.problemes = []; return render(); }
    if (t.closest("[data-ed-essayer]")) return essayer(E);
    const add = t.closest("[data-ed-add]");
    if (add) { if (add.dataset.edAdd === "seg") E.segments.push({ t: "", s: false, pq: "" }); else E.etapes.push(""); return render(); }
    const ds = t.closest("[data-ed-del-seg]"); if (ds) { E.segments.splice(Number(ds.dataset.edDelSeg), 1); return render(); }
    const de = t.closest("[data-ed-del-etape]"); if (de) { E.etapes.splice(Number(de.dataset.edDelEtape), 1); return render(); }
    const hu = t.closest("[data-ed-haut]"); if (hu) { const k = Number(hu.dataset.edHaut); [E.etapes[k - 1], E.etapes[k]] = [E.etapes[k], E.etapes[k - 1]]; return render(); }
  });
  // Saisie dans l'éditeur : la copie de travail suit chaque frappe, sans redessiner la page (le curseur reste en place)
  const saisie = e => {
    const t = e.target, E = ADM.edition;
    if (!t.dataset) return;
    if (t.id === "wca-adm-titre" && ADM.data) { ADM.data.titre = t.value; ADM.nonEnr = true; return; }
    if (t.id === "wca-adm-nom") { if (e.type === "change") { ADM.utilisateur = WerbSocle.lien.nettoyerNom(t.value); WerbSocle.verrou.identifier(ADM.utilisateur); render(); } return; }
    if (!E) return;
    if (t.dataset.ed) { E[t.dataset.ed] = t.value; if (t.dataset.ed === "forme" && e.type === "change") render(); return; }
    if (t.dataset.edChoix !== undefined) { E.choix[Number(t.dataset.edChoix)] = t.value; return; }
    if (t.dataset.edVrai !== undefined) { E.vrai = t.dataset.edVrai === "true"; return; }
    if (t.dataset.edEtape !== undefined) { E.etapes[Number(t.dataset.edEtape)] = t.value; return; }
    if (t.dataset.edSeg !== undefined) {
      const s = E.segments[Number(t.dataset.edSeg)];
      if (t.dataset.edSegc === "s") { s.s = t.checked; if (e.type === "change") render(); } else s[t.dataset.edSegc] = t.value;
    }
  };
  document.addEventListener("input", saisie);
  document.addEventListener("change", saisie);
  addEventListener("beforeunload", e => { if (ADM.nonEnr) { e.preventDefault(); e.returnValue = ""; } });

  /* ===================================================== rendu et navigation */
  const TITRES = { admin: "Défis de l'entreprise", accueil: "Nouvelle partie", jeu: "Partie en cours", fin: "Fin de partie", scores: "Meilleurs scores", sources: "Sources", apropos: "À propos" };
  function render() {
    const guide = vue.startsWith("guide:") && WerbGuides.trouver(vue);
    const reflexes = vue.match(/^reflexes:(maison|travail)$/);
    if (!guide && !reflexes && !VUES[vue]) vue = "accueil";
    if (vue === "fin" && (!partie || partie.phase !== "fin")) vue = partie ? "jeu" : "accueil";
    $("#main").innerHTML = guide ? WerbGuides.vue(vue, { lien, retour: `<button type="button" data-nav="accueil">← Accueil</button>`, mot: "Page" })
      : reflexes ? vueReflexes(reflexes[1]) : VUES[vue]();
    $("#main").dataset.vue = vue;                                     // repère de la page affichée (tests)
    $("#tb-titre").textContent = guide ? guide.titre : reflexes ? `Bons réflexes — ${LIEUX[reflexes[1]][1]}` : TITRES[vue] || "";
    document.title = `${$("#tb-titre").textContent} – ${WERB.produit}`;
    menu.rendre({ actif: vue === "fin" ? "jeu" : vue, pied });
    if (vue === "jeu") lancerChrono(); else arreterChrono();
  }
  function aller(id) {
    if (id === vue) { render(); $("#main").scrollTop = 0; return; }
    location.hash = encodeURIComponent(id);
  }
  function depuisAdresse() {
    let id = "";
    try { id = decodeURIComponent(location.hash.slice(1)); } catch { /* adresse illisible : accueil */ }
    vue = id || "accueil";
    render();
    $("#main").scrollTop = 0;
  }
  window.addEventListener("hashchange", depuisAdresse);

  // Mise à jour de la manche sans toucher au chrono (indices marqués, étapes placées)
  function majManche() {
    const c = document.querySelector(".wca-carte");
    if (!c) return render();
    c.innerHTML = carteJeu(courante());
  }

  /* ===================================================== interactions */
  document.addEventListener("click", e => {
    const t = e.target;
    const nav = t.closest("[data-nav]");
    if (nav && !nav.closest("#sidebar")) { e.preventDefault(); aller(nav.dataset.nav); return; }
    const lieu = t.closest("[data-wca-lieu]"); if (lieu) { reglages.lieu = lieu.dataset.wcaLieu; if (reglages.theme && THEMES[reglages.theme].lieu !== reglages.lieu) reglages.theme = ""; return render(); }
    const mode = t.closest("[data-wca-mode]"); if (mode) { reglages.mode = mode.dataset.wcaMode; return render(); }
    const nb = t.closest("[data-wca-nb]"); if (nb) { reglages.nb = nb.dataset.wcaNb === "tout" ? "tout" : Number(nb.dataset.wcaNb); return render(); }
    if (t.closest("[data-theme-off]")) { e.preventDefault(); reglages.theme = ""; return render(); }
    if (t.closest("#wca-jouer")) return nouvellePartie();
    if (t.closest("#wca-relever")) return relever();
    if (t.closest("#wca-ent-charger")) return chargerEntreprise();
    if (t.closest("[data-nom-fin]")) return nommerFin();
    if (t.closest("[data-fiche]")) return telechargerFiche();
    if (t.closest("[data-copier]")) return copierMessage();
    const ent = t.closest("[data-entrainer]");
    if (ent) { reglages.theme = ent.dataset.entrainer; reglages.lieu = THEMES[reglages.theme].lieu; reglages.mode = "entrainement"; return nouvellePartie(); }
    if (t.closest("[data-rejouer]")) return nouvellePartie();
    if (!partie) return;
    const rep = t.closest("[data-rep]"); if (rep && !rep.disabled) return repondre({ k: Number(rep.dataset.rep) });
    const vf = t.closest("[data-vf]"); if (vf && !vf.disabled) return repondre({ v: vf.dataset.vf === "true" });
    if (partie.phase === "question") {
      const seg = t.closest("[data-seg]");
      if (seg) { const k = seg.dataset.seg === "E" ? "E" : Number(seg.dataset.seg); partie.sel.has(k) ? partie.sel.delete(k) : partie.sel.add(k); return majManche(); }
      const et = t.closest("[data-etape]"); if (et) { partie.ordre.push(Number(et.dataset.etape)); return majManche(); }
      const ret = t.closest("[data-retirer]"); if (ret) { partie.ordre.splice(Number(ret.dataset.retirer)); return majManche(); }
      if (t.closest("[data-ordre-raz]")) { partie.ordre = []; return majManche(); }
      const val = t.closest("[data-valider]"); if (val && !val.disabled) return repondre({});
    }
    if (t.closest("[data-suivante]")) return suivante();
  });

  document.addEventListener("keydown", e => {
    if (vue !== "jeu" || !partie || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    const q = courante() && courante().q, k = e.key.toLowerCase();
    if (partie.phase === "retour") { if (k === "enter" || k === " ") { e.preventDefault(); suivante(); } return; }
    if (partie.phase !== "question" || !q) return;
    if (q.type === "qcm" && /^[1-4]$/.test(k)) { e.preventDefault(); repondre({ k: Number(k) - 1 }); }
    else if (q.type === "vf" && (k === "v" || k === "1")) { e.preventDefault(); repondre({ v: true }); }
    else if (q.type === "vf" && (k === "f" || k === "2")) { e.preventDefault(); repondre({ v: false }); }
    else if (k === "enter" && !(e.target.closest && e.target.closest("button"))
      && (q.type === "piege" || (q.type === "ordre" && partie.ordre.length === q.etapes.length))) { e.preventDefault(); repondre({}); }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "wca-joueur") reglages.joueur = e.target.value.trim();
    if (e.target.id === "wca-code") codeSaisi = e.target.value;
    if (e.target.id === "wca-ent-inclure") { ENT.inclure = e.target.checked; render(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (e.target.id === "wca-code") { e.preventDefault(); relever(); }
    if (e.target.id === "wca-nom-fin") { e.preventDefault(); nommerFin(); }
  });

  /* --------------------------------------------- défi entre collègues */
  function relever() {
    const c = lireCode(codeSaisi);
    if (!c) { codeErreur = "Code défi non reconnu : il ressemble à WCA-200-K3Q9ZP."; render(); const f = $("#wca-code"); if (f) f.focus(); return; }
    if (c.ent !== null && !ENT.defis.length) { codeErreur = `Ce défi comprend les défis de l'entreprise (version ${c.ent}) : chargez-les d'abord, dans l'encart « 🏢 Défis de l'entreprise ».`; return render(); }
    if (c.ent !== null && ENT.version !== c.ent) { codeErreur = `Ce défi a été lancé avec la version ${c.ent} des défis de l'entreprise ; la version chargée est la ${ENT.version} : les questions ne seraient pas les mêmes.`; return render(); }
    codeErreur = "";
    Object.assign(reglages, { lieu: c.lieu, mode: c.mode, nb: c.nb, theme: c.theme });
    nouvellePartie(c.graine, c.ent !== null);
  }
  function nommerFin() {
    const v = (($("#wca-nom-fin") || {}).value || "").trim();
    if (!v || !partie || partie.phase !== "fin") return;
    partie.reglages.joueur = reglages.joueur = v;
    if (partie.ligneScore) partie.ligneScore.joueur = v;
    messagePartage = "";
    render();
  }
  function telechargerFiche() {
    if (!partie || partie.phase !== "fin") return;
    ficheScore(partie).toBlob(b => {
      if (!b) return;
      const nom = nomFichierFiche(partie);
      WerbSocle.telecharger(b, nom, "image/png", { brut: true });
      messagePartage = `🖼 Image téléchargée : ${nom}. Joignez-la à votre courriel ou à votre message.`;
      render();
    }, "image/png");
  }
  async function copierMessage() {
    if (!partie || partie.phase !== "fin") return;
    const { sujet, corps } = messageDefi(partie), texte = `${sujet}\n\n${corps}`;
    try { await navigator.clipboard.writeText(texte); }
    catch {                                                           // presse-papiers refusé : copie par une zone de texte temporaire
      const z = Object.assign(document.createElement("textarea"), { value: texte });
      z.style.position = "fixed"; z.style.opacity = "0"; document.body.appendChild(z); z.select();
      try { document.execCommand("copy"); } finally { z.remove(); }
    }
    messagePartage = "📋 Message copié : collez-le dans Teams, une messagerie en ligne ou un courriel.";
    render();
  }

  // Bandeau commun (charte §7.6) : pas de base ; 🖨 PDF imprime la page affichée (le bilan d'une partie, par exemple)
  document.getElementById("tb-actions").innerHTML = WerbSocle.bandeau.boutons(["pdf"]);
  window.WCA_JEU = Object.freeze({ get partie() { return partie; }, get scores() { return scores; }, get entreprise() { return ENT; }, get admin() { return ADM; } });   // pour les tests
  depuisAdresse();
  if (LIEN) chargerEntreprise({ silencieux: true });                   // ouvert depuis une puce du portail : défis de l'entreprise sans fenêtre
})();
</script>
</body>
</html>
